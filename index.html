s by tracing rays from a grid of <strong>screen probes<\/strong>, caching what they find in a <strong>radiance cache<\/strong>, and reusing that cache across frames. Almost every command here tunes one of three things: how many probes there are, how far and how accurately their rays go, and how long the answers are kept.<\/p><p>That structure is why the numbers matter more than usual. A setting that doubles the rays per probe does not cost a little more -- probe counts and ray counts multiply, and the result lands on the GPU every frame.<\/p><p><strong>This category was the worst offender in the file, in three separate ways.<\/strong><\/p><p>The first: five commands pushed Lumen above Epic&#x27;s own settings on the <strong>Balanced<\/strong> preset, which is the one most people use and the one the app calls Recommended. The audit&#x27;s word for one of them is *&quot;greatly increases GPU cost&quot;*. Balanced and Quality were identical for all five, so the Quality preset was buying almost nothing while Balanced was paying almost everything. Since 2026-08-31 those five are Quality only, and Balanced and Performance write Epic&#x27;s numbers.<\/p><p>The second: three commands the audit describes as experiments were on for everybody. One is called *&quot;a Lumen-specific A/B test&quot;* in so many words. They are now three switches on the app&#x27;s Experimental tab, and all three write the engine value until somebody ticks them.<\/p><p>The third is in the NO EFFECT block, and it is the largest single find of this whole review. Sixteen names here were being written live. Eleven do not exist, which is harmless. <strong>Five the audit itself grades &quot;Valid&quot;, and every one of the five was forced away from its documented default<\/strong> -- task granularity, surface cache eviction, an undocumented internal parallel path. They sat in a block whose heading says the engine ignores names it does not know.<\/p>","commands":[{"name":"r.Lumen.DiffuseIndirect.AsyncCompute","status":"active","ourValue":"1","engineDefault":"1 where the platform supports it","valueRange":"0 or 1","appliesWhen":"Only where the renderer and platform support async compute. It is ignored elsewhere rather than causing an error.","visualsHtml":"None. It moves work between GPU queues; the result is identical.","performanceHtml":"Where supported, it lets the diffuse indirect pass overlap other GPU work instead of queueing behind it. That is why the default is on.","definitionHtml":"Schedules Lumen&#x27;s diffuse indirect lighting on the asynchronous compute queue.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. The audit&#x27;s note says *&quot;Omit and let the renderer/platform select the applicable path&quot;*, and we do the opposite on purpose -- see <code>r.Bloom.AsyncCompute<\/code> in the post-processing paper for the rule.<\/p><p>The reason to pin it is the same as everywhere else, with one addition worth naming: a game that shipped this off is paying for the serialised path on every frame, and nothing else in this file would tell us.<\/p>","filled":true},{"name":"r.Lumen.DiffuseIndirect.SSAO","status":"active","ourValue":"0, and 1 on the Quality preset","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Meaningful mainly when `ShortRangeAO` is off, which is what this project writes.","visualsHtml":"Ambient occlusion is the soft darkening where two surfaces meet -- the inside of a corner, the seam where a crate touches the floor. Lumen normally supplies it through ShortRangeAO. With that off and this off too, there is none at all, and corners and creases look flat and slightly pasted-on. Turning this on restores it by a cheaper, screen-space route that is less accurate and can halo around edges.","performanceHtml":"A screen-space AO pass over the whole frame. Cheaper than full-resolution ShortRangeAO, and not free.","definitionHtml":"Enables classic screen-space ambient occlusion inside the Lumen diffuse indirect path, as a stand-in for Lumen&#x27;s own short-range occlusion.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/lumen-performance-guide-for-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>**Read this together with <code>r.Lumen.ScreenProbeGather.ShortRangeAO<\/code> below.** The two are one decision written as two commands, and reading either alone gives the wrong answer.<\/p><p>This project turns ShortRangeAO off in every preset, which saves full-resolution work and removes contact occlusion. Quality then buys some of it back with SSAO. Balanced and Performance do not, and accept flatter corners -- which is the trade those preset names promise.<\/p><p>Until 2026-08-31 Balanced paid for SSAO as well, so Balanced and Quality looked the same here and only Performance differed.<\/p>","filled":true},{"name":"r.Lumen.RadianceCache.SupersampleDistanceFromCamera","status":"active","ourValue":"2000","engineDefault":"2000","valueRange":"a distance in Unreal units. 2000 is 20 metres.","appliesWhen":"Always, wherever the Lumen radiance cache runs.","visualsHtml":"Inside this distance the radiance cache is sampled more densely, so indirect light near the player has finer detail and shifts less as the camera moves. Beyond it, the cache is coarser and cheaper.","performanceHtml":"Raising it extends the expensive near-field region outwards and costs accordingly. 2000 is Epic&#x27;s balance point.","definitionHtml":"The radius, from the camera, within which radiance cache probes are supersampled.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. The audit noticed that the source config had this line commented out and said so approvingly: *&quot;2000 is the current default, so the source correctly leaves it commented.&quot;*<\/p><p>We write it anyway, under the pinning rule. This is the entry where that rule is least comfortable, because the audit explicitly praised the omission -- but the rule is about what a game might have written, not about what the audit saw.<\/p>","filled":true},{"name":"r.Lumen.Reflections.DownsampleFactor","status":"active","ourValue":"1","engineDefault":"1","valueRange":"1 or 2. 1 is full resolution, 2 is half.","appliesWhen":"Always, wherever Lumen reflections run.","visualsHtml":"At 2 the reflection buffer is traced at half resolution and upscaled, which softens reflections and makes their edges crawl during movement. At 1 reflections match the rest of the frame.","performanceHtml":"The single biggest lever on Lumen reflection cost. Half resolution is roughly a quarter of the rays.","definitionHtml":"The resolution divisor for Lumen&#x27;s reflection tracing pass, relative to the screen.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default of full resolution.<\/p><p>It is worth flagging as a <strong>future preset candidate<\/strong>. 2 is a documented value with a documented effect, and it is exactly the kind of lever the Performance preset exists for. It is not split today because the audit names only the default, and this project does not invent the second number. If Epic&#x27;s scalability tiers are ever read into this catalog properly, this is the first entry to revisit.<\/p>","filled":true},{"name":"r.Lumen.Reflections.RadianceCache","status":"active","ourValue":"0; 1 when \"Lumen: cache distant reflections\" is ticked","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Lumen reflections only.","visualsHtml":"On, rough reflections stop tracing all the way out and reuse cached distant lighting instead. Rough surfaces -- brushed metal, wet concrete, a scuffed floor -- get their distant reflection from the cache. It can be close to indistinguishable, and it can also show as a reflection that lags or does not match what is actually behind you.","performanceHtml":"Potentially a real saving, because it shortens the longest rays in the reflection pass. Nobody here has measured it.","definitionHtml":"Lets Lumen reflections sample the radiance cache for rough specular instead of tracing distant rays. Epic marks it experimental and content sensitive.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>We wrote <strong>1<\/strong> for every user until 2026-08-31, against a documented default of 0, for a feature the audit calls *&quot;explicitly experimental/content-sensitive&quot;* and qualifies as a *&quot;tested Lumen-reflections profile only&quot;*.<\/p><p>It is now a switch on the Experimental tab and writes 0 until ticked.<\/p><p>The rule that produced the tab: <strong>an experiment is a question, not an answer.<\/strong> Shipping one on, to everybody, in a file nobody reads, converts a question into a silent claim. Putting it behind a switch keeps it available to whoever wants to find out.<\/p>","filled":true},{"name":"r.Lumen.ScreenProbeGather.IrradianceFormat","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 = spherical harmonic, 1 = octahedral","appliesWhen":"Always, in the screen probe gather.","visualsHtml":"The two formats store the same lighting with different precision and different failure modes. 0 is smoother and can lose sharp directional contrast; 1 keeps more direction and costs more memory bandwidth.","performanceHtml":"Small either way. It changes the size and layout of the probe irradiance buffer.","definitionHtml":"The storage format for screen probe irradiance.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.Lumen.ScreenProbeGather.MaxRoughnessToEvaluateRoughSpecularForFoliage","status":"active","ourValue":"0.8","engineDefault":"none published. Epic drives it from reflection quality scalability.","valueRange":"0.0 to 1.0, a roughness threshold.","appliesWhen":"Foliage materials only.","visualsHtml":"Sets how rough a foliage surface may be before Lumen stops computing rough specular for it. Higher keeps the soft sheen on leaves and wet grass further into the rough range; lower drops it sooner and leaves foliage looking matte.","performanceHtml":"Directly proportional to how much foliage is on screen. 0.8 keeps the high-quality workload for nearly all of it, which in a forest is most of the frame.","definitionHtml":"The maximum material roughness at which rough specular is still evaluated on foliage in the screen probe gather.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>Rejected as a preset value, deliberately.<\/strong> The audit says *&quot;values vary by reflection quality; forcing 0.8 locks the high-quality rough-specular workload across presets&quot;* -- which names a direction but not a second number.<\/p><p>This project&#x27;s standard for splitting a value across presets is that the audit&#x27;s own text must name both numbers. A direction without a number is not enough, and guessing one here would be inventing a fact about the engine in the one category where cost compounds fastest.<\/p><p>So 0.8 stays everywhere, and this entry is the clearest example of the standard costing us something real. It is recorded rather than quietly fixed.<\/p>","filled":true},{"name":"r.Lumen.ScreenProbeGather.RadianceCache.NumProbesToTraceBudget","status":"active","ourValue":"100, and 300 on the Quality preset","engineDefault":"100","valueRange":"a probe count per frame. Scalability can override it.","appliesWhen":"Always, in the radiance cache update.","visualsHtml":"The budget decides how many cache probes may be re-traced each frame. A larger budget means the cache catches up faster, so when a light changes or you walk into a new room the indirect lighting settles sooner. A smaller one leaves a visible lag while the room fills in.","performanceHtml":"Linear in the budget, and it is paid every frame whether or not anything changed.","definitionHtml":"The per-frame cap on radiance cache probes that may be traced.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Both numbers are the audit&#x27;s. It graded the config&#x27;s 300 CONDITIONAL with *&quot;the current constructor default is 100 and scalability can override it. Locking 300 improves responsiveness at additional GPU cost.&quot;*<\/p><p>Quality triples the budget and buys the responsiveness. Balanced and Performance write Epic&#x27;s 100.<\/p><p>Until 2026-08-31 Balanced wrote 300 as well.<\/p>","filled":true},{"name":"r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution","status":"active","ourValue":"32, and 64 on the Quality preset","engineDefault":"32","valueRange":"powers of two. 32 and 64 are the practical settings.","appliesWhen":"Always, in the radiance cache.","visualsHtml":"The angular resolution of each cache probe. 64 resolves sharper distant lighting and reduces the blockiness that shows on large flat surfaces lit indirectly.","performanceHtml":"<strong>Rays per probe scale with the square of this.<\/strong> 64 is four times the tracing work of 32, per probe, every frame.","definitionHtml":"The octahedral resolution of a radiance cache probe.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>Read the provenance before copying this pattern.<\/strong> The audit names one number: *&quot;32 is the current default probe resolution and ray count already scales with its square.&quot;* It does not recommend 64.<\/p><p>64 is the maintainer&#x27;s own tested value. That is real evidence, but it is testing rather than documentation, so it goes on Quality alone -- the preset whose whole promise is spending frames on looks.<\/p><p>This and <code>r.LensFlareQuality<\/code> are the only two entries in the project that split on a number the audit did not name, and both say so at the top.<\/p>","filled":true},{"name":"r.Lumen.ScreenProbeGather.ScreenTraces","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, in the screen probe gather.","visualsHtml":"Screen traces march through the depth buffer before falling back to the slower world-space methods. They are what makes nearby indirect light sharp and correctly occluded. Off, near-field bounce lighting gets coarser and leaks through thin geometry.","performanceHtml":"Screen traces are the cheapest tracing method Lumen has. Disabling them does not save time; it pushes the same work onto more expensive paths.","definitionHtml":"Enables screen-space tracing as the first step of the screen probe gather.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. Worth pinning precisely because turning it off looks like a saving and is not.<\/p>","filled":true},{"name":"r.Lumen.ScreenProbeGather.ScreenTraces.HZBTraversal.FullResDepth","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only while screen traces are on.","visualsHtml":"Full-resolution depth during hierarchical traversal means a screen trace can see thin geometry -- railings, wires, leaves -- that a downsampled depth buffer would miss. Off, light leaks past those.","performanceHtml":"A modest cost, paid on the cheapest tracing path.","definitionHtml":"Uses full-resolution depth rather than a downsampled HZB level when traversing the depth hierarchy for screen traces.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.Lumen.ScreenProbeGather.ShortRangeAO","status":"active","ourValue":"0","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, in the screen probe gather.","visualsHtml":"Short-range ambient occlusion is the high-frequency contact darkening where surfaces nearly touch. It is what stops objects looking as if they hover. Off, the scene loses that contact and reads flatter, most visibly on furniture on a floor, rocks on ground and any tight corner.","performanceHtml":"A full-resolution pass. Disabling it is one of the larger single savings available inside Lumen.","definitionHtml":"Lumen&#x27;s own short-range occlusion term, computed at full resolution from the screen probes.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>This is the one command in the category that departs from the default in every preset, including Quality, and it is not currently defended anywhere.<\/strong><\/p><p>The audit&#x27;s note is even-handed: *&quot;Disabling ShortRangeAO saves full-resolution work but removes high-frequency contact occlusion.&quot;* It states a cost and a consequence, and it does not recommend either direction.<\/p><p>The config chose 0 and paired it with <code>r.Lumen.DiffuseIndirect.SSAO<\/code> as a cheaper substitute. That pairing is coherent, and it is why the two are written up together. But on Balanced and Performance the substitute is now off as well, so those presets have no contact occlusion at all.<\/p><p>That may be the right call for Performance. It is a strange one for Balanced, and it is the open question left in this category. It is recorded here rather than changed, because changing it is a look decision and belongs to a conversation, not to a sweep.<\/p>","filled":true},{"name":"r.Lumen.ScreenProbeGather.StochasticInterpolation","status":"active","ourValue":"0; 1 when \"Lumen: cheaper probe blending\" is ticked","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Always, in the screen probe gather.","visualsHtml":"On, probe interpolation takes one stochastic sample instead of four bilinear ones. Indirect light becomes noisier and less steady, and the noise moves, which the temporal passes then have to clean up.","performanceHtml":"Potentially cheaper -- a quarter of the interpolation samples. Whether that survives the extra denoising is exactly what has not been measured.","definitionHtml":"Replaces four-tap bilinear probe interpolation with a single stochastic sample.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The audit calls this one *&quot;a Lumen-specific A/B test&quot;* in so many words, and we were shipping one side of the test, on, to everybody, against a documented default of 0.<\/p><p>Now a switch on the Experimental tab. It writes 0 until ticked, so ticking nothing changes nothing.<\/p>","filled":true},{"name":"r.Lumen.ScreenProbeGather.TemporalFilterProbes","status":"active","ourValue":"0; 1 when \"Lumen: smooth probes over time\" is ticked","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Always, in the screen probe gather.","visualsHtml":"Averages probe results across frames. Indirect light gets visibly cleaner in a static scene. The cost is response: when a light turns on or you round a corner, the new lighting arrives late and can leave a faint trail behind moving objects.","performanceHtml":"Slightly cheaper per frame in exchange for holding an extra history buffer. Not a decisive lever either way.","definitionHtml":"Applies a temporal filter to screen probe results before they are gathered.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The audit: *&quot;default 0. Can reduce probe noise but adds temporal response delay and possible ghosting. Content-specific Lumen option.&quot;* Content-specific means it depends on the game, which means a general config cannot answer it.<\/p><p>Now a switch on the Experimental tab, writing 0 until ticked.<\/p>","filled":true},{"name":"r.Lumen.ScreenProbeGather.TracingOctahedronResolution","status":"active","ourValue":"8, and 16 on the Quality preset","engineDefault":"8","valueRange":"powers of two. 8 and 16 in practice.","appliesWhen":"Always, in the screen probe gather.","visualsHtml":"The angular resolution of each screen probe&#x27;s tracing. Higher resolves finer detail in bounced light -- the shape of a window reflected in indirect light, rather than a soft glow.","performanceHtml":"<strong>Traces per probe scale with the square.<\/strong> 16 is four times the tracing work of 8, on every screen probe, every frame. The audit&#x27;s own phrase is *&quot;greatly increases traces per probe and GPU cost&quot;*.","definitionHtml":"The octahedral resolution used when tracing from a screen probe.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Both numbers are the audit&#x27;s, so both may be used. 8 is the documented default and is what Balanced and Performance write; 16 goes to Quality alone.<\/p><p><strong>This was the single most expensive line in the file on the Balanced preset.<\/strong> Until 2026-08-31 Balanced wrote 16, quadrupling probe tracing work for the preset the app calls Recommended, with nothing in the data saying why.<\/p>","filled":true},{"name":"r.Lumen.TraceMeshSDFs","status":"active","ourValue":"0, and 1 on the Quality preset","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Software tracing. Hardware ray tracing uses a different path.","visualsHtml":"Mesh signed distance fields let Lumen trace against individual objects rather than only the coarse global field. Off-screen geometry occludes and bounces light more correctly, so a wall behind the camera actually blocks light. Off, off-screen coverage is coarser and light can leak through it.","performanceHtml":"The audit: *&quot;costly in dense or overlapping scenes&quot;*. Cost rises with how many mesh fields overlap a traced ray, so it is worst exactly where scenes are busiest.","definitionHtml":"Enables tracing against per-mesh distance fields in Lumen&#x27;s software tracing path.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>A whole tracing path, off by default, that was on for everyone except Performance until 2026-08-31. Quality turns it on now; Balanced and Performance write the documented 0.<\/p>","filled":true},{"name":"r.Lumen.TraceMeshSDFs.Allow","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, but it only permits the path. `r.Lumen.TraceMeshSDFs` decides whether it is used.","visualsHtml":"None on its own. Setting it to 0 would make the command above unable to take effect.","performanceHtml":"None on its own.","definitionHtml":"The permission gate for mesh SDF tracing. It does not force the path; it allows it.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>A permission gate, and this project removed several of those from the NO EFFECT block for being permissions.<\/strong> The distinction is worth stating plainly, because it is easy to get backwards.<\/p><p><code>r.Velocity.TemporalResponsiveness.Supported<\/code> defaults to <strong>off<\/strong>. Writing 1 there granted permission the engine had not granted, for a path Epic warns is expensive. That is adding something.<\/p><p>This one defaults to <strong>on<\/strong>. Writing 1 restores what the engine already allows, against a game that might have closed the gate. That is pinning something.<\/p><p>Same shape of command, opposite direction, opposite verdict. The test is not whether it is a permission -- it is whether the value we write is the default.<\/p>","filled":true},{"name":"r.Lumen.TranslucencyReflections.FrontLayer.Allow","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, as a gate for the command below.","visualsHtml":"None on its own.","performanceHtml":"None on its own.","definitionHtml":"The permission gate for front-layer translucency reflections.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The second permission gate in the category, and the same reasoning as <code>r.Lumen.TraceMeshSDFs.Allow<\/code> above: the default is on, so writing 1 pins rather than grants.<\/p><p>The pairing is the useful thing to notice. Lumen consistently splits a feature into <code>Allow<\/code> and <code>Enable<\/code>, and only <code>Enable<\/code> costs anything. Reading one without the other gives the wrong answer twice over.<\/p>","filled":true},{"name":"r.Lumen.TranslucencyReflections.FrontLayer.Enable","status":"active","ourValue":"0, and 1 on the Quality preset","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Only while `FrontLayer.Allow` is 1.","visualsHtml":"Gives the front-facing layer of translucent surfaces its own Lumen reflection. Glass, water surfaces and windows get a real reflection of the room instead of a cruder approximation. It is one of the more noticeable Lumen upgrades in an interior scene with windows.","performanceHtml":"The audit: *&quot;a feature- and content-specific GPU cost&quot;*. It is paid per translucent surface on screen, so a glass-heavy scene pays a lot and a forest pays nothing.","definitionHtml":"Enables Lumen reflections on the front layer of translucent materials.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Quality turns it on; Balanced and Performance write the documented 0. Until 2026-08-31 it was on everywhere except Performance.<\/p><p>Of the five commands moved to Quality-only that day, this is the one whose visual gain is easiest to see and whose cost is most content dependent -- which is exactly the profile of a setting that belongs to a preset rather than to a default.<\/p>","filled":true},{"name":"r.Lumen.TranslucencyVolume.RadianceCache.NumProbesToTraceBudget","status":"active","ourValue":"200","engineDefault":"200","valueRange":"a probe count per frame.","appliesWhen":"Always, in the translucency lighting volume.","visualsHtml":"The same idea as the screen probe budget, applied to the volume that lights translucent surfaces, fog and particles. A larger budget means smoke and glass catch up faster when lighting changes.","performanceHtml":"Linear in the budget, paid every frame.","definitionHtml":"The per-frame cap on translucency volume radiance cache probes that may be traced.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. Note the contrast with its screen-probe sibling above, which the config raised from 100 to 300: this one was left at Epic&#x27;s number. Nothing in the audit explains why one was raised and the other was not.<\/p>","filled":true},{"name":"r.Lumen.TranslucencyVolume.TraceFromVolume","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, wherever translucency is lit by Lumen.","visualsHtml":"Traces lighting from the translucency volume itself rather than approximating it. Fog, smoke and glass receive indirect light that matches the room they are in. Off, they fall back to a cruder estimate and can sit visibly wrong in their surroundings.","performanceHtml":"Real, and proportional to how much translucency is on screen.","definitionHtml":"Enables tracing from the translucency lighting volume.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.LumenScene.DirectLighting.OffscreenShadowing.TraceMeshSDFs","status":"active","ourValue":"0","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Software Lumen. It is about how off-screen shadows are traced.","visualsHtml":"At 1, off-screen shadowing traces against per-mesh distance fields and is accurate. At 0 it uses the lower-resolution global field, so shadows cast by things behind the camera are coarser and can miss thin or small casters entirely.","performanceHtml":"0 is faster, and it is one of the few departures in this category that saves rather than spends.","definitionHtml":"Chooses mesh distance fields over the global distance field when shadowing Lumen scene direct lighting from off-screen geometry.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>**The second command in this category that departs from the default in every preset, and like <code>ShortRangeAO<\/code> it is not defended anywhere.**<\/p><p>The audit is neutral: *&quot;Uses lower-resolution Global SDF rather than Mesh SDFs for offscreen shadows: faster but less accurate.&quot;* Faster and less accurate is a trade, and a trade with no preset attached is a decision made once for everyone.<\/p><p>Unlike <code>ShortRangeAO<\/code>, this one at least points the way the app&#x27;s name points -- it is a performance tuner, and this saves time. But it belongs on a preset, not on everybody, and it is the second open question left in this category.<\/p>","filled":true},{"name":"r.LumenScene.Lighting.AsyncCompute","status":"active","ourValue":"1","engineDefault":"1 where possible","valueRange":"0 or 1","appliesWhen":"Where the platform supports async compute.","visualsHtml":"None.","performanceHtml":"Lets Lumen scene lighting overlap other GPU work. On by default because it is generally a win.","definitionHtml":"Schedules Lumen scene direct lighting on the asynchronous compute queue.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. The audit says *&quot;Omit and inherit&quot;*; we pin it instead, for the reason in <code>r.Bloom.AsyncCompute<\/code>.<\/p>","filled":true},{"name":"r.LumenScene.ParallelUpdate","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, on the CPU side of the Lumen scene update.","visualsHtml":"None.","performanceHtml":"Spreads the Lumen scene update across worker threads instead of running it on one. On a scene with many Lumen-relevant primitives this is a meaningful CPU saving, which is why it is the default.","definitionHtml":"Enables parallel execution of the Lumen scene update.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. The audit&#x27;s note is the shortest in the category: *&quot;Valid and exactly current default. Omit and inherit.&quot;*<\/p><p>Note the contrast with <code>r.DistanceFields.ParallelUpdate<\/code> at the end of this paper. Same shape of name, same idea, opposite situation: that one defaults to <strong>0<\/strong> and was being forced to 1.<\/p>","filled":true},{"name":"r.DistanceFields.ParallelUpdate","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Distance field updates. It is an internal control.","visualsHtml":"None directly.","performanceHtml":"Unknown, and that is the point. Parallelising a workload that is short or contended can cost more in synchronisation than it saves.","definitionHtml":"An internal, undocumented parallel path for distance field updates. The audit&#x27;s words: *&quot;Valid internal CVar, current default 0, but Epic publishes no supported end-user behavior for forcing it. Leave the undocumented path engine-controlled.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>One of the five real commands hidden in the NO EFFECT block.<\/strong><\/p><p>It is valid, it defaults to 0, and we were writing 1. Epic publishes nothing about what forcing it does, which means nobody outside Epic can say whether it helps. Turning on an undocumented internal path is not tuning; it is hoping.<\/p><p>Compare <code>r.LumenScene.ParallelUpdate<\/code> above, which is nearly the same name and is entirely legitimate: documented, default 1, pinned at 1. The difference is the whole lesson. <strong>A name that looks like a good idea is not evidence.<\/strong><\/p>","filled":true},{"name":"r.LumenScene.MeshCardsPerTask","status":"not used","ourValue":"not written since 2026-08-31; was 384","engineDefault":"128","valueRange":"a count of mesh cards per parallel task.","appliesWhen":"Always, in the Lumen scene update.","visualsHtml":"None.","performanceHtml":"The audit: *&quot;Value 384 can reduce parallelism or increase stalls depending on CPU and scene.&quot;* Larger tasks mean fewer of them, so fewer cores get work and a slow task holds everyone up.","definitionHtml":"The granularity of work batching when Lumen mesh cards are updated in parallel.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The second of the five. Tripled from Epic&#x27;s 128 with no stated reason, in a direction the audit says can <strong>reduce<\/strong> parallelism.<\/p><p>Task granularity is not a quality dial. Bigger is not better and there is no universal right answer -- it depends on the core count of the machine and on what is in the scene, neither of which a shipped config knows.<\/p>","filled":true},{"name":"r.LumenScene.PrimitivesPerTask","status":"not used","ourValue":"not written since 2026-08-31; was 384","engineDefault":"128","valueRange":"a count of primitives per parallel task.","appliesWhen":"Always, in the Lumen scene update.","visualsHtml":"None.","performanceHtml":"The same argument as <code>MeshCardsPerTask<\/code>. The audit: *&quot;No universal optimum across scenes and CPUs.&quot;*","definitionHtml":"Work batching granularity for primitive processing in the Lumen scene update.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The third of the five, and the twin of the one above -- same default, same override, same reasoning. Whoever wrote the original config set both to 384 together, which suggests a guess applied twice rather than two measurements.<\/p>","filled":true},{"name":"r.LumenScene.SurfaceCache.Feedback.MinPageHits","status":"not used","ourValue":"not written since 2026-08-31; was 32.0","engineDefault":"16","valueRange":"a hit count threshold.","appliesWhen":"Always, in surface cache streaming.","visualsHtml":"Indirectly, yes. The surface cache is what Lumen reads lighting from; a page that arrives late means indirect light that is wrong or missing on that surface until it does.","performanceHtml":"The audit: *&quot;Value 32 arbitrarily delays demand for new surface-cache pages and is content/streaming sensitive.&quot;* Doubling the threshold means a surface must be looked at twice as often before the engine agrees to fetch its page.","definitionHtml":"The number of feedback hits a surface must accumulate before the surface cache requests a page for it.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The fourth of the five, and the one most likely to have been visible to players. A doubled threshold delays surface cache pages, and delayed pages show up as lighting that pops in a moment after you look at something.<\/p><p>The audit&#x27;s word for it is <strong>arbitrarily<\/strong>.<\/p>","filled":true},{"name":"r.LumenScene.SurfaceCache.RemovesPerFrame","status":"not used","ourValue":"not written since 2026-08-31; was 128","engineDefault":"512","valueRange":"a count of cache pages evicted per frame.","appliesWhen":"Always, in surface cache maintenance.","visualsHtml":"Indirectly. A backlog of stale pages means the cache holds lighting for surfaces that have changed or gone.","performanceHtml":"The audit: *&quot;Throttling removals this far can create stale-work backlog; internal content-sensitive tuning, not a general option.&quot;* Quartering the eviction rate is a large change in the wrong direction.","definitionHtml":"The maximum number of surface cache pages that may be removed in one frame.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The fifth and last of the real ones. Set to a quarter of Epic&#x27;s value.<\/p><p>Taken together, the five are the strongest argument this review has produced for reading the NO EFFECT block rather than trusting its heading. The block says the engine ignores names it does not know. These five are names the engine knows perfectly well, and it was doing what they said.<\/p>","filled":true},{"name":"r.DistanceFields.ParallelAtlasUpdate","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No such command. The audit warns specifically against substituting <code>r.DistanceFields.ParallelUpdate<\/code>, which is a different internal control and is covered above.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The audit&#x27;s warning against substitution is the useful part: two names one word apart, one of them real, and the real one should also not be written.<\/p>","filled":true},{"name":"r.DistanceFields.ParallelBuild","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist as a runtime CVar.","valueRange":"not applicable.","appliesWhen":"Never at runtime.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Distance field generation is build-time and content work. There is no runtime command to parallelise it, because at runtime it has already happened.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. A good example of a config line that could never have worked: it asks the shipped game to speed up something that happened on a developer&#x27;s machine months earlier.<\/p>","filled":true},{"name":"r.DistanceFields.ParallelCulling","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No such command.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Third in a family of four <code>r.DistanceFields.Parallel*<\/code> lines, of which exactly one is a real command -- and that one defaults to off.<\/p>","filled":true},{"name":"r.ParallelDistanceField","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No such command. Distance field work has feature-specific scheduling rather than one global switch.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The fourth spelling of the same wish.<\/p><p>Four names, one idea, one of them real and defaulting to off. That ratio is the honest summary of the whole NO EFFECT block: mostly harmless, occasionally not, and never a substitute for reading the reference.<\/p>","filled":true},{"name":"r.Lumen.ASVGF.AsyncCompute","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none in current UE5.","valueRange":"not applicable.","appliesWhen":"Never on a stock build.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"ASVGF is a spatiotemporal denoising filter from research literature. The name is not in the current stock registry, so this is either obsolete or from a custom engine branch.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.Lumen.HardwareRayTracing.AsyncCompute","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this exact name.","valueRange":"not applicable.","appliesWhen":"Never as written.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar under this exact name. UE5 exposes async compute for Lumen through other, narrower controls.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Plausible-looking, which is the danger: it is built from three real words in the right order and still names nothing.<\/p>","filled":true},{"name":"r.Lumen.HardwareRayTracing.ShaderExecutionReordering","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this name.","valueRange":"not applicable.","appliesWhen":"Never as written.","visualsHtml":"None.","performanceHtml":"None. But the audit adds a warning worth keeping: shader execution reordering is capability and path specific and *&quot;can regress unsuitable workloads&quot;*, so the right response to this line is not to find the real name and write that instead.","definitionHtml":"SER is a real hardware feature on recent NVIDIA GPUs that regroups divergent ray-tracing threads. There is no current Lumen CVar under this name, and the audit says explicitly not to substitute another SER control.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, with the audit&#x27;s do-not-substitute warning preserved. It is the second such warning in this paper, after <code>r.DistanceFields.ParallelAtlasUpdate<\/code>, and both exist because the obvious next step after finding a dead name is to look for the live one.<\/p>","filled":true},{"name":"r.Lumen.SceneCapture.MaxTargetTexelsPerTexelRatio","status":"not used","ourValue":"not written since 2026-08-31; was 4","engineDefault":"none under this exact name.","valueRange":"not applicable.","appliesWhen":"Never as written.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock UE5 CVar under this SceneCapture name. Obsolete, renamed, or from a branch.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The audited config had this one commented out already, so it was never doing anything even by accident.<\/p>","filled":true},{"name":"r.Lumen.ScreenProbeGather.AsyncCompute","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this exact name.","valueRange":"not applicable.","appliesWhen":"Never as written.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar with this exact name. The real async compute controls for Lumen are the global one and <code>r.Lumen.DiffuseIndirect.AsyncCompute<\/code>, which is written properly at the top of this paper.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. This is the third <code>*.AsyncCompute<\/code> name in the inert list and the category also has two real ones. Guessing that a subsystem has an async switch, because two of its neighbours do, is how a config file grows names nobody wrote.<\/p>","filled":true},{"name":"r.LumenScene.FarField.OcclusionOnly","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none in current stock UE5.","valueRange":"not applicable.","appliesWhen":"Never as written. Far Field itself also needs a suitable hardware ray tracing and HLOD project setup, which a config file cannot arrange.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Far Field is Lumen&#x27;s mechanism for very distant geometry. This name is not in current stock UE5, and the feature it refers to is a project-level setup rather than a switch.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The audit&#x27;s second point is the more useful one: even a working version of this line would not have done anything, because the feature needs things only the game&#x27;s own build can provide.<\/p>","filled":true},{"name":"r.LumenScene.SurfaceCache.MaxFramesPerUpdate","status":"not used","ourValue":"not written since 2026-08-31; was 4","engineDefault":"none in the current registry.","valueRange":"not applicable.","appliesWhen":"Never on a current build.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Not present in the current stock registry; obsolete or renamed. Its two live neighbours in the surface cache family -- <code>Feedback.MinPageHits<\/code> and <code>RemovesPerFrame<\/code> -- are documented above and were both real.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and it makes the point the whole category has been making. Three surface cache lines sat side by side in the same block under the same heading. Two were real and set to values the audit calls arbitrary and harmful; one was a name that does nothing. Nothing about their appearance distinguished them.<\/p>","filled":true}]},{"id":"ray-tracing","title":"Hardware Ray Tracing","introHtml":"<p>Hardware ray tracing uses the dedicated ray-tracing units on a modern GPU to trace light through the actual scene, instead of approximating it from what happens to be on screen. Reflections show things behind the camera, shadows have correct contact and softness, and Lumen&#x27;s indirect light stops guessing at geometry it cannot see.<\/p><p>It is expensive, and it needs hardware. <strong>This category is different from every other one in the file in two ways that matter more than any single value:<\/strong><\/p><ul><li>It is gated on *&quot;Needs a ray-tracing capable GPU&quot;*, so it does not appear<\/li><\/ul><p>unless the user&#x27;s machine can use it.<\/p><ul><li>It is <strong>switched off entirely on the Performance preset.<\/strong><\/li><\/ul><p>That second point changes how the values here should be read. Everywhere else, a Performance value is the cheap end of a range. Here, Performance already gets nothing from this category, so a Performance value is reachable only by somebody who picked Performance and then deliberately ticked ray tracing back on. That is a real person -- &quot;I want ray tracing, but cheaply&quot; -- and it is a narrow one.<\/p><p>The category splits cleanly into three kinds of command. Nine pin engine defaults. Two are Lumen&#x27;s hardware ray tracing being switched on, which is the whole point of the category. Three were extras that Quality and Balanced paid for identically until 2026-08-31.<\/p>","commands":[{"name":"r.RayTracing.Enable","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, on a build with ray tracing support compiled in. Project settings and `r.RayTracing.EnableOnDemand` still decide whether switching it at runtime can work at all.","visualsHtml":"The master switch. Off, nothing else in this category means anything.","performanceHtml":"Enabling ray tracing costs memory and CPU time to build and maintain the acceleration structure, before any ray is traced.","definitionHtml":"The runtime switch for the ray tracing subsystem. The audit calls it experimental as a *runtime* switch: whether it can be flipped after startup depends on the project, and a game built without ray tracing support ignores it.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. The pinning rule applies with unusual force here: this is the one line that could turn the whole category into nothing, and a game that ships it at 0 would silently waste every other line below.<\/p>","filled":true},{"name":"r.RayTracing.Culling.Angle","status":"active","ourValue":"1","engineDefault":"1","valueRange":"an angle in degrees.","appliesWhen":"Always, while ray tracing is on.","visualsHtml":"Objects whose on-screen angular size falls below this are left out of the ray tracing scene, so they stop appearing in reflections and stop casting ray-traced shadows. At 1 degree that means genuinely tiny things.","performanceHtml":"Raising it removes more geometry from the acceleration structure, which is a real saving on scenes with many small props.","definitionHtml":"The minimum angular size, in degrees, an instance must subtend before it is included in the ray tracing scene.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.RayTracing.Culling.Radius","status":"active","ourValue":"15000, with 25000 on Quality and 10000 on Performance","engineDefault":"30000 according to the CVar registry. Epic's performance guide recommends 10000.","valueRange":"a distance in centimetres. 30000 is 300 metres, 10000 is 100.","appliesWhen":"Always, while ray tracing is on.","visualsHtml":"Geometry beyond this distance is left out of the ray tracing scene. Inside a 100 metre radius a distant building still reflects in a puddle; beyond it, it does not, and reflections of the far background simply stop.","performanceHtml":"<strong>Lower is faster.<\/strong> The radius decides how much of the world goes into the acceleration structure, and that structure is rebuilt and traversed every frame. Dropping 300 metres to 100 removes most of an open world from it.","definitionHtml":"The radius around the camera within which instances are included in the ray tracing scene.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference","https://dev.epicgames.com/documentation/en-us/unreal-engine/ray-tracing-and-path-tracer-features-properties-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the two Epic sources disagree","notesHtml":"<p><strong>Epic&#x27;s own pages give two different numbers, and the audit refused to choose:<\/strong> *&quot;Current registry help reports 30000 cm while Epic&#x27;s current performance guide still says 10000 cm; do not force it universally while the primary guidance conflicts.&quot;*<\/p><p>Read carefully, they are not contradicting each other. 30000 is what the engine <strong>does<\/strong>; 10000 is what Epic <strong>advises<\/strong> for performance. A default and a recommendation are different kinds of statement.<\/p><p><strong>Read the provenance before copying this pattern.<\/strong> Since 2026-08-31 this is a three-way preset split, and only one of the three numbers is Epic&#x27;s. Performance uses their 10000. Balanced writes 15000 and Quality 25000, and neither figure appears in any Epic source -- both are the maintainer&#x27;s own measured values, run and judged before being written down.<\/p><p>This project&#x27;s standard is that a preset split must use numbers the audit already names, precisely so that nobody invents a fact about the engine. This is the third entry to depart from it, after <code>r.LensFlareQuality<\/code> and the Lumen <code>ProbeResolution<\/code>, and like both of those it says so rather than hiding it.<\/p><p>The lever is a good one. Radius decides how much of the world enters the ray tracing acceleration structure, which is rebuilt and traversed every frame, so cost falls quickly as it shrinks. It is one of the few settings in this category that scales smoothly rather than switching something on or off.<\/p><p>The cost should not be understated. At 15000 the world stops appearing in reflections and stops casting ray-traced shadows beyond 150 metres, against 300 at the engine default. In an open scene with water or wet ground, that edge is visible -- a distant skyline simply absent from the puddle in front of you.<\/p><p>Because the category is off on the Performance preset, the 10000 is written only when somebody on Performance has deliberately ticked ray tracing back on. The same narrow, real user as <code>EnableTwoSidedGeometry<\/code> below.<\/p>","filled":true},{"name":"r.RayTracing.Geometry.Cable","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only where cable components exist in the scene.","visualsHtml":"Includes cable components in the ray tracing scene, so hanging cables reflect and cast ray-traced shadows instead of vanishing from both.","performanceHtml":"Proportional to how many cables there are, which in most games is very few.","definitionHtml":"One of a family of per-geometry-type inclusion switches for the ray tracing scene.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. First of six <code>r.RayTracing.Geometry.*<\/code> inclusion switches, all defaulting to 1 and all pinned.<\/p><p>The family is worth understanding as a family: each one decides whether a class of geometry exists as far as ray tracing is concerned. Turning any of them off does not make that geometry look worse -- it makes it <strong>disappear<\/strong> from reflections and stop casting shadows, while still being drawn normally. That mismatch is far more noticeable than lower quality would be.<\/p>","filled":true},{"name":"r.RayTracing.Geometry.GeometryCache","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only where geometry cache assets are used -- typically Alembic imports of simulated or animated meshes.","visualsHtml":"Includes geometry caches in the ray tracing scene.","performanceHtml":"Geometry caches change every frame, so their ray tracing structures must be rebuilt every frame. Where they are used heavily this is one of the more expensive inclusions.","definitionHtml":"Inclusion switch for geometry cache components.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.RayTracing.Geometry.HierarchicalInstancedStaticMesh","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Wherever HISM components are used, which in practice means foliage, rocks, debris and anything else scattered in large numbers.","visualsHtml":"Includes hierarchical instanced static meshes in the ray tracing scene. This is the switch that decides whether a forest exists in reflections and ray-traced shadows.","performanceHtml":"Potentially the largest of the six, because HISM is used precisely where instance counts are highest.","definitionHtml":"Inclusion switch for hierarchical instanced static mesh components.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. The audited config had this one commented out, and the audit approved: *&quot;HISM inclusion already defaults to 1, so leaving this candidate commented is correct.&quot;* We write it anyway under the pinning rule, and this is one of the entries where that rule earns its keep -- a game that had excluded HISM would have a forest missing from every reflection.<\/p>","filled":true},{"name":"r.RayTracing.Geometry.Landscape.DetectTextureStreaming","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only on the landscape ray tracing update path.","visualsHtml":"Lets the landscape ray tracing geometry notice when its textures have streamed in and update accordingly, so ray-traced landscape does not sit at a stale displacement.","performanceHtml":"Small, and only on landscape updates.","definitionHtml":"Enables texture streaming detection for landscape ray tracing geometry updates.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. The narrowest command in the category: it matters only on landscapes, only while textures are still streaming, and only on the update path.<\/p>","filled":true},{"name":"r.RayTracing.Geometry.SkeletalMeshes","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Wherever skeletal meshes exist, which means characters.","visualsHtml":"Includes skeletal meshes in the ray tracing scene. Off, characters have no reflection and cast no ray-traced shadow -- the single most obvious failure any of these six can produce.","performanceHtml":"Skeletal meshes deform every frame, so their ray tracing structures are refitted every frame. In a crowd this is significant.","definitionHtml":"Inclusion switch for skeletal mesh components.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. Of the six, this is the one where a game disabling it for performance would be most visible and most worth overriding.<\/p>","filled":true},{"name":"r.RayTracing.Geometry.SplineMeshes","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Wherever spline meshes exist -- roads, pipes, railings, cables built along a path.","visualsHtml":"Includes spline meshes in the ray tracing scene.","performanceHtml":"Modest. Spline meshes are usually static once built.","definitionHtml":"Inclusion switch for spline mesh components.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. Last of the six.<\/p>","filled":true},{"name":"r.RayTracing.Shadows.EnableTwoSidedGeometry","status":"active","ourValue":"1, and 0 on the Performance preset","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Ray-traced shadows only.","visualsHtml":"Two-sided geometry is leaves, grass, fences, cloth, hair cards -- every flat surface a game draws from both sides. At 0 those stop being treated as shadow occluders, so <strong>a tree casts no shadow through its own foliage<\/strong> and a chain-link fence throws no pattern. It is not a subtle loss of quality; it is a missing shadow.","performanceHtml":"Real. Two-sided hits cost more to resolve because the tracer cannot cull by facing, and foliage is exactly where ray counts are highest.","definitionHtml":"Whether two-sided geometry participates as an occluder in ray-traced shadow tracing.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference","https://dev.epicgames.com/documentation/en-us/unreal-engine/ray-tracing-and-path-tracer-features-properties-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>We wrote 0 in every preset until 2026-08-31<\/strong>, against a documented default of 1, for a saving the audit qualifies as *&quot;hardware-RT/content profile only&quot;*.<\/p><p>The default is restored, and 0 is kept for Performance alone. Because this category is switched off on Performance, that value is written only when somebody on the Performance preset has deliberately ticked ray tracing back on -- which is precisely the person the trade is for: *I want ray tracing, but cheaply.*<\/p><p>That combination -- a preset value inside a category the same preset switches off -- broke a golden test, which had encoded the rule *&quot;a preset value changes the value, not the line count.&quot;* The rule was right and slightly too narrow. It now reads: the line count moves only where the <strong>category<\/strong> moved it, and the test checks the resolved values rather than the written ones so an entry hidden by a disabled category is still held to differing somewhere.<\/p>","filled":true},{"name":"r.Lumen.HardwareRayTracing","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Needs project and platform support. Without both, it does nothing.","visualsHtml":"Switches Lumen from software tracing against distance fields to hardware tracing against real triangles. Indirect light and reflections stop being approximations of the scene and start being the scene: small objects occlude correctly, thin geometry stops leaking light, and reflections resolve detail the distance-field representation never had.","performanceHtml":"The audit: *&quot;can have high scene-update cost&quot;*. The cost is not only in tracing -- the ray tracing acceleration structure has to be built and kept current for everything Lumen might hit, every frame.","definitionHtml":"Selects the hardware ray tracing path for Lumen.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/using-hardware-ray-tracing-with-lumen-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>This departs from the engine default in every preset where the category is on, and that is deliberate.<\/strong> It is the one place in this paper where writing a non-default everywhere is the right answer.<\/p><p>The reasoning: this command *is* the category. A user who has a ray-tracing GPU, sees a category called Hardware Ray Tracing, and leaves it ticked has asked for exactly this. The default of 0 exists because Epic cannot assume the hardware; we can, because the category is gated on it and off on Performance.<\/p><p>Everything else in this category is either a default being pinned or an extra on top. This is the switch they are all about.<\/p>","filled":true},{"name":"r.Lumen.HardwareRayTracing.HitLighting.ReflectionCaptures","status":"active","ourValue":"0, and 1 on the Quality preset","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Lumen hardware ray tracing with hit lighting.","visualsHtml":"Lets reflection captures contribute lighting at ray hit points. Surfaces seen only in a reflection get lit closer to how they would look directly, instead of falling back to a coarser estimate.","performanceHtml":"The audit: *&quot;renderer-specific and adds quality/cost&quot;*. It is paid per ray hit that needs lighting, so it scales with how much of the frame is reflective.","definitionHtml":"Includes reflection capture lighting when shading hit points during Lumen hardware ray tracing.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/using-hardware-ray-tracing-with-lumen-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Both numbers are the audit&#x27;s: 0 is the documented default, 1 is what the source config wrote. Quality pays; Balanced writes the default.<\/p><p>Until 2026-08-31 Balanced wrote 1 as well, so Quality and Balanced were identical here -- the same pattern found in the Lumen category and corrected the same day.<\/p>","filled":true},{"name":"r.Lumen.Reflections.HardwareRayTracing","status":"active","ourValue":"1","engineDefault":"1 where global project and platform support permit it","valueRange":"0 or 1","appliesWhen":"Only while `r.Lumen.HardwareRayTracing` is on and support exists.","visualsHtml":"Uses hardware ray tracing for Lumen&#x27;s reflection path specifically. Off, reflections fall back to software tracing while the rest of Lumen stays hardware -- which looks inconsistent, because reflections are where the difference shows most.","performanceHtml":"The reflection path is usually the most expensive consumer of hardware rays.","definitionHtml":"The hardware ray tracing switch for Lumen reflections, separate from the global Lumen one.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/using-hardware-ray-tracing-with-lumen-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, which is on wherever support permits. Pinned so that a game which had turned reflections back to software tracing is brought into line with the rest of the category.<\/p>","filled":true},{"name":"r.Lumen.Reflections.HardwareRayTracing.HitLighting","status":"active","ourValue":"0, and 1 on the Quality preset","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"UE 5.6 and later, with Lumen hardware ray tracing reflections.","visualsHtml":"When a reflection ray hits a surface the Surface Cache has no valid lighting for, this fires a <strong>second<\/strong> trace to light that hit properly. It fixes reflections that would otherwise show a black or wrongly lit patch where the cache had nothing.","performanceHtml":"The audit&#x27;s phrase is *&quot;improving quality at extra cost&quot;*, and the cost is structural rather than incremental: it is another trace over the subset of rays that failed, not a percentage more work on the ones that succeeded. A scene with many surfaces missing from the cache pays a lot; a well-covered one pays almost nothing.","definitionHtml":"Fires a hit-lighting trace for reflection rays whose Surface Cache lookup was invalid.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/using-hardware-ray-tracing-with-lumen-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation; the option itself is UE 5.6 and later","notesHtml":"<p>Quality pays for it; Balanced writes the documented 0. Both numbers are the audit&#x27;s.<\/p><p>Being 5.6-and-later is worth noting on its own: on an older engine the line is simply unknown and ignored, so it can only ever help or do nothing -- but it also means the Quality preset behaves differently on two games depending on which engine build they shipped with, and nothing on screen says so.<\/p>","filled":true},{"name":"r.D3D12.RayTracing.AllowSpecializedStateObjects","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"The D3D12 renderer, and only where specialized state objects actually exist. Where none do, it has no effect at all.","visualsHtml":"None.","performanceHtml":"Unknown in the direction we were pushing it. Specialized state objects let the driver compile a narrower, faster ray tracing pipeline for particular cases. Turning them off gives that up.","definitionHtml":"Allows the D3D12 RHI to create specialized ray tracing state objects. The audit: *&quot;Valid, default 1, and documented mainly for performance testing... Do not override generally.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>A real command, in the NO EFFECT block, forced from its default of 1 to 0.<\/strong><\/p><p>The same shape as the five found in Lumen: valid, documented, and pushed the wrong way. Epic documents it *for performance testing* -- a diagnostic switch, so that an engineer can measure what specialized state objects are worth. Shipping one side of a diagnostic to every user is not tuning.<\/p><p>Its saving grace is the second half of the audit&#x27;s note: it has no effect unless specialized state objects exist, so on many games it did nothing. That is luck, not design.<\/p>","filled":true},{"name":"D3D12.RayTracing.AllowSpecializedStateObjects","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"none. The name is wrong.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"The same command as the entry above, missing its <code>r.<\/code> prefix. The engine does not answer to it.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where only the r. spelling exists","notesHtml":"<p>Switched off. The audit&#x27;s note is a warning rather than a description: *&quot;Wrong namespace/name for the current r.D3D12.* CVar. Do not silently substitute.&quot;*<\/p><p>Both spellings sat in the same block, one line apart, one real and one not. The dead one did nothing; the live one was pushing a documented default the wrong way. Reading the block as uniformly harmless is exactly the mistake.<\/p>","filled":true},{"name":"r.RayTracing.Culling","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. There is no root CVar by this name.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A parent name invented from the real <code>r.RayTracing.Culling.*<\/code> family. The engine has the children -- <code>Culling.Angle<\/code> and <code>Culling.Radius<\/code>, both documented above -- but no switch at the root.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where only the Culling.* children exist","notesHtml":"<p>Switched off. A pattern seen twice already in this review: a family of real commands, and a plausible-looking parent that does not exist. <code>r.Velocity.Enable<\/code> in the motion blur paper is the same mistake, and so is <code>r.Lumen.ScreenProbeGather.AsyncCompute<\/code> in the Lumen one.<\/p><p>The lesson is small and repeats: <strong>a naming convention is not an API.<\/strong><\/p>","filled":true},{"name":"LogNFORDenoise","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Only where the NFOR denoiser plugin is present.","visualsHtml":"None. It silences log output.","performanceHtml":"None worth measuring.","definitionHtml":"A log category, not a console variable. NFOR is a denoising filter used with path tracing and offline renders.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off as redundant. The audit&#x27;s grading is plain: *&quot;Redundant; plugin/version-specific category.&quot;*<\/p><p>Silencing a log has no effect on a shipped game that nobody is reading logs from, and it only exists at all if the plugin is installed. It is the least harmful entry in this whole review, and it is here for completeness rather than for risk.<\/p>","filled":true},{"name":"LogNNEDenoiser","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Only where the NNE denoiser plugin is present.","visualsHtml":"None.","performanceHtml":"None worth measuring.","definitionHtml":"A log category for the Neural Network Engine denoiser, again used with path tracing rather than real-time rendering.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off with its twin above, for the same reason.<\/p><p>Both point at path tracing rather than at games. Path tracing is Unreal&#x27;s offline, physically accurate renderer -- it is used to make images, not to play. Two log categories from that world ended up in a config file meant to make games run faster, which says something about where the original settings were collected from.<\/p>","filled":true}]},{"id":"megalights","title":"MegaLights","introHtml":"<p>MegaLights is UE5&#x27;s newer answer to a scene with many lights. The old way costs roughly one shadow pass per shadow-casting light, so artists ration them. MegaLights samples many lights stochastically instead, which makes the cost depend on the screen rather than on the light count -- a room with fifty lamps costs about what a room with five does.<\/p><p>It is new, it is opt-in per project, and most games on the list do not use it. That shapes everything in this paper.<\/p><p><strong>The category is gated on the game, not on the preset.<\/strong> Its condition is *&quot;Only matters if the game actually uses this feature&quot;*, so it never appears for a game that does not.<\/p><p>Until 2026-08-31 it was <strong>also<\/strong> restricted to the Quality preset, and that was backwards. A game that uses MegaLights uses it on every preset; a player who picks Performance is the one who needs the tuning most, and was getting none of it. The feature gate already does the real filtering, so the preset restriction was doing nothing but hiding the category from the people it would help. It is on for all three presets now.<\/p><p>Two of the five commands were A/B tests shipped as answers, in Epic&#x27;s own words. They are a switch on the Experimental tab now, and the presets decide underneath it.<\/p>","commands":[{"name":"r.MegaLights.AsyncCompute.GenerateSamples","status":"active","ourValue":"1, and 0 on the Quality preset. The \"MegaLights: use the async compute queue\" switch overrides both when set to Off or On.","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Only where MegaLights and async compute are both supported.","visualsHtml":"None. It moves work between GPU queues; the samples are the same either way.","performanceHtml":"Genuinely unpredictable, which is the point. Async compute lets this work run alongside graphics work instead of queueing behind it, so it wins where the graphics queue has idle gaps and loses where it does not. That is a property of the machine and the scene.","definitionHtml":"Schedules MegaLights sample generation on the asynchronous compute queue.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The audit: *&quot;Valid current MegaLights CVar, disabled by default. Epic requires workload-specific A/B testing.&quot;* Epic names one number, 0, and then asks for a test rather than giving an answer.<\/p><p>We shipped one side of that test, on, to everybody, until 2026-08-31.<\/p><p><strong>The split is the maintainer&#x27;s and measured.<\/strong> Balanced and Performance turn it on; Quality leaves it off. The reasoning is that a GPU under pressure has more to gain from overlapping work, and Quality is the preset least likely to be starved of it.<\/p><p>The Experimental switch can override that in either direction. Its default state writes <strong>null<\/strong> -- no opinion -- which is what lets the preset value underneath survive. A state that wrote a number in every position would kill the preset split outright, and this project has had to remove three dead values already for exactly that reason.<\/p>","filled":true},{"name":"r.MegaLights.AsyncCompute.Volume","status":"active","ourValue":"1, and 0 on the Quality preset. Same switch as above.","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Only where MegaLights, async compute and volumetric passes are all in play.","visualsHtml":"None.","performanceHtml":"The same argument as <code>GenerateSamples<\/code>, applied to the volu
