gine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.AllowMultiThreadedShaderCreation","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar. The audit: shader creation capability is *&quot;RHI/platform managed&quot;* -- decided by the graphics API and the driver, not by configuration.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The same category of mistake as <code>r.VRS.Tier<\/code> in the variable rate shading paper: asking a text file for a capability the hardware either has or does not.<\/p>","filled":true},{"name":"r.UseAsyncShaderPrecompilation","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none in current UE5.","valueRange":"not applicable.","appliesWhen":"Never on a current build.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A legacy entry from the <code>FShaderCache<\/code> era. The audit: the current <code>FShaderPipelineCache<\/code> and PSO precaching *&quot;replaced that system and already manages asynchronous work&quot;*.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Genuinely real once, in a system Unreal replaced -- the same shape as <code>grass.UseHaltonDistribution<\/code> and the six <code>pakcache.*<\/code> entries: obsolete rather than invented.<\/p>","filled":true},{"name":"r.ShaderDrawDebug","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"none under this exact name.","valueRange":"not applicable.","appliesWhen":"Never as written.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar with this exact name. Shader draw debugging is a real facility under a different name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and the last of thirty-five.<\/p><p>The category&#x27;s inert list is the largest in the file and also the most instructive, because the errors sort into four clean groups: twelve developer settings addressed to a machine that finished compiling months ago, seventeen invented names, four real commands moved off their defaults, and two silenced logs. Only the third group could do any harm, and only the fourth would have told anyone about it.<\/p>","filled":true}]},{"id":"occlusion-culling","title":"Occlusion & Culling","introHtml":"<p>Every frame the engine has to answer one question thousands of times: is this object worth drawing? Three tests answer it. <strong>Frustum culling<\/strong> removes what is outside the camera&#x27;s view. <strong>Occlusion culling<\/strong> removes what is behind something else. <strong>Instance culling<\/strong> does the same for the individual copies inside an instanced mesh.<\/p><p>All of it runs on the CPU, and almost all of it runs on the render thread -- which in a UE5 game is usually the thread everything else is waiting for. That is why this category matters more than its six commands suggest.<\/p><p><strong>Every one of the original six departs from Epic&#x27;s default<\/strong>, and every audit note asks for a measurement: *&quot;must be measured&quot;*, *&quot;content/CPU/GPU-specific&quot;*, *&quot;test per title&quot;*, *&quot;profile per title&quot;*. All six were reviewed and kept on 2026-08-31. None was benchmarked, and their evidence grade says so.<\/p><p>One of them, <code>r.NumBufferedOcclusionQueries<\/code>, is the rare case in this whole review of a departure pointing the way the app&#x27;s name points -- and it was already examined and rejected as a Performance preset candidate <strong>because it is the faster setting<\/strong>, so dropping to Epic&#x27;s value would cost frame time rather than save it.<\/p><p>The inert list held one real command, and it was the worst possible one to find in this category: <code>r.Visibility.TaskSchedule<\/code> was taking visibility work off the task graph and putting it back on the render thread. It is a live command now, pinned at Epic&#x27;s value, which makes seven in this category rather than six.<\/p>","commands":[{"name":"D3D12.InsertOuterOcclusionQuery","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"The D3D12 renderer.","visualsHtml":"None directly.","performanceHtml":"An outer occlusion query wraps a group of draws in a single query, so the whole group can be skipped when nothing in it is visible. The audit: *&quot;Epic notes it can help some GPU architectures; benefit is hardware-specific and must be measured.&quot;*","definitionHtml":"Inserts an outer occlusion query around grouped draws in the D3D12 renderer.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Kept, and the reason Epic ships it off is worth understanding: the cost is not in the query but in <strong>resolving<\/strong> it, and how cheaply a GPU does that varies by architecture. So this is one of the few settings in the file whose right answer genuinely differs between two machines both running the same game.<\/p>","filled":true},{"name":"foliage.MaxOcclusionQueriesPerComponent","status":"active","ourValue":"8","engineDefault":"16","valueRange":"a query count.","appliesWhen":"Foliage components, which is where instance counts are highest.","visualsHtml":"Indirectly. Coarser occlusion means more foliage is drawn that is actually hidden -- which costs time but shows nothing wrong. It does not cause missing foliage.","performanceHtml":"A foliage component holds many instances and the engine tests groups of them rather than each one. Fewer queries means larger groups: cheaper to ask, and coarser, because a group is drawn if any part of it is visible.","definitionHtml":"The maximum number of occlusion queries issued per foliage component.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Halved from Epic&#x27;s 16, and it moves with the Min value below.<\/p><p>The pair sets a <strong>range<\/strong> the engine chooses within, so halving one without the other would narrow the range rather than shift it. Both were halved, which keeps Epic&#x27;s ratio while moving the whole range down -- fewer queries, larger groups, less query overhead and more overdraw.<\/p><p>Whether that is a win depends entirely on how the game&#x27;s foliage was authored, which is what the audit means by *content-specific*.<\/p>","filled":true},{"name":"foliage.MinOcclusionQueriesPerComponent","status":"active","ourValue":"3","engineDefault":"6","valueRange":"a query count.","appliesWhen":"Foliage components.","visualsHtml":"The same as the Max entry above, at the other end of the range.","performanceHtml":"The floor on how few queries a component may use.","definitionHtml":"The minimum number of occlusion queries issued per foliage component.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Halved with its Max sibling, keeping the 1:2 ratio Epic chose.<\/p>","filled":true},{"name":"r.InstanceCulling.OcclusionCull","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Instanced rendering, which in UE5 is most static geometry.","visualsHtml":"<strong>This one can change what is drawn.<\/strong> The audit&#x27;s phrase is *&quot;may alter visibility behavior&quot;*, and an instance culled wrongly is an object that is simply not there.","performanceHtml":"Occlusion culling applied per instance rather than per component, so one instanced mesh can have some copies culled and others drawn. On a scene built from many instances that is a real saving.","definitionHtml":"Enables occlusion culling within the instance culling pass.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Kept, and it is the entry in this category to watch.<\/p><p>Everything else here trades CPU time against overdraw -- getting it wrong costs frames. This one trades CPU time against <strong>correctness<\/strong>, and getting it wrong means missing geometry. Epic ships it off for that reason, and *&quot;test per title&quot;* is not something a file shipped for fifty games can do.<\/p><p>It is kept because the saving on instance-heavy scenes is large and no misbehaviour has been observed. If any game on the list is ever reported to have objects flickering out of existence, this is the first line to try.<\/p>","filled":true},{"name":"r.NumBufferedOcclusionQueries","status":"active","ourValue":"2","engineDefault":"1","valueRange":"a buffer count.","appliesWhen":"Always.","visualsHtml":"A stale occlusion result means an object can be drawn a frame after it should have vanished, or vanish a frame late. It is visible as a brief flicker at the edge of a doorway or around a corner.","performanceHtml":"Occlusion queries are answered by the GPU a frame or more after they are asked. Buffering more of them means the CPU waits less often for an answer that has not arrived.","definitionHtml":"How many frames of occlusion query results are buffered.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The one departure in this category that points the way the app&#x27;s name points<\/strong>, and the reason it is not a preset value is worth recording.<\/p><p>It was examined as a Performance preset candidate and rejected, because the arithmetic runs backwards from the usual case: <strong>2 is already the faster setting<\/strong>, so moving Performance to Epic&#x27;s 1 would cost frame time in order to reduce artifacts. That is a quality change wearing a performance label. See <code>.agent/memory/preset-values.md<\/code>, where it is one of three recorded rejections.<\/p><p>The artifact it buys is real and small. The CPU wait it removes is real and happens every frame.<\/p>","filled":true},{"name":"r.Visibility.FrustumCull.UseSphereTestFirst","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Frustum culling, every frame, for every primitive.","visualsHtml":"None. Both tests answer the same question; only the order changes.","performanceHtml":"A sphere test is cheaper than a box test and less precise. Doing it first wins when most objects are rejected outright, because the cheap test answers most of the questions. It loses when most objects are visible, because then every one pays for two tests instead of one.","definitionHtml":"Performs a bounding sphere test before the bounding box test during frustum culling.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Kept. The audit&#x27;s *&quot;depends on scene bounds and rejection rates&quot;* is unusually precise about what would have to be measured: the fraction of primitives the cheap test can reject.<\/p><p>An open world with a wide view rejects most of what it tests, and a corridor rejects little. So this is a setting whose right answer changes <strong>between levels of the same game<\/strong>, which is about as far from a universal default as a value gets.<\/p>","filled":true},{"name":"r.Visibility.TaskSchedule","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"<strong>This decides where visibility work runs.<\/strong> At 1 the engine spreads frustum, occlusion and relevance work across the task graph in parallel. At 0 it runs on the render thread, in order -- which is the thread everything else in the frame is waiting for.","definitionHtml":"Selects async task-graph scheduling for the visibility pass.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>A real command that was in the NO EFFECT block, taking work off idle cores and putting it back on the busiest one.<\/strong> It is promoted into this category and pinned at Epic&#x27;s 1, rather than merely stopped -- so a game that had set 0 for its own reasons is corrected as well.<\/p><p>The audit: *&quot;Valid, current default 1 async task-graph scheduling. Forcing 0 shifts work back toward the render thread and has no universal benefit.&quot;*<\/p><p>There are two reasons somebody might write 0 and neither applies here. Task scheduling has a small fixed overhead, so on a machine with very few cores serial can win -- but this project assumes twelve hardware threads elsewhere, so it cannot also assume two. And serial timings are reproducible, which makes 0 useful while profiling; a shipped configuration is not profiling.<\/p><p>It was the worst single line to find in this category. The other six settings all spend effort saving render-thread time, and this one was quietly handing some back.<\/p><p>Note where it now sits: it is the seventh live command here rather than an absence, which is the difference between *we stopped doing a bad thing* and *we state what should happen*. The pinning rule is worth the extra line whenever the wrong value is one a game might plausibly have set, and 0 is exactly that -- somebody profiling would have written it and might not have taken it out.<\/p>","filled":true},{"name":"r.ForceOcclusionQueryBatching","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar with this exact name. Query batching is a real idea -- <code>D3D12.InsertOuterOcclusionQuery<\/code> above is one form of it -- but there is no global switch to force it.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.HZBOcclusion.Parallel","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The suffix is invented.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"HZB occlusion is real -- a hierarchical depth buffer used to test visibility cheaply -- and <code>r.HZBOcclusion<\/code> exists. The audit: *&quot;this suffix is invented.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where only r.HZBOcclusion exists","notesHtml":"<p>Switched off. A real command with <code>.Parallel<\/code> appended, which is the single most common mistake in the whole inert block.<\/p>","filled":true},{"name":"r.Occlusion.ParallelPrimFetch","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar with this exact name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.ParallelCulling","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar. The audit: *&quot;UE exposes specific culling/task controls rather than this universal switch&quot;* -- and one of them, <code>r.Visibility.TaskSchedule<\/code>, is documented above and was being set the wrong way.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and the pairing is the lesson. The file contained an invented switch asking for culling to be parallel, and beside it a real switch turning parallel culling <strong>off<\/strong>. Neither was checked.<\/p>","filled":true},{"name":"r.ParallelMeshBuildUseJobCulling","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar. The audit calls it *&quot;plausible but invented asset-build wording&quot;* -- and mesh building is a cook-time concern in any case.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Both mistakes at once: an invented name, describing build-time work, in a runtime file.<\/p><p>That brings the reviewed <code>Parallel*<\/code> count to twenty-two of the ninety-one that were in the block, with exactly one of them naming a real and useful command.<\/p>","filled":true}]},{"id":"memory-management","title":"GPU Memory Management","introHtml":"<p>Video memory is allocated and freed thousands of times a second, and like any heap it fragments: free space ends up scattered in pieces too small to be useful. This category is about the machinery that keeps it tidy -- defragmenting the buffer and texture pools, tracking which resources are resident, and pooling allocations that would otherwise be made one at a time.<\/p><p><strong>It is the best-behaved category in the file.<\/strong> Seven of the eleven commands write Epic&#x27;s value. The audit&#x27;s word for the category is *&quot;advanced internals, safe to leave on&quot;*, and mostly that is what happens.<\/p><p>The four departures are all about the same trade in different places: <strong>spend memory or spend frame time<\/strong>. Two halve a defragmentation budget to make each frame cheaper, one reserves eight times more memory than Epic to avoid splitting an operation, and one pools allocations to avoid making them repeatedly.<\/p><p>The inert list is small and has one theme. <strong>Three of its ten entries silence a log, and a fourth suppresses memory statistics<\/strong> -- in the category whose subject is memory. That is the ninth, tenth and eleventh log category found in this review, and the sixth category to turn off its own diagnostics.<\/p>","commands":[{"name":"D3D12.AllowPoolAllocateIndirectArgBuffers","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"The D3D12 renderer, and only where GPU-driven rendering issues indirect draws.","visualsHtml":"None.","performanceHtml":"Indirect argument buffers hold the parameters for GPU-driven draw calls. Allocating them from a pool avoids repeated small allocations; the cost is holding the pool whether or not it is used.","definitionHtml":"Allows indirect argument buffers to be allocated from a pool rather than individually.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Kept. The audit: *&quot;Pool allocation can change memory/API behavior; hardware/workload-specific and requires testing.&quot;*<\/p><p>Epic ships it off because the win depends on how much GPU-driven rendering a title actually does -- a game that issues few indirect draws pools an allocation it barely makes.<\/p>","filled":true},{"name":"D3D12.ResidencyManagement","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"The D3D12 renderer.","visualsHtml":"None directly. Where it fails, resources are not resident when needed, which shows as stalls rather than as anything visible.","performanceHtml":"Residency management tracks which resources are actually in video memory and evicts what is not needed, so the game can address more resources than the card holds. Without it, over-committing video memory is a hard failure rather than a managed one.","definitionHtml":"Enables D3D12 residency management.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, and it is one of the more valuable pins in the project. Read it beside <code>r.Streaming.LimitPoolSizeToVRAM<\/code> in the textures paper: that one decides whether the texture pool is allowed to exceed available memory, and this one is the machinery that copes when something does.<\/p>","filled":true},{"name":"D3D12.VRAMBufferPoolDefrag","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"The D3D12 renderer.","visualsHtml":"None.","performanceHtml":"Defragments the buffer pool by moving allocations to close the gaps between them. Without it, free video memory ends up scattered in pieces too small to satisfy a request, and an allocation fails while memory is technically available.","definitionHtml":"Enables defragmentation of the D3D12 VRAM buffer pool.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"D3D12.VRAMBufferPoolDefrag.MaxCopySizePerFrame","status":"active","ourValue":"16777216","engineDefault":"33554432, which is 32 MB","valueRange":"a size in bytes.","appliesWhen":"While the buffer pool is being defragmented.","visualsHtml":"None directly. A large copy in one frame is a hitch.","performanceHtml":"Defragmentation works by copying allocations, and this caps how much may be copied per frame. Half Epic&#x27;s budget is half the spike and half the progress -- so fragmentation is cleared more slowly.","definitionHtml":"The per-frame copy budget for buffer pool defragmentation.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Kept at 16 MB, half Epic&#x27;s value. The audit: *&quot;Lower copy budget may reduce one-frame cost but slows defrag. Hardware/memory-pressure-specific.&quot;*<\/p><p>It moves with the texture pool equivalent below. The two are the same mechanism applied to buffers and to textures, and splitting them would leave one pool tidier than the other for no reason anyone could state.<\/p><p>The direction is worth being honest about: this is a category whose job is keeping video memory tidy, and halving the budget makes it slower at that. What it buys is a smaller worst-case frame, which is the same trade <code>s.AsyncLoadingTimeLimit<\/code> makes for loading -- smoothness now against the job taking longer.<\/p>","filled":true},{"name":"D3D12.VRAMTexturePoolDefrag","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"The D3D12 renderer.","visualsHtml":"None.","performanceHtml":"The same mechanism as the buffer pool, applied to textures -- which are the larger pool, so this is the one that matters more under memory pressure.","definitionHtml":"Enables defragmentation of the D3D12 VRAM texture pool.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"D3D12.VRAMTexturePoolDefrag.MaxCopySizePerFrame","status":"active","ourValue":"16777216","engineDefault":"33554432, which is 32 MB","valueRange":"a size in bytes.","appliesWhen":"While the texture pool is being defragmented.","visualsHtml":"None directly.","performanceHtml":"The same budget, on the larger pool. A 32 MB texture copy in a single frame is the most visible version of this hitch, which is the argument for the lower cap.","definitionHtml":"The per-frame copy budget for texture pool defragmentation.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Kept at 16 MB, moving with its buffer pool sibling above.<\/p>","filled":true},{"name":"D3D12.ZeroBufferSizeInMB","status":"active","ourValue":"32","engineDefault":"4, in megabytes","valueRange":"a size in megabytes.","appliesWhen":"The D3D12 renderer, whenever a resource is initialised without real data.","visualsHtml":"None.","performanceHtml":"The zero buffer is a block of zeroed memory the driver reads from when a resource needs initialising -- most often a texture mip being streamed in. If a mip is larger than the buffer, the operation is split into several.","definitionHtml":"The size of the D3D12 zero buffer.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Kept at eight times Epic&#x27;s value, and it is a <strong>fixed<\/strong> allocation: 32 MB of video memory held whether any title needs it or not.<\/p><p>The audit: *&quot;More memory supports unusually large async-streamed mips but wastes a fixed allocation for ordinary titles. Content-specific.&quot;*<\/p><p>It belongs with the other memory reservations this project makes -- the Nanite streaming pool, the I/O dispatcher cache, the World Partition garbage collection threshold -- and rests on the same assumption that the machine has memory to spend. Those are recorded together so that if the assumption is ever revisited, they are findable as a group.<\/p>","filled":true},{"name":"r.GPUDefrag.AllowOverlappedMoves","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"During GPU defragmentation.","visualsHtml":"None.","performanceHtml":"Allows a relocation to overlap its source and destination, which lets the defragmenter close a gap without needing scratch space elsewhere. Without it, some moves simply cannot be made when memory is tight -- which is exactly when defragmentation matters.","definitionHtml":"Permits overlapped memory moves during GPU defragmentation.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.GPUDefrag.EnableTimeLimits","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"During GPU defragmentation.","visualsHtml":"None.","performanceHtml":"Time-limits the defragmentation pass so it cannot consume an unbounded part of a frame.","definitionHtml":"Enables per-frame time limits on GPU defragmentation.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, and it is worth reading beside the two <code>MaxCopySizePerFrame<\/code> entries above: three separate mechanisms limit how much defragmentation may happen in one frame -- a time limit, a copy size limit for buffers, and a copy size limit for textures. Two of the three are already halved.<\/p>","filled":true},{"name":"r.GPUDefrag.MaxRelocations","status":"active","ourValue":"10","engineDefault":"10","valueRange":"a relocation count.","appliesWhen":"During GPU defragmentation.","visualsHtml":"None.","performanceHtml":"The number of allocations that may be relocated per pass. The fourth limit on the same work.","definitionHtml":"The maximum number of relocations per defragmentation pass.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default -- and see <code>r.GPUDefrag.MaxRelocationsPerFrame<\/code> below, which is an invented name for the same idea that was in the file at the same time, at a different value.<\/p>","filled":true},{"name":"r.UniformBufferPooling","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"Uniform buffers carry per-draw shader constants and are created constantly. Pooling reuses them instead of allocating each time, which is why it is on by default.","definitionHtml":"Enables pooling of uniform buffers.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.GPUDefrag.MaxRelocationsPerFrame","status":"not used","ourValue":"not written since 2026-08-31; was 5","engineDefault":"none under this name.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A wrong name. The real command is <code>r.GPUDefrag.MaxRelocations<\/code>, documented above, with a default of 10. The audit: *&quot;Do not silently substitute it.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where only MaxRelocations exists","notesHtml":"<p>Switched off, with the do-not-substitute warning preserved -- the tenth in this review.<\/p><p><strong>The pairing is what makes it worth reading.<\/strong> The file contained the real command at Epic&#x27;s 10 and this invented one at 5, in the same configuration. One was correct and did nothing but restate the default; the other looked like a deliberate halving and did nothing at all. Neither told the reader which was which.<\/p>","filled":true},{"name":"memory.logGenericPlatformMemoryStats","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"None. The audit: *&quot;only suppresses platform memory-stat reporting. Diagnostic policy, not a rendering optimization.&quot;*","definitionHtml":"Controls reporting of platform memory statistics.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>A real command moved off its default to suppress memory statistics, in the category about memory.<\/p><p>It belongs with the three log categories below and with <code>fx.ParticlePerfStats.Enabled<\/code> in the effects paper: four separate places where this configuration turned off the measurement rather than the cost.<\/p>","filled":true},{"name":"LogMemory","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"None worth measuring.","definitionHtml":"The log category for memory.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The audit: *&quot;Redundant and hides memory diagnostics.&quot;*<\/p><p><strong>Ninth log category found, sixth category to silence its own subject.<\/strong> After variable rate shading, Niagara, texture streaming, level loading and shader compilation, this is memory management turning off memory reporting.<\/p><p>The pattern has been identical every time: the configuration pushes a subsystem away from its defaults, and then turns off the part of the engine that would say what happened.<\/p>","filled":true},{"name":"LogRenderTargetPool","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"None worth measuring.","definitionHtml":"The log category for the render target pool, which warns when render targets are being reallocated rather than reused.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The tenth, and the audit calls out what it hides specifically: *&quot;hides render-target memory warnings.&quot;*<\/p><p>Render target pool warnings are among the more useful things the engine prints, because a render target being reallocated every frame instead of reused is a real and fixable waste.<\/p>","filled":true},{"name":"LogMemoryProfiler","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Only while the memory profiler is running, which in a shipped game is never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"The log category for the memory profiler.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The eleventh, and genuinely harmless -- profiler-specific, so nothing reads it in a shipped game.<\/p><p>Three log categories in one category, of which two hide something worth seeing and one does not. That ratio has held throughout: most silenced logs are pointless, and enough of them are not.<\/p>","filled":true},{"name":"r.ThreadPool.EnableBackgroundThreads","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock <code>r.ThreadPool.*<\/code> CVar exists at all.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the namespace does not appear","notesHtml":"<p>Switched off. First of three invented commands sharing a namespace the engine does not have -- which is a step beyond the usual mistake. Most invented names in this review are a real family with a wrong member; this is a family that does not exist.<\/p>","filled":true},{"name":"r.ThreadPool.EnableHighPriorityThreads","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The namespace does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock <code>r.ThreadPool.*<\/code> CVar.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the namespace does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.ThreadPool.BackgroundThreadPriority","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"none. The namespace does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock <code>r.ThreadPool.*<\/code> CVar.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the namespace does not appear","notesHtml":"<p>Switched off, and it is the third invented thread-priority setting in the review, after <code>r.RHIThread.Priority<\/code> in the frame pacing paper and <code>s.AsyncLoadingThreadPriority<\/code> in the level streaming one.<\/p><p>The objection is the same each time and worth stating once more: raising one thread&#x27;s priority does not create CPU time. It takes it from another thread in the same process.<\/p>","filled":true},{"name":"r.RHI.UseParallelDispatch","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar. The audit: parallel dispatch is *&quot;RHI/ platform implementation policy, not a verified universal end-user toggle&quot;*.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The twenty-third <code>Parallel*<\/code> name reviewed of the ninety-one that were in the block.<\/p>","filled":true},{"name":"RHI.SyncThreshold","status":"not used","ourValue":"not written since 2026-08-31; was 512","engineDefault":"none under this name.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar with this name. The audit notes that UE exposes other <code>rhi.Sync*<\/code> controls but nothing matching this, and adds *&quot;Do not substitute another setting.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, with the eleventh do-not-substitute warning of the review.<\/p><p>It closes a small category that is mostly well made. Seven commands pin Epic&#x27;s values, four trade memory against frame time in a stated direction, and the ten that were removed were three invented threads, two invented dispatch and sync names, one wrong name beside its real twin, one suppressed statistic and three silenced logs.<\/p>","filled":true}]},{"id":"threading","title":"Threading & Parallelism","introHtml":"<p>A UE5 frame is not one sequence of work. The game thread decides what exists, the render thread turns that into draw commands, the RHI thread hands them to the driver, and a pool of worker threads takes whatever can be split off any of them. Almost everything in this category is about how much gets split off and where it lands.<\/p><p><strong>Fourteen of the seventeen commands already wrote Epic&#x27;s value<\/strong>, which is the highest proportion in the file. That is not an accident: the audit&#x27;s note on one of them states the principle the whole category runs on -- *&quot;let platform/engine policy manage frontend parallelization&quot;*. The engine sizes its worker pools from the hardware it finds, and a value typed into a text file months earlier on a different machine cannot improve on that.<\/p><p>The three departures are kept and are recorded as the maintainer&#x27;s judgement rather than as measurements.<\/p><p><strong>Then there is the inert list, which is the largest in the project.<\/strong> Sixty-nine names belonging to this category were being written, and the shape of them says more than any single entry:<\/p><ul><li><strong>Forty-two name nothing at all.<\/strong> <code>TaskGraph.Enable<\/code>, <code>UseAllCores<\/code>,<\/li><\/ul><p><code>bEnableMultiCoreRendering<\/code>, <code>r.UseMultiThreadedRendering<\/code> -- all reading like master switches for multithreading, none of them real. Twenty-three are <code>r.Parallel*<\/code> names invented beside the four real ones documented above, including <code>r.MeshDrawCommands.UseParallelPassSetup<\/code>, which differs from a real command pinned in this very category by one word.<\/p><ul><li><strong>Five are real and were pushed the wrong way.<\/strong> Two of those matter:<\/li><\/ul><p><code>AllowAsyncRenderThreadUpdatesDuringGamethreadUpdates=0<\/code> serialises the game and render threads, and <code>Async.ParallelFor.YieldingTimeout=99<\/code> lets a background loop block foreground work for the better part of six frames.<\/p><ul><li><strong>Two silence a log<\/strong>, and one of them is <code>LogCore<\/code> -- the twelfth log category<\/li><\/ul><p>found in this review and the broadest, covering far more than threading.<\/p><p>A further forty-two names matched the same search and belong to other subjects -- twenty-four to animation, seven to landscape and materials, five to AI navigation, three to physics, two to garbage collection, one to audio. They are covered in those categories.<\/p>","commands":[{"name":"r.AOAsyncBuildQueue","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only while mesh distance field volume data is being built, which happens as levels stream in.","visualsHtml":"None.","performanceHtml":"Moves distance field building off the thread that would otherwise wait for it. Distance fields feed Lumen software tracing and distance field shadows, so this work happens whenever new geometry appears.","definitionHtml":"Builds mesh distance field volume data on an asynchronous queue.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.AsyncCreateLightPrimitiveInteractions","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, when lights and primitives are matched up.","visualsHtml":"None.","performanceHtml":"In a scene with many lights this matching is a substantial piece of per-frame bookkeeping, and doing it on a task thread keeps it off the game thread.","definitionHtml":"Creates light-primitive interactions asynchronously.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.AsyncPipelineCompile","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, wherever pipeline states are compiled.","visualsHtml":"None directly. Where a pipeline state is not ready the engine either waits or draws something else -- the first is a hitch and the second is a missing object.","performanceHtml":"Compilation happens off the thread that needs the result, so a first-use compile does not stop the frame.","definitionHtml":"Compiles pipeline state objects asynchronously rather than blocking.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, and it is the shader stutter paper approached from the threading side. That category decides WHEN pipeline states are built; this decides whether building one blocks anything.<\/p>","filled":true},{"name":"r.MeshDrawCommands.ParallelPassSetup","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, in the renderer.","visualsHtml":"None.","performanceHtml":"Mesh draw commands are the per-object work lists the renderer submits, and building them is one of the larger render-thread costs in a busy scene.","definitionHtml":"Sets up mesh draw commands across worker threads rather than serially.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. Note <code>r.MeshDrawCommands.UseParallelPassSetup<\/code> later in this paper: an invented name for the same idea, which sat in the file alongside this real one.<\/p>","filled":true},{"name":"r.ParallelBasePass","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only where parallel rendering is supported, which the engine decides.","visualsHtml":"None.","performanceHtml":"The base pass draws geometry and evaluates materials, and is usually the largest single pass in the frame.","definitionHtml":"Records the base pass across multiple threads.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. First of four real <code>r.Parallel*<\/code> renderer passes in this category, against twenty-three invented <code>r.Parallel*<\/code> names in the block below.<\/p>","filled":true},{"name":"r.ParallelPrePass","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only where parallel rendering is supported.","visualsHtml":"None.","performanceHtml":"The prepass draws depth only, so the base pass can reject hidden pixels before shading them. Recording it in parallel shortens the critical path before the expensive pass begins.","definitionHtml":"Records the depth prepass across multiple threads.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.ParallelTranslucency","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only where parallel rendering is supported.","visualsHtml":"None.","performanceHtml":"Translucency can be a heavy pass in a scene with smoke or many particles, which is where recording it in parallel pays.","definitionHtml":"Records the translucency pass across multiple threads.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.ParallelVelocity","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only where parallel rendering is supported.","visualsHtml":"None. The velocity pass produces motion vectors rather than pixels.","performanceHtml":"Proportional to how much of the scene is moving.","definitionHtml":"Records the velocity pass across multiple threads.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. The velocity buffer this pass produces is what the anti-aliasing and motion blur papers both depend on -- motion vectors are the input to TAA, TSR, DLSS, frame generation and motion blur alike.<\/p>","filled":true},{"name":"r.RDG.AsyncCompute","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Passes the render graph has tagged as suitable, on platforms supporting async compute.","visualsHtml":"None.","performanceHtml":"Lets tagged passes overlap graphics work instead of queueing behind it.","definitionHtml":"Enables async compute scheduling in the render dependency graph.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. This is the general mechanism the per-subsystem async compute settings in the Lumen, MegaLights and shadows papers sit on top of -- and unlike several of those, Epic ships this one on, because the graph decides per pass rather than being told once.<\/p>","filled":true},{"name":"r.RDG.ParallelExecute","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Where supported by the platform.","visualsHtml":"None.","performanceHtml":"Executes render graph passes in parallel where their recorded dependencies allow it.","definitionHtml":"Enables parallel execution of render graph passes.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.RHICmdUseParallelAlgorithms","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, in the RHI command frontend.","visualsHtml":"None.","performanceHtml":"Uses parallel algorithms when building RHI command lists, which is the last stage before work reaches the driver.","definitionHtml":"Enables parallel algorithms in the RHI command frontend.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. The audit states the principle this whole category rests on: *&quot;let platform/engine policy manage frontend parallelization&quot;*.<\/p>","filled":true},{"name":"r.StochasticLighting.AsyncCompute","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Stochastic lighting passes, where async compute is supported.","visualsHtml":"None.","performanceHtml":"Overlaps stochastic lighting with graphics work. The audit notes it *&quot;automatically follows relevant downstream async work&quot;* -- the engine works out when it applies rather than being told.","definitionHtml":"Schedules stochastic lighting on the async compute queue.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, and it is the clearest argument for pinning defaults in this category rather than overriding them: the setting is already adaptive, so a value in a text file replaces a decision made per frame with one made once, months earlier, on a different machine.<\/p>","filled":true},{"name":"tick.AllowAsyncTickDispatch","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"None directly. What it can change is correctness -- a tick dispatched from a task thread runs somewhere the game may not expect.","performanceHtml":"Moves tick dispatch off the game thread. The audit: *&quot;needs per-title correctness and profiling.&quot;*","definitionHtml":"Dispatches actor ticks from a task thread rather than the game thread.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>**The audit&#x27;s first word is <code>Valid<\/code>** -- this is a real command, and the caveat is about whether a particular game&#x27;s tick code is safe to dispatch from a task thread rather than about whether the command exists.<\/p><p><strong>Correctness is the word to weigh.<\/strong> It is the same word that kept <code>FX.AllowAsyncTick<\/code> out of the Experimental tab in the effects paper: an experiment a user can run is fine when the failure is a slower frame, and this failure would not be.<\/p><p>The difference here is who decides. This is the maintainer&#x27;s judgement rather than a question passed on to a user who has no way to evaluate it.<\/p>","filled":true},{"name":"tick.AllowBatchedTicks","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"None directly.","performanceHtml":"Every actor that ticks costs a scheduled task, and a task has a fixed overhead however little work it does. Batching groups them, which wins where a game has many cheap tickers and does nothing where it has few expensive ones.","definitionHtml":"Batches actor ticks into fewer scheduled tasks.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Kept, and it moves with <code>tick.AllowAsyncTickDispatch<\/code> above. Both change how ticks are scheduled, and testing one without the other would measure the wrong thing.<\/p><p>The audit&#x27;s caveat is milder than its sibling&#x27;s: *&quot;the benefit depends on the game&#x27;s exact tick workload&quot;* is about whether it helps, not about whether it is safe.<\/p>","filled":true},{"name":"D3D12.MaxCommandsPerCommandList","status":"active","ourValue":"20000","engineDefault":"10000","valueRange":"a command count.","appliesWhen":"The D3D12 renderer.","visualsHtml":"None.","performanceHtml":"A command list is a batch of GPU work the CPU records and then submits. Larger lists mean fewer submissions and less driver overhead; they also mean the GPU waits longer before it has anything to start on, and each list holds more memory while being recorded.","definitionHtml":"The maximum number of commands recorded into a single D3D12 command list.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Double Epic&#x27;s number, kept on the same reasoning as the thread-count settings elsewhere in this project: a machine with a modern CPU and driver can carry the larger batch.<\/p><p>That makes it the third setting resting on the twelve-thread, modern-hardware assumption, after <code>grass.MaxAsyncTasks<\/code> and <code>r.Streaming.ParallelRenderAssetsNumWorkgroups<\/code>. All three are recorded so that if the assumption is ever revisited they are findable together.<\/p>","filled":true},{"name":"RHI.ResourceTableCaching","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"Caches shader resource tables rather than rebuilding them for every draw.","definitionHtml":"Enables resource table caching. The canonical spelling is <code>rhi.ResourceTableCaching<\/code>; console variable names are case-insensitive, so both work.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"RHI.SyncAllowEarlyKick","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only on RHI paths using VSync frame pacing -- which this project turns off, so in practice almost never.","visualsHtml":"None.","performanceHtml":"Allows the RHI to submit work early rather than waiting for the sync point.","definitionHtml":"Permits early submission on synchronised presentation paths.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. Worth reading beside <code>r.VSync=0<\/code> in the frame pacing paper: this only applies on VSync pacing paths, and that paper turns VSync off for everybody. Pinned anyway, because pinning costs one line and the pacing decision could change.<\/p>","filled":true},{"name":"AllowAsyncRenderThreadUpdatesDuringGamethreadUpdates","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"1","valueRange":"see the note.","appliesWhen":"Always, on a machine where it applies.","visualsHtml":"None.","performanceHtml":"Real, and in the wrong direction. See the note.","definitionHtml":"Valid, default 1. Value 0 disables normal game/render overlap; troubleshooting switch, not an optimization.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>One of five real commands in this category&#x27;s inert list, and the most harmful of them.<\/strong> Epic&#x27;s default is 1: the game thread and the render thread overlap, which is the single largest source of parallelism in the engine. Writing 0 serialises them.<\/p><p>The audit is blunt about what it is for: *&quot;troubleshooting switch, not an optimization.&quot;* It exists so a developer chasing a race condition can make the two threads take turns.<\/p><p>The file contained it <strong>twice<\/strong>, once with an <code>r.<\/code> prefix and once without, both at 0. Only one of the two spellings is the real command, and nothing in the file said which.<\/p>","filled":true},{"name":"Async.ParallelFor.YieldingTimeout","status":"not used","ourValue":"not written since 2026-08-31; was 99","engineDefault":"8 ms","valueRange":"see the note.","appliesWhen":"Always, on a machine where it applies.","visualsHtml":"None.","performanceHtml":"Real, and in the wrong direction. See the note.","definitionHtml":"Valid, current default 8 ms. Value 99 can delay yielding to higher-priority tasks and increase latency/stutter.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>A real command at more than twelve times its default. The audit: *&quot;Valid, current default 8 ms. Value 99 can delay yielding to higher-priority tasks and increase latency/stutter.&quot;*<\/p><p>A parallel loop that does not yield holds its worker thread, so higher-priority work queues behind it. Raising the timeout from 8 ms to 99 means a background loop can block foreground work for the better part of six frames at 60 fps.<\/p><p><strong>It is the clearest example in this review of a setting that reads as &quot;let it run&quot; and means &quot;let it block&quot;.<\/strong><\/p>","filled":true},{"name":"AttemptStuckThreadResuscitation","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Absent from the current stock CVar registry.","so rifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.RenderThread.EnableTaskGraphThread","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar; render-thread/task-graph scheduling is engine policy.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.RenderThread.Priority","status":"not used","ourValue":"not written since 2026-08-31; was 2","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar; thread priority is platform/engine controlled.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.SceneRenderingThreadAffinity","status":"not used","ourValue":"not written since 2026-08-31; was -1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar under this exact name; do not force undocumented CPU affinity behavior in every game.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.Threading.AllowWorkerThreadStall","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar under this exact name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.Threading.ThreadPriority","status":"not used","ourValue":"not written since 2026-08-31; was 3","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar under this exact name; forcing a guessed worker-thread priority is unsafe platform policy.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.UseMultiThreadedRendering","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock umbrella CVar. Renderer multithreading remains engine, RHI, platform, and title policy.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true}]},{"id":"physics","title":"Physics","introHtml":"<p>Chaos is UE5&#x27;s physics system, and it replaced PhysX wholesale rather than extending it. Everything in this category is Chaos, and all five live commands are the same kind of setting: whether a part of the solver uses its <strong>ISPC<\/strong> implementation.<\/p><p>ISPC is Intel&#x27;s SPMD Program Compiler. It compiles the same maths to instructions that process several particles at once instead of one, so the vectorised path produces identical results faster. There is no quality trade anywhere in it, which makes this the only category in the review where nothing is being traded against anything.<\/p><p><strong>All five already wrote Epic&#x27;s value.<\/strong> Nothing needed doing, and that is worth recording as plainly as the categories that needed a great deal.<\/p><p>The inert list is where this category earns its place. Seventeen names, and they sort into a shape the review has now seen many times -- with one family larger and more systematic than any other found so far.<\/p><p><strong>Eight of the seventeen are fabricated cloth names.<\/strong> <code>r.ParallelSkeletalCloth<\/code> followed by <code>BoundsCalc<\/code>, <code>Gather<\/code>, <code>PrepareSim<\/code>, <code>Simulate<\/code>, <code>Skinning<\/code>, <code>Update<\/code>, <code>UpdateBounds<\/code>, <code>UpdateVerts<\/code> -- the internal stages of a cloth simulation, in order, each given a <code>Parallel<\/code> switch, in the renderer namespace where cloth does not live. The audit&#x27;s phrase is *&quot;fabricated granularity&quot;*.<\/p><p><strong>Two are real and were pushed the wrong way<\/strong>, and one of those trades correctness rather than cost: <code>p.RemoveFarBodiesFromBVH<\/code> removes distant bodies from the structure physics queries search, which makes them invisible to line traces and overlap tests as well as cheaper to skip.<\/p><p><strong>Two silence a log<\/strong>, one of which hides physics errors.<\/p>","commands":[{"name":"p.Chaos.PerParticleCollision.ISPC","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Cloth and soft body simulation, where per-particle collision is computed.","visualsHtml":"None. ISPC is a compiler technology, not a simulation setting -- the vectorised path computes the same result as the scalar one.","performanceHtml":"Collision resolution per simulated particle. It is the most expensive part of a cloth solve, because every particle has to be tested against whatever it might touch. The ISPC path processes several particles per instruction instead of one.","definitionHtml":"Enables the ISPC (Intel SPMD Program Compiler) vectorised implementation for this part of the Chaos solver.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>First of five. Each enables the ISPC path for one part of the Chaos solver, and all five default to on for the same reason: the vectorised code produces the same numbers as the scalar code, faster. There is no quality trade here at all, which is rare in this project.<\/p>","filled":true},{"name":"p.Chaos.Spherical.ISPC","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Cloth simulation using spherical constraints.","visualsHtml":"None. ISPC is a compiler technology, not a simulation setting -- the vectorised path computes the same result as the scalar one.","performanceHtml":"Spherical constraints keep particles within a distance of an anchor -- the mechanism that stops cloth stretching away from the body it is attached to. The ISPC path processes several particles per instruction instead of one.","definitionHtml":"Enables the ISPC (Intel SPMD Program Compiler) vectorised implementation for this part of the Chaos solver.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"p.Chaos.Spring.ISPC","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Cloth and soft body simulation using spring constraints.","visualsHtml":"None. ISPC is a compiler technology, not a simulation setting -- the vectorised path computes the same result as the scalar one.","performanceHtml":"Spring constraints are what give cloth its stiffness and stretch, and they are solved iteratively many times per frame. The ISPC path processes several particles per instruction instead of one.","definitionHtml":"Enables the ISPC (Intel SPMD Program Compiler) vectorised implementation for this part of the Chaos solver.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"p.Chaos.TriangleMesh.ISPC","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Collision against triangle mesh geometry.","visualsHtml":"None. ISPC is a compiler technology, not a simulation setting -- the vectorised path computes the same result as the scalar one.","performanceHtml":"Triangle mesh collision is the general case and the slow one: an arbitrary mesh has no shortcuts, so every candidate triangle must be tested. The ISPC path processes several particles per instruction instead of one.","definitionHtml":"Enables the ISPC (Intel SPMD Program Compiler) vectorised implementation for this part of the Chaos solver.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"p.Chaos.VelocityField.ISPC","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Cloth simulation subject to a velocity field -- wind, movement through air.","visualsHtml":"None. ISPC is a compiler technology, not a simulation setting -- the vectorised path computes the same result as the scalar one.","performanceHtml":"Applies aerodynamic forces per particle. It is what makes a cape move when a character runs. The ISPC path processes several particles per instruction instead of one.","definitionHtml":"Enables the ISPC (Intel SPMD Program Compiler) vectorised implementation for this part of the Chaos solver.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, and the last of the five.<\/p><p>Taken together they are the clearest example in the project of a category that needed nothing done to it. All five were already Epic&#x27;s value, all five are pure implementation choices with no visual or behavioural consequence, and the audit&#x27;s note on each is one sentence long.<\/p>","filled":true},{"name":"p.RemoveFarBodiesFromBVH","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Always, in the Chaos scene.","visualsHtml":"None directly.","performanceHtml":"Removing distant bodies from the bounding volume hierarchy makes every spatial query cheaper, because the tree it walks is smaller.","definitionHtml":"Valid, default 0. Removing far bodies changes physics BVH membership and may break distant scene queries/interactions. Too correctness-sensitive for a general catalog.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>A real command turned on against a default of off, and the audit&#x27;s objection is correctness rather than cost:<\/strong> *&quot;Removing far bodies changes physics BVH membership and may break distant scene queries/interactions. Too correctness-sensitive.&quot;*<\/p><p>The bounding volume hierarchy is what physics queries search. A body removed from it is not merely cheaper to consider -- it is invisible to line traces, overlap tests and anything else that asks what is out there. In a game where something distant is supposed to be shootable, hittable or triggerable, that is a bug rather than a saving.<\/p><p>It is the second setting in this review that trades correctness for speed without saying so, after <code>r.InstanceCulling.OcclusionCull<\/code> in the occlusion paper -- and unlike that one it was hidden in the NO EFFECT block.<\/p>","filled":true},{"name":"p.Chaos.VisualDebuggerEnable","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, though the data is only read when the debugger is attached.","visualsHtml":"None directly.","performanceHtml":"Recording debug data has a cost, so disabling it is a small saving -- and the audit does not dispute that, only its relevance.","definitionHtml":"Valid, but current default is 1 and this is a developer diagnostic-data switch, not universal gameplay tuning.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>A real developer diagnostic switch turned off. The audit: *&quot;current default is 1 and this is a developer diagnostic-data switch, not universal gameplay tuning.&quot;*<\/p><p>It belongs with <code>fx.ParticlePerfStats.Enabled<\/code> in the effects paper and <code>memory.logGenericPlatformMemoryStats<\/code> in the memory one: three real commands moved off their defaults to stop the engine recording what it was doing.<\/p>","filled":true},{"name":"LogPhysics","status":"not used","ourValue":"not written since 2026-08-31; was all off","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Always, but it only affects log output.","visualsHtml":"None.","performanceHtml":"None worth measuring.","definitionHtml":"Redundant and hides physics errors/warnings.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>Fourteenth log category found.<\/strong> The audit: *&quot;Redundant and hides physics errors/warnings.&quot;*<\/p><p>Errors, not only warnings -- the same wording as <code>LogNiagara<\/code> in the effects paper. Physics errors are among the more actionable things the engine prints, because they usually name the asset that caused them.<\/p>","filled":true},{"name":"LogChaosDD","status":"not used","ourValue":"not written since 2026-08-31; was all off","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Always, but it only affects log output.","visualsHtml":"None.","performanceHtml":"None worth measuring.","definitionHtml":"Redundant; Chaos diagnostic/plugin category.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The fifteenth, and harmless: Chaos Debug Draw is a diagnostic and plugin category that a shipped game does not use.<\/p><p>Two logs in a five-command category, one of which hides errors. That ratio has held throughout the review.<\/p>","filled":true},{"name":"r.ParallelSkeletalClothBoundsCalc","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar; wrong namespace and fabricated granularity.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>First of <strong>eight<\/strong> fabricated cloth names, and the audit&#x27;s phrase for the set is exact: *&quot;wrong namespace and fabricated granularity.&quot;*<\/p><p>Somebody enumerated the stages of a cloth simulation -- calculate bounds, gather, prepare, simulate, skin, update, update bounds, update vertices -- and wrote a <code>Parallel<\/code> switch for each one, in the <code>r.<\/code> renderer namespace where cloth does not live. The engine has none of them.<\/p><p>It is the largest single family of invented names in the whole review, and the most systematic. The others look like guesses; this looks like a list.<\/p>","filled":true},{"name":"r.ParallelSkeletalClothGather","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.ParallelSkeletalClothPrepareSim","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.ParallelSkeletalClothSimulate","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.ParallelSkeletalClothSkinning","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.ParallelSkeletalClothUpdate","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.ParallelSkeletalClothUpdateBounds","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-eng
