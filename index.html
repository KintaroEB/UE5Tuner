://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference","https://dev.epicgames.com/documentation/unreal-engine/xr-performance-features-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Both numbers are the audit&#x27;s: *&quot;current default 2 (conservative). Value 1 selects full VRS for the base pass and can trade image quality for performance. Hardware/title testing needed.&quot;*<\/p><p>Balanced writes Epic&#x27;s 2; Performance takes 1.<\/p>","filled":true},{"name":"r.VRS.NaniteEmitGBuffer","status":"active","ourValue":"2, and 1 on the Performance preset","engineDefault":"2","valueRange":"0 = off, 2 = conservative, 1 = full","appliesWhen":"Always, while VRS is enabled and Nanite geometry is being drawn.","visualsHtml":"The Nanite equivalent of the base pass. In a game where most geometry is Nanite, this is the setting that matters and the base pass one barely applies.","performanceHtml":"The same magnitude as the base pass, shifted to whichever share of the scene is Nanite.","definitionHtml":"The variable rate shading mode used when Nanite emits the GBuffer.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference","https://dev.epicgames.com/documentation/unreal-engine/xr-performance-features-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Both numbers are the audit&#x27;s: *&quot;current default 2 (conservative). Value 1 requests full VRS for this pass; hardware/Nanite quality testing required.&quot;*<\/p><p>It moves with <code>r.VRS.BasePass<\/code> deliberately. A game that is partly Nanite would otherwise get one shading rate on its Nanite meshes and another on everything else, which would show as a visible seam between the two.<\/p>","filled":true},{"name":"r.VRS.ReflectionEnvironmentSky","status":"active","ourValue":"2, and 1 on the Performance preset","engineDefault":"2","valueRange":"0 = off, 2 = conservative, 1 = full","appliesWhen":"Always, while VRS is enabled.","visualsHtml":"The safest of the four pass controls. Sky and environment reflections are already low-frequency -- broad gradients rather than fine detail -- so a coarser shading rate has less to lose.","performanceHtml":"Moderate, and largest in an outdoor scene where sky covers much of the screen.","definitionHtml":"The variable rate shading mode for the reflection environment and sky pass.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference","https://dev.epicgames.com/documentation/unreal-engine/xr-performance-features-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Both numbers are the audit&#x27;s. Balanced writes Epic&#x27;s 2; Performance takes 1.<\/p><p>Of the four, this is the one where full VRS is easiest to defend -- and it is still split, because the standard is what Epic documents rather than what seems harmless.<\/p>","filled":true},{"name":"r.VRS.SSR","status":"active","ourValue":"2, and 1 on the Performance preset","engineDefault":"2","valueRange":"0 = off, 2 = conservative, 1 = full","appliesWhen":"Only where screen-space reflections run, which in a Lumen game is a fallback path.","visualsHtml":"Screen-space reflections are noisy before VRS touches them -- see <code>r.SSR.Temporal<\/code> in the reflections paper -- so a coarser shading rate is hidden by noise the pass already has.","performanceHtml":"Small in absolute terms, because SSR is often not the active reflection path at all.","definitionHtml":"The variable rate shading mode for the screen-space reflection pass.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference","https://dev.epicgames.com/documentation/unreal-engine/xr-performance-features-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Both numbers are the audit&#x27;s. The second safest of the four, and split for the same reason as the safest.<\/p>","filled":true},{"name":"r.VRS.SSAO","status":"active","ourValue":"0, and 1 on the Performance preset","engineDefault":"0","valueRange":"0 = off, 2 = conservative, 1 = full","appliesWhen":"Only where screen-space ambient occlusion runs.","visualsHtml":"Ambient occlusion is the soft darkening in creases, and it is high-frequency by nature -- the detail it adds lives exactly at the scale VRS removes. Coarsening it shows as blocky patches of shading in corners.","performanceHtml":"A saving on the AO pass, which is a full-screen pass.","definitionHtml":"The variable rate shading mode for the SSAO pass.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference","https://dev.epicgames.com/documentation/unreal-engine/xr-performance-features-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>Epic&#x27;s default here is 0 -- off -- not the conservative 2 they use on the other four.<\/strong> That is a stronger statement than caution: they keep variable rate shading away from ambient occlusion entirely unless asked.<\/p><p>The audit agrees: *&quot;Enabling full VRS for SSAO can save work but may create visible artifacts. Test per platform/title.&quot;*<\/p><p>Balanced writes Epic&#x27;s 0; Performance takes 1. Until 2026-08-31 both wrote 1.<\/p><p>Read it beside the ambient occlusion entries in the shadows paper and the Lumen one. Between them, three separate systems decide how corners are shaded, and this project had been pushing all three away from their defaults at once.<\/p>","filled":true},{"name":"r.VRS.ContrastAdaptiveShading","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"While VRS is enabled.","visualsHtml":"Contrast adaptive shading picks the shading rate from image contrast -- low-contrast regions get coarser rates. Off by default because the analysis costs something and the heuristic is not always right.","performanceHtml":"A cost to analyse the image, against a saving from better targeted rate reduction. Whether it nets out depends on the content.","definitionHtml":"Enables contrast-adaptive selection of the shading rate.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p><p>Not to be confused with <strong>Contrast Adaptive Sharpening<\/strong>, which shares the initials CAS and is part of AMD&#x27;s FSR. Three of those turned up in this category&#x27;s inert list during the review and were moved to the anti-aliasing paper, where upscaling belongs.<\/p>","filled":true},{"name":"r.VRS.LightFunctions","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only where light functions are used -- a light with a material driving its shape, such as a projector, a flickering fluorescent tube or dappled light through leaves.","visualsHtml":"Light functions are evaluated per pixel and are usually low frequency, which makes them a good candidate for a coarser rate. On by default for that reason.","performanceHtml":"Proportional to how many light functions are on screen, which in most games is few.","definitionHtml":"Enables variable rate shading for light function rendering.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, and it is the one place in this category where Epic&#x27;s default is the *permissive* one. Worth noticing: it means VRS on light functions was judged safe enough to ship on, while the base pass was not.<\/p>","filled":true},{"name":"r.VRS.Translucency","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"While VRS is enabled and translucent surfaces are drawn.","visualsHtml":"Translucency is layered and usually soft, so a coarser rate is hard to see through it.","performanceHtml":"Translucency can be a heavy pass in a scene with smoke or many particles, so the saving is real where it applies.","definitionHtml":"Enables variable rate shading for the translucency pass.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. The audit&#x27;s caveat is the useful part: *&quot;Global VRS support/enabling still gates it&quot;*, so this line does nothing on its own.<\/p>","filled":true},{"name":"r.VRS.Method","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar under this name. The audit&#x27;s explanation is the useful part: *&quot;VRS behavior uses specific source and pass controls instead&quot;* -- which is exactly the eleven commands documented above.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The same shape as <code>r.RayTracing.Culling<\/code> in the ray tracing paper: a plausible parent invented above a family of real children.<\/p>","filled":true},{"name":"r.VRS.Tier","status":"not used","ourValue":"not written since 2026-08-31; was 2","engineDefault":"none. It is not a variable at all.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"VRS tier describes what a GPU can do -- tier 1 is a rate per draw call, tier 2 adds a per-tile image. The audit puts it exactly: *&quot;VRS tier is a hardware capability, not a user-selected engine variable.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and it is the clearest example in the whole review of a config line asking for something that is not a setting. Writing <code>2<\/code> here is asking a graphics card to support tier 2 variable rate shading. It either does or it does not, and a text file has no vote.<\/p>","filled":true},{"name":"r.VRS.MaterialAdaptiveShading","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar under this exact name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Formed from <code>r.VRS.ContrastAdaptiveShading<\/code>, which is real and documented above, with one word swapped.<\/p>","filled":true},{"name":"r.VRS.MotionAdaptiveShading","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar under this exact name. Motion-adaptive shading is a real technique -- shading more coarsely where the image is moving fast enough to hide it -- which is presumably why the name seemed plausible.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The third invented name in this category built from one real one by substitution -- <code>Contrast<\/code> became <code>Material<\/code> and then <code>Motion<\/code>.<\/p>","filled":true},{"name":"LogVRS","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Always, but it only affects log output.","visualsHtml":"None.","performanceHtml":"None worth measuring.","definitionHtml":"A log category, not a console variable.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off, and this one is not merely redundant. The audit says it *&quot;hides VRS capability/configuration warnings&quot;* -- the messages the engine prints when VRS is asked for and cannot be provided.<\/p><p>That is the opposite of what a tuning tool should do. In a category whose first three commands ask for hardware features that may not exist, silencing the report of them not existing means a user whose VRS is doing nothing has no way to find out.<\/p><p>It is the third log category found in the review, after the two denoiser ones in the ray tracing paper, and the only one that was actively unhelpful rather than merely pointless.<\/p>","filled":true}]},{"id":"effects","title":"Effects & Particles","introHtml":"<p>Two particle systems live side by side in UE5. <strong>Niagara<\/strong> is the current one -- <code>fx.Niagara*<\/code> and <code>vm.*<\/code>, since Niagara compiles its logic to a small vector virtual machine. <strong>Cascade<\/strong> is the one it replaced, and its settings are the <code>FX.*<\/code> capitals and <code>r.Emitter.*<\/code>. Most UE5 games use Niagara; a game carried forward from UE4 may still have Cascade effects in it.<\/p><p>That split matters here, because four of the commands in this category tune the old system and all four had been switched away from their defaults.<\/p><p><strong>This was the most hand-tuned category in the file, and the least evidenced.<\/strong> Eleven of the fifteen commands departed from Epic&#x27;s value, and not one of the departures carried a measurement. The audit qualified every one with *workload-specific*, *content-specific*, *device-profile*, or *test per game*.<\/p><p>All eleven were set back to Epic&#x27;s value on 2026-08-31. <strong>Five were then restored the same day, on measurement<\/strong> -- the four Cascade async settings and the particle statistics switch. That is what this category is worth reading for: the same five values before and after, with the second set backed by somebody running them.<\/p><p>Two entries are worth having in mind before the rest. The GPU simulation texture was quartering the particle budget in a way that <strong>cuts effects off rather than making them cheaper<\/strong>. And <code>FX.AllowAsyncTick<\/code> carries a caveat about thread safety rather than quality, which is why it is a measured decision here and not an Experimental switch.<\/p><p>The inert half of the category has a pattern that has not appeared anywhere else in this review. <strong>Four separate entries silence the engine&#x27;s warnings<\/strong> -- a spawn-rate warning pushed to 99999999, a render-component warning to 999999, and two Niagara log categories turned off entirely. A tuning file that quiets the report of a problem is worse than one that causes it, because the second is findable.<\/p>","commands":[{"name":"FX.AllowAsyncTick","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Cascade particle systems only. A Niagara-only game never reaches it.","visualsHtml":"None directly.","performanceHtml":"Ticks legacy particle systems in parallel rather than on the game thread. On a game with many Cascade emitters that is a real saving, and on one with few it is task overhead for nothing.","definitionHtml":"Enables parallel ticking of Cascade particle systems.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>Read the provenance before copying this pattern.<\/strong> Epic&#x27;s default is 0 and we write 1, so the audit&#x27;s caveat is being taken on deliberately rather than inherited. The value is the maintainer&#x27;s, measured.<\/p><p>That caveat is not about quality. It reads *&quot;task overhead and thread safety depend on effects/title&quot;*, and Epic ships it off because whether a game&#x27;s Cascade effects are safe to tick in parallel depends on how those effects were written.<\/p><p>It was set back to 0 on 2026-08-31 for exactly that reason, and restored the same day after testing. <strong>The difference between those two states is not the value -- it is that somebody ran it.<\/strong><\/p><p>It is deliberately not an Experimental switch, unlike the async settings in the MegaLights and shadows papers. An experiment a user can run is fine when the failure is a slower frame. Where the failure might be a crash, the decision belongs to whoever can test it and stands behind it.<\/p>","filled":true},{"name":"FX.BatchAsync","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Cascade particle systems, and only while `FX.AllowAsyncTick` is on, which it is.","visualsHtml":"None.","performanceHtml":"Batches many small legacy-particle tasks into fewer larger ones. Task scheduling has a fixed cost per task, so batching wins when there are many tiny emitters and loses when there are few large ones.","definitionHtml":"Batches Cascade particle async tasks.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The maintainer&#x27;s value, measured. The audit&#x27;s word is *&quot;workload-specific&quot;*, and the workload is the game&#x27;s effects -- which a general config cannot see, but a person testing on real games can.<\/p><p>Batching only means anything while <code>FX.AllowAsyncTick<\/code> is on, so the two are one decision rather than two.<\/p>","filled":true},{"name":"FX.BatchAsyncBatchSize","status":"active","ourValue":"16","engineDefault":"32","valueRange":"a task count per batch.","appliesWhen":"Only while `FX.BatchAsync` is on, which it is.","visualsHtml":"None.","performanceHtml":"How many particle tasks go into one batch. Larger batches mean less scheduling overhead and more latency before the last one finishes; smaller batches the reverse.","definitionHtml":"The batch size used when Cascade particle async tasks are batched.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>Read the provenance: neither number here is Epic&#x27;s.<\/strong> Their default is 32, the source config wrote 8, and we write <strong>16<\/strong> -- the maintainer&#x27;s measured value, appearing in no Epic source.<\/p><p>Like <code>fx.NiagaraDataBufferMinSize<\/code> below, this replaces the documented number outright rather than splitting two documented ones across presets, so it rests entirely on the measurement.<\/p><p>The trade has two ends and neither is safe. Larger batches mean less scheduling overhead and more latency before the last task lands; smaller batches the reverse. 8 was too far one way, and 16 is where testing put it.<\/p><p>The four Cascade settings move as a group, which is the honest way to treat them: async ticking, batching, early scheduling and the batch size are one decision about how legacy particles are processed, and testing three of them while leaving the fourth alone would measure nothing.<\/p>","filled":true},{"name":"FX.EarlyScheduleAsync","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Cascade particle systems.","visualsHtml":"None.","performanceHtml":"Schedules the particle work earlier in the frame so it has more chance to overlap other work. Whether there is anything to overlap with is the game&#x27;s business.","definitionHtml":"Schedules Cascade async particle tasks early in the frame.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The maintainer&#x27;s value, measured, and the fourth of the Cascade group.<\/p><p>Scheduling the particle work earlier gives it more chance to overlap other work. Whether there is anything to overlap with depends on the frame, which is why Epic leaves it off and why this needed testing rather than reasoning.<\/p>","filled":true},{"name":"fx.GPUSimulationTextureSizeX","status":"active","ourValue":"1024, and 512 on the Performance preset","engineDefault":"1024","valueRange":"a texture width in texels.","appliesWhen":"Cascade GPU particles. Niagara manages its own buffers.","visualsHtml":"<strong>This is a capacity limit, and running out of it does not degrade gracefully.<\/strong> GPU particles are stored one per texel in a simulation texture, so the texture&#x27;s area is the particle budget. Exceed it and particles are simply not simulated -- an explosion loses its sparks rather than losing detail.","performanceHtml":"A smaller texture is less GPU memory and less simulation work, but only up to the point where effects start being cut off.","definitionHtml":"The width of the Cascade GPU particle simulation texture.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/scalability-and-best-practices-for-niagara","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Both numbers are the audit&#x27;s: *&quot;current default 1024. Reduces legacy GPU-particle capacity/memory and can truncate effects. Device-profile/content- specific.&quot;*<\/p><p>Quality and Balanced write Epic&#x27;s 1024; Performance halves it.<\/p><p><strong>Read this with the Y entry below, because the two multiply.<\/strong> Halving both axes is a quarter of the capacity, not a half. Until 2026-08-31 both were 512 in every preset, so every user had a quarter of the particle budget the engine intends.<\/p>","filled":true},{"name":"fx.GPUSimulationTextureSizeY","status":"active","ourValue":"1024, and 512 on the Performance preset","engineDefault":"1024","valueRange":"a texture height in texels.","appliesWhen":"Cascade GPU particles.","visualsHtml":"The other axis of the same budget, with the same abrupt failure.","performanceHtml":"The same.","definitionHtml":"The height of the Cascade GPU particle simulation texture.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/scalability-and-best-practices-for-niagara","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Moves with the X axis, necessarily. A texture of 512 by 1024 would be a strange thing to ask for and neither number would mean what it says.<\/p>","filled":true},{"name":"fx.NiagaraAllowRuntimeScalabilityChanges","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Niagara systems.","visualsHtml":"Lets Niagara change its own scalability settings while the game runs -- culling distant systems, lowering spawn rates when many effects are active. Off, a system that was set up at one quality level stays there.","performanceHtml":"This is Niagara&#x27;s own budget enforcement. Disabling it removes the mechanism that stops effects overrunning their allowance.","definitionHtml":"Allows runtime changes to Niagara scalability state.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/scalability-and-best-practices-for-niagara","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, and it is worth pinning rather than omitting: this is the setting that lets the game manage its own particle budget, and a tuning file that switched it off would be taking the wheel from the system best placed to steer.<\/p>","filled":true},{"name":"fx.NiagaraBatcher.FreeBufferEarly","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Niagara systems.","visualsHtml":"None.","performanceHtml":"Frees GPU buffers as soon as a batch is done rather than holding them for reuse. Holding them avoids reallocation for a system that starts and stops repeatedly; freeing them returns the memory.","definitionHtml":"Frees Niagara batcher GPU buffers early rather than retaining them.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>We wrote <strong>0<\/strong> until 2026-08-31 -- retain the buffers -- against Epic&#x27;s 1.<\/p><p>The audit&#x27;s phrasing gives the trade exactly: *&quot;Keeping buffers can avoid reallocations for oscillating emitters but retains GPU memory.&quot;* An oscillating emitter is a specific thing, a game either has them or does not, and this is the second setting in the category to trade GPU memory for a benefit nobody had measured.<\/p>","filled":true},{"name":"fx.NiagaraDataBufferMinSize","status":"active","ourValue":"1536","engineDefault":"512, in bytes","valueRange":"a size in bytes.","appliesWhen":"Niagara systems.","visualsHtml":"None.","performanceHtml":"The floor on a Niagara data buffer allocation. Too small and a system that grows past it reallocates repeatedly; too large and every light system reserves memory it never uses. Particle memory is GPU memory.","definitionHtml":"The minimum size of a Niagara data buffer allocation.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/scalability-and-best-practices-for-niagara","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>Read the provenance before copying this pattern.<\/strong> Epic&#x27;s number is 512 and the source config wrote 2048. We write <strong>1536<\/strong>, which is neither: it is the maintainer&#x27;s own measured value and appears in no Epic source.<\/p><p>This is a different kind of exception from the preset splits that carry the same warning. Those choose between two documented numbers and give one to each preset. This replaces the documented number outright, in every preset, which the pinning rule would otherwise forbid -- so it rests entirely on the measurement, and says so.<\/p><p>The trade is genuinely two-sided, which is what makes a middle value sensible rather than lazy. Neither end is safe: 512 makes a growing system reallocate constantly, and 2048 makes every trivial system reserve four times what it uses.<\/p>","filled":true},{"name":"fx.ParticlePerfStats.Enabled","status":"active","ourValue":"0","engineDefault":"true","valueRange":"0 or 1","appliesWhen":"Always, where particles are used.","visualsHtml":"None.","performanceHtml":"Gathering per-system particle statistics costs a small amount of CPU time. Turning it off saves that.","definitionHtml":"Enables collection of particle performance statistics.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The provenance is the maintainer&#x27;s, measured<\/strong>, and the value is written as <code>0<\/code> rather than <code>false<\/code>. Both are accepted for a boolean variable, but every other value in the generated file is numeric, and 0 is also correct if the variable turns out to be int-typed. <code>false<\/code> is not.<\/p><p>The audit&#x27;s caveat is real and worth stating precisely, because an earlier draft of this entry overstated it. The audit says the setting *&quot;may remove data used by a title&#x27;s FX budgeting/profiling&quot;* -- <strong>may<\/strong>, and *a title&#x27;s*. It does not say that Niagara&#x27;s own scalability manager depends on these statistics, and this paper should not either. What is documented is that some games read them for their own budgeting, and that nothing published says which.<\/p><p>So this is a judgement about an unquantified risk rather than a denial that one exists. The saving was measured and taken, and the risk is named here so that a game showing odd effect-budgeting behaviour has somewhere to look.<\/p>","filled":true},{"name":"fx.ScalabilityManParallelThreshold","status":"active","ourValue":"50","engineDefault":"50","valueRange":"an instance count.","appliesWhen":"Niagara scalability management.","visualsHtml":"None.","performanceHtml":"How many Niagara instances there must be before the scalability manager does its work in parallel. Below the threshold, going parallel costs more in task setup than it saves.","definitionHtml":"The instance-count threshold at which Niagara scalability management runs in parallel.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>We wrote <strong>25<\/strong> until 2026-08-31, halving the crossover point.<\/p><p>The audit: *&quot;Parallel-task crossover depends on CPU and Niagara instance workload.&quot;* A crossover point is exactly the kind of number that has to be measured on the machine it runs on, and the machine is different for every user.<\/p>","filled":true},{"name":"fx.ScalabilityMaxUpdatesPerFrame","status":"active","ourValue":"50, and 25 on the Performance preset","engineDefault":"50","valueRange":"an update count per frame.","appliesWhen":"Niagara scalability management.","visualsHtml":"Indirectly. This caps how many Niagara systems have their scalability state re-evaluated per frame, so a lower cap means a system that should have been culled keeps running for a few frames longer.","performanceHtml":"The audit: *&quot;Throttles scalability processing and can delay culling or state response.&quot;* Less work per frame, and later culling.","definitionHtml":"The per-frame cap on Niagara scalability updates.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Both numbers are the audit&#x27;s, and this one was already correct before the review: Quality and Balanced write Epic&#x27;s 50 and only Performance throttles.<\/p><p>It is one of the two entries in the whole project where correcting a value moved the <strong>base<\/strong> preset, so the file most people get changed. The other is <code>r.Nanite.MaxPixelsPerEdge<\/code>.<\/p>","filled":true},{"name":"r.Emitter.FastPoolEnable","status":"active","ourValue":"1","engineDefault":"**disputed.** Epic's reference text and table disagree.","valueRange":"0 or 1","appliesWhen":"Cascade emitters.","visualsHtml":"None.","performanceHtml":"Pools emitter instances instead of allocating and freeing them. A game that spawns the same effect repeatedly benefits; a game that does not holds memory for nothing.","definitionHtml":"Enables the fast pooling path for legacy particle emitters.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the reference text and its table do not agree","notesHtml":"<p><strong>The third documentation conflict found in this review<\/strong>, after <code>r.RayTracing.Culling.Radius<\/code> and <code>r.SSR.Temporal<\/code>. There is nothing to pin, because Epic publishes two answers.<\/p><p>We keep 1 and record the conflict. The reasoning is the same narrow one used for <code>r.SSR.Temporal<\/code>: this only affects Cascade, which most UE5 games no longer use, and pooling is the safer failure -- holding a little memory is more forgiving than allocating during play.<\/p><p>Like that one, it is a candidate for a <code>memory<\/code> grade. Reading the value out of a running game would settle it.<\/p>","filled":true},{"name":"vm.FreeUnoptimizedByteCode","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Niagara systems, at load.","visualsHtml":"None.","performanceHtml":"Niagara compiles its scripts to bytecode for a small vector virtual machine, optimises it, and this frees the unoptimised copy afterwards. Keeping it would waste memory for no benefit at runtime.","definitionHtml":"Frees the unoptimised VectorVM bytecode once the optimised form exists.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. The audit adds a caution worth keeping: *&quot;it is not a general shader-compilation tweak&quot;* -- the name suggests shaders and the subject is Niagara&#x27;s own virtual machine.<\/p>","filled":true},{"name":"vm.OptimizeVMByteCode","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Niagara systems, at load.","visualsHtml":"None.","performanceHtml":"Optimises the VectorVM bytecode. On by default because the optimisation is cheap and the interpreter runs every frame.","definitionHtml":"Enables optimisation of the VectorVM bytecode Niagara compiles its scripts to.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, with the same caution: it is *&quot;unrelated to general shader compilation&quot;* despite reading like a compiler flag.<\/p><p>The two <code>vm.*<\/code> entries are a small lesson in why the audit&#x27;s notes are copied rather than rewritten. Both look like build settings, both are runtime Niagara settings, and the note is the only thing in the file that says so.<\/p>","filled":true},{"name":"FX.GPUSpawnWarningThreshold","status":"not used","ourValue":"not written since 2026-08-31; was 99999999","engineDefault":"20000","valueRange":"a particle count.","appliesWhen":"Cascade GPU particles.","visualsHtml":"None.","performanceHtml":"None directly. It is the point at which the engine warns that a system is spawning an unreasonable number of GPU particles.","definitionHtml":"The spawn count above which Cascade logs an excessive-spawn warning.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>A real command, raised five thousand times its default, to silence a warning.<\/strong><\/p><p>The audit is blunt: *&quot;merely suppresses an excessive-spawn warning.&quot;*<\/p><p>Read it beside <code>fx.GPUSimulationTextureSizeX<\/code> and <code>Y<\/code> earlier in this paper. Those two were quartering the GPU particle capacity; this one raises the threshold at which the engine complains that an effect is spawning too many particles for it. Capacity down, warning off. Whether that pairing was deliberate cannot be known, and it does not need to be -- the effect is the same.<\/p>","filled":true},{"name":"fx.Niagara.WarnComponentRenderCount","status":"not used","ourValue":"not written since 2026-08-31; was 999999","engineDefault":"50","valueRange":"a component count.","appliesWhen":"Niagara systems.","visualsHtml":"None.","performanceHtml":"None directly.","definitionHtml":"The number of render components a single Niagara system may create before the engine warns about it.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The second warning silenced, at twenty thousand times its default. The audit calls the warning *&quot;useful&quot;* in so many words, and it is: one Niagara system creating hundreds of render components is a real performance problem with a specific cause, and the warning names it.<\/p>","filled":true},{"name":"LogNiagara","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"None worth measuring.","definitionHtml":"The log category for Niagara.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The third suppression, and the broadest. The audit: *&quot;Redundant and hides Niagara warnings/errors.&quot;*<\/p><p><strong>Errors<\/strong>, not only warnings. This is the fourth log category found in the review and the second that was actively unhelpful rather than merely pointless, after <code>LogVRS<\/code> in the variable rate shading paper.<\/p>","filled":true},{"name":"LogNiagaraDebuggerClient","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Only where the Niagara debugger is connected, which in a shipped game is never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"The log category for the Niagara debugger client.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off as redundant. Genuinely harmless, unlike the three above it.<\/p><p>Together the four make the pattern this category is worth remembering for. Three of them silence a real signal, and they sit in a block whose heading says its contents have no effect. Silencing a warning has no effect <strong>until something goes wrong<\/strong>, which is the only moment it matters.<\/p>","filled":true},{"name":"fx.Niagara.DebugDraw.Enabled","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Niagara systems.","visualsHtml":"None in normal play. Debug drawing only appears when something asks for it.","performanceHtml":"The audit: *&quot;disabling does not fully remove overhead and can break authored debug data.&quot;* So the saving is partial and the cost is a feature the game&#x27;s own authors may rely on.","definitionHtml":"The Niagara debug drawing interface switch.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off. A real command turned away from its default for a saving the audit says is not fully realised, at a cost it says is real.<\/p>","filled":true},{"name":"fx.Niagara.GpuComputeDebug.DrawDebugEnabled","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only while the GPU compute debugger is in use.","visualsHtml":"None.","performanceHtml":"None. The audit: *&quot;debug drawing only matters when the debugger is used.&quot;*","definitionHtml":"Enables debug drawing for Niagara GPU compute.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off. Harmless either way, and included because a real command set away from its default is worth recording even when nothing turns on it.<\/p>","filled":true},{"name":"fx.NiagaraRuntimeCycleHistorySize","status":"not used","ourValue":"not written since 2026-08-31; was 30","engineDefault":"15","valueRange":"a sample count.","appliesWhen":"Niagara systems.","visualsHtml":"None.","performanceHtml":"None meaningful. It doubles how many frames of timing history Niagara&#x27;s performance tracker keeps.","definitionHtml":"The history length of the Niagara runtime performance tracker.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off. The audit&#x27;s classification is the useful part: *&quot;Diagnostic/ statistics policy, not rendering optimization.&quot;*<\/p><p>It is the third statistics setting in this category, after <code>fx.ParticlePerfStats.Enabled<\/code> and the two warning thresholds -- and the directions do not agree. One doubles the history the tracker keeps while another switches the tracker off entirely.<\/p>","filled":true},{"name":"fx.EnableCircularAnimTrailDump","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"2","valueRange":"a verbosity level.","appliesWhen":"Only where anim trails are used.","visualsHtml":"None.","performanceHtml":"None. It suppresses trail diagnostics.","definitionHtml":"Controls diagnostic dumping for circular animation trails.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off. A fourth diagnostic quieted, and a real command moved off its default to do it.<\/p>","filled":true},{"name":"fx.AllowFastPathFunctionLibrary","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Niagara script compilation, on the graph and compiler side.","visualsHtml":"None directly.","performanceHtml":"Unknown in the direction we were pushing it. The audit calls it *&quot;graph/compiler-side experimental behavior rather than a broadly useful packaged-game tweak.&quot;*","definitionHtml":"Allows Niagara&#x27;s fast-path function library during script compilation.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off. Real, experimental, defaulting to off, and turned on for everyone.<\/p>","filled":true},{"name":"fx.SkipVectorVMBackendOptimizations","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Niagara script compilation.","visualsHtml":"None.","performanceHtml":"Unclear, and that is the point. Writing 0 asks the compiler <strong>not<\/strong> to skip its backend optimisations -- more compilation work in exchange for possibly faster bytecode, on a path Epic ships the other way round.","definitionHtml":"Skips VectorVM backend optimisations during Niagara script compilation.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off. The audit: *&quot;VectorVM compilation policy is not a general player runtime tweak.&quot;*<\/p><p>The double negative is worth pausing on, because it is how a line like this survives review. The name says *skip optimisations*, so 0 reads as *do not skip*, which reads as *optimise more*, which sounds like the right answer. Epic ships 1. Somebody reasoned from the name and got the opposite of the shipped policy.<\/p>","filled":true},{"name":"fx.Niagara.AsyncCompute","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar with this exact name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The fifth invented <code>*.AsyncCompute<\/code> name in the review.<\/p>","filled":true},{"name":"fx.NiagaraAllowAsyncWork","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this old name.","valueRange":"not applicable.","appliesWhen":"Never on a current build.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"An old name that no current stock CVar answers to.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"fx.NiagaraParallelSpawn","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar with this exact name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"fx.NiagaraParallelUpdate","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar with this exact name. The audit points at the real thing: *&quot;current Niagara tasking uses specific SystemSimulation controls.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.ParallelParticleUpdate","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar; particle and Niagara scheduling use feature-specific controls rather than one global switch.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Four more <code>Parallel*<\/code> names in this category alone, bringing the reviewed total to fourteen of the ninety-one in the block.<\/p>","filled":true},{"name":"fx.DeferrPSCDeactivation","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this spelling.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"PSC is a particle system component. No stock CVar answers to this spelling, which also carries a doubled <code>r<\/code> in &quot;Deferr&quot;.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and the misspelling is the point rather than an aside. A config line is matched by exact string; there is no near-miss handling and no warning for an unknown name. <code>Deferr<\/code> and <code>Defer<\/code> are the same idea to a reader and two different worlds to the engine, which is the whole reason a block of hundreds of unchecked names is worth reading rather than trusting.<\/p>","filled":true}]},{"id":"foliage-grass","title":"Foliage & Grass","introHtml":"<p>Grass in UE5 is not placed by hand. A landscape carries a grass type, and the engine spawns instances procedurally in a ring around the camera as you move, destroying them behind you. Foliage -- trees, bushes, rocks -- is placed by an artist but drawn through the same instanced path.<\/p><p>That difference explains the shape of this category. Two commands are <strong>density scales<\/strong>, which decide how much is placed. Two are about <strong>the rate at which grass is built<\/strong>, which decides whether it is there when you arrive.<\/p><p><strong>This is the first category in the review where the original configuration was pointed the right way.<\/strong> Every other one either spent frames nobody asked for or took quality nobody agreed to. Here both departures from Epic&#x27;s values are aimed at the single most complained-about thing in UE5 games: grass appearing in front of you as you walk.<\/p><p>Both are the maintainer&#x27;s measured values, and both carry an assumption about the audience&#x27;s hardware that is written into their entries rather than left implied.<\/p>","commands":[{"name":"foliage.DensityScale","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0.0 upwards. 1 is neutral; below 1 thins the placement.","appliesWhen":"Only foliage types the artist authored to permit scaling. A foliage type that opts out ignores it entirely.","visualsHtml":"Multiplies how many foliage instances are placed. Below 1 a forest thins out, and it thins out everywhere at once -- the effect is not distance-based, so a bush beside you can vanish as readily as one on the horizon.","performanceHtml":"Close to linear in instance count for the placement and culling work, though drawing is dominated by what ends up on screen.","definitionHtml":"A global multiplier on foliage instance density.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/scalability-reference-for-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, which is neutral.<\/p><p>It is a plausible-looking preset candidate and is not one, for a reason worth stating: <strong>thinning foliage is a change to the game&#x27;s art, not to its performance settings.<\/strong> A forest with half its undergrowth is a different place. Epic exposes this for scalability tiers on hardware that cannot cope, and this project&#x27;s Performance preset is not a statement that the machine cannot cope -- it is a statement about which frames to spend.<\/p>","filled":true},{"name":"grass.densityScale","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0.0 upwards. 1 is neutral.","appliesWhen":"Procedural grass on landscapes.","visualsHtml":"The same multiplier, applied to procedurally spawned grass. Below 1, ground cover thins and the landscape material underneath starts showing through.","performanceHtml":"Grass is usually the largest instance count in an outdoor scene, so this is the biggest single lever on that cost -- and the most visible.","definitionHtml":"A global multiplier on procedural grass density.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/scalability-reference-for-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, and is left alone for the same reason as its foliage twin.<\/p><p>It is worth being explicit, because this is the obvious thing a performance tool would reach for: dropping grass density to 0.5 would be one of the largest frame-time savings available anywhere in this file, and it would also be the most obvious visual change any of these settings can make. Doing that silently, on a preset, would be taking a decision about how a game looks and calling it tuning.<\/p><p>If it is ever done, it belongs behind a control the user can see.<\/p>","filled":true},{"name":"grass.MaxAsyncTasks","status":"active","ourValue":"8","engineDefault":"4","valueRange":"a task count.","appliesWhen":"Procedural grass creation.","visualsHtml":"Indirectly. More concurrent tasks means grass is built faster, so it is more likely to be there before you look at it.","performanceHtml":"The audit: *&quot;More concurrent grass creation can improve throughput or increase CPU contention.&quot;* Both halves are true and which one wins depends on how many hardware threads the machine has spare.","definitionHtml":"The maximum number of concurrent asynchronous grass creation tasks.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/foliage-tool-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>Read the provenance, and read the assumption behind it.<\/strong> Epic&#x27;s 4 is chosen to be safe on any core count. 8 is the maintainer&#x27;s measured value, on the reasoning that a machine running a UE5 game today has at least twelve hardware threads, so eight concurrent grass tasks are comfortable rather than contended.<\/p><p><strong>The assumption is the weak point, not the number.<\/strong> This app ships an *&quot;I have a weaker PC&quot;* option, which exists precisely because the audience is not uniform. A six-thread laptop running this file gets eight grass tasks competing with the game thread, and nothing here would tell its owner why.<\/p><p>If that option ever grows a CPU dimension, this is the first command that should follow it. Recorded here so that the connection is findable when it does.<\/p>","filled":true},{"name":"grass.MaxCreatePerFrame","status":"active","ourValue":"6","engineDefault":"1","valueRange":"a component count per frame.","appliesWhen":"Procedural grass creation.","visualsHtml":"<strong>This is the pop-in setting.<\/strong> It caps how many grass components may be created in a single frame. At Epic&#x27;s 1, grass builds in behind a walking player at one component per frame, which is the visible crawl of ground cover catching up that UE5 games are known for. At 6 it keeps up.","performanceHtml":"The audit: *&quot;can create frame hitches.&quot;* The work is not removed, it is concentrated -- six components built in one frame is six times the spike.","definitionHtml":"The maximum number of grass components created per frame.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/foliage-tool-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The maintainer&#x27;s measured value, and the entry in this whole review where the original configuration most clearly had the right instinct.<\/p><p>**Note that the twelve-thread reasoning behind <code>grass.MaxAsyncTasks<\/code> applies here only indirectly.** That one is bounded by how many tasks can run at once; this is a cap on work inside a single frame, so more threads absorb the spike rather than remove it. The hitch risk is about frame time.<\/p><p>The trade is pop-in against hitching, and 6 picks hitching. That is the right way round only because the hitches did not appear in testing -- which is exactly why the value is recorded as measured rather than reasoned.<\/p><p>Worth reading beside <code>r.Nanite.Streaming.MaxPageInstallsPerFrame<\/code> in the Nanite paper, which is the same shape of setting pointed the other way. There the config had <strong>throttled<\/strong> a per-frame install budget to a quarter of Epic&#x27;s, delaying detail arrival; here it <strong>raised<\/strong> one six times, hurrying it. Same mechanism, opposite direction, and only one of the two was measured.<\/p>","filled":true},{"name":"grass.UseHaltonDistribution","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. Absent from the current registry.","valueRange":"not applicable.","appliesWhen":"Never on a current build.","visualsHtml":"None as written. A Halton sequence is a low-discrepancy distribution -- points that look randomly scattered without clumping -- which is a real and sensible thing to place grass with.","performanceHtml":"None.","definitionHtml":"Selected a Halton distribution for procedural grass placement. Obsolete or removed; the current engine does not answer to it.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. It is one of the more interesting dead names in the review, because unlike most of them it is not a guess -- Halton distributions are a real technique with a real place in procedural placement, so this was almost certainly a genuine setting once. Obsolete rather than invented.<\/p>","filled":true},{"name":"r.Foliage.UsePrecomputedLODScreenSize","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar with this exact name. Precomputed LOD screen sizes are a real concept -- deciding at build time at what on-screen size each level of detail takes over -- but the engine exposes no runtime switch for it under this name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Another line asking a shipped game to change something decided when the assets were built, after <code>r.DistanceFields.ParallelBuild<\/code> in the Lumen paper and <code>r.Nanite.Builder.AsyncHelpers<\/code> in the Nanite one.<\/p><p>Three such lines now, in three different subsystems, all with the same shape: a build-time concept written as a runtime variable.<\/p>","filled":true},{"name":"r.Grass.ParallelCull","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No exact stock CVar. The audit adds the useful half: *&quot;grass behavior depends on authored content&quot;* -- how grass is culled is decided by the grass type&#x27;s own settings, not by a global switch.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The fifteenth <code>Parallel*<\/code> name reviewed of the ninety-one in the block, and the fourteenth that names nothing.<\/p><p>Two more names turned up while searching this category and belong elsewhere: <code>LogWindows<\/code> and <code>LogWindowsTextInputMethodSystem<\/code> matched on <strong>&quot;Wind&quot;<\/strong> inside &quot;Windows&quot; and have nothing to do with foliage. They are platform and text-input log categories, and are covered with the rest of the diagnostics.<\/p>","filled":true}]},{"id":"textures","title":"Textures, Streaming & Sharpness","introHtml":"<p>Textures are the largest thing a game keeps in graphics memory, and there is always more of them than will fit. The engine solves that by <strong>streaming<\/strong>: every texture exists at several sizes, called mips, and the streamer decides which size of which texture is worth holding right now.<\/p><p>Almost everything in this category is that decision. How big the pool is, how often the streamer reconsiders, what it loads first, and what it does when it runs out.<\/p><p><strong>Eleven of the eighteen commands already write Epic&#x27;s value<\/strong> -- the highest proportion of any category so far, and a sign that whoever assembled this part was reading the reference rather than guessing.<\/p><p>The interesting part is where they were not, and one thread runs through it. <strong>Four settings in this file all want the same graphics memory:<\/strong><\/p><p>``<code> PoolSizeVRAMPercentage = 60             claims 60 percent of the card for textures r.Nanite.Streaming.StreamingPoolSize    reserves 512 MB, 768 on Quality r.Streaming.HLODStrategy = 2            kept every HLOD mip resident, forever r.Streaming.LimitPoolSizeToVRAM = 0     and switched off the check that it fits <\/code>``<\/p><p>Three of the four take memory and the fourth stops looking. <code>HLODStrategy<\/code> is Quality-only since 2026-08-31, which is what makes that stack tolerable.<\/p><p>The inert half contains the sharpest note in the entire audit, on a line that silenced the streaming log: *&quot;hides exactly the streaming failures this tweak file attempts to influence.&quot;*<\/p>","commands":[{"name":"PoolSizeVRAMPercentage","status":"active","ourValue":"60","engineDefault":"none published. It is a project or device-profile policy rather than a value with a shipped default.","valueRange":"a percentage of total video memory.","appliesWhen":"Always, unless the game sets a fixed pool size instead.","visualsHtml":"The pool is how much memory textures may occupy. Too small and surfaces resolve to lower mips -- visibly blurrier walls and signage -- and the same textures stream in and out repeatedly. Too large and the pool competes with everything else the GPU needs.","performanceHtml":"Not frame time directly. The failure is stutter, when the driver starts paging texture memory over PCIe because more was claimed than exists.","definitionHtml":"The share of total video memory allocated to the texture streaming pool. It lives in the <code>[TextureStreaming]<\/code> section rather than being a console variable.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The audit: *&quot;A 60% pool is a hardware/game VRAM policy; fixed percentages can under- or over-allocate depending on other GPU resources.&quot;*<\/p><p>There is no default to pin, because Epic does not ship one -- it is set per project and per device profile, by people who know what else the game keeps in memory.<\/p><p>60 is kept because a percentage at least scales with the card, which a fixed size does not. But read it together with <code>r.Streaming.LimitPoolSizeToVRAM<\/code> below: a percentage that scales is still a percentage of the whole card, not of what is free.<\/p>","filled":true},{"name":"r.MaxAnisotropy","status":"active","ourValue":"16","engineDefault":"none named by the audit. The legal range is 1 to 16.","valueRange":"1 to 16.","appliesWhen":"Always, though scalability settings and per-texture-group settings can override it.","visualsHtml":"Anisotropic filtering is what keeps a surface sharp when you see it at a shallow angle -- a road running to the horizon, a floor stretching away. At low values the far half of that road turns to mush; at 16 it stays legible almost to the vanishing point. It is one of the most visible settings in this file and one of the cheapest.","performanceHtml":"Small on any modern GPU. Anisotropic filtering is dedicated hardware, and the cost is extra texture fetches only on surfaces actually seen at an angle.","definitionHtml":"The maximum anisotropy level used when sampling textures.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>This is the only entry in the whole review where the audit itself proposes a preset split<\/strong>: *&quot;Value 16 is a valid maximum-quality choice, but scalability and texture groups can override it. Quality-preset candidate.&quot;*<\/p><p>It is not split, and the reason is the standard rather than disagreement. The audit names the range and one value; it does not name a second number. Splitting would mean choosing 8 or 4 out of the air, in a project whose whole point is not doing that.<\/p><p>16 stays everywhere, which is defensible on its own terms: the cost is close to nothing on hardware from the last decade, and the benefit is on every angled surface in the game.<\/p><p>If this is ever measured, it is the first entry to revisit -- the audit has already done everything except supply the number.<\/p>","filled":true},{"name":"r.PreTileTextures","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Cook time. At runtime it describes what already happened.","visualsHtml":"None from a player&#x27;s configuration file.","performanceHtml":"None from a player&#x27;s configuration file.","definitionHtml":"Whether textures are tiled at cook time for the target platform&#x27;s preferred memory layout.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. The audit&#x27;s second sentence is the point: *&quot;A player INI cannot retile cooked textures.&quot;*<\/p><p>It is the fourth build-time setting found in a runtime file, after two in the Lumen and Nanite papers and one in foliage. Unlike those three this one is real and correct -- it simply cannot do anything from here.<\/p>","filled":true},{"name":"r.Streaming.Boost","status":"active","ourValue":"1","engineDefault":"1","valueRange":"a multiplier. 1 is neutral.","appliesWhen":"Always.","visualsHtml":"Scales the streamer&#x27;s sense of how urgently textures are wanted. Above 1 it fetches more aggressively, which fills the pool faster and can push out textures still in use.","performanceHtml":"More streaming work for the same scene.","definitionHtml":"A global multiplier on texture streaming boost.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.Streaming.DefragDynamicBounds","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"None directly.","performanceHtml":"Defragments the bounds data the streamer uses to decide what is near the camera. Fragmented bounds mean slower queries every frame.","definitionHtml":"Enables defragmentation of dynamic streaming bounds.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.Streaming.FramesForFullUpdate","status":"active","ourValue":"2","engineDefault":"5","valueRange":"a frame count.","appliesWhen":"Always.","visualsHtml":"How many frames a complete streaming update is spread over. A shorter cycle means the streamer notices sooner that the camera has moved and starts fetching earlier, so textures are more likely to be resident by the time you look at them.","performanceHtml":"CPU time, paid every frame whether anything changed or not. The audit: *&quot;More frequent full updates improve responsiveness but increase CPU work.&quot;*","definitionHtml":"The number of frames over which a full texture streaming update is amortised.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The maintainer&#x27;s value, measured.<\/strong> Epic spreads the update over five frames; 2 does it more than twice as often.<\/p><p>It is the fourth setting in this project aimed at pop-in, after <code>grass.MaxCreatePerFrame<\/code> and the two Nanite streaming budgets. The four are worth reading as a set, because each pays for the same benefit in a different currency: grass pays in frame spikes, Nanite paid in delayed arrival when it was throttled the wrong way, and this one pays in steady CPU time.<\/p>","filled":true},{"name":"r.Streaming.FullyLoadUsedTextures","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"At 1, any texture that has been used at all is loaded at full resolution and kept. No blurry mips and no pop-in -- and no streaming either, so a large game runs out of memory.","performanceHtml":"At 1 it defeats the purpose of streaming entirely.","definitionHtml":"Forces fully loading every texture that has been used.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, and it is one worth pinning rather than omitting. This is the setting somebody reaches for when they want to &quot;fix pop-in&quot;, and it works exactly once, on a small game, on a card with memory to burn.<\/p>","filled":true},{"name":"r.Streaming.HLODStrategy","status":"active","ourValue":"0, and 2 on the Quality preset","engineDefault":"0","valueRange":"0, 1 or 2.","appliesWhen":"Games using HLODs -- the simplified stand-ins World Partition draws at distance.","visualsHtml":"At 2 every HLOD texture mip stays resident, so the distant landscape never streams and never pops. At 0 HLOD textures stream like everything else.","performanceHtml":"Not frame time -- <strong>memory<\/strong>, and potentially a lot of it. The audit: *&quot;trading reduced streaming and pop-in for potentially large memory use.&quot;*","definitionHtml":"The residency strategy for HLOD textures.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Both numbers are the audit&#x27;s. Quality keeps every HLOD mip resident; Balanced and Performance write Epic&#x27;s 0. Until 2026-08-31 every preset wrote 2.<\/p><p><strong>This is the entry that makes the memory stack at the top of this paper tolerable.<\/strong> With it on every preset, a machine was being asked for 60 percent of its VRAM as a texture pool, plus half a gigabyte of Nanite pages, plus every HLOD mip a large world has, with the fit check switched off.<\/p>","filled":true},{"name":"r.Streaming.LimitPoolSizeToVRAM","status":"active","ourValue":"0; 1 on the Performance preset, and 1 on any preset when \"I have a weaker PC\" is ticked","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"At 1 the pool is clamped to fit the memory actually available, so it may end up smaller than requested -- which shows as lower mips, more churn and more pop-in. At 0 the pool is whatever was asked for.","performanceHtml":"At 0, if the request does not fit, the driver begins paging texture memory over PCIe. That shows as stutter with no obvious cause rather than as a lower frame rate.","definitionHtml":"Clamps the texture streaming pool to available video memory.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>Neither value is safe, which is why this is an option rather than a setting.<\/strong> Clamping risks blurry textures; not clamping risks stutter. The audit says *&quot;test with each game&#x27;s pool policy&quot;*, and a file shipped for fifty games cannot.<\/p><p><strong>Three sources decide this line, and the order they resolve in is the whole design:<\/strong><\/p><p>``<code> base 0             Epic&#x27;s value. Quality and Balanced write it. performance 1      the clamp, because a machine chasing frames is the one least likely to have VRAM to spare weaker-pc on 1     the clamp, on any preset, because the user said so <\/code>``<\/p><p>VRAM is a fact about the machine rather than a taste, which is why the user&#x27;s switch outranks everything. The Performance preset carries the same value for a weaker reason -- an assumption about who picks it -- and is overruled the moment the user has an opinion.<\/p><p>**The <code>off<\/code> state writes <code>null<\/code>, meaning no opinion, and that is not an oversight.** An option beats a preset, so a state that wrote <code>0<\/code> would outrank the Performance value and the preset could never be seen at all.<\/p><p>It costs one line in the generated file. A state with no opinion writes no note, so <code>; * Your setting: I have a weaker PC = off.<\/code> no longer appears when the box is unticked -- and that note is what tells a reader this line is controlled by a box they can find. The trade was made deliberately on 2026-08-31 in exchange for the Performance behaviour. The note still appears when the box is ticked.<\/p><p>The base value was <strong>1<\/strong> until that day and could never be reached, because the option supplied a value in both of its states. It sat in the data looking like the answer while the real answer always came from the option -- the fourth unreachable base value found in this review, after <code>r.Tonemapper.Sharpen<\/code> and both <code>r.MotionBlur<\/code> amounts. It is genuinely reachable now, and it is what Quality and Balanced write.<\/p>","filled":true},{"name":"r.Streaming.ParallelRenderAssetsNumWorkgroups","status":"active","ourValue":"4","engineDefault":"2","valueRange":"a workgroup count.","appliesWhen":"Always.","visualsHtml":"None directly.","performanceHtml":"How many parallel groups the render-asset streaming work is split into. More groups means less waiting on a machine with threads to spare, and more game-thread bookkeeping on one without.","definitionHtml":"The number of workgroups used for parallel render asset streaming.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The maintainer&#x27;s value, measured<\/strong>, resting on the same assumption as <code>grass.MaxAsyncTasks<\/code> in the foliage paper: that a machine running a UE5 game today has at least twelve hardware threads.<\/p><p>The audit: *&quot;Valid, default 2. More groups can reduce waits but add game-thread overhead; there is no universal optimum.&quot;* Epic&#x27;s 2 is chosen to be safe on any core count.<\/p><p>As with the grass setting, the assumption is the weak point rather than the number, and *&quot;I have a weaker PC&quot;* is where it should eventually live if that option ever grows a CPU dimension. Two commands now wait on that.<\/p>","filled":true},{"name":"r.Streaming.StressTest.ExtraAsyncLatency","status":"active","ourValue":"0","engineDefault":"0","valueRange":"a latency in milliseconds.","appliesWhen":"Only during streaming stress tests.","visualsHtml":"None at 0.","performanceHtml":"None at 0. Above 0 it deliberately makes streaming slower, to test what a game does when storage is.","definitionHtml":"Adds artificial latency to streaming requests for stress testing.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. A diagnostic tool pinned at off, which is the one place pinning is unambiguously free.<\/p>","filled":true},{"name":"r.Streaming.UseAsyncRequestsForDDC","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Where the derived data cache is in use, which in a packaged game is essentially never.","visualsHtml":"None.","performanceHtml":"None in a shipped game.","definitionHtml":"Uses asynchronous requests when streaming from the derived data cache.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. The audit adds a warning about the documentation itself: *&quot;The description retains stale default prose&quot;* -- the reference&#x27;s table and its prose disagree, and the table is the one that matches the engine.<\/p><p>That is the fourth documentation problem found in this review, after the three outright conflicts on <code>r.RayTracing.Culling.Radius<\/code>, <code>r.SSR.Temporal<\/code> and <code>r.Emitter.FastPoolEnable<\/code>. This one is milder: stale prose beside a correct table, rather than two live answers.<\/p>","filled":true},{"name":"r.Streaming.UseBackgroundThreadPool","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"Runs texture mip calculations on the background thread pool rather than on the game thread.","definitionHtml":"Uses the background thread pool for streaming mip calculations.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. Note that <code>r.TextureStreaming.UseBackgroundThreadPool<\/code> also appeared in the inert list, in the wrong namespace, and is documented at the end of this paper -- the real one is here and the imitation was being written alongside it.<\/p>","filled":true},{"name":"r.Streaming.UseFixedPoolSize","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"At 1 the pool never grows or shrinks at runtime, which makes memory predictable and removes the streamer&#x27;s ability to adapt.","performanceHtml":"At 0 the pool behaves normally.","definitionHtml":"Uses a fixed texture streaming pool size rather than a dynamic one.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, and it is the third member of the pool-policy group with <code>PoolSizeVRAMPercentage<\/code> and <code>LimitPoolSizeToVRAM<\/code>. The three together decide how large the pool is, whether it may change, and whether it must fit -- and only the last of the three is a user option.<\/p>","filled":true},{"name":"r.Streaming.UseNewMetrics","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"Indirectly. The metrics decide which mip the streamer thinks a surface needs, so the old ones are worse at it.","performanceHtml":"No meaningful difference.","definitionHtml":"Uses the current streaming metrics rather than the legacy ones.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes
