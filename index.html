ine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.ParallelSkeletalClothUpdateVerts","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>The last of the eight.<\/p><p>They are worth counting because the number is the evidence. One or two invented names is somebody misremembering. Eight, following the internal stages of one subsystem in order, is somebody writing down a plan the engine was never asked about.<\/p>","filled":true},{"name":"p.Chaos.Solver.Joint.UseSimd","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none in current UE5.","valueRange":"not applicable.","appliesWhen":"Never on a current build.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Version-limited setting introduced in UE 5.5 but absent from current UE 5.8 registry. Not general across UE5.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and it is a category of dead entry this review has met only twice. The audit: *&quot;Version-limited setting introduced in UE 5.5 but absent from current UE 5.8 registry.&quot;*<\/p><p>It is not invented and not obsolete in the usual sense. It existed, briefly, between two engine versions. A configuration file shipped for fifty games built on different UE5 revisions cannot rely on a setting with that lifespan.<\/p>","filled":true},{"name":"p.AsyncSceneEnabled","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none in current UE5.","valueRange":"not applicable.","appliesWhen":"Never on a current build.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Obsolete PhysX-era async-scene advice; absent from current Chaos UE5.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. PhysX-era advice: UE4 ran a separate asynchronous physics scene, and Chaos replaced the whole architecture.<\/p><p>It is the same shape as <code>grass.UseHaltonDistribution<\/code>, the six <code>pakcache.*<\/code> entries and <code>r.UseAsyncShaderPrecompilation<\/code> -- real once, in a system the engine has since replaced entirely.<\/p>","filled":true},{"name":"r.ParallelPhysicsScene","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none in current UE5.","valueRange":"not applicable.","appliesWhen":"Never on a current build.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar; physics uses p.* / Chaos controls and project policy.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The audit: *&quot;physics uses p.* / Chaos controls and project policy&quot;* -- and five real <code>p.Chaos.*<\/code> commands are pinned at the top of this paper.<\/p>","filled":true},{"name":"r.ParallelPhysicsStepAsync","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none in current UE5.","valueRange":"not applicable.","appliesWhen":"Never on a current build.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar; async physics is not exposed through this renderer name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The audit: *&quot;async physics is not exposed through this renderer name.&quot;*<\/p>","filled":true},{"name":"r.ParallelDestruction","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none in current UE5.","valueRange":"not applicable.","appliesWhen":"Never on a current build.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar found; likely conflates unrelated RDG or GC controls.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The audit suspects it *&quot;conflates unrelated RDG or GC controls&quot;* -- a name assembled from two subsystems that each have something like it.<\/p>","filled":true}]},{"id":"garbage-collection","title":"Garbage Collection","introHtml":"<p>Garbage collection is how UE5 frees objects nothing points at any more. It runs in two phases: a <strong>mark<\/strong> phase that walks the object graph deciding what is still reachable, and a <strong>purge<\/strong> phase that destroys what is not. Both used to happen on the game thread, and both used to show up as a hitch.<\/p><p>The three live commands here are Epic&#x27;s answer to that, and all three are on by default. Two spread a phase across worker threads. The third makes the graph smaller to walk in the first place.<\/p><p><strong>All three already wrote Epic&#x27;s value, and all three stay.<\/strong> The audit&#x27;s note on each is the same sentence -- *&quot;Valid and exactly current default 1. Omit.&quot;* -- and this project does not omit defaults. The generated file is appended after the game&#x27;s own, so stating the value is what guarantees it.<\/p><p><strong>One of the three is not a free win.<\/strong> <code>gc.CreateGCClusters<\/code> changes when objects die, not just how fast they are found. It is kept, but it is kept as a judged bet rather than as an obvious yes, and its entry says so.<\/p><p>The inert list held two names, and the second of them turned out to matter more than anything live in this category.<\/p><p>**<code>gc.AllowParallelDestruction<\/code> is invented** -- a guess at a name for something that already exists as <code>gc.MultithreadedDestructionEnabled<\/code>.<\/p><p>**<code>r.bForceGCAfterLevelStreamedOut<\/code> is a misspelling of a real command.** The engine calls it <code>s.ForceGCAfterLevelStreamedOut<\/code>. Wrong prefix, stray <code>b<\/code>, and the line did nothing for it. Corrected, it stops the engine forcing a full collection every time a level unloads -- which is a stall in the middle of play, traded for up to a minute of held memory. It is now a live command with a maintainer&#x27;s provenance note, and it is the only entry in this category that was not already correct.<\/p>","commands":[{"name":"gc.AllowParallelGC","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Every collection, which on a streaming game is many times a minute.","visualsHtml":"None.","performanceHtml":"The mark phase walks the whole object graph looking for what is still reachable. Spread over worker threads it finishes in a fraction of the time, which shortens the pause the game thread waits through.","definitionHtml":"Runs the reachability analysis of garbage collection across the task graph rather than on one thread.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation and BaseEngine.ini, where the value is True","notesHtml":"<p>First of three, and all three are the same shape: Epic&#x27;s default, written back anyway.<\/p><p>The audit says *&quot;Valid and exactly current default 1. Omit.&quot;* -- and this project does not omit defaults. A generated file that states the value protects against a title that shipped something else, and this file is appended after the game&#x27;s own, so the last word is ours.<\/p><p>There is no trade in this one. It is work split across threads that produces the same answer.<\/p>","filled":true},{"name":"gc.CreateGCClusters","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"When objects are created, not when they are collected. It is a load-time structural choice.","visualsHtml":"None.","performanceHtml":"A cluster is visited once instead of once per member, so the mark phase has far less to walk. On an asset-heavy title this is the largest single saving in the whole collector.","definitionHtml":"Groups objects that load and die together into a single GC cluster, which is reached, marked and destroyed as one unit.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation and BaseEngine.ini, where the value is True","notesHtml":"<p><strong>The one setting in this category that is a bet rather than a free win<\/strong>, and it is worth being plain about why.<\/p><p>The other two split work across threads and change nothing else. Clustering changes *when objects die*. A member of a cluster is kept alive as long as any member is reachable, so an object that would have been freed on its own is held until the whole group goes.<\/p><p>That is the point -- it is what makes the mark phase cheap -- but it means a title that shipped <code>False<\/code> may have shipped it deliberately, to work around an object-lifetime bug of its own. Writing <code>1<\/code> puts that title back on the path its developers stepped off.<\/p><p>The bet is still worth taking. <code>True<\/code> is Epic&#x27;s default, it is what the overwhelming majority of shipped UE5 titles run, and it is the value Epic tests against. A game that turned it off is the rare case, and the rare case does not set the rule for the rest of the list.<\/p><p>Recorded here so that if a single title ever misbehaves, this is the first line to read.<\/p>","filled":true},{"name":"gc.MultithreadedDestructionEnabled","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"The purge phase, after the collector has decided what is dead.","visualsHtml":"None.","performanceHtml":"Destruction is the second half of a collection and on a large purge it is the slower half. Running destructors on worker threads keeps that off the game thread.","definitionHtml":"Runs UObject destruction on worker threads rather than serially on the game thread during the purge.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation and BaseEngine.ini, where the value is True","notesHtml":"<p>Third of three, and the free win again: same result, more threads.<\/p><p>It pairs with <code>gc.AllowParallelGC<\/code> above. That one parallelises deciding what is dead; this one parallelises killing it. Together they are the whole of what this category does, and the whole of what it needed.<\/p><p>Note that the inert list carried <code>gc.AllowParallelDestruction<\/code>, an invented name for exactly this. The real command was already here.<\/p>","filled":true},{"name":"s.ForceGCAfterLevelStreamedOut","status":"active","ourValue":"0","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Every time a streaming level or World Partition cell unloads.","visualsHtml":"None directly. Indirectly it removes a hitch, which is visible as a frame that arrives late.","performanceHtml":"Trades held memory for smoothness. A forced collection walks the entire object graph, so it costs milliseconds at a moment the player did not choose. Deferring it means up to about a minute of dead level data stays resident.","definitionHtml":"Controls whether the engine requests a full garbage collection immediately after a streaming level finishes unloading, rather than leaving it to the normal purge interval.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 source, where the CVar is declared in LevelStreaming.cpp with a default of 1","notesHtml":"<p><strong>PROVENANCE: not from the audit.<\/strong> Added by the maintainer, because the review of this category found three defaults and nothing else, while the inert list held a broken spelling of a real and useful command.<\/p><p>That broken spelling was <code>r.bForceGCAfterLevelStreamedOut<\/code>. The <code>r.<\/code> prefix is the renderer and the <code>b<\/code> is a C++ bool naming habit that leaked into a console variable name. Neither belongs. The engine&#x27;s own name is <code>s.<\/code> for streaming, with no <code>b<\/code>.<\/p><p>The behaviour is worth having. By default the engine forces a full collection the moment a level streams out. That is tidy and it is safe, and it is also a stall dropped into the middle of play, at a moment chosen by the level layout rather than by anything the player did. On a World Partition map that unloads cells continuously it can fire often.<\/p><p>Setting <code>0<\/code> does not disable collection. It hands the work back to the normal schedule, which <code>gc.TimeBetweenPurgingPendingKillObjects<\/code> runs about once a minute. The dead objects wait their turn instead of jumping the queue.<\/p><p><strong>The cost is memory, and it is the honest objection to this entry.<\/strong> Up to a minute of unloaded level data stays resident. On a machine with headroom that is free; on a machine short of RAM it is not. If a low-memory dimension is ever added to the setup options, this is the first command that should answer to it.<\/p><p>Evidence is <code>ai<\/code> only. The name and default were read from the engine&#x27;s source rather than measured here.<\/p>","filled":true},{"name":"gc.AllowParallelDestruction","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock GC CVar with this exact name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The audit: *&quot;No current stock GC CVar with this exact name.&quot;*<\/p><p>It is an invented name for something real. Parallel destruction exists and is on by default; the engine spells it <code>gc.MultithreadedDestructionEnabled<\/code>, and that command is live at the top of this paper.<\/p><p>This is a shape the review has met before -- a guess at what a command *should* be called, sitting a few lines away from what it *is* called. <code>r.ParallelPhysicsScene<\/code> in the physics paper is the same mistake about a different subsystem.<\/p>","filled":true},{"name":"r.bForceGCAfterLevelStreamedOut","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar with this exact renderer-prefixed name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and <strong>the most useful dead entry found in the whole review.<\/strong><\/p><p>The audit: *&quot;No current stock CVar with this exact renderer-prefixed name.&quot;* That is correct, and it is where the audit stopped, because the audit&#x27;s job was to grade what was in front of it rather than to guess what was meant.<\/p><p>What was meant is <code>s.ForceGCAfterLevelStreamedOut<\/code>, which is real, is current, and does something worth doing. Two characters were wrong: an <code>r.<\/code> where an <code>s.<\/code> belongs, and a stray <code>b<\/code>. Those two characters were the difference between a line the engine ignores and a line that removes a stutter.<\/p><p>It is now live, with its own entry above.<\/p><p>Every other dead name in this review was dead because the idea behind it was wrong. This one was dead because of a typing mistake, and it is the reason the inert list is worth reading rather than deleting.<\/p>","filled":true}]},{"id":"animation","title":"Animation","introHtml":"<p>Animation is the clearest case in the review of a category whose live commands were already right and whose inert list was doing real harm.<\/p><p>The three <code>a.Parallel*<\/code> commands are Epic&#x27;s defaults, and they mean one thing: animation work may run on worker threads instead of the game thread. Evaluating the graph, interpolating a thinned update, running the Animation Blueprint&#x27;s own logic -- all three are permitted to move, and all three are permitted by default.<\/p><p><strong>The word to hold on to is permitted.<\/strong> <code>a.ParallelAnimUpdate=1<\/code> does not move anything. It allows the engine to move it *when the engine judges that safe*, and the engine only judges it safe when the Animation Blueprint was authored to be thread-safe. The engine keeps the veto.<\/p><p><code>GeometryCache.OffloadUpdate<\/code> is the one live command that deviates, and it is kept at 1. Geometry Cache is baked vertex animation imported from a film tool; most titles never use it, and a title that does not use it never reaches the code. The downside case is not a worse result but no result, which is what makes the deviation an easy one.<\/p><p><strong>The inert list held eighteen names, and one of them was dangerous.<\/strong><\/p><p><code>a.ForceParallelAnimUpdate<\/code> was switched on. It is real, its default is 0, and it is the same idea as <code>a.ParallelAnimUpdate<\/code> with the engine&#x27;s veto removed. The audit&#x27;s word for it is one it uses almost nowhere else: <strong>unsafe<\/strong>. It forced every Animation Blueprint in whatever game the user owned onto a worker thread, whether or not its author had made it safe to be there. A pose solved from data another thread is still writing is a wrong pose, and a wrong pose looks like the game&#x27;s fault.<\/p><p>It is now off.<\/p><p><strong>Two more are wrong-namespace copies of commands that are already live.<\/strong> <code>r.ParallelAnimationEvaluation<\/code> and <code>r.ParallelAnimationUpdate<\/code>, where the real names are <code>a.ParallelAnimEvaluation<\/code> and <code>a.ParallelAnimUpdate<\/code>. The audit attaches a warning to the first that appears nowhere else in it: *&quot;Do not silently rename a source candidate.&quot;* That instruction has been followed. The wrong names are recorded here rather than quietly corrected, because the right ones were already in the file. A third, <code>r.ForceParallelAnimUpdate<\/code>, is the wrong-namespace copy of the unsafe command -- so the list contained the dangerous setting twice, and only the correctly spelled one was doing anything.<\/p><p><strong>Nine are invented, and they form the second large fabricated family in the review.<\/strong> <code>r.ParallelAnimation<\/code> followed by <code>CacheConversion<\/code>, <code>CacheStreaming<\/code>, <code>Compression<\/code>, <code>Retargeting<\/code> and <code>Streaming<\/code> -- with an <code>Async<\/code> twin for four of the five. The shape matches the eight <code>r.ParallelSkeletalCloth*<\/code> names in the physics paper exactly: the stages of one subsystem, listed in order, each given a switch. Two more, <code>a.ParallelBlendSpaceEvaluation<\/code> and <code>a.ParallelTransitionEvaluation<\/code>, get the namespace right and the structure wrong; blend spaces and transitions are nodes inside the animation graph, not systems beside it.<\/p><p><strong>Two are real but in the wrong file.<\/strong> <code>bAllowMultiThreadedAnimationUpdate<\/code> and <code>bOptimizeAnimBlueprintMemberVariableAccess<\/code> are project settings, not console variables, and the audit is firm that both should stay with the developer. The first is precisely the permission that <code>a.ParallelAnimUpdate<\/code> asks about -- which is to say the project&#x27;s own statement about whether its animation code is thread-safe, and not ours to answer.<\/p><p><strong>One hides a fault.<\/strong> <code>LevelSequence.InvalidBindingTagWarnings=0<\/code> silences the warning that a cutscene is pointing at an object that is not there. Unlike the fifty-six log lines in the crash-diagnostics paper, this one was in a section that applied it, so it worked -- and what it did was make a broken cinematic harder to explain.<\/p>","commands":[{"name":"a.ParallelAnimEvaluation","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Every frame a skeletal mesh is visible and its animation graph runs.","visualsHtml":"None. The same pose is produced either way.","performanceHtml":"Evaluating an animation graph means blending poses, running state machines and solving IK, per character. Spread across worker threads it comes off the game thread, which is where a crowd scene otherwise costs the most.","definitionHtml":"Runs skeletal mesh animation evaluation on task-graph worker threads rather than on the game thread.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>First of three pinned defaults, and all three are the same shape: Epic&#x27;s value, written back anyway.<\/p><p>The audit says *&quot;Valid stock CVar and exactly default 1. Omit and inherit.&quot;* This project does not omit, because the generated file is appended after the game&#x27;s own and stating the value is what guarantees it.<\/p><p>Note that the inert list carries <code>r.ParallelAnimationEvaluation<\/code> -- this command with the wrong prefix and a longer word. It is documented further down.<\/p>","filled":true},{"name":"a.ParallelAnimInterpolation","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"When Update Rate Optimisation is thinning animation updates, which on a crowded scene is most distant characters.","visualsHtml":"None when it works. Interpolation is what stops a thinned update looking like a stutter, so the visible result of having it is smooth motion at a lower update rate.","performanceHtml":"Moves the pose blend between two thinned updates onto worker threads.","definitionHtml":"Runs the interpolation step of Update Rate Optimisation on worker threads.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Second pinned default, and it pairs with the evaluation setting above.<\/p><p>Update Rate Optimisation is the engine deciding that a distant character does not need its animation solved every frame. Interpolation is what fills the gap so the saving is not visible. This command decides which thread does the filling.<\/p><p>The audit&#x27;s note is the same single sentence: valid, exactly default 1, omit and inherit. Written instead.<\/p>","filled":true},{"name":"a.ParallelAnimUpdate","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Every frame an animation instance ticks, subject to the engine deciding the work is safe to move.","visualsHtml":"None.","performanceHtml":"The update phase is where the Animation Blueprint runs its own logic, and on a title with complex character code it is the larger half of the animation cost.","definitionHtml":"Allows the animation update phase to run on worker threads when the project and the Animation Blueprint are configured for it.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Third pinned default, and <strong>the most important sentence in this category is in its audit note<\/strong>: *&quot;Worker eligibility still requires safe project/Animation Blueprint configuration.&quot;*<\/p><p>That is not a caveat about the command. It is a description of how the command works. <code>1<\/code> does not force anything. It permits the engine to move the update to a worker thread *when the engine judges that safe*, and the engine only judges it safe when the Animation Blueprint was authored to be thread-safe.<\/p><p>So this is a request, and the engine holds the veto.<\/p><p>Hold that thought for <code>a.ForceParallelAnimUpdate<\/code> below, which is the same idea with the veto removed, and which was sitting in the inert list switched on.<\/p>","filled":true},{"name":"GeometryCache.OffloadUpdate","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Only when a title actually uses Geometry Cache assets. Most do not.","visualsHtml":"None. The same vertices arrive, computed elsewhere.","performanceHtml":"Geometry Cache updates are heavy by nature: they push whole vertex buffers per frame rather than a handful of bone transforms. Moving that off the game thread is worth more than it would be for skeletal animation.","definitionHtml":"Moves the per-frame Geometry Cache vertex update off the game thread onto a worker.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The only live command in this category that deviates from Epic&#x27;s default<\/strong>, and the only one that needed a decision.<\/p><p>Geometry Cache is baked vertex animation -- a mesh whose vertices were recorded frame by frame in a film tool and imported, rather than driven by a skeleton. It is used for cloth simulation caches, fluid, destruction and facial performance capture. Most games never touch it.<\/p><p>The audit: *&quot;Valid, default 0. Only titles using Geometry Cache benefit, and platform behavior must be tested.&quot;*<\/p><p>Both halves of that are true and neither argues against keeping it.<\/p><p><strong>A title that does not use Geometry Cache never reaches this code.<\/strong> The downside case is not a worse result, it is no result. That is unusual and it is what makes this an easy deviation.<\/p><p><strong>The platform caveat is narrower here than the audit had to assume.<\/strong> The audit graded a setting that might be applied anywhere. This application ships for Windows desktop only, which is the platform the offload path is best exercised on.<\/p><p>Reviewed and kept at 1 by the maintainer.<\/p>","filled":true},{"name":"a.ForceParallelAnimUpdate","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Every animation update, including the ones the engine would have refused to move.","visualsHtml":"A pose solved from data another thread was still writing is wrong, and wrong poses are visible -- a limb in the wrong place for a frame, a character briefly folded.","performanceHtml":"Faster, when it works. That is the trap.","definitionHtml":"Valid, default 0. Forces worker-thread updates past project/Anim Blueprint permission and is unsafe as a general preset.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the default is 0","notesHtml":"<p><strong>The real find in this category, and the audit uses a word it uses almost nowhere else:<\/strong> *&quot;Valid, default 0. Forces worker-thread updates past project/Anim Blueprint permission and is unsafe as a general preset.&quot;*<\/p><p><strong>Unsafe.<\/strong> Not slower, not pointless, not obsolete. Unsafe.<\/p><p>Read it directly against <code>a.ParallelAnimUpdate<\/code>, which is live at the top of this paper and is entirely fine. That one asks the engine whether the update can move to a worker thread. The engine answers yes only when the Animation Blueprint was authored to be thread-safe -- no reads of game state another thread might be writing, no calls into things that assume the game thread.<\/p><p>This command removes the question.<\/p><p>It was switched on. A configuration file handed to inexperienced users, for whatever game they own, forced every Animation Blueprint in that game onto a worker thread whether or not its author had made it safe to be there. The symptoms of getting that wrong are a wrong pose for a frame, or a crash, and both would look like the game&#x27;s fault.<\/p><p>It is the second setting in this whole review that trades correctness for speed without saying so -- after <code>p.RemoveFarBodiesFromBVH<\/code> in the physics paper -- and it is the more dangerous of the two, because a broken physics query is a missed line trace and a broken animation update is a data race.<\/p>","filled":true},{"name":"r.ForceParallelAnimUpdate","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"0 or 1","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Wrong namespace/name. Real control is a.ForceParallelAnimUpdate and is unsafe to force generally.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and it is the strangest entry in the category: <strong>a wrong-namespace copy of the unsafe command above.<\/strong><\/p><p>The audit: *&quot;Wrong namespace/name. Real control is a.ForceParallelAnimUpdate and is unsafe to force generally.&quot;*<\/p><p>So the list contained the dangerous setting twice -- once spelled correctly, where it worked, and once spelled <code>r.<\/code>, where it did nothing. Only one of those two lines was ever doing harm, and it was not the one that looks like a mistake.<\/p>","filled":true},{"name":"r.ParallelAnimationEvaluation","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"0 or 1","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Wrong exact name/namespace. Real stock control is a.ParallelAnimEvaluation and is already default 1. Do not silently rename a source candidate.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and the audit&#x27;s note carries a warning it gives nowhere else: *&quot;Wrong exact name/namespace. Real stock control is a.ParallelAnimEvaluation and is already default 1. <strong>Do not silently rename a source candidate.<\/strong>&quot;*<\/p><p>That last sentence is aimed at whoever reads the audit next, and it is worth repeating here. The temptation on finding <code>r.ParallelAnimationEvaluation<\/code> is to correct it to <code>a.ParallelAnimEvaluation<\/code> and move on. The audit says no: record that the wrong name was written, because the wrong name is evidence about where the list came from, and the right name is already live anyway.<\/p><p>That is exactly what has been done. The real command sits at the top of this paper at its default, and this entry stays here as the record.<\/p><p>Note the contrast with <code>r.bForceGCAfterLevelStreamedOut<\/code> in the garbage-collection paper, which *was* corrected and promoted. The difference is that the correction there produced a command nothing else covered. Here it produces a duplicate.<\/p>","filled":true},{"name":"r.ParallelAnimationUpdate","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"0 or 1","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Wrong exact name/namespace. Real a.ParallelAnimUpdate is already default 1 and actual worker use remains gated by safe project/Anim Blueprint configuration.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, the second of the two renames. The audit: *&quot;Wrong exact name/namespace. Real a.ParallelAnimUpdate is already default 1 and actual worker use remains gated by safe project/Anim Blueprint configuration.&quot;*<\/p><p>The audit repeats the gate here, in a note about a name that does not exist, which suggests it expected the reader to reach for the wrong lever. Worth honouring: the safe command is live, the forcing command is gone, and this one never ran.<\/p>","filled":true},{"name":"r.ParallelAnimationCacheConversion","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"0 or 1","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar; invented r.ParallelAnimation* naming.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>First of **nine invented <code>r.ParallelAnimation*<\/code> names**, and the family has a structure worth describing before the individual entries.<\/p><p>Somebody listed what the animation system does -- convert caches, stream caches, compress, retarget, stream -- and wrote a <code>Parallel<\/code> switch for each, in the <code>r.<\/code> renderer namespace where animation does not live. Then, for four of the five, wrote an <code>Async<\/code> twin as well.<\/p><p>The engine has none of them.<\/p><p>It is the second family of this exact shape in the review, after the eight fabricated <code>r.ParallelSkeletalCloth*<\/code> names in the physics paper. Both follow the internal stages of one subsystem in order. Neither could have come from reading the engine.<\/p>","filled":true},{"name":"r.ParallelAnimationCacheConversionAsync","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"0 or 1","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar; invented async suffix.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>The <code>Async<\/code> twin of the entry above, and the twins are the tell.<\/p><p><code>Parallel<\/code> and <code>Async<\/code> mean nearly the same thing here. A real engine does not ship a parallel switch and an async switch for the same operation, because there is nothing for the second one to control. Four such pairs appear in this family.<\/p>","filled":true},{"name":"r.ParallelAnimationCacheStreaming","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"0 or 1","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar; cache/streaming work is not exposed under this name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The audit: *&quot;No stock CVar; cache/streaming work is not exposed under this name.&quot;*<\/p><p>The one member of the family without an <code>Async<\/code> twin, which is the only thing distinguishing it.<\/p>","filled":true},{"name":"r.ParallelAnimationCompression","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"0 or 1","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar. Animation compression is an asset/build-pipeline concern, not a universal packaged-game renderer toggle.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and this one is wrong twice over. The audit: *&quot;No stock CVar. Animation compression is an asset/build-pipeline concern, not a universal packaged-game renderer toggle.&quot;*<\/p><p>Animation compression happens when the asset is cooked, on a build machine, before the game ships. There is nothing left to compress at runtime, so even a real command of this name would have had nothing to do.<\/p>","filled":true},{"name":"r.ParallelAnimationCompressionAsync","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"0 or 1","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar; invented async variant.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>The <code>Async<\/code> twin of the compression entry. Same objection, plus the twin objection: nothing to be asynchronous about in work that finished on a build machine months earlier.<\/p>","filled":true},{"name":"r.ParallelAnimationRetargeting","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"0 or 1","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar. Retargeting is asset/animation-system behavior, not exposed under this universal switch.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The audit: *&quot;No stock CVar. Retargeting is asset/animation-system behavior, not exposed under this universal switch.&quot;*<\/p><p>Retargeting maps an animation authored for one skeleton onto another. It is configured per asset, in the retarget settings, and there is no global switch for whether it happens in parallel.<\/p>","filled":true},{"name":"r.ParallelAnimationRetargetingAsync","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"0 or 1","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar; invented async variant.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>The <code>Async<\/code> twin. Third of the four pairs.<\/p>","filled":true},{"name":"r.ParallelAnimationStreaming","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"0 or 1","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar. Real animation-streaming controls use the a.* namespace and require authored/cooked streamable assets.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and the audit&#x27;s note is the most useful in the family: *&quot;No stock CVar. Real animation-streaming controls use the a.* namespace and require authored/cooked streamable assets.&quot;*<\/p><p>Two conditions, not one. The name would have to be right *and* the game would have to ship animations marked streamable. Most do not.<\/p>","filled":true},{"name":"r.ParallelAnimationStreamingAsync","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"0 or 1","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar; invented async variant.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>The last <code>Async<\/code> twin, and the last of the nine invented names.<\/p><p>Four pairs and one single. Written out in a list, the family reads as a plan for an animation system rather than a description of one.<\/p>","filled":true},{"name":"a.ParallelBlendSpaceEvaluation","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"0 or 1","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar with this exact name. Blend-space work uses the normal animation evaluation path.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and it is the more interesting kind of invented name because the namespace is right. The audit: *&quot;No current stock CVar with this exact name. Blend-space work uses the normal animation evaluation path.&quot;*<\/p><p>A blend space is a way of mixing animations by a parameter -- speed and direction, usually. It is not a separate system with its own threading. It is one node inside the animation graph, and <code>a.ParallelAnimEvaluation<\/code>, live at the top of this paper, already decides which thread that graph runs on.<\/p><p>The name was written by someone who knew the <code>a.<\/code> namespace and assumed the system was more divided than it is.<\/p>","filled":true},{"name":"a.ParallelTransitionEvaluation","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"0 or 1","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar with this exact name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and the pair to the blend-space entry above: right namespace, wrong assumption.<\/p><p>A transition is a state machine edge inside the animation graph, evaluated as part of the graph. There is no separate transition pass to parallelise.<\/p>","filled":true},{"name":"bAllowMultiThreadedAnimationUpdate","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"true, as an engine config property.","valueRange":"0 or 1","appliesWhen":"Never, as written here.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Real UEngine config property, but not a CVar; belongs to engine object config and should remain project-controlled.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where this is a UEngine config property and not a console variable","notesHtml":"<p>Switched off, and this one is <strong>real but in the wrong place<\/strong> -- a different failure from everything above it.<\/p><p>The audit: *&quot;Real UEngine config property, but not a CVar; belongs to engine object config and should remain project-controlled.&quot;*<\/p><p>It exists. It lives in the <code>[/Script/Engine.Engine]<\/code> section as a property of the engine object, and it is the project-level permission that <code>a.ParallelAnimUpdate<\/code> asks about. Written into <code>[ConsoleVariables]<\/code> it is not a console variable, so the engine finds no match and moves on.<\/p><p>The same shape as the fifty-six log lines in the crash-diagnostics paper: a real mechanism, real syntax, wrong section.<\/p><p>And the audit&#x27;s last three words are the reason not to move it to the right section either. <code>should remain project-controlled<\/code> -- this is the developer&#x27;s statement about whether their own animation code is thread-safe, and it is not ours to answer.<\/p>","filled":true},{"name":"bOptimizeAnimBlueprintMemberVariableAccess","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"true, as an animation compiler setting.","valueRange":"0 or 1","appliesWhen":"Never, as written here.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Project/animation compiler property, not a CVar. Invalid here and should remain developer-controlled.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where this is an animation blueprint compiler setting and not a console variable","notesHtml":"<p>Switched off. The audit: *&quot;Project/animation compiler property, not a CVar. Invalid here and should remain developer-controlled.&quot;*<\/p><p>A compiler setting, which means it acted when the Animation Blueprint was built, long before the game shipped. Nothing set at runtime can change a decision the compiler already made.<\/p><p>It pairs with <code>bAllowMultiThreadedAnimationUpdate<\/code> above: two real project settings, copied into a runtime configuration file where neither could apply.<\/p>","filled":true},{"name":"LevelSequence.InvalidBindingTagWarnings","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"When a Level Sequence refers to an object it cannot find.","visualsHtml":"None directly. The broken binding itself is visible -- a cinematic that does not animate what it should.","performanceHtml":"None.","definitionHtml":"Valid, current default true, but only hides useful invalid-binding warnings.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the default is enabled","notesHtml":"<p>Switched off, and it belongs to this category because Level Sequences are how UE5 plays authored, recorded animation -- cutscenes and scripted moments.<\/p><p>The audit: *&quot;Valid, current default true, but only hides useful invalid-binding warnings.&quot;*<\/p><p><strong>Only hides.<\/strong> An invalid binding means a sequence is pointing at an object that is not there, and the result the player sees is a cutscene where something does not move. The warning is the one signal that says why.<\/p><p>It is the fifty-ninth entry in this review whose whole purpose was to stop the engine reporting a problem, after the fifty-six log lines and the two crash-plugin names in the crash-diagnostics paper. Unlike those, this one is a real console variable in a section that would have applied it.<\/p><p><strong>So it worked, and what it did was hide a fault.<\/strong><\/p>","filled":true}]},{"id":"audio","title":"Audio","introHtml":"<p>Audio is the only subsystem in this review with a <strong>hard deadline<\/strong>, and that one fact explains every decision in the category.<\/p><p>A late frame is a stutter. It is unpleasant, and then it is over. A late audio buffer is a click, and the buffer that was missed is gone -- the speaker has already moved, and there is no catching up. Graphics can be late. Audio cannot.<\/p><p><strong>Three of the four live commands deviate from Epic&#x27;s default, which is the highest rate of any category in the review.<\/strong> That is stated plainly rather than hidden, because the reason is the same for all three.<\/p><p>Epic&#x27;s audio defaults have to be safe on a handheld, on a console with a fixed core budget, and on a two-core laptop. This application ships for Windows desktop. All three deviations spend spare CPU to protect a deadline that cannot be missed: <code>au.DisableParallelSourceProcessing=0<\/code> spreads per-sound work across cores, <code>AudioThread.AboveNormalPriority=1<\/code> gives the audio thread a better claim on them, and <code>AudioThread.BatchAsyncBatchSize=256<\/code> halves the number of hand-offs between the game thread and the audio thread.<\/p><p>The first of those is worth reading twice: it *disables* parallel processing, so <code>0<\/code> switches the feature <strong>on<\/strong>. A zero that enables something is a trap in a generated file, and it is the reason that entry is written out at length.<\/p><p><code>AudioThread.AboveNormalPriority<\/code> is the one setting here a user can change, and it carries the plainest question on the setup tab: *&quot;Turn this on if you hear the sound crackle, pop or drop out.&quot;* On by default, because crackling is a fault people actually report.<\/p><p><strong>The inert list held four names, and two of them break a feature rather than slow one down.<\/strong><\/p><p><code>au.BakedAnalysisEnabled=0<\/code> is real, its default is 1, and baked analysis is what drives lights, particles and animation from a soundtrack. Switching it off does not make that cheaper. It makes it stop -- which makes this the only correctness-for-speed trade in the review whose failure the player would see rather than feel.<\/p><p><code>au.voip.AlwaysPlayVoiceComponent=0<\/code> is real, its default is 1, and it puts a teammate&#x27;s voice back into competition with footsteps for a source slot. The audit&#x27;s phrase is *&quot;can damage voice chat&quot;*.<\/p><p>The remaining two are the ordinary kinds of wrong. <code>au.streamcache.StreamCacheSize<\/code> is an obsolete spelling of <code>au.streamcaching.StreamCacheSizeOverrideMB<\/code> -- and unlike the misspelt command rescued in the garbage-collection paper, this one was <strong>not<\/strong> corrected, because the right cache size depends on how much streamed audio a particular title ships and this file is written for forty-nine of them. A wrong name is fixable; a number that has to differ per title is not.<\/p><p><code>PlatformFormat=OGG<\/code> is the clearest category error in the review. Audio is compressed into its final format when the game is built. Nothing written into a player&#x27;s configuration file can transcode it afterwards.<\/p>","commands":[{"name":"au.DisableParallelSourceProcessing","status":"active","ourValue":"0","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Every audio callback in which more than a handful of sounds are playing.","visualsHtml":"None. Audio settings do not touch the picture.","performanceHtml":"A busy scene plays dozens of sources at once, each needing its own filtering, attenuation and spatialisation. In parallel that work spreads across cores; serially it all lands on the audio thread, which has a hard deadline it cannot miss.","definitionHtml":"Disables the parallel audio source processing path. 0 leaves it enabled.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>Read the name slowly, because it is backwards.<\/strong> It *disables* parallel processing, so <code>0<\/code> means parallel source processing stays <strong>on<\/strong>. We switch a feature on by writing a zero.<\/p><p>The engine default is <code>1<\/code> -- disabled. The audit: *&quot;Valid, current default 1. Value 0 enables async source processing; benefit depends on source count, CPU scheduling, backend, and platform.&quot;*<\/p><p>Four conditions, and on a modern Windows desktop all four point the same way: plenty of sources in a busy scene, plenty of cores to spread them over, one backend, one platform. The audit had to grade a setting that might be applied anywhere. This application ships for one place.<\/p><p>It pairs with <code>AudioThread.AboveNormalPriority<\/code> below. One gives the audio work more cores; the other gives it a better claim on them.<\/p><p>Reviewed and kept at 0 by the maintainer.<\/p>","filled":true},{"name":"AudioThread.AboveNormalPriority","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Always, though it only matters when the CPU is busy enough for scheduling to be contended.","visualsHtml":"None.","performanceHtml":"A gain for audio and a possible loss elsewhere. Raising the audio thread means the scheduler prefers it, and on a CPU already short of time that is taken from the game thread.","definitionHtml":"Runs the audio thread at above-normal operating system scheduling priority.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The one setting in this category the user can change<\/strong>, and it carries the plainest question on the setup tab: *&quot;Turn this on if you hear the sound crackle, pop or drop out.&quot;*<\/p><p>The reason it deserves a default of on is an asymmetry between audio and graphics. A late frame is a stutter, and then it is over. A late audio buffer is a click, and the buffer that was missed is simply gone -- there is no catching up, because the speaker has already moved.<\/p><p>So audio has a hard deadline that graphics does not, and a thread with a hard deadline is the right one to prioritise.<\/p><p>The audit&#x27;s objection is exactly right and is why the checkbox exists: *&quot;steals CPU scheduling priority from other work. Hardware/title-specific.&quot;* On a machine with cores to spare that costs nothing measurable. On a machine already short of CPU it takes time from the game thread, and the user who notices that can switch it off.<\/p><p>Default on, because crackling is a fault people actually report and a one-percent frame cost is not.<\/p><p>Reviewed and kept by the maintainer.<\/p>","filled":true},{"name":"AudioThread.BatchAsyncBatchSize","status":"active","ourValue":"256","engineDefault":"128","valueRange":"a count of queued commands; any positive number","appliesWhen":"Whenever the game thread queues audio commands, which is constantly.","visualsHtml":"None.","performanceHtml":"Each hand-off between the game thread and the audio thread needs a lock, and a contended lock on the audio thread is the one thing that must not happen. Doubling the batch halves the number of hand-offs.","definitionHtml":"The number of queued audio commands handed to the audio thread in one batch.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Double Epic&#x27;s number, and the cost is latency rather than correctness.<\/p><p>A command sits in the queue slightly longer before the audio thread sees it. At this size the delay is a fraction of one audio callback, while the sounds themselves are triggered by gameplay events measured in whole frames. It is far below anything a player can hear.<\/p><p>The audit: *&quot;Larger batches trade command throughput against latency; no universal optimum.&quot;* True, and the same reasoning as <code>D3D12.MaxCommandsPerCommandList<\/code> in the threading paper: a modern machine carries the larger batch, and this project assumes a modern machine. It is the fourth setting in the review resting on that assumption.<\/p><p>Reviewed and kept at 256 by the maintainer.<\/p>","filled":true},{"name":"AudioThread.EnableBatchProcessing","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"Batching is what makes the queue between the two threads cheap. Without it every audio command is its own hand-off.","definitionHtml":"Enables batched processing of audio commands between the game thread and the audio thread.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The only pinned default in the category, and the one that makes the previous entry mean anything: <code>AudioThread.BatchAsyncBatchSize<\/code> sets how large a batch is, and this decides whether there are batches at all.<\/p><p>The audit: *&quot;Valid and exactly current default 1. Omit.&quot;* Written instead, as everywhere in this project.<\/p><p><strong>Three of the four live commands here deviate from Epic&#x27;s default, which is the highest rate of any category in the review.<\/strong> That is worth stating rather than hiding. Audio is the one subsystem where the engine&#x27;s defaults are conservative for a reason that does not apply here: they have to be safe on a handheld, on a console with a fixed core budget, and on a laptop with two cores. This application ships for Windows desktop, and all three deviations are the same trade -- spend spare CPU to protect a deadline that cannot be missed.<\/p>","filled":true},{"name":"au.BakedAnalysisEnabled","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only in titles that ship baked audio analysis data.","visualsHtml":"This is the entry with a real visual consequence, which is unusual for audio. Baked analysis is what drives lights, particles and animation from a soundtrack, so switching it off stops those things moving.","performanceHtml":"A small saving in a title that uses the feature, and nothing at all in one that does not.","definitionHtml":"Valid, current default 1. Can break title features using baked audio analysis.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the default is 1","notesHtml":"<p>Switched off, and it is <strong>a real command pushed off its default in a way that can break a game feature.<\/strong> The audit: *&quot;Valid, current default 1. Can break title features using baked audio analysis.&quot;*<\/p><p>Baked audio analysis is amplitude and frequency data computed when a sound is cooked, so the game can read it cheaply at runtime. What it is used for is driving something visible from the music -- a light that pulses on the beat, a particle burst on a transient, a creature that moves to a rhythm.<\/p><p>Turning it off does not make that run slower. It makes it stop.<\/p><p>It is the third setting in this review that trades correctness for a saving without saying so, after <code>p.RemoveFarBodiesFromBVH<\/code> in the physics paper and <code>a.ForceParallelAnimUpdate<\/code> in the animation one -- and the only one of the three whose failure the player would see rather than feel.<\/p>","filled":true},{"name":"au.voip.AlwaysPlayVoiceComponent","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only in titles with voice chat.","visualsHtml":"None.","performanceHtml":"A saving so small it is hard to name, against a feature that stops working.","definitionHtml":"Valid, default 1. Allows VOIP to be deprioritized/killed and can damage voice chat rather than provide useful general tuning.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the default is 1","notesHtml":"<p>Switched off. The audit: *&quot;Valid, default 1. Allows VOIP to be deprioritized/killed and can damage voice chat rather than provide useful general tuning.&quot;*<\/p><p>Voice components normally play regardless of the usual source-count limits, because a teammate&#x27;s voice is not competing with a footstep for importance. <code>0<\/code> puts voice back into that competition, where a busy scene can push it out.<\/p><p>The result is a player who cannot hear their team in exactly the moment when the scene is busy enough to need them -- which is the second entry in this category whose cost is a broken feature rather than a slower one.<\/p>","filled":true},{"name":"au.streamcache.StreamCacheSize","status":"not used","ourValue":"not written since 2026-08-31; was 131072","engineDefault":"none. The name is obsolete.","valueRange":"not applicable.","appliesWhen":"Never on a current build.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Obsolete/wrong current name. Modern UE exposes au.streamcaching.StreamCacheSizeOverrideMB, and cache size is project/content- specific rather than a universal raw number.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the current name is au.streamcaching.StreamCacheSizeOverrideMB","notesHtml":"<p>Switched off, and the audit&#x27;s note carries two separate objections: *&quot;Obsolete/wrong current name. Modern UE exposes au.streamcaching.StreamCacheSizeOverrideMB, and cache size is project/content-specific rather than a universal raw number.&quot;*<\/p><p>The first objection is a spelling: <code>streamcache<\/code> against <code>streamcaching<\/code>, and the modern name ends in <code>MB<\/code> because it takes megabytes rather than the raw <code>131072<\/code> written here.<\/p><p><strong>The second objection is the one that matters, and it is why this was not simply corrected.<\/strong> In the garbage-collection paper a misspelt name was fixed and promoted, because behind the typo was a setting that suited every title. Here the right answer depends on how much streamed audio a particular game ships, and this file is written for forty-nine of them.<\/p><p>A wrong name is fixable. A number that has to be different per title is not.<\/p>","filled":true},{"name":"PlatformFormat","status":"not used","ourValue":"not written since 2026-08-31; was OGG","engineDefault":"none. This is a cooking setting, not a runtime one.","valueRange":"not applicable.","appliesWhen":"Never at runtime.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Audio format is a project/platform cooking decision. A player Engine.ini cannot transcode already cooked audio.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where audio format is chosen during cooking","notesHtml":"<p>Switched off, and it is the clearest category error in the whole review. The audit: *&quot;Audio format is a project/platform cooking decision. A player Engine.ini cannot transcode already cooked audio.&quot;*<\/p><p>The value was <code>OGG<\/code>. Audio is compressed into its final format when the game is built, months before anyone installs it. Asking for a different format at startup would require the engine to decompress and re-encode every sound on the user&#x27;s machine, which is not a thing it will do, offer, or attempt.<\/p><p>It belongs with <code>r.ParallelAnimationCompression<\/code> in the animation paper: both are build-pipeline settings written into a runtime file, and both were asking for work that had already finished.<\/p>","filled":true}]},{"id":"hdr-display","title":"HDR","introHtml":"<p>One command, and it is the only one in the review that is switched on by two separate gates before it is written at all.<\/p><p>HDR output is not a quality setting. It is a statement about the hardware on the other end of the cable, and a wrong statement produces a washed-out or blown-out picture rather than a slower one. Getting it wrong is not a performance mistake, it is a broken screen.<\/p><p>So the category has a <strong>condition<\/strong> -- it is only offered when the display can take it -- and the command itself is bound to a <strong>checkbox<\/strong>, so the user says yes explicitly. Neither the preset nor the audit decides it.<\/p><p>That is exactly what the audit asked for, in the one phrase it uses about this command: *&quot;expose it only as an explicit display choice.&quot;*<\/p><p>There are no inert entries in this category.<\/p>","commands":[{"name":"r.HDR.EnableHDROutput","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Only on a display, operating system and RHI that all support HDR output, and only when the user has ticked the box.","visualsHtml":"The largest visual change any single command in this review can make, and the only one that can make the picture wrong rather than cheaper. On correct hardware it widens the range between the darkest and brightest parts of the image and the range of colours available. On incorrect hardware it produces a washed-out or blown-out picture.","performanceHtml":"Small and not the point. HDR output changes the format of the final image rather than the work done to produce it.","definitionHtml":"Enables high dynamic range output on the swap chain, which requires a compatible display, operating system, RHI, output device and gamut handling.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai+memory","verifiedAgainst":"UE 5.4 documentation, where the default is 0","notesHtml":"<p><strong>The only command in the review guarded twice<\/strong>, and the audit&#x27;s wording is the reason: *&quot;Valid stock HDR-output switch, default 0. It requires compatible display, OS, RHI, output-device and gamut handling, so expose it only as an explicit display choice.&quot;*<\/p><p>Five things have to be true at once, and a configuration file can check none of them. So the file does not try.<\/p><p>The first guard is the category condition. The whole category is offered only when the display reports itself as HDR-capable, so a user on an ordinary monitor never sees the question.<\/p><p>The second guard is the checkbox. Even on capable hardware nothing is written until the user says yes.<\/p><p><strong>This is what &quot;expose it only as an explicit display choice&quot; looks like when it is implemented rather than agreed with.<\/strong> Deviating from a default of 0 would normally need a reason; here the reason is that the user supplied it, one screen at a time.<\/p>","filled":true}]},{"id":"power","title":"Power & Battery","introHtml":"<p>One command, and like HDR it is guarded twice: a category condition that only fires on a laptop, and a checkbox the user has to tick.<\/p><p>The difference is what is being traded. HDR is a question about hardware, where one answer is simply wrong. This is a question about what the person wants, where both answers are right and only they can say which.<\/p><p>A laptop on battery is a machine with four resources in tension -- frame rate, battery life, heat and fan noise -- and spending one buys another. The engine&#x27;s default answer is to be polite: limit the frame rate and leave the battery alone. That is a reasonable default for a machine you might be using on a train.<\/p><p>It is the wrong default for somebody who plugged headphones in and intends to play. So the file offers the other answer and lets them pick.<\/p><p>The audit&#x27;s last three words are the whole design: *&quot;Never force universally.&quot;*<\/p><p>There are no inert entries in this category.<\/p>","commands":[{"name":"r.DontLimitOnBattery","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Only on a laptop running on battery, and only when the user has ticked the box.","visualsHtml":"None directly. Indirectly the whole picture moves, because the frame rate is no longer being held down.","performanceHtml":"The largest single frame-rate change available to a laptop user, and the one with the largest cost outside the frame. Removing the limit spends battery, produces heat, and makes the fans work.","definitionHtml":"Stops the engine applying its reduced performance limits while the device is running on battery power.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai+memory","verifiedAgainst":"UE 5.4 documentation, where the default is 0","notesHtml":"<p>The audit: *&quot;Valid, default 0. Explicit user preference: more performance on battery versus battery life, heat, and noise. Never force universally.&quot;*<\/p><p><strong>Explicit user preference<\/strong> is a category of setting this review has met only three times -- here, <code>r.HDR.EnableHDROutput<\/code> in the HDR paper, and <code>bAgreeToCrashUpload<\/code> in the crash-diagnostics one. All three share a shape: there is no better answer, only a person&#x27;s answer.<\/p><p>The engine&#x27;s default of 0 means it does limit itself on battery. That is the right choice for a machine that might be doing anything, and the wrong one for a person who sat down to play. Neither of those is a mistake.<\/p><p><strong>Never force universally<\/strong> is honoured in the implementation rather than in a comment. The category condition means the question is only asked on a laptop. The checkbox means nothing is written until the answer is yes. On a desktop the command never appears in the file at all.<\/p>","filled":true}]},{"id":"crash-diagnostics","title":"Crash Reporting & Diagnostics","introHtml":"<p>Two very different things share this category, and they were decided in opposite directions.<\/p><p><strong>The original eight live commands are the best argument in this project for writing defaults.<\/strong> Every one of them is already at Epic&#x27;s value, and every one of them costs frames if something switches it on. They are the settings a developer turns on to chase a crash and is supposed to turn off again afterwards -- GPU crash dumps, NVIDIA Aftermath markers, D3D12 breadcrumb tracking, debug view modes. Forgetting the second half of that is an ordinary mistake, and it ships.<\/p><p><code>r.RHICmdBypass<\/code> is the sharpest example. At <code>1<\/code> the multi-threaded renderer stops being multi-threaded: RHI commands run inline on the thread that issued them instead of being recorded and replayed. It exists so an engine programmer can remove a layer and see the driver plainly. It is not something a player should ever meet.<\/p><p>Our file is appended after the game&#x27;s own, so the last word on each of these is ours. <strong>All eight stay pinned at 0.<\/strong> <code>bAgreeToCrashUpload<\/code> stays at <code>0<\/code> too -- already the Windows default, kept as a deliberate privacy choice rather than a performance one, exactly as the audit asked.<\/p><p><strong>Four more were promoted into the category from the inert list<\/strong>, and one of them is the most dangerous thing found in the whole review.<\/p><p><code>r.D3D12.GPUTimeout<\/code> was set to <code>0<\/code>, and it was working. Windows watches the GPU; when a piece of work does not finish within about two seconds it concludes the device has hung, resets the driver and carries on. That mechanism is why a bad shader costs a black flash rather than a reboot. <code>0<\/code> removes it, and a hang then has nothing to recover it -- the failure stops being the game closing and becomes the machine stopping. **It is now written at <code>1<\/code>**, rather than merely dropped, because dropping it would leave the answer to whatever the title shipped.<\/p><p>The other three -- <code>r.D3D12.LightweightDRED<\/code>, <code>r.GPUCrash.Collectionenable<\/code> and <code>r.GPUCrash.DataDepth<\/code> -- are the same family as the eight above and are kept at their existing values, which switch crash collection off. That deviates from Epic&#x27;s defaults, and the audit says so on each of them. It is kept anyway on grounds of consistency: this category already switches off every heavier form of the same thing, for the same reason, and a player is not diagnosing anything. The audit&#x27;s objection is recorded in each entry rather than argued away.<\/p><p><strong>The fifty-eight inert entries went the other way, and the finding there is not that they were unwise. It is that they were never read.<\/strong><\/p><p>Unreal sets log verbosity in the <code>[Core.Log]<\/code> section of an ini file, using exactly the syntax these lines use -- <code>LogRenderer=all off<\/code>. It is a real mechanism and that is the real spelling of it.<\/p><p>The generated file has no <code>[Core.Log]<\/code> section. All fifty-six log lines were written into <code>[ConsoleVariables]<\/code>, which the engine walks looking for console variables. Log categories are not console variables. The engine finds no match and moves on.<\/p><p>So the whole block was a recipe copied out of the right section into the wrong one, and it has been doing nothing ever since.<\/p><p><strong>They are removed for two reasons, and either alone would have been enough.<\/strong><\/p><p>The first is that they did not work. Fifty-six lines of a generated file with no effect are fifty-six lines a reader has to discount.<\/p><p>The second is that they should not work. The audit&#x27;s verdict on the master switch is the harshest sentence it wrote about anything: *&quot;Valid global log suppression, but it hides errors and crash context for negligible normal-game benefit. Never force in a general supportable release.&quot;* Every entry after it carries the phrase *&quot;redundant after Global=all off&quot;*, and roughly half then add *&quot;hides&quot;* or *&quot;removes&quot;* and name what would have been lost.<\/p><p><strong>The gain was never there.<\/strong> A shipped UE5 build already compiles most logging out, and what survives costs a string format on an event that has already happened. There is no frame time in it.<\/p><p>Four are worth naming, because they touch this project directly. <code>LogConfig<\/code> reports a configuration file the engine could not parse, and a configuration file is the only thing this application produces. <code>LogRenderer<\/code> reports a rejected renderer setting, and this project sets well over a hundred of them. <code>LogPluginManager<\/code> reports a plugin that failed to load, which is how DLSS and FSR arrive. <code>LogWorldPartition<\/code> reports a streaming failure, and the level-streaming paper changed nine streaming values on measured evidence.<\/p><p>Silencing those four means changing a great deal and then switching off the only channel that reports the result.<\/p><p>The remaining two inert names, <code>LogCrashReportHydra<\/code> and <code>LogCrashUploader<\/code>, belong to a third-party crash-handling plugin rather than to UE5, and are gone for the ordinary reason.<\/p><p><strong>The pattern across the category is worth stating once.<\/strong> The live commands are kept because stating a default costs nothing and protects against a title that shipped a debugging switch by accident. The inert ones are dropped because stating something the engine never reads protects against nothing at all. Both decisions follow from the same rule.<\/p>","commands":[{"name":"bAgreeToCrashUpload","status":"active","ourValue":"0","engineDefault":"0 on Windows and macOS, 1 on Linux","valueRange":"true or false, written here as 0 or 1","appliesWhen":"When the game crashes and the Crash Report Client opens.","visualsHtml":"None.","performanceHtml":"None. It decides what happens after a crash, not what happens during play.","definitionHtml":"Consent for the Crash Report Client to send a crash report to the title owner without asking.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The only entry in this category that is not a performance setting, and the only one where the audit asked for restraint rather than a value: *&quot;Retain only as an explicit user privacy choice, not a performance preset.&quot;*<\/p><p>It is kept, and kept at <code>0<\/code>.<\/p><p>On Windows -- the only platform this application runs on -- <code>false<\/code> is already the engine&#x27;s default, so writing <code>0<\/code> changes nothing about what the user&#x27;s machine would have done. It states the default rather than altering it, which is what this project does everywhere.<\/p><p><strong>What it does change is that the choice is now fixed rather than left open.<\/strong> That was considered and deliberately left as it is. Automatic upload without asking is not a thing to switch on for somebody else, and a user who wants to send a report can still do so from the dialog the client shows.<\/p><p>Reviewed and left alone by the maintainer.<\/p>","filled":true},{"name":"r.D3D12.DRED","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"D3D12 only, which is every machine this application targets.","visualsHtml":"None.","performanceHtml":"Costs performance when on. DRED makes the driver keep an ordered record of GPU work so that a hung device can be traced afterwards, and that record has to be written during every frame, not only during the bad one.","definitionHtml":"Device Removed Extended Data: Direct3D 12 breadcrumb tracking that survives a GPU hang and names the last work the device was doing.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>First of seven pinned zeros, and the reason to pin them is the same for all seven: <strong>each one is free to leave off and expensive to leave on, and a game that shipped it on shipped a mistake.<\/strong><\/p><p>That is not a hypothetical. DRED is switched on during development to chase a device-removed crash, and it is switched off again when the crash is fixed. Forgetting the second half of that is an ordinary mistake, and it ships.<\/p><p>The audit&#x27;s note is one line -- *&quot;Valid D3D12 crash-debug option and exactly default 0. Omit.&quot;* -- and this project does not omit. Writing <code>0<\/code> after the game&#x27;s own file takes the mistake back.<\/p>","filled":true},{"name":"r.ForceDebugViewModes","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 means no override; the non-zero values force debug view modes on or off","appliesWhen":"Always, though in a shipped build there is normally nothing to force.","visualsHtml":"A forced debug view mode repla
