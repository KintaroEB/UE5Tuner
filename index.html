<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UE5 Tuner — Technical Analysis</title>
<meta name="description" content="The engineering record behind every console variable UE5 Tuner writes into Engine.ini: what it does, what the engine's own default is, and why ours differs.">
<style>/* Palette and shapes lean on Epic's own developer pages: a near-black ground
   rather than a blue-grey one, one saturated Unreal blue as the single accent,
   square corners, and uppercase letter-spaced micro-labels. The layout
   underneath is unchanged -- the card header is still a fixed grid, and the
   reading width is still held separately from the page width. */
:root {
  --bg: #08090c;
  --panel: #101216;
  --panel-2: #161a20;
  --line: #23272f;
  --line-soft: #191d23;
  --text: #e6e9ee;
  --dim: #98a2ae;
  --faint: #69727e;
  --accent: #0aa3ff;
  --accent-dim: #6cc4ff;
  --accent-soft: #0c2a41;
  --good: #3fd39b;
  --warn: #f0a94c;
  --bad: #ff6b6b;
  --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
  --sans: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, system-ui, sans-serif;
  --r: 4px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 15px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-dim); text-decoration: underline; }
code {
  font-family: var(--mono); font-size: 0.88em;
  background: #0d1319; border: 1px solid #1d2731;
  border-radius: 3px; padding: 1px 5px; color: #9fd4ff;
}
strong { color: #f4f7fa; font-weight: 600; }

/* ------------------------------------------------------------- layout */
.shell { display: flex; min-height: 100vh; }

nav {
  width: 300px; flex: 0 0 300px; background: var(--panel);
  border-right: 1px solid var(--line); padding: 0 0 60px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
nav .brand {
  padding: 24px 22px 18px; border-bottom: 1px solid var(--line);
  border-top: 2px solid var(--accent);
}
nav .brand h1 {
  font-size: 12px; margin: 0 0 6px; letter-spacing: 1.4px;
  text-transform: uppercase; color: var(--text); font-weight: 700;
}
nav .brand p { margin: 0; font-size: 11.5px; color: var(--faint); line-height: 1.5; }

.filter { padding: 16px 18px 12px; }
.filter input {
  width: 100%; background: #0b0d11; border: 1px solid var(--line);
  color: var(--text); border-radius: 3px; padding: 8px 10px;
  font-family: inherit; font-size: 13px;
}
.filter input::placeholder { color: var(--faint); }
.filter input:focus { outline: none; border-color: var(--accent); background: #0d1319; }

nav ol { list-style: none; margin: 0; padding: 0 12px; }
nav ol li a {
  display: flex; align-items: baseline; gap: 10px;
  padding: 7px 12px; color: var(--dim);
  font-size: 13px; line-height: 1.35;
  border-left: 2px solid transparent;
}
nav ol li a:hover { background: var(--panel-2); color: var(--text); text-decoration: none; }
nav ol li a.on {
  background: var(--accent-soft); color: #eaf6ff; border-left-color: var(--accent);
}
nav ol li a .num { font-family: var(--mono); font-size: 11px; color: var(--faint); }
nav ol li a.on .num { color: var(--accent-dim); }
nav ol li a .count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--faint); }
nav ol li a.empty { color: var(--faint); }
nav ol li a.empty .count { color: #3c434c; }

/* Wide because of the card header, not because of the prose. The header is a
   fixed grid -- name, badges, values -- and the values column is whatever is
   left over, so the page has to be wide enough that "left over" is usable.
   Reading width is held separately by the max-width on .prose and .kv dd. */
main { flex: 1 1 auto; min-width: 0; padding: 46px 56px 120px; max-width: 1460px; }

/* --------------------------------------------------------- typography */
h2.cat { font-size: 27px; margin: 6px 0 4px; letter-spacing: -.4px; font-weight: 700; }
.cat-id {
  font-family: var(--mono); font-size: 11px; color: var(--accent);
  text-transform: uppercase; letter-spacing: 1.2px;
}
.intro { color: var(--dim); margin: 18px 0 34px; max-width: 74ch; }
.intro p { margin: 0 0 13px; }
.intro ul { margin: 0 0 13px; padding-left: 20px; }
.intro strong { color: var(--text); }

.rule { border: 0; border-top: 1px solid var(--line-soft); margin: 30px 0; }

/* -------------------------------------------------------------- cards */
details.cmd {
  background: var(--panel); border: 1px solid var(--line-soft);
  border-radius: var(--r); margin: 0 0 7px; overflow: hidden;
  border-left: 2px solid transparent;
}
details.cmd:hover { border-color: var(--line); }
details.cmd[open] { border-color: var(--line); border-left-color: var(--accent); }

/* A grid, not a flex row. The command name varies from 12 to 70 characters, so
   anything that flows would put the badges in a different place on every line.
   Fixed columns mean the status, the "differs" tag and the values each start at
   the same x on every card, whatever the name does. */
details.cmd > summary {
  list-style: none; cursor: pointer; padding: 13px 16px;
  display: grid; align-items: center; column-gap: 14px;
  grid-template-columns: 12px minmax(0, 38rem) 152px minmax(240px, 1fr);
}
details.cmd > summary::-webkit-details-marker { display: none; }
details.cmd > summary:hover { background: var(--panel-2); }
.chev { color: var(--faint); font-size: 10px; width: 10px; flex: 0 0 10px; transition: transform .12s; }
details.cmd[open] .chev { transform: rotate(90deg); color: var(--accent); }

/* Every cell on the header line is one line, cut with an ellipsis. A wrapped
   cell makes the row taller and puts the next card's badges somewhere else,
   which is the thing the fixed grid exists to prevent. The full text is on the
   title attribute, and on the fields inside the card. */
.cname {
  font-family: var(--mono); font-size: 13.5px; color: #9fd4ff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.tags { display: flex; align-items: center; gap: 6px; }
.vals { display: flex; align-items: center; justify-content: flex-end;
        gap: 8px; font-family: var(--mono); font-size: 12px; min-width: 0; }
.vals .ours, .vals .def {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.vals .ours { color: var(--text); }
.vals .arrow { color: var(--faint); flex: 0 0 auto; }
.vals .def { color: var(--faint); }

.badge {
  font-size: 10px; font-family: var(--mono); letter-spacing: .8px;
  text-transform: uppercase; padding: 3px 8px; border-radius: 2px;
  border: 1px solid transparent; white-space: nowrap; font-weight: 600;
}
.b-active { color: var(--good); border-color: #1c4638; background: #0d1f19; }
.b-notused { color: var(--faint); border-color: #282e37; background: #14171c; }
.b-dropped { color: var(--bad); border-color: #482225; background: #211114; }
.b-differs { color: var(--warn); border-color: #4a381d; background: #211a0f; }

.body { padding: 4px 16px 20px; border-top: 1px solid var(--line-soft); }

.kv { display: grid; grid-template-columns: 178px 1fr; gap: 0; margin: 16px 0 0; }
.kv dt {
  font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase;
  color: var(--faint); padding: 10px 14px 10px 0; border-top: 1px solid var(--line-soft);
  font-weight: 600;
}
.kv dd {
  margin: 0; padding: 10px 0; border-top: 1px solid var(--line-soft);
  color: var(--dim); max-width: 78ch;
}
.kv dd strong { color: var(--text); }
.kv dd.mono { font-family: var(--mono); font-size: 13px; color: var(--text); }

.notes { margin: 18px 0 0; padding: 15px 18px; background: var(--panel-2);
         border-left: 2px solid var(--accent); border-radius: 0 var(--r) var(--r) 0; }
.notes p { margin: 0 0 11px; color: var(--dim); max-width: 76ch; }
.notes p:last-child { margin-bottom: 0; }
.notes ul { margin: 0 0 11px; padding-left: 20px; color: var(--dim); }
.notes strong { color: var(--text); }

/* The evidence grade is a claim about how a fact was checked, so it is spelled
   out rather than left as the token the source file stores. */
.ev { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  font-size: 11px; letter-spacing: .3px; padding: 4px 10px;
  border-radius: 2px; border: 1px solid transparent; white-space: nowrap;
  text-transform: uppercase; font-weight: 600;
}
.ev-ai { color: var(--accent-dim); border-color: #17405e; background: #0b1b28; }
.ev-mem { color: var(--good); border-color: #1c4638; background: #0d1f19; }
.ev-none { color: var(--faint); border-color: #282e37; background: #14171c; }

.srcs { margin: 14px 0 0; font-size: 12.5px; }
.srcs a { display: block; color: var(--dim); font-family: var(--mono);
          font-size: 11.5px; word-break: break-all; padding: 2px 0; }
.srcs a:hover { color: var(--accent); }

/* --------------------------------------------------------- home page */
.hero { border-bottom: 1px solid var(--line); padding-bottom: 30px; margin-bottom: 30px; }
.hero h2 { font-size: 34px; margin: 8px 0 12px; letter-spacing: -.8px; font-weight: 700; line-height: 1.2; }
.hero .lede { font-size: 17px; color: var(--dim); max-width: 72ch; margin: 0; }

.stats {
  display: flex; gap: 1px; flex-wrap: wrap; margin: 26px 0 0;
  background: var(--line-soft); border: 1px solid var(--line-soft);
  border-radius: var(--r); overflow: hidden;
}
.stat { background: var(--panel); padding: 14px 22px; min-width: 130px; flex: 1 1 auto; }
.stat b { display: block; font-family: var(--mono); font-size: 23px; color: var(--text); line-height: 1.2; }
.stat span { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

.prose { max-width: 74ch; color: var(--dim); }
.prose h3 {
  color: var(--text); font-size: 13px; margin: 40px 0 12px;
  text-transform: uppercase; letter-spacing: 1.3px; font-weight: 700;
  padding-bottom: 8px; border-bottom: 1px solid var(--line-soft);
}
.prose p { margin: 0 0 13px; }
.prose ul { padding-left: 20px; margin: 0 0 13px; }
.prose li { margin: 0 0 7px; }
.prose table { border-collapse: collapse; width: 100%; margin: 0 0 16px; font-size: 13.5px; }
.prose th, .prose td { text-align: left; padding: 9px 14px 9px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.prose th { color: var(--faint); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; }
.prose td:first-child { white-space: nowrap; color: var(--text); font-family: var(--mono); font-size: 12.5px; }

.bar { display: flex; align-items: center; gap: 8px; margin: 0 0 18px; }
.bar button {
  background: transparent; border: 1px solid var(--line); color: var(--dim);
  border-radius: 2px; padding: 6px 14px; font-family: inherit;
  font-size: 10.5px; cursor: pointer; text-transform: uppercase;
  letter-spacing: 1px; font-weight: 600;
}
.bar button:hover { border-color: var(--accent); color: var(--accent-dim); }
.bar .n { font-size: 11px; color: var(--faint); margin-left: auto;
          font-family: var(--mono); text-transform: uppercase; letter-spacing: .6px; }

.hidden { display: none !important; }
.empty-note { color: var(--faint); font-style: italic; padding: 26px 0; }

footer { margin-top: 60px; padding-top: 22px; border-top: 1px solid var(--line-soft);
         color: var(--faint); font-size: 12px; }

@media (max-width: 900px) {
  .shell { flex-direction: column; }
  nav { width: auto; flex: none; height: auto; position: static; border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 28px 20px 80px; }
  details.cmd > summary { display: flex; flex-wrap: wrap; gap: 10px; }
  .vals { margin-left: auto; }
  .kv { grid-template-columns: 1fr; }
  .kv dt { padding-bottom: 0; border-top: 1px solid var(--line-soft); }
  .kv dd { border-top: 0; padding-top: 2px; }
}
</style>
</head>

<script id="data" type="application/json">{"schema":1,"generated":"2026-08-31","counts":{"categories":27,"commands":280,"filled":104,"open":176},"categories":[{"id":"anti-aliasing","title":"Anti-Aliasing & Upscaling","introHtml":"<p>Anti-aliasing decides how jagged edges are smoothed, and in UE5 it is also the stage that upscales the image when the game renders below the output resolution. The two jobs are welded together, which is why one setting in this category changes the meaning of six others.<\/p><p><code>r.AntiAliasingMethod<\/code> is that setting. It selects the algorithm, and each algorithm reads its own family of CVars and ignores the rest:<\/p><ul><li><strong>TAA<\/strong> (<code>2<\/code>) reads every <code>r.TemporalAA*<\/code> line and ignores every <code>r.TSR*<\/code> line.<\/li><li><strong>TSR<\/strong> (<code>4<\/code>) reads every <code>r.TSR*<\/code> line and ignores every <code>r.TemporalAA*<\/code> line.<\/li><\/ul><p>Whichever method is active, roughly half of this category is inert. That is not a bug in the values; it is the shape of the engine. The <code>applies when<\/code> field on each entry below says which half it belongs to.<\/p><p>DLSS and FSR sit on top of both. Their UE plugins register as the engine&#x27;s temporal upscaler and replace the TAA or TSR pass, so they need *a* temporal method active but do not care which. What switches them off is 0, 1 or 3, and this app never writes those.<\/p><p>Since 2026-08-30 the method is a user option (<code>anti-aliasing-method<\/code>) whose default writes no line at all. See that entry below.<\/p><p>The last four entries in this paper are marked <code>not used<\/code>. They are real names that appeared in the audited config and were graded inert, and they are documented here rather than forgotten because all four are anti-aliasing controls. An inert name that turns out to be live in some engine revision would quietly override the choice the user just made in the dropdown, which is a different and worse failure than an inert name for anything else. They were switched off on 2026-08-30 and are written nowhere.<\/p>","commands":[{"name":"r.PostProcessAAQuality","status":"active","ourValue":"4","engineDefault":"4","valueRange":"0 to 6","appliesWhen":"Always. Every anti-aliasing method reads it.","visualsHtml":"0 turns the anti-aliasing pass off and leaves raw stair-step edges. 2 is a cheap pass that still shimmers on thin geometry. 4 is the tier Epic ships at its Epic scalability level and is stable on foliage, wires and fences. 6 adds further samples and mainly helps still frames and captures.","performanceHtml":"Low. The pass is a full-screen filter, so the cost scales with output resolution rather than with scene complexity. The step from 4 to 6 is the only one that is usually measurable, and it is a fraction of a millisecond on a modern GPU.","definitionHtml":"A single quality dial read by whichever anti-aliasing method is active. For FXAA it picks the FXAA quality preset. For TAA and TSR it scales the number of history samples and the quality of the resampling filter. It does not select the method; <code>r.AntiAliasingMethod<\/code> does that.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/scalability-reference-for-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai+memory","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>We write <strong>4<\/strong>, which is also the default. On a stock game the line changes nothing; it only pins the value against a game that ships a lower tier. It is safe under every method because every method understands it.<\/p><p>6 was not taken. Epic reserves it for the Cinematic tier, which is aimed at Movie Render Queue rather than at play.<\/p>","filled":true},{"name":"r.AntiAliasingMethod","status":"active","ourValue":"not written by default; 4 or 2 when the user picks a method","engineDefault":"4","valueRange":"0 = none, 1 = FXAA, 2 = TAA, 3 = MSAA, 4 = TSR","appliesWhen":"Always, in the deferred renderer. 3 (MSAA) needs the forward renderer and is ignored otherwise.","visualsHtml":"The largest single visual change in the whole file. TSR is sharper than TAA at the same render resolution and holds thin detail together better while moving. TAA is softer and smears behind fast motion, but it ghosts less on materials whose motion vectors are wrong. FXAA is a pure edge blur with no temporal history, so it never ghosts and never resolves sub-pixel detail.","performanceHtml":"TSR costs more GPU time than TAA at the same resolution, typically a low single-digit percentage. TSR earns that back because it holds up at lower render percentages, so the honest comparison is not TSR against TAA at the same resolution but TSR at 70 percent against TAA at 100 percent. FXAA is by far the cheapest and by far the worst.","definitionHtml":"Selects the anti-aliasing and temporal upscaling pass for the deferred renderer. The value is read per view, and the choice decides which family of CVars has any effect at all. Third-party upscalers such as DLSS and FSR replace whichever temporal pass is selected, so they work under either 2 or 4 and are switched off only by 0, 1 or 3. The value is a startup default: a game whose own graphics menu sets the method overrides it at runtime, and can then show a menu entry that no longer matches the engine.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference","https://dev.epicgames.com/documentation/en-us/unreal-engine/temporal-super-resolution-in-unreal-engine","https://gpuopen.com/learn/ue-fsr/"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>Decided 2026-08-30.<\/strong> We wrote <strong>2<\/strong> for everybody, forcing legacy TAA over the engine default of TSR. We now write nothing unless the user asks.<\/p><p>An earlier draft of this entry claimed the forced value could disable DLSS and FSR. That was wrong, and it is corrected above: both plugins replace whichever temporal pass is selected, and 2 is a temporal pass. The real harm was different and smaller, but still real. In a game with no anti-aliasing menu we silently downgraded the image from TSR to TAA for every player who does not use an upscaler plugin.<\/p><p>The command became the option <code>anti-aliasing-method<\/code>, with three states:<\/p><ul><li><strong>GAME DLSS/FSR<\/strong> -- the default. Writes no line at all.<\/li><li><strong>Sharper (TSR)<\/strong> -- writes 4.<\/li><li><strong>Smoother (TAA)<\/strong> -- writes 2.<\/li><\/ul><p>The first state needed a new ability in both generators. An option state could previously only replace a value, never suppress the line; a state with no opinion fell through to the catalog value, which was still written. The sentinel <code>&quot;omit&quot;<\/code> in <code>_values.json<\/code> now means &quot;do not write this command at all, in any section&quot;. <code>null<\/code> keeps its old and weaker meaning, &quot;no opinion, let the catalog decide&quot;.<\/p>","filled":true},{"name":"r.TemporalAA.Upsampling","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"TAA path only, and only below 100 percent screen percentage. TSR always upsamples and ignores this line.","visualsHtml":"None at full render resolution. Below full resolution, 1 lets the temporal pass do the upscale, which reconstructs detail across frames. 0 upscales spatially in a separate pass, which is blurrier.","performanceHtml":"None worth measuring. It moves work between two passes rather than adding any.","definitionHtml":"Enables Temporal Anti-Aliasing Upsampling, the mode in which the TAA history resolve also performs the scale from render resolution to display resolution, instead of resolving at render resolution and then stretching the result.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/screen-percentage-with-temporal-upscale-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>We write <strong>1<\/strong>, which is already the engine default. The line therefore changes nothing on a stock game. It is kept as a guard against a game that ships 0.<\/p>","filled":true},{"name":"r.TemporalAACatmullRom","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"TAA path only.","visualsHtml":"1 resamples the history with a sharper filter, which recovers a little crispness but can ring, drawing a faint bright halo on high-contrast edges.","performanceHtml":"None worth measuring.","definitionHtml":"Selects a Catmull-Rom filter instead of a bilinear filter when the previous frame&#x27;s history buffer is reprojected into the current frame.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, not version tagged","notesHtml":"<p>We write <strong>0<\/strong>, the default, so the line does nothing. It is a candidate for removal or for <code>isBeingUsed: false<\/code>.<\/p><p>The default is worth re-checking in a running game. This CVar is not version tagged in Epic&#x27;s reference, and the figure recorded here comes from documentation rather than from a memory read.<\/p>","filled":true},{"name":"r.TemporalAACurrentFrameWeight","status":"active","ourValue":"0.2","engineDefault":"0.04","valueRange":"0.0 to 1.0","appliesWhen":"TAA path only.","visualsHtml":"Raising it makes the image markedly sharper and cuts the smear that trails behind moving objects. The cost is stability: thin geometry, specular highlights and dithered materials begin to crawl and flicker, because each frame contributes more of its own noise.","performanceHtml":"None. The blend is a single multiply-add per pixel at any weight.","definitionHtml":"The weight given to the newly rendered frame when it is blended into the accumulated temporal history. At the default 0.04 each frame contributes 4 percent and the history retains 96 percent, which is what makes TAA both stable and soft. The effective history length is roughly the reciprocal of this value, so 0.04 averages about 25 frames and 0.2 averages about 5.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>We write <strong>0.2<\/strong>, five times the default, shortening the history from about 25 frames to about 5. That is an aggressive sharpening choice and it is the single strongest opinion in this category.<\/p><p>It is defensible as a stated preference: many players find UE5&#x27;s TAA too soft and would rather have shimmer than smear. It is not defensible as a neutral improvement, and it does nothing at all if the method is TSR.<\/p>","filled":true},{"name":"r.TemporalAAFilterSize","status":"active","ourValue":"0.7","engineDefault":"1","valueRange":"about 0.5 to 2.0 in practice","appliesWhen":"TAA path only.","visualsHtml":"Below 1 the image is sharper and thin edges are better defined, at the cost of more visible aliasing and more crawl on fine patterns. Above 1 the image softens and aliasing is suppressed further.","performanceHtml":"None. The filter footprint is fixed in the shader; only the weights change.","definitionHtml":"Scales the width of the spatial reconstruction filter applied to the sample neighbourhood during the temporal resolve. It controls how far a sample bleeds into its neighbours, so it trades edge sharpness against aliasing directly.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>We write <strong>0.7<\/strong>, a 30 percent narrower filter than the default. This pairs with the raised frame weight above: both changes push the same direction, towards a sharper and less stable image.<\/p><p>Because they compound, the two should be judged together rather than one at a time.<\/p>","filled":true},{"name":"r.TemporalAASamples","status":"active","ourValue":"8","engineDefault":"8","valueRange":"2 to 32, in practice 4, 8, 16 or 32","appliesWhen":"TAA path only. TSR generates its own jitter sequence.","visualsHtml":"More samples give a longer, more even jitter pattern, which resolves sub-pixel detail better in still and slow-moving shots. In fast motion the history is rejected anyway, so the difference disappears.","performanceHtml":"None directly. It changes the jitter sequence length, not the amount of work per frame.","definitionHtml":"The number of distinct sub-pixel offsets in the temporal jitter sequence before it repeats. The projection matrix is nudged by one offset per frame so that, over the sequence, the scene is sampled across the whole pixel.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>We write <strong>8<\/strong>, the default, so the line does nothing. Like <code>r.TemporalAACatmullRom<\/code> it is a candidate for removal.<\/p>","filled":true},{"name":"r.TSR.ShadingRejection.Flickering","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"TSR path only.","visualsHtml":"On, TSR detects pixels whose shading flickers between frames and keeps more of their history, which calms moire on fine patterns such as distant fences, roof tiles and hair. The trade is ghosting: an animated material or an object with missing motion vectors is read as flicker and gets smeared instead of corrected.","performanceHtml":"Negligible. It is an extra test inside a pass that already runs.","definitionHtml":"Enables the flicker heuristic inside TSR&#x27;s shading rejection stage. Shading rejection normally throws away history that disagrees with the current frame; this heuristic makes an exception when the disagreement looks like high-frequency flicker rather than real change. Epic drives it through the anti-aliasing scalability tiers.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/temporal-super-resolution-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>We write <strong>1<\/strong>. It was considered for a preset split and rejected: Epic drives it through the scalability tiers but publishes no per-tier value, so a split would mean inventing the second number.<\/p>","filled":true},{"name":"r.TSR.ShadingRejection.Flickering.Period","status":"active","ourValue":"3","engineDefault":"3","valueRange":"1 upwards, in practice 2 to 5","appliesWhen":"TSR path only, and only while `r.TSR.ShadingRejection.Flickering` is 1.","visualsHtml":"A longer period makes TSR more certain before it calls something flicker, which favours stability and increases the chance of ghosting on genuinely changing surfaces. A shorter period reacts faster and ghosts less, but lets more moire through.","performanceHtml":"Negligible.","definitionHtml":"The number of frames over which the flicker heuristic measures a pixel before deciding its shading is unstable. It is the time constant of the test enabled by <code>r.TSR.ShadingRejection.Flickering<\/code>. Epic has changed the shipped default between UE5 revisions, so a game built on an older engine may not match this figure.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/temporal-super-resolution-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, default known to differ on other revisions","notesHtml":"<p>We write <strong>3<\/strong>. Because the shipped default moved between engine versions, this line&#x27;s real effect depends on which UE5 revision the game was built with. On some it restores the old behaviour and on others it changes nothing.<\/p><p>This is the clearest case in the file for a <code>memory<\/code> grade rather than an <code>ai<\/code> grade. Reading the value out of a running game would settle it.<\/p>","filled":true},{"name":"r.DefaultFeature.AntiAliasing","status":"not used","ourValue":"not written since 2026-08-30; was 2","engineDefault":"2 in UE4. Absent from the current UE5 reference, so UE5 has no documented default for it.","valueRange":"0 = none, 1 = FXAA, 2 = TAA, 3 = MSAA. The same numbering as `r.AntiAliasingMethod`, which is what replaced it.","appliesWhen":"Never on a current UE5 build, as far as the documentation shows. On an engine revision that still reads it, always.","visualsHtml":"If it is still live anywhere, the same effect as <code>r.AntiAliasingMethod<\/code>: it picks the anti-aliasing algorithm, which is the largest single visual change this app can make.","performanceHtml":"The same as whichever method it would select.","definitionHtml":"The UE4-era project default for the anti-aliasing method, read into the default post-process settings at engine start. UE5 moved the setting to <code>r.AntiAliasingMethod<\/code> and this name is absent from the current console variables reference.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>This one is the reason the other three were looked at. It was being written at <strong>2<\/strong>, which is TAA, in the same session in which we stopped writing <code>r.AntiAliasingMethod=2<\/code> for exactly that reason.<\/p><p>If the audit is right and the name is dead, the line did nothing. If it is wrong, or if a game is built on an engine revision that still honours it, we were forcing TAA through the back door and the new dropdown was a lie for that game. Those are the only two outcomes, and one of them is bad, so the line is switched off.<\/p><p>Nothing is lost. The entry, its value and the reason it was rejected all stay in <code>_commands.json<\/code>, and <code>isBeingUsed<\/code> is one click.<\/p>","filled":true},{"name":"r.TemporalAA.Algorithm","status":"not used","ourValue":"not written since 2026-08-30; was 1","engineDefault":"none documented. The name is not in the current registry.","valueRange":"0 or 1 in the sample it came from.","appliesWhen":"Never on a current UE5 build. On an older one, the TAA path only.","visualsHtml":"It selected between the older TAA resolve and the Gen5 TAAU resolve, which differ in sharpness and in how they reject history. Where the name is dead, none.","performanceHtml":"The two algorithms it chose between were close in cost.","definitionHtml":"An experimental selector for the Gen5 temporal upsampling algorithm, documented in an older Epic sample and absent from the current console variable registry.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off with the other three. It is an anti-aliasing control, so the same argument applies: an experimental resolve selected behind the user&#x27;s back is worse than nothing selected at all.<\/p>","filled":true},{"name":"r.TemporalAASharpness","status":"not used","ourValue":"not written since 2026-08-30; was 0","engineDefault":"none documented. The name is not in the current reference.","valueRange":"unknown. Presumably 0 to 1 by analogy with other sharpness dials.","appliesWhen":"Never on a current UE5 build.","visualsHtml":"Where live, a post-resolve sharpening pass on the TAA output. At 0 it would do nothing anyway, which is what made the line harmless even while it was written.","performanceHtml":"None.","definitionHtml":"A sharpening amount applied after the temporal resolve. Absent from the current console variables reference. It is not <code>r.Tonemapper.Sharpen<\/code>, which is a real and separate control, and the two are easy to confuse by name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>The least harmful of the four, because the value written was 0. Switched off for consistency rather than for risk: this paper should not have to explain why three anti-aliasing ghosts were removed and a fourth was kept.<\/p>","filled":true},{"name":"r.TSR.Velocity.Extrapolation","status":"not used","ourValue":"not written since 2026-08-30; was 1","engineDefault":"none documented in current UE5. The feature was removed.","valueRange":"0 or 1 while it existed.","appliesWhen":"Never on a current UE5 build. On the revisions that had it, the TSR path only.","visualsHtml":"It extrapolated motion vectors forward for pixels that had none, which was meant to reduce smearing on disoccluded edges and in practice produced artifacts of its own. That is why it was removed.","performanceHtml":"Negligible either way.","definitionHtml":"An experiment in TSR&#x27;s velocity handling, present in early UE5 revisions and taken out again after the behaviour proved flawed.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/temporal-super-resolution-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Turning on an experiment that Epic removed for producing artifacts is not a defensible default, and it is a TSR control, so it lands in the same argument as the other three.<\/p>","filled":true}]},{"id":"post-processing","title":"Post-Processing & Lens Effects","introHtml":"<p>These are the effects a virtual camera adds after the scene is drawn: grain, colour fringing at the edges of the lens, blurred backgrounds, glare, and a final sharpening pass. None of them make a scene more correct. They make it look like it was filmed.<\/p><p>That makes the whole category taste rather than fact, which is why almost all of it moved to user options on 2026-08-30. Before that we switched off film grain, colour fringing and depth of field for everybody and never asked.<\/p><p>The rule the category now follows: <strong>write nothing until the user ticks a box.<\/strong> A game with its own menu for these keeps working, a game without one keeps its own look, and a player who wants an effect gone gets it gone. We cannot see whether a game has a menu, so writing nothing is the only answer that is never wrong.<\/p><p>Four names in the NO EFFECT block belonged to this category and were being written live. Two of them, <code>r.SceneColorFringe.Max<\/code> and <code>r.NT.Lens.ChromaticAberration.Intensity<\/code>, were disabling colour fringing on their own. They were harmless while we also wrote <code>r.SceneColorFringeQuality=0<\/code>, and became back doors the moment we stopped. All four are documented at the end of this paper, marked <code>not used<\/code>.<\/p><p>Three more sound like they belong here and do not. <code>r.ParallelPostProcessing<\/code>, <code>r.ParallelSceneColorGather<\/code> and <code>r.ParallelTonemapping<\/code> are about threading rather than looks, and are covered with the rest of the parallelism settings.<\/p>","commands":[{"name":"r.FilmGrain","status":"active","ourValue":"not written by default; 0 when \"Turn off film grain and colour fringing\" is ticked","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, but only over the engine's own film grain. Grain painted into a game's custom post-process material is beyond its reach.","visualsHtml":"Film grain is a fine moving speckle laid over the whole image. Some people read it as texture and film character; others read it as dirt, and it is worst on a large screen at close range. Removing it also removes its one technical benefit: grain hides banding in dark gradients, so a smooth night sky can start to show steps once it is gone.","performanceHtml":"Very small. One extra noise sample per pixel in the tonemapper.","definitionHtml":"The master switch for the engine&#x27;s film grain pass inside the tonemapper. The strength comes from the post-process settings, and the shipped intensity is 0, so on many games this switch is already moot -- there is no grain to remove. It matters on the games whose artists turned it up.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference","https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>We wrote <strong>0<\/strong> for everybody until 2026-08-30. The audit&#x27;s own note calls this *&quot;a valid broad optional Disable Film Grain control&quot;* -- optional, in its own word, and we had made it compulsory.<\/p><p>It shares an option with colour fringing rather than having its own. Both are lens simulation, both are disliked by roughly the same people for the same reason, and two boxes that are always ticked together are one box.<\/p>","filled":true},{"name":"r.SceneColorFringeQuality","status":"active","ourValue":"not written by default; 0 when \"Turn off film grain and colour fringing\" is ticked","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, but only over the engine's own fringe pass. A game's custom post-process material is beyond its reach.","visualsHtml":"Chromatic aberration splits colour towards the edges of the screen, so straight edges pick up a red or blue border away from the centre. It imitates a cheap lens. It is strongest exactly where peripheral vision is weakest, which is why some players find it fatiguing and others never notice.","performanceHtml":"Small. It costs extra samples across the whole frame, and 0 skips the pass rather than running it at zero strength.","definitionHtml":"The quality level of the stock scene-colour fringe pass. 0 removes the pass; 1 runs it at the strength the post-process settings ask for. Like film grain, the CVar is the switch and the artist sets the amount.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference","https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/scalability-reference-for-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Same story as film grain, and the same option. The audit again says *&quot;good optional&quot;* and we again made it compulsory.<\/p><p>Read <code>r.SceneColorFringe.Max<\/code> at the end of this paper before trusting that the option works on an older bundle. That clamp was doing the same job invisibly.<\/p>","filled":true},{"name":"r.Bloom.AsyncCompute","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"FFT convolution bloom only, and only where the renderer and the platform support async compute. Standard gaussian bloom ignores it.","visualsHtml":"None. It changes which GPU queue the work runs on, not what the work produces.","performanceHtml":"Where it applies, it lets the bloom convolution overlap other GPU work instead of waiting in line, which is why 1 is the default. A game that had turned it off would be paying for the serialised path.","definitionHtml":"Schedules the FFT bloom convolution on the asynchronous compute queue rather than the graphics queue.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>It was switched off on 2026-08-30 for restating the engine&#x27;s own default, and restored on 2026-08-31 under a rule that outranks the audit&#x27;s *&quot;Omit and inherit&quot;*.<\/p><p><strong>The rule: a documented default is worth pinning.<\/strong> A game ships its own Engine.ini, and nothing stops its developers writing something other than the default. Omitting the line trusts a config we have never read; writing the default states what we want out loud and survives a game that disagrees. It costs one line and it cannot make anything worse, because the value is the one the engine would have chosen anyway.<\/p><p>That rule does <strong>not<\/strong> extend to the entries in the NO EFFECT block that were switched off. Those were not writing defaults -- they were forcing real commands *away* from their defaults, which is the opposite case.<\/p>","filled":true},{"name":"r.DepthOfFieldQuality","status":"active","ourValue":"not written by default; 0 when \"Turn off depth of field\" is ticked","engineDefault":"2","valueRange":"0 = off, 1 = low, 2 = high and the default, 3 = very high. Epic drives it from the Post Processing scalability tier.","appliesWhen":"Always, wherever the game uses the engine's depth of field.","visualsHtml":"The largest change in this category. Depth of field blurs what the camera is not focused on. Off, everything is sharp at once, which reads as flat and video-like, and distant text and detail become legible that the game may never have meant you to read. In a game that uses focus to point you at the thing you are supposed to look at, turning it off removes a deliberate signal, not just an effect.","performanceHtml":"A real saving. Depth of field is a multi-pass gather and blur over the whole frame, and at high quality on a scene with wide depth it is one of the more expensive post passes. Off is measurably faster.","definitionHtml":"The quality tier of the depth of field post-process chain. 0 skips the passes entirely; higher values increase the number of samples in the gather and, at the top tier, switch to the adaptive path.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference","https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-depth-of-field-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>We wrote <strong>0<\/strong> for everybody until 2026-08-30, and this was the worst of the three. The audit&#x27;s own note warns that it *&quot;can undermine gameplay focus, cameras and cinematics&quot;*, and we did it by default to every user, in every preset, without a word on screen.<\/p><p>It has its own option rather than sharing the lens-effects one. Grain and fringing are cosmetic; this one can change what a game is telling you. Someone who wants a cleaner image does not necessarily want the camera to stop focusing, and the two should not move together.<\/p>","filled":true},{"name":"r.LensFlareQuality","status":"active","ourValue":"2, and 3 on the Quality preset","engineDefault":"2","valueRange":"0 = off, 1 to 3 increasing quality","appliesWhen":"Only where the game uses the engine's own bloom-based lens flare. A flare drawn by a custom material is untouched.","visualsHtml":"Lens flare is the streak and halo a bright light leaves when it is in or near frame. 0 removes it. 2 is what Epic ships. 3 traces more flare samples, so the streaks are smoother and break up less as the light moves across the screen. The difference is real but small, and it is easiest to see on a slow pan past a bright source.","performanceHtml":"Small, and it scales with how much of the screen is bright. 3 costs more than 2 by a measurable but minor amount.","definitionHtml":"The quality tier of the bloom-derived lens flare pass. Higher tiers use more samples when building the flare from the bloom pyramid.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference","https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>Read the provenance before copying this pattern.<\/strong> The audit names one number and one only: 2 is the current default and a good quality level. It does not say what 3 does and does not recommend it.<\/p><p>3 is the maintainer&#x27;s own tested value -- measurably more expensive and a visible improvement on the flares. That is real evidence, but it is testing rather than documentation, so it goes on the Quality preset alone, the one whose whole promise is spending frames on looks. Balanced and Performance keep the documented default.<\/p><p>Every other preset split in this project needs the audit to name a second number. This entry and <code>ProbeResolution<\/code> are the two that knowingly do not, and both say so.<\/p>","filled":true},{"name":"r.Tonemapper.Sharpen","status":"active","ourValue":"-1 by default, which inherits; 1.20 when \"Extra sharpening\" is ticked","engineDefault":"-1, meaning inherit rather than a number","valueRange":"-1 to inherit, then 0 upwards. 0 to 2 in practice.","appliesWhen":"The desktop tonemapper only. The mobile tonemapper does not support it and ignores the value.","visualsHtml":"Adds edge contrast after tonemapping, which reads as a crisper image. Pushed too far it draws bright halos along high-contrast edges and lifts whatever noise is already there. It is worst on top of a temporal upscaler, because TSR, DLSS and FSR leave faint temporal noise that sharpening then makes visible.","performanceHtml":"Negligible. One extra filter tap in a pass that already runs.","definitionHtml":"A post-tonemap unsharp mask. -1 is a sentinel meaning &quot;take the value from the post-process settings&quot; rather than a strength, so writing -1 is the documented way to say &quot;leave it alone&quot;.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference","https://dev.epicgames.com/documentation/en-us/unreal-engine/temporal-super-resolution-frequently-asked-questions-for-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The audit warned that <strong>1.5 is aggressive<\/strong> and told us not to force it universally. Someone had already acted on that by moving the command to the &quot;Extra sharpening&quot; option, which writes -1 when unticked and 1.20 when ticked.<\/p><p>But the base value was left at <strong>1.5<\/strong>, where it looked live and was not. The option overrides it in *both* states, so 1.5 could not reach any file, in any preset, in any state -- verified on 2026-08-30 by generating every combination. A number that cannot be reached is worse than a wrong one, because nobody reviewing the file can tell.<\/p><p>The base is now -1, which is both the documented default and what actually happens.<\/p>","filled":true},{"name":"r.SceneColorFringe.Max","status":"not used","ourValue":"not written since 2026-08-30; was 0","engineDefault":"not stated in the reference. The clamp exists to bound the artist's value, not to carry one of its own.","valueRange":"0 upwards. 0 means no fringing at all.","appliesWhen":"Always, wherever the stock fringe pass runs.","visualsHtml":"At 0 it clamps chromatic aberration to nothing, so the effect is gone regardless of what the post-process settings ask for. At a higher value it caps how strong an artist&#x27;s setting may become.","performanceHtml":"None worth measuring. It is a clamp on a value, not a pass.","definitionHtml":"An upper bound applied to the scene colour fringe intensity before the pass runs. The audit grades it a valid stock clamp, unlike most of the NO EFFECT block, and its objection was redundancy rather than the name being dead.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The most dangerous entry found so far, and we created the danger ourselves.<\/strong><\/p><p>The audit let it through with the reasoning that it was *&quot;redundant when line 28 disables the stock fringe pass&quot;*. That was true. Line 28 was <code>r.SceneColorFringeQuality=0<\/code>, which we wrote for everybody.<\/p><p>The moment colour fringing became a user option and that line stopped being written by default, the clamp stopped being redundant and became the only thing still acting. A player who left the box unticked would have had fringing silently removed anyway, and nothing on screen would have explained it.<\/p><p>This is the shape of the risk in general: an inert entry is only inert in the configuration it was judged in. Change the configuration and the judgement has to be made again. It is switched off, and it is the reason every category&#x27;s inert names are now read alongside its live ones.<\/p>","filled":true},{"name":"r.Tonemapper.GrainQuantization","status":"not used","ourValue":"not written since 2026-08-30; was 1","engineDefault":"1 where the name existed at all.","valueRange":"0 or 1","appliesWhen":"Never on a current UE5 build. The name is absent from the reference.","visualsHtml":"Where it existed it enabled dithering during tonemapper quantisation, which hides banding in smooth gradients. It never had anything to do with preserving artistic film grain, whatever its name suggests.","performanceHtml":"None.","definitionHtml":"A UE4-era switch for dither quantisation in the tonemapper output. Absent from the current UE5 console variables reference.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off with the other two. The value written was 1, which was the default anyway, so nothing changes either way.<\/p><p>The audit&#x27;s note on this one is worth keeping for a different reason: it records that the original config&#x27;s comment claimed the setting kept &quot;original artistic film grain&quot;, and that this was simply wrong. A confident comment in a config file is not evidence.<\/p>","filled":true},{"name":"r.NGX.DLSS.PreferNISSharpen","status":"not used","ourValue":"not written since 2026-08-30; was 0","engineDefault":"set by the DLSS plugin, not by the engine.","valueRange":"0 or 1","appliesWhen":"Only in a game that ships the NVIDIA DLSS plugin. There it is a real setting, not a dead name.","visualsHtml":"It chose whether NIS sharpening was preferred over the DLSS path&#x27;s own sharpening. Modern NGX marks the old DLSS sharpening path deprecated, so on a current plugin the question is largely moot.","performanceHtml":"Negligible either way.","definitionHtml":"A coordination setting between the DLSS plugin and the NVIDIA Image Scaling sharpener, from the era when DLSS still applied its own sharpening pass.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear; it is a plugin CVar rather than an engine one","notesHtml":"<p>Switched off for the same reason as the anti-aliasing names. This one is real wherever the DLSS plugin is installed, it touches sharpening, and sharpening is a user option here. Setting it behind the player&#x27;s back on a DLSS install is exactly the pattern this project has spent two categories removing.<\/p>","filled":true},{"name":"r.NT.Lens.ChromaticAberration.Intensity","status":"not used","ourValue":"not written since 2026-08-30; was 0","engineDefault":"none. The name is not part of stock UE5, so the engine has no opinion about it.","valueRange":"0 upwards, where it exists. 0 is no aberration.","appliesWhen":"Only in a title built on the engine or plugin that defines the `r.NT.*` namespace. Everywhere else it is an unknown name and is ignored.","visualsHtml":"Where it is defined, it sets the strength of that title&#x27;s own chromatic aberration to zero, which is the same visible result as <code>r.SceneColorFringeQuality=0<\/code> by a different route.","performanceHtml":"None worth measuring.","definitionHtml":"A lens effect intensity in a private CVar namespace. <code>r.NT.*<\/code> is a title, plugin or custom-engine prefix, not an Epic one, so the command cannot be shipped as a general UE5 setting.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the namespace does not appear","notesHtml":"<p>The third route to the same effect, and the reason this category needed a deliberate sweep of the inert list rather than a glance.<\/p><p>It is dead in almost every game, which is why the audit graded it inert. It is also, by definition, alive in the game it was copied from -- a private namespace exists because something defines it. In that game our file would have set chromatic aberration to zero while the user&#x27;s box sat unticked.<\/p><p>The pattern is now three for three: <code>r.DefaultFeature.AntiAliasing<\/code>, <code>r.SceneColorFringe.Max<\/code> and this one. Every time a setting became a user choice, the inert list turned out to hold another way of making the same choice silently.<\/p>","filled":true}]},{"id":"motion-blur","title":"Motion Blur","introHtml":"<p>Motion blur smears whatever moved between one frame and the next. It is the one post-process effect that is a genuine accessibility question rather than only a matter of taste: some people find it makes fast movement unreadable, and some find it makes them ill.<\/p><p>The category is small, and it is already the shape the rest of the file is moving towards. <code>Reduce motion blur<\/code> has been a user option for a long time, and the preset split on <code>r.MotionBlurQuality<\/code> comes from Epic&#x27;s own scalability table rather than from anybody&#x27;s opinion.<\/p><p>What it was carrying was quieter damage. Two of the four commands had a base value that no file could ever contain, and the NO EFFECT block held seven names belonging to this subject -- two of which the audit itself says are real in recent UE5 and cost frames.<\/p><p><strong>Motion vectors are the thread running through the whole thing.<\/strong> They are the per-pixel record of what moved where, and motion blur is only one consumer of them. Temporal anti-aliasing uses them, TSR uses them, and DLSS and frame generation depend on them completely. That is why plugin CVars about motion vectors are documented here and not in the anti-aliasing paper: they share a subject, not a category.<\/p>","commands":[{"name":"r.MotionBlur.Amount","status":"active","ourValue":"-1 by default, which inherits; 0.15 when \"Reduce motion blur\" is ticked","engineDefault":"-1, meaning inherit rather than a number","valueRange":"-1 to inherit, then 0 upwards. 0 is no blur; 0.5 is the usual authored maximum.","appliesWhen":"Always, wherever the game runs the engine's motion blur.","visualsHtml":"Sets how much the image smears during camera and object movement. A lower number makes fast motion easier to read and makes a 60 fps game feel crisper. It also flattens the sense of speed the artist built, and it applies to cutscenes as well as to play, which is where a global override is most likely to be noticed as wrong.","performanceHtml":"Almost none. The blur pass runs either way; the amount only changes how far it samples.","definitionHtml":"A global multiplier on the motion blur amount from the post-process settings. -1 is a sentinel meaning &quot;use the authored value&quot; rather than a strength, so writing -1 is the documented way to leave the game alone.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference","https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The base value was <strong>0.25<\/strong> and could not be reached. The <code>reduce-motion-blur<\/code> option overrides this command in both of its states -- -1 when unticked and 0.15 when ticked -- so 0.25 was never written, in any preset, in any state. Verified on 2026-08-31 by generating all six combinations.<\/p><p>That is the third dead base value found by this process, after <code>r.Tonemapper.Sharpen<\/code> and <code>r.MotionBlur.Max<\/code>. All three came about the same way: somebody correctly moved a forced value into an option and left the old number sitting where it still looked live. The base is -1 now, which is both the documented default and what actually happens.<\/p><p>The audit&#x27;s warning is worth keeping in view: *&quot;0.25 globally forces reduced blur, including cutscenes. Suitable only for an opt-in reduced motion-blur control.&quot;* That is exactly what it is now.<\/p>","filled":true},{"name":"r.MotionBlur.Max","status":"active","ourValue":"-1 by default, which inherits; 0.30 when \"Reduce motion blur\" is ticked","engineDefault":"-1, meaning inherit rather than a number","valueRange":"-1 to inherit, then 0 upwards, measured in percent of screen width.","appliesWhen":"Always, alongside `r.MotionBlur.Amount`.","visualsHtml":"Caps how long a blur streak may become, as a fraction of the screen. It is the control that stops a fast pan turning the whole frame into smear. Lowering it keeps detail readable during quick turns; raising it lets the artist&#x27;s intended sense of speed through.","performanceHtml":"Small but real, and in the opposite direction to the amount. A longer maximum streak means more samples along it, so a tight cap is slightly cheaper as well as clearer.","definitionHtml":"The maximum motion blur distance, expressed as a percent of screen width. -1 inherits the authored value. The audit notes that 0.40 is a strong 0.4 percent cap and can substantially change the intended look.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference","https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The same dead base value as the command above, at <strong>0.40<\/strong>, and corrected the same way on 2026-08-31.<\/p><p>It moves with <code>r.MotionBlur.Amount<\/code> in one option deliberately. Capping the length without lowering the amount, or the reverse, gives a result neither setting was designed for, and a user who wants less blur wants both.<\/p>","filled":true},{"name":"r.MotionBlur.Scale","status":"active","ourValue":"1.0","engineDefault":"1","valueRange":"0 upwards. 1 is no scaling.","appliesWhen":"Always, wherever motion blur runs.","visualsHtml":"Multiplies the final blur amount after everything else has been decided. At 1 it changes nothing. Above 1 every blur in the game gets longer, and below 1 they all shorten, whatever the artist asked for.","performanceHtml":"None at 1.","definitionHtml":"A last global scale applied to the computed motion blur amount, sitting after both the authored value and <code>r.MotionBlur.Amount<\/code>.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off on 2026-08-31 for restating the engine&#x27;s default, then restored the same day. The audit&#x27;s note says *&quot;Omit the line and let the game inherit that behavior&quot;*, and the rule that overrode it is in <code>r.Bloom.AsyncCompute<\/code> in the post-processing paper: a documented default is worth pinning, because a game may ship a different one and we have never read its config.<\/p><p>Here the case is stronger than usual. This category has an option that changes blur, and a scale multiplier the game moved off 1 would quietly change what that option does. Pinning it at 1 makes the option mean what it says.<\/p>","filled":true},{"name":"r.MotionBlurQuality","status":"active","ourValue":"3, and 4 on the Quality preset","engineDefault":"none documented. Epic drives it entirely from scalability.","valueRange":"0 = off, 1 to 4 increasing quality. Epic's tiers are Low 0, Medium 3, High 3, Epic 4.","appliesWhen":"Always, and only meaningful while motion blur is on at all.","visualsHtml":"Higher tiers take more samples along the motion vector, so the streak is smoother and breaks into fewer visible steps. It is easiest to see on a fast pan past a high-contrast edge, where a low tier shows the blur as a row of ghosts rather than a smear.","performanceHtml":"Real and worth respecting. The audit calls 4 *&quot;maximum quality with extra cost&quot;*, and the cost scales with how much of the screen is moving, so it is highest exactly when the frame rate is already under pressure.","definitionHtml":"The sample count and filtering tier of the motion blur pass. 0 skips the pass entirely.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference","https://dev.epicgames.com/documentation/en-us/unreal-engine/scalability-reference-for-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>This is the preset split done the way the project intends. Epic&#x27;s table names every number, so nothing had to be invented: Quality maps to Epic, Balanced to High, Performance to Medium.<\/p><p>Balanced and Performance therefore both write 3. That is Epic&#x27;s grouping, not a placeholder -- Medium and High are both 3 in Epic&#x27;s own table.<\/p><p><strong>Performance is deliberately not mapped to Low.<\/strong> Low is 0, which switches motion blur off entirely, and the user already has a checkbox for that. A preset should not silently do the job a visible control exists to do.<\/p><p>The audited config wrote 4 for everybody, which the audit rejected: *&quot;Use only in a named quality option, not as a universal default.&quot;* Quality is that named option.<\/p>","filled":true},{"name":"r.MotionBlur.Separate","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never. There is no such command.","visualsHtml":"None. An unknown name is ignored.","performanceHtml":"None.","definitionHtml":"A misspelling. The real command is <code>r.MotionBlurSeparable<\/code>, which adds a second smoothing pass to the blur and would need its own audit before anyone wrote it. <code>Separate<\/code> and <code>Separable<\/code> are one letter apart and mean different things, which is how this survived in a config file for a long time.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where only the Separable spelling appears","notesHtml":"<p>Switched off. It is worth recording rather than deleting, because the real command it points at is a genuine one that nobody has looked at yet. If motion blur quality is ever revisited, <code>r.MotionBlurSeparable<\/code> is the name to audit.<\/p>","filled":true},{"name":"r.MotionBlurPause","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this name.","valueRange":"not applicable.","appliesWhen":"Never as written.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Epic&#x27;s older material mentions an unprefixed <code>MotionBlurPause<\/code> system setting. There is no <code>r.<\/code> command by this name, so the prefix makes it unknown to the engine.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the r. spelling does not appear","notesHtml":"<p>Switched off. A second example of the same failure as <code>r.MotionBlur.Separate<\/code>: a real idea written under a name the engine does not answer to.<\/p>","filled":true},{"name":"r.MotionBlurPerObjectSize","status":"not used","ourValue":"not written since 2026-08-31; was 0.6","engineDefault":"none as a console variable.","valueRange":"not applicable as a command.","appliesWhen":"Never. It is a post-process property, not a CVar.","visualsHtml":"None from the config file. The underlying property does have an effect, but it is set on a post-process volume by the game&#x27;s own artists, not from Engine.ini.","performanceHtml":"None.","definitionHtml":"<code>MotionBlurPerObjectSize<\/code> is a real post-process setting that controls the minimum on-screen size an object must have before it is blurred. Epic does not register an <code>r.<\/code> command for it, so this entry confuses a property with a command.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off. The third in a row, and the third distinct way to write a name the engine will never read: a misspelling, a missing prefix, and a property mistaken for a command.<\/p><p>Together they are the honest case for the NO EFFECT block existing at all. None of these three could hurt anybody. The four that follow are a different matter.<\/p>","filled":true},{"name":"r.Velocity.TemporalResponsiveness.Supported","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"off, on the revisions that have it. It is opt-in by design.","valueRange":"0 or 1","appliesWhen":"Recent UE5 revisions only, and only on hardware with support for 64-bit image atomics.","visualsHtml":"Where the game&#x27;s materials use the path, it lets a material mark itself as needing a faster temporal response, which reduces smearing on surfaces whose motion the standard velocity pass records badly.","performanceHtml":"<strong>Epic warns of significant performance impact.<\/strong> That is the audit&#x27;s summary of Epic&#x27;s own wording, and it is the reason the path is opt-in rather than on.","definitionHtml":"A support switch for an optional velocity-rendering path. The <code>.Supported<\/code> suffix is the tell: it does not tune anything, it grants permission for a more expensive path to be used where a material asks for it.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The worst entry found so far, and it is not close.<\/strong><\/p><p>Everything else this process has turned up was a setting overruling a choice the user had made. This one may simply have made the game slower. We wrote 1 -- turn the expensive path on -- for every user, in every preset, from a tool people install to gain frames.<\/p><p>It was graded inert on the reasoning that it is version and content specific, which is true and was never a reason to write it. On an engine old enough not to have the name, it did nothing. On a recent one it did exactly what it says.<\/p><p>The <code>.Supported<\/code> suffix is the general lesson. A permission is not a setting. Granting one the game never asked for cannot make anything faster, and can make it slower.<\/p>","filled":true},{"name":"r.Velocity.OutputTranslucentClippedDepth.Supported","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"off, on the revisions that have it.","valueRange":"0 or 1","appliesWhen":"Recent UE5 revisions only.","visualsHtml":"Where a game&#x27;s materials use it, translucent surfaces write clipped depth into the velocity pass, so temporal effects behind glass, water and foliage cards resolve more correctly instead of smearing.","performanceHtml":"Extra rendering cost, in the audit&#x27;s own words. It adds work to the velocity pass for every translucent surface that opts in.","definitionHtml":"A second support switch for an optional authored-material velocity path, in the same family and with the same <code>.Supported<\/code> meaning as the entry above.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off with its sibling, for the same reason and on the same day. The audit&#x27;s grading is *&quot;version/content specific, not general tuning&quot;*, and a setting that is not general tuning has no business in a file written for every game on the list.<\/p>","filled":true},{"name":"r.NGX.DLSS.DilateMotionVectors","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"set by the DLSS plugin, not by the engine.","valueRange":"0 or 1","appliesWhen":"Only in a game that ships the NVIDIA DLSS plugin. There it is real.","visualsHtml":"It chooses how motion vectors are prepared before DLSS consumes them. Dilation spreads a moving object&#x27;s vectors slightly beyond its edges, which helps DLSS reconstruct the boundary and hurts where the geometry is thin. Which answer is right depends on the game&#x27;s content and on how the integration was done.","performanceHtml":"Negligible either way. This is a correctness choice, not a cost one.","definitionHtml":"A DLSS integration setting for motion vector dilation. <code>r.NGX.*<\/code> belongs to NVIDIA&#x27;s plugin, not to Epic&#x27;s engine.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the namespace does not appear; it is a plugin CVar rather than an engine one","notesHtml":"<p>Switched off. The audit is explicit that the motion-vector mode is *&quot;integration and content specific&quot;* and *&quot;cannot be a general engine setting&quot;*, and we were answering it identically for every game.<\/p><p>It is the same argument as <code>r.NGX.DLSS.PreferNISSharpen<\/code> in the post-processing paper. A plugin&#x27;s own settings belong to the plugin and to the game that integrated it.<\/p>","filled":true},{"name":"r.Streamline.DilateMotionVectors","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"0, which is the plugin's own default.","valueRange":"0 or 1","appliesWhen":"Only in a game that ships NVIDIA Streamline, which is the layer frame generation runs through.","visualsHtml":"The same choice as the DLSS entry above, for the frame generation path. Motion vectors are what a generated frame is built from, so a wrong answer here shows up as artifacts on the frames nobody rendered.","performanceHtml":"Negligible directly.","definitionHtml":"A Streamline integration setting for motion vector dilation. <code>r.Streamline.*<\/code> belongs to NVIDIA&#x27;s plugin.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the namespace does not appear; it is a plugin CVar rather than an engine one","notesHtml":"<p>Switched off. This one is the clearest waste of the four: <strong>0 is already the plugin&#x27;s default<\/strong>, so the line could never change anything today, and could only ever start mattering on the day NVIDIA changes their mind -- at which point we would be overriding a decision made by the people who wrote the code, without having read it.<\/p><p>The audit&#x27;s own summary says as much: plugin-specific defaults stay rejected under a stock UE5 audit.<\/p>","filled":true}]},{"id":"lumen","title":"Lumen Lighting & Reflections","introHtml":"<p>Lumen is UE5&#x27;s real-time global illumination and reflection system. It is what makes light bounce off a red wall and tint the floor, and what puts a reflection in a puddle without a pre-baked cubemap. It replaced a decade of tricks, and it is usually the single most expensive thing a UE5 game does.<\/p><p>It works by tracing rays from a grid of <strong>screen probes<\/strong>, caching what they find in a <strong>radiance cache<\/strong>, and reusing that cache across frames. Almost every command here tunes one of three things: how many probes there are, how far and how accurately their rays go, and how long the answers are kept.<\/p><p>That structure is why the numbers matter more than usual. A setting that doubles the rays per probe does not cost a little more -- probe counts and ray counts multiply, and the result lands on the GPU every frame.<\/p><p><strong>This category was the worst offender in the file, in three separate ways.<\/strong><\/p><p>The first: five commands pushed Lumen above Epic&#x27;s own settings on the <strong>Balanced<\/strong> preset, which is the one most people use and the one the app calls Recommended. The audit&#x27;s word for one of them is *&quot;greatly increases GPU cost&quot;*. Balanced and Quality were identical for all five, so the Quality preset was buying almost nothing while Balanced was paying almost everything. Since 2026-08-31 those five are Quality only, and Balanced and Performance write Epic&#x27;s numbers.<\/p><p>The second: three commands the audit describes as experiments were on for everybody. One is called *&quot;a Lumen-specific A/B test&quot;* in so many words. They are now three switches on the app&#x27;s Experimental tab, and all three write the engine value until somebody ticks them.<\/p><p>The third is in the NO EFFECT block, and it is the largest single find of this whole review. Sixteen names here were being written live. Eleven do not exist, which is harmless. <strong>Five the audit itself grades &quot;Valid&quot;, and every one of the five was forced away from its documented default<\/strong> -- task granularity, surface cache eviction, an undocumented internal parallel path. They sat in a block whose heading says the engine ignores names it does not know.<\/p>","commands":[{"name":"r.Lumen.DiffuseIndirect.AsyncCompute","status":"active","ourValue":"1","engineDefault":"1 where the platform supports it","valueRange":"0 or 1","appliesWhen":"Only where the renderer and platform support async compute. It is ignored elsewhere rather than causing an error.","visualsHtml":"None. It moves work between GPU queues; the result is identical.","performanceHtml":"Where supported, it lets the diffuse indirect pass overlap other GPU work instead of queueing behind it. That is why the default is on.","definitionHtml":"Schedules Lumen&#x27;s diffuse indirect lighting on the asynchronous compute queue.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. The audit&#x27;s note says *&quot;Omit and let the renderer/platform select the applicable path&quot;*, and we do the opposite on purpose -- see <code>r.Bloom.AsyncCompute<\/code> in the post-processing paper for the rule.<\/p><p>The reason to pin it is the same as everywhere else, with one addition worth naming: a game that shipped this off is paying for the serialised path on every frame, and nothing else in this file would tell us.<\/p>","filled":true},{"name":"r.Lumen.DiffuseIndirect.SSAO","status":"active","ourValue":"0, and 1 on the Quality preset","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Meaningful mainly when `ShortRangeAO` is off, which is what this project writes.","visualsHtml":"Ambient occlusion is the soft darkening where two surfaces meet -- the inside of a corner, the seam where a crate touches the floor. Lumen normally supplies it through ShortRangeAO. With that off and this off too, there is none at all, and corners and creases look flat and slightly pasted-on. Turning this on restores it by a cheaper, screen-space route that is less accurate and can halo around edges.","performanceHtml":"A screen-space AO pass over the whole frame. Cheaper than full-resolution ShortRangeAO, and not free.","definitionHtml":"Enables classic screen-space ambient occlusion inside the Lumen diffuse indirect path, as a stand-in for Lumen&#x27;s own short-range occlusion.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/lumen-performance-guide-for-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>**Read this together with <code>r.Lumen.ScreenProbeGather.ShortRangeAO<\/code> below.** The two are one decision written as two commands, and reading either alone gives the wrong answer.<\/p><p>This project turns ShortRangeAO off in every preset, which saves full-resolution work and removes contact occlusion. Quality then buys some of it back with SSAO. Balanced and Performance do not, and accept flatter corners -- which is the trade those preset names promise.<\/p><p>Until 2026-08-31 Balanced paid for SSAO as well, so Balanced and Quality looked the same here and only Performance differed.<\/p>","filled":true},{"name":"r.Lumen.RadianceCache.SupersampleDistanceFromCamera","status":"active","ourValue":"2000","engineDefault":"2000","valueRange":"a distance in Unreal units. 2000 is 20 metres.","appliesWhen":"Always, wherever the Lumen radiance cache runs.","visualsHtml":"Inside this distance the radiance cache is sampled more densely, so indirect light near the player has finer detail and shifts less as the camera moves. Beyond it, the cache is coarser and cheaper.","performanceHtml":"Raising it extends the expensive near-field region outwards and costs accordingly. 2000 is Epic&#x27;s balance point.","definitionHtml":"The radius, from the camera, within which radiance cache probes are supersampled.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. The audit noticed that the source config had this line commented out and said so approvingly: *&quot;2000 is the current default, so the source correctly leaves it commented.&quot;*<\/p><p>We write it anyway, under the pinning rule. This is the entry where that rule is least comfortable, because the audit explicitly praised the omission -- but the rule is about what a game might have written, not about what the audit saw.<\/p>","filled":true},{"name":"r.Lumen.Reflections.DownsampleFactor","status":"active","ourValue":"1","engineDefault":"1","valueRange":"1 or 2. 1 is full resolution, 2 is half.","appliesWhen":"Always, wherever Lumen reflections run.","visualsHtml":"At 2 the reflection buffer is traced at half resolution and upscaled, which softens reflections and makes their edges crawl during movement. At 1 reflections match the rest of the frame.","performanceHtml":"The single biggest lever on Lumen reflection cost. Half resolution is roughly a quarter of the rays.","definitionHtml":"The resolution divisor for Lumen&#x27;s reflection tracing pass, relative to the screen.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default of full resolution.<\/p><p>It is worth flagging as a <strong>future preset candidate<\/strong>. 2 is a documented value with a documen
