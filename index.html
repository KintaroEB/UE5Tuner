on was working against, after <code>r.Nanite.Streaming.MaxPageInstallsPerFrame<\/code> and <code>MaxPendingPages<\/code> in the Nanite paper -- and it is the most direct of the three, because the other two slowed streaming down while this one changed what order it happens in.<\/p><p>The irony is worth stating plainly: three other live settings in this same file are aimed squarely at reducing pop-in, and this one was quietly undoing part of that work from a block labelled NO EFFECT.<\/p>","filled":true},{"name":"r.Streaming.AmortizeCPUToGPUCopy","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Only while `MaxNumTexturesToStreamPerFrame` is capped, which it is not here -- that remains 0, meaning unlimited.","visualsHtml":"None as configured.","performanceHtml":"None as configured. The audit: *&quot;Standalone no-op, and a cap needs title testing.&quot;*","definitionHtml":"Spreads the CPU-to-GPU copy of streamed texture data across frames, but only when a per-frame streaming cap is in force.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>A real command, set away from its default, doing nothing -- because the setting it depends on was left at unlimited.<\/p><p>It is a good example of why &quot;it is real&quot; and &quot;it does something&quot; are different questions. Half a mechanism was enabled and the half that would have made it work was not.<\/p>","filled":true},{"name":"LogStreaming","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"None worth measuring.","definitionHtml":"The log category for asset and texture streaming.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The audit&#x27;s sharpest note in the whole review:<\/strong> *&quot;Redundant and hides exactly the streaming failures this tweak file attempts to influence.&quot;*<\/p><p>Eighteen commands in this category tune streaming. One line in the block below them turned off the log that reports when streaming goes wrong.<\/p><p>It is the fifth log category found and the third that was actively unhelpful, after <code>LogVRS<\/code> and <code>LogNiagara<\/code>. The pattern across all three is identical: the configuration pushes a subsystem hard and then silences that subsystem&#x27;s complaints.<\/p>","filled":true},{"name":"r.TextureStreaming.UseBackgroundThreadPool","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this name.","valueRange":"not applicable.","appliesWhen":"Never as written.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"The wrong namespace. The real command is <code>r.Streaming.UseBackgroundThreadPool<\/code>, which is documented above and is written correctly.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where only the r.Streaming spelling exists","notesHtml":"<p>Switched off. Both spellings were in the file at the same value, one working and one not -- the same pattern as the two <code>AllowSpecializedStateObjects<\/code> entries in the ray tracing paper.<\/p>","filled":true},{"name":"r.TextureStreaming.DiscardUnusedMips","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The namespace is wrong or obsolete.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None as written. The audit adds what it would have done: *&quot;indiscriminate mip dropping could worsen re-streaming and pop-in.&quot;*","performanceHtml":"None.","definitionHtml":"No exact stock CVar under this namespace.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and it is one of the few dead names that is fortunate rather than merely harmless. Had it worked, it would have made pop-in worse in a file trying to reduce it.<\/p>","filled":true},{"name":"r.TextureStreaming.UseDeferredLock","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar; invented or obsolete.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The third <code>r.TextureStreaming.*<\/code> name in the block, in a namespace where the engine has none at all -- every real one is <code>r.Streaming.*<\/code>.<\/p>","filled":true},{"name":"r.Streaming.UseMaterialDataStreaming","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this name. The real command is `r.Streaming.UseMaterialData`.","valueRange":"not applicable as written.","appliesWhen":"Never as written.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A wrong name one word away from a real one. The audit: *&quot;do not silently substitute it.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where only UseMaterialData exists","notesHtml":"<p>Switched off, with the do-not-substitute warning preserved. The sixth such warning in the review.<\/p>","filled":true},{"name":"r.Streaming.MinFudgeFactor","status":"not used","ourValue":"not written since 2026-08-31; was 0.5","engineDefault":"none. Obsolete.","valueRange":"not applicable.","appliesWhen":"Never on a current build.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"An obsolete streaming heuristic factor with no current stock equivalent.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.Streaming.PredictiveBoost","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar with this name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.Streaming.PredictiveBoostHintSize","status":"not used","ourValue":"not written since 2026-08-31; was 512","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar with this name; a companion to the invented entry above.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The pair is the same shape as the MegaLights shadow cache and its <code>MaxAge<\/code>: one invented name suggesting a second, more specific one, and neither checked.<\/p>","filled":true},{"name":"r.Streaming.BuildTextureStreamingDataOnLoad","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar. Texture streaming data is built when the project is cooked, not when a level loads.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The fifth build-time concept written as a runtime variable.<\/p>","filled":true},{"name":"r.Streaming.EnableAssetUpdateAbandons","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.IO.VirtualTextures","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this name. The real command is `r.VirtualTextures`.","valueRange":"not applicable as written.","appliesWhen":"Never as written, and the real one is not a runtime choice either.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A wrong name for a real setting, and one that could not be used even correctly. The audit: enabling virtual textures is *&quot;a project/cook decision requiring compatible textures, materials, samplers&quot;* -- the game must be built for it.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where only r.VirtualTextures exists","notesHtml":"<p>Switched off. Two failures in one line: the wrong name, and a real name that would not have worked either because virtual texturing is decided when the game is built.<\/p>","filled":true},{"name":"r.VT.CsvStats","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"none under this exact name.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None. The audit: *&quot;not rendering optimization.&quot;*","definitionHtml":"A CSV statistics switch for virtual texturing, under a name the engine does not answer to.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. A statistics toggle rather than a setting, in the same family as the four warning suppressions in the effects paper.<\/p>","filled":true},{"name":"PlatformStreamingFormat","status":"not used","ourValue":"not written since 2026-08-31; was OGG","engineDefault":"set by the platform's cook settings.","valueRange":"an audio format name.","appliesWhen":"Never from a player's configuration file.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"The streaming audio format for the platform, which is chosen when the project is cooked. Audio is encoded into the packaged game; a text file cannot re-encode it afterwards.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off. It is the only entry in this category that is not about textures at all -- it is audio, and it landed here because of the word *streaming*.<\/p>","filled":true},{"name":"LogTextureEncodingSettings","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Cook and editor only.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A log category for texture encoding settings, which are an editor and cook concern.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off as redundant. Harmless, unlike <code>LogStreaming<\/code> above it.<\/p>","filled":true},{"name":"LogTextureFormatManager","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Cook and editor only.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A log category for the texture format manager.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off as redundant.<\/p>","filled":true},{"name":"LogTextureFormatOodle","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Cook only. Oodle is the compressor textures are encoded with when the game is packaged.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A log category for the Oodle texture format plugin.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off as redundant, and the last of four log categories in this one category alone. Three of the four are cook-time and genuinely pointless; the fourth was <code>LogStreaming<\/code>, which was not.<\/p><p>That ratio is the argument for reading the block rather than trusting its heading, in miniature.<\/p>","filled":true}]},{"id":"frame-pacing","title":"Frame Rate, VSync & Latency","introHtml":"<p>This category is about the last few milliseconds: how a finished frame reaches the monitor, how many of them are allowed per second, and how much of the delay between moving the mouse and seeing the result is the engine&#x27;s fault.<\/p><p>It is also the category where <strong>more settings were removed than kept<\/strong>. Four commands are written now, out of the six that were.<\/p><p>Two reasons for that, and they are worth having up front.<\/p><p><strong>The category argued with itself.<\/strong> <code>r.GTSyncType=2<\/code> is a low-latency presentation mode that depends on VSync frame pacing, and the line above it turned VSync off. The audit spotted the contradiction and said so. We shipped both.<\/p><p><strong>And the pinning rule fails here, for the first time.<\/strong> That rule works because writing the value the engine would have chosen cannot make anything worse. In this category two of the engine&#x27;s own defaults mean *&quot;remove the limit&quot;* -- <code>t.MaxFPS=0<\/code> is no frame cap and <code>r.VSync=0<\/code> is no synchronisation -- and our file outranks the game&#x27;s own configuration. Writing Epic&#x27;s default there does not preserve the engine&#x27;s behaviour; it strips a limit somebody set on purpose.<\/p><p><code>t.MaxFPS<\/code> is no longer written for exactly that reason. <code>r.VSync<\/code> still is, and the reason is a judgement rather than a rule -- recorded in its entry.<\/p><p>The category also gained a command from the NO EFFECT block rather than losing one to it, which happened nowhere else in this review. See <code>t.Streamline.Reflex.Mode<\/code> at the end.<\/p>","commands":[{"name":"r.VSync","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"VSync holds each finished frame until the monitor is ready for it. Off, a frame is shown the moment it is done, which means the screen can show the top half of one frame and the bottom half of the next -- a horizontal seam that moves, called tearing.","performanceHtml":"Off is faster and lower latency. The GPU never waits for the display, and the frame you see is the newest one rather than one held back.","definitionHtml":"Enables vertical synchronisation of frame presentation.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, forced rather than offered, on the maintainer&#x27;s judgement about the hardware people actually own.<\/p><p>The audit is careful about it: *&quot;Disabling VSync is a display/user preference: it can reduce latency but can also tear, increase GPU load, and <strong>override the game&#x27;s own setting<\/strong>. Keep only as an explicit display toggle.&quot;*<\/p><p><strong>The judgement, stated so it can be argued with later:<\/strong> adaptive sync is no longer a premium feature. FreeSync and G-Sync compatibility are standard on inexpensive monitors, and on such a display the tearing VSync exists to prevent is already handled -- while VSync itself is a straightforward latency increase, because a finished frame waits for the panel instead of being shown.<\/p><p>So the trade VSync offers is one almost nobody running this app wants to take: pay latency to solve a problem their monitor already solves.<\/p><p>The residual tension is small and worth naming anyway. This app&#x27;s own *&quot;Adaptive sync monitor&quot;* option has an <strong>off<\/strong> state, which exists because some users have neither G-Sync nor FreeSync, and those users get tearing with no way to ask for VSync back. If tearing reports ever arrive, this is the entry they belong to, and the fix is the same shape as the ambient occlusion method in the shadows paper: a three-state option that can also say *leave it alone*.<\/p><p><strong>One connection worth following.<\/strong> The standard practice on an adaptive-sync display is to sit slightly below the panel&#x27;s maximum refresh rate, which means a frame cap. This project deliberately stopped writing one -- see <code>t.MaxFPS<\/code> below -- so that cap comes from the game, the driver, or the user&#x27;s own limiter. The two decisions were made separately and agree: we remove the synchronisation and we decline to set the limit that would replace it, leaving the limit to whoever knows the monitor.<\/p>","filled":true},{"name":"r.D3D12.UseAllowTearing","status":"active","ourValue":"1; 0 when \"Adaptive sync monitor\" is unticked","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"The D3D12 renderer.","visualsHtml":"Allows the swap chain to present without waiting for the display&#x27;s refresh. It is the mechanism variable refresh rate needs -- G-Sync and FreeSync work by the monitor following the game, which requires the game to present when it is ready.","performanceHtml":"It is what makes uncapped, unsynchronised presentation possible at all. Without it, presentation falls back to waiting.","definitionHtml":"Permits the DXGI swap chain to use the allow-tearing presentation flag.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, and correctly follows the *&quot;Adaptive sync monitor&quot;* option: a display with variable refresh needs this on, and one without it does not.<\/p><p><strong>The audit found a contradiction in the source configuration here<\/strong>, and it is worth keeping as a warning about how these files are assembled: *&quot;This also contradicts line 15&#x27;s value 0; the later ConsoleVariables value would win.&quot;* The same command appeared twice at two different values, in two sections, and only the second one did anything. Nothing in the file said so.<\/p><p>That is the one command in the whole audit that the source config wrote at two different values, and it is why this project resolves each command to exactly one value before writing anything.<\/p>","filled":true},{"name":"r.FinishCurrentFrame","status":"active","ourValue":"0; 1 when \"Lowest input lag\" is ticked","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"At 1 the CPU waits for the GPU to finish the current frame before starting the next. That removes a frame of buffering, so input reaches the screen sooner -- and it removes the overlap that keeps both processors busy, so throughput drops. The audit: *&quot;value 1 reduces buffering/latency but harms throughput.&quot;*","definitionHtml":"Forces the render thread to complete the current frame before beginning the next.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default and is offered as a user option, which is the right shape: latency against frame rate is a preference, not a fact, and it is the trade *&quot;Lowest input lag&quot;* exists to make.<\/p>","filled":true},{"name":"r.OneFrameThreadLag","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"The game thread runs one frame ahead of the render thread. That is what lets both stay busy; without it each waits for the other and the frame rate falls, in exchange for one frame less latency.","definitionHtml":"Allows the render thread to lag the game thread by one frame.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p><p>It is the same trade as <code>r.FinishCurrentFrame<\/code> at a different point in the pipeline, and only one of the two is offered to the user. That is deliberate rather than an oversight: they are not independent, and exposing both would let somebody remove two frames of buffering at once and then wonder why the frame rate collapsed.<\/p>","filled":true},{"name":"t.Streamline.Reflex.Mode","status":"active","ourValue":"not written by default; 0 when \"Turn off NVIDIA Reflex\" is ticked","engineDefault":"set by NVIDIA's plugin, not by Epic.","valueRange":"0 disables Reflex. Other values exist and their meanings are not documented in any source this project has checked.","appliesWhen":"Only in a game that ships the NVIDIA Streamline plugin. Elsewhere it is an unknown name and is ignored.","visualsHtml":"None directly. Reflex changes when frames are submitted, not what is in them -- but frame *pacing* is visible, and that is the whole point of this entry.","performanceHtml":"Reflex reduces input latency by keeping the CPU from running too far ahead of the GPU. In some games the way it does that disturbs frame pacing, producing stutter that is worse to look at than the latency it removes.","definitionHtml":"The Reflex mode for NVIDIA&#x27;s Streamline integration. 0 disables it.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>This is the only command in the entire review that moved OUT of the NO EFFECT block rather than into it.<\/strong><\/p><p>Read the audit&#x27;s grading again: *&quot;Not a stock UE5 CVar. It belongs to NVIDIA Streamline/Reflex integration and only disables that plugin when present.&quot;*<\/p><p>That rejects the line for not being <strong>Epic&#x27;s<\/strong>, which was the audit&#x27;s job. It does not say the line does nothing -- it says the opposite, in the same sentence. And so it sat in a block headed NO EFFECT while being one of the most effective settings in the file for this project&#x27;s own reference game.<\/p><p><strong>Mortal Shell 2 has visible frame-pacing problems with Reflex enabled and no menu option to switch it off.<\/strong> Writing 0 resolves them, and measured latency stays good. That is the maintainer&#x27;s measurement and it outranks the classification.<\/p><p>It is a <strong>user option<\/strong> rather than a forced value because that is a fact about one game and not about the engine. Reflex is normally worth having. Most of the titles on this list are single-player games where its benefit is small and its risk to frame pacing is not, so the default leaves the game alone and the game notes tell affected players to tick the box.<\/p><p>Only 0 is offered. The audit documents no value meanings, and claiming to know what 1 or 2 select would be inventing a fact about somebody else&#x27;s plugin.<\/p><p>The general lesson is the mirror of the one the rest of this review keeps finding. The NO EFFECT block was read as *&quot;these do nothing&quot;*, and it never said that -- it said *&quot;these were rejected&quot;*. Five Lumen commands were rejected and harmful; this one was rejected and useful. Only reading them tells you which.<\/p>","filled":true},{"name":"t.MaxFPS","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"0, meaning uncapped.","valueRange":"a frame rate. 0 is no limit.","appliesWhen":"Always.","visualsHtml":"None directly. A frame cap changes pacing, not content.","performanceHtml":"A cap costs frames above it and gives back power, temperature and, on some hardware, more consistent pacing below it.","definitionHtml":"The engine&#x27;s frame rate limiter.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>This is where the pinning rule breaks, and it is worth understanding rather than patching.<\/strong><\/p><p>Everywhere else in this project, writing the engine&#x27;s documented default is free: the value we write is the value the engine would have chosen, so a game that had moved it gets brought back and a game that had not is unaffected.<\/p><p>Here the default means *no limit*, and our file outranks the game&#x27;s own configuration. So <code>t.MaxFPS=0<\/code> does not preserve the engine&#x27;s behaviour -- it <strong>removes a cap the game set on purpose<\/strong>. Some games cap for good reasons, including physics that misbehaves at high frame rates.<\/p><p>The audit said it plainly and this review took two passes to hear it: *&quot;Omit it so the game and user-selected limiter remain authoritative.&quot;*<\/p><p>Switched off. A frame-limit control may be worth adding later as a user option, but it would need real values rather than a single 0, and nothing in the audit supplies them.<\/p>","filled":true},{"name":"r.GTSyncType","status":"not used","ourValue":"not written since 2026-08-31; was 2","engineDefault":"none published. The audit names 2 as *\"the current stock low-latency mode\"* without naming a default.","valueRange":"0 upwards; the modes are not documented in any source this project has checked.","appliesWhen":"Only with VSync on. It is a synchronisation mode, and there is nothing to synchronise with when presentation is unsynchronised.","visualsHtml":"Where it works, it changes when frames are handed to the display, which affects pacing rather than content.","performanceHtml":"The audit: *&quot;trades hitch tolerance for latency&quot;*. It also *&quot;relies on swap-chain/VSync frame pacing and coordinated settings&quot;*.","definitionHtml":"The game-thread synchronisation mode used for frame pacing.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where no default is published","notesHtml":"<p>Switched off for two reasons that agree.<\/p><p><strong>It could not work.<\/strong> The audit spotted the contradiction directly: it *&quot;relies on swap-chain/VSync frame pacing&quot;* and *&quot;contradicts the earlier r.VSync=0&quot;*. This project writes VSync off, so a VSync-dependent pacing mode had nothing to act on.<\/p><p><strong>And there is nothing to pin.<\/strong> No default is published, so the pinning rule that saves most of the commands in this file has no value to fall back to. That is the same position as <code>r.AmbientOcclusion.Method<\/code> in the shadows paper and <code>PoolSizeVRAMPercentage<\/code> in the textures one -- and unlike those two, this command is not doing anything useful in the meantime.<\/p><p>The audit&#x27;s own condition was *&quot;keep only in a tested platform/display latency profile&quot;*. This is not one.<\/p>","filled":true},{"name":"bSmoothFrameRate","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"set in the engine's own configuration, not as a console variable.","valueRange":"not applicable in the section it was written to.","appliesWhen":"Never as written.","visualsHtml":"None as written.","performanceHtml":"None as written.","definitionHtml":"A real engine configuration property that enables frame rate smoothing, but not a console variable -- so it does nothing in a <code>[ConsoleVariables]<\/code> section. The audit adds that smoothing is *&quot;a user/title pacing policy&quot;* in any case.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off, and it is a failure mode this review has not seen before: not a wrong name, not an obsolete one, but a <strong>real setting written in the wrong kind of section<\/strong>.<\/p><p>Engine configuration properties and console variables live in the same file and look identical. One is read by the section it is in and the other is not.<\/p>","filled":true},{"name":"D3D12.MaximumFrameLatency","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this name.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock D3D12 option under this name. Frame latency is controlled through supported presentation settings.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Also missing the <code>r.<\/code> prefix that every real D3D12 setting in this engine carries -- the same mistake as <code>D3D12.RayTracing.AllowSpecializedStateObjects<\/code> in the ray tracing paper, in the same namespace.<\/p>","filled":true},{"name":"r.RHIThread","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this name. The real command is `r.RHIThread.Enable`.","valueRange":"not applicable as written.","appliesWhen":"Never as written.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"The RHI thread is the one that talks to the graphics driver. This name is obsolete; the current control is <code>r.RHIThread.Enable<\/code>, with <code>-rhithread<\/code> on the command line. The audit: *&quot;Do not substitute or force it universally.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where only r.RHIThread.Enable exists","notesHtml":"<p>Switched off, with the do-not-substitute warning preserved. The seventh such warning in this review, and one of the clearest cases for heeding it: whether the RHI thread should exist is a platform decision the engine makes at startup.<\/p>","filled":true},{"name":"r.RHIThread.Priority","status":"not used","ourValue":"not written since 2026-08-31; was 2","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar. The audit: *&quot;Thread priority should remain engine/platform controlled.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. A companion invented beside an obsolete name -- the same pattern as the MegaLights shadow cache and its <code>MaxAge<\/code>, and the streaming predictive boost and its <code>HintSize<\/code>.<\/p><p>Thread priority is worth one extra sentence, because it is a category of setting rather than a single command: raising one thread&#x27;s priority does not create CPU time, it takes it from another thread in the same process. On a machine that is not oversubscribed it changes nothing, and on one that is it usually moves the problem.<\/p>","filled":true},{"name":"r.Occlusion.SingleRHIThreadStall","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar with this exact name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Occlusion query stalls are a real subject and are covered properly in the occlusion and culling paper <script id="home-prose" type="text/plain"><h3>What the app actually does</h3>

<p>Unreal Engine 5 exposes several thousand <strong>console variables</strong> —
runtime switches and numbers that control the renderer. A game reads them from a
chain of configuration files, and the last file in that chain, the one in your
own user folder, wins.</p>

<p>UE5 Tuner writes that file:</p>

<p><code>%LOCALAPPDATA%\&lt;Game&gt;\Saved\Config\Windows\Engine.ini</code></p>

<p>It clears the read-only flag, keeps the game's own contents, appends its own
block underneath, and sets the file read-only again so the game cannot overwrite
it on the next launch. Later lines win, which is why appending works.</p>

<h3>Why this document exists</h3>

<p>A tuned <code>Engine.ini</code> circulating on a forum is a list of assertions
with no evidence attached. Somebody set <code>r.MotionBlur.Amount</code> to
<code>0.25</code>, and nothing in the file says what the engine would have done
instead, whether the number helps, or whether the command is even real.</p>

<p>This document is the missing half. Every command the app writes has an entry
here recording what it does inside the renderer, what the engine's own default
is, what we write, and — where those differ — the reasoning and the evidence.</p>

<p>Entries that were <strong>removed</strong> are kept too. "Why is this not in
my file any more" is a question people arrive with, and the only place that can
answer it is a document the deletion did not touch.</p>

<h3>How to read an entry</h3>

<table>
  <tr><th>Field</th><th>Means</th></tr>
  <tr><td>status</td><td><code>active</code> — the app writes it.
    <code>not used</code> — kept in the data, written nowhere.
    <code>dropped</code> — gone entirely.</td></tr>
  <tr><td>our value</td><td>What lands in your file, including any difference
    between presets or user options.</td></tr>
  <tr><td>engine default</td><td>What the engine does when nobody says
    anything. Where Epic publishes no default, the entry says so rather than
    inventing one.</td></tr>
  <tr><td>value range</td><td>Every value the command accepts, with meanings
    where they are named rather than numeric.</td></tr>
  <tr><td>applies when</td><td>The conditions under which the command does
    anything at all. Roughly a third of them are narrower than their name
    suggests.</td></tr>
  <tr><td>effect on visuals</td><td>What changes on screen, described so it can
    be looked for rather than taken on faith.</td></tr>
  <tr><td>effect on performance</td><td>Which direction, and how the cost
    scales. "Negligible" is used only where it is true.</td></tr>
  <tr><td>technical definition</td><td>What the command does inside the
    renderer, not what it is for.</td></tr>
  <tr><td>technical evidence</td><td>How the entry was checked.
    <strong>CLAUDE FABLE 5 verified against Epic documentation</strong> — read
    against Epic's published pages and the engine's console variable
    reference.
    <strong>Reverse Engineered Memory Reading verified</strong> — the value was
    read out of a running game's memory, which is the only way to settle a
    default Epic has changed between revisions without saying so. An entry may
    carry both.</td></tr>
  <tr><td>verified against</td><td>Which engine revision the facts were checked
    against. Several UE5 defaults have moved between versions and are not
    version-tagged in Epic's reference.</td></tr>
</table>

<p>A <span style="color:var(--warn)">differs</span> tag on an entry means our
value is not the engine's. Those are the ones worth reading.</p>

<h3>The three presets</h3>

<ul>
  <li><strong>Quality</strong> — spends frames on looks. It is the only preset
    permitted to exceed Epic's own settings.</li>
  <li><strong>Recommended</strong> — the default. It should be Epic's settings
    plus fixes, not a quality preset in disguise.</li>
  <li><strong>Performance</strong> — gives cost back, using values Epic
    documents.</li>
</ul>

<p>Separately, <strong>options</strong> describe the user rather than a taste:
an adaptive-sync monitor, an HDR display, a laptop on battery, a dislike of
motion blur. An option beats a preset, because a fact about the machine outranks
a choice from a list.</p>

<h3>The rules this document is held to</h3>

<ul>
  <li><strong>A preset split needs two numbers Epic already published.</strong>
    Where a value is the maintainer's own, measured rather than documented, the
    entry says so in its first line. Three entries are in that position.</li>
  <li><strong>A documented default is worth pinning.</strong> Writing the value
    the engine would have chosen looks pointless, and is not: a game ships its
    own configuration file, and nothing stops its developers setting something
    else. Pinning costs one line and cannot make anything worse.</li>
  <li><strong>An experiment is a question, not an answer.</strong> Where Epic's
    own guidance is "test this on your workload", shipping one side of the test
    to everybody turns a question into a silent claim. Those settings are behind
    a switch that writes the engine's value until somebody chooses.</li>
  <li><strong>A permission is not a setting.</strong> Several commands only
    grant the renderer leave to use a more expensive path. Granting one the game
    never asked for cannot make anything faster.</li>
</ul>

<h3>The NO EFFECT block</h3>

<p>The generated file ends with several hundred commands the original audit
graded as invalid, obsolete, placebo, or specific to one plugin or one game.
They were written out anyway on the reasoning that the engine ignores names it
does not know.</p>

<p>That reasoning does not survive contact with the exceptions. Reviewing the
block category by category has repeatedly turned up commands the audit itself
grades <em>valid</em>, forced away from their documented defaults — task
granularity, cache eviction rates, ray tracing state objects, and one setting
that selected the anti-aliasing method behind the user's back while the app
offered them a choice of it.</p>

<p>Each of those is documented here alongside the live commands of the category
it belongs to, marked <code>not used</code>, with the reason it was rejected and
the reason it stopped being written.</p>

<h3>Status of the work</h3>

<p>This is an audit in progress, worked category by category in the order the
app shows them. A category listed without a count in the sidebar has not been
written up yet — its commands are still being written into the file, they simply
have no entry here.</p>

<p>Nothing on this page is generated from the shipping configuration. The papers
are written by hand and read no other file, so they are free to say things the
configuration cannot — including that a value was wrong.</p>
</script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("data").textContent);
  var HOME = document.getElementById("home-prose").textContent;
  var CATS = DATA.categories;
  var navEl = document.getElementById("nav");
  var mainEl = document.getElementById("main");
  var qEl = document.getElementById("q");

  var filled = function (c) { return c.commands.filter(function (e) { return e.filled; }); };
  var written = CATS.filter(function (c) { return filled(c).length; });

  document.getElementById("brandsub").textContent =
    DATA.counts.filled + " commands documented across " + written.length + " of " + CATS.length + " categories";

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    for (var k in attrs || {}) {
      if (k === "html") n.innerHTML = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  // ------------------------------------------------------------- nav
  navEl.appendChild(el("li", {}, [link("home", "00", "Overview", "", false)]));
  CATS.forEach(function (c, i) {
    var n = filled(c).length;
    navEl.appendChild(el("li", {}, [
      link(c.id, pad(i + 1), c.title, n ? String(n) : "—", !n)
    ]));
  });

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function link(id, num, title, count, empty) {
    var a = el("a", { href: "#" + id, "data-id": id }, [
      el("span", { class: "num", text: num }),
      el("span", { text: title }),
      el("span", { class: "count", text: count })
    ]);
    if (empty) a.className = "empty";
    return a;
  }

  // ------------------------------------------------------------ pages
  function statusBadge(s) {
    var cls = s === "active" ? "b-active" : s === "dropped" ? "b-dropped" : "b-notused";
    return el("span", { class: "badge " + cls, text: s || "?" });
  }

  // CSS cuts these to the column width. This only stops a 400-character value
  // from being handed to the layout in the first place.
  function shortValue(v) {
    if (!v) return "—";
    return v.length > 90 ? v.slice(0, 88) + "…" : v;
  }

  function differs(e) {
    var a = (e.ourValue || "").trim(), b = (e.engineDefault || "").trim();
    if (!a || !b) return false;
    if (a === b) return false;
    // "1" vs "1 where the platform supports it" is not a difference.
    return b.indexOf(a) !== 0 && a.indexOf(b) !== 0;
  }

  // "ai" and "memory" are how the source file records the grade. Neither means
  // anything to a reader, so the page spells both out. "ai+memory" is both.
  function evidenceChips(v) {
    var wrap = el("span", { class: "ev" });
    (v || "none").split("+").forEach(function (part) {
      var k = part.trim();
      if (k === "ai")
        wrap.appendChild(el("span", { class: "chip ev-ai",
          text: "CLAUDE FABLE 5 verified against Epic documentation" }));
      else if (k === "memory")
        wrap.appendChild(el("span", { class: "chip ev-mem", text: "Reverse Engineered Memory Reading verified" }));
      else
        wrap.appendChild(el("span", { class: "chip ev-none", text: "not yet checked" }));
    });
    return wrap;
  }

  function commandCard(e) {
    var rows = [];
    function row(label, value, mono) {
      if (!value) return;
      rows.push(el("dt", { text: label }));
      rows.push(el("dd", mono ? { class: "mono", text: value } : { html: value }));
    }
    function rowNode(label, node) {
      rows.push(el("dt", { text: label }));
      rows.push(el("dd", {}, [node]));
    }
    row("our value", e.ourValue, true);
    row("engine default", e.engineDefault, true);
    row("value range", e.valueRange, true);
    row("applies when", e.appliesWhen);
    row("effect on visuals", e.visualsHtml);
    row("effect on performance", e.performanceHtml);
    row("technical definition", e.definitionHtml);
    rowNode("technical evidence", evidenceChips(e.evidence));
    row("verified against", e.verifiedAgainst);

    var body = [el("dl", { class: "kv" }, rows)];
    if (e.notesHtml) body.push(el("div", { class: "notes", html: e.notesHtml }));
    if (e.sources && e.sources.length) {
      body.push(el("div", { class: "srcs" }, e.sources.map(function (u) {
        return el("a", { href: u, target: "_blank", rel: "noreferrer", text: u });
      })));
    }

    var tags = [statusBadge(e.status)];
    if (differs(e)) tags.push(el("span", { class: "badge b-differs", text: "differs" }));

    var head = [
      el("span", { class: "chev", text: "▶" }),
      el("span", { class: "cname", title: e.name, text: e.name }),
      el("span", { class: "tags" }, tags)
    ];
    head.push(el("span", { class: "vals" }, [
      el("span", { class: "ours", title: e.ourValue || "", text: shortValue(e.ourValue) }),
      el("span", { class: "arrow", text: "vs" }),
      el("span", { class: "def", title: e.engineDefault || "", text: shortValue(e.engineDefault) })
    ]));

    var d = el("details", { class: "cmd", id: "c-" + e.name.toLowerCase() }, [
      el("summary", {}, head),
      el("div", { class: "body" }, body)
    ]);
    d.dataset.name = e.name.toLowerCase();
    return d;
  }

  function categoryPage(c) {
    var list = filled(c);
    var parts = [
      el("div", {}, [
        el("span", { class: "cat-id", text: c.id }),
        el("h2", { class: "cat", text: c.title })
      ])
    ];
    if (c.introHtml) parts.push(el("div", { class: "intro", html: c.introHtml }));

    if (!list.length) {
      parts.push(el("p", { class: "empty-note", text: "Not written yet." }));
      return el("div", {}, parts);
    }

    parts.push(el("div", { class: "bar" }, [
      el("button", { type: "button", "data-act": "open", text: "Expand all" }),
      el("button", { type: "button", "data-act": "close", text: "Collapse all" }),
      el("span", { class: "n", text: list.length + " commands" })
    ]));
    parts.push(el("hr", { class: "rule" }));
    list.forEach(function (e) { parts.push(commandCard(e)); });
    return el("div", {}, parts);
  }

  function homePage() {
    var wrap = el("div", {});
    wrap.appendChild(el("div", { class: "hero" }, [
      el("h2", { text: "The engineering record behind every line we write" }),
      el("p", {
        class: "lede",
        text: "UE5 Tuner writes an Engine.ini into a game's configuration folder. "
            + "This document accounts for every console variable in that file: what "
            + "it does inside the renderer, what value the engine would have chosen "
            + "on its own, what ours is, and why the two differ."
      })
    ]));

    var stats = el("div", { class: "stats" }, [
      stat(DATA.counts.filled, "documented"),
      stat(written.length + " / " + CATS.length, "categories"),
      stat(DATA.counts.open, "still open"),
      stat(DATA.generated, "last built")
    ]);
    wrap.appendChild(stats);
    wrap.appendChild(el("div", { class: "prose", html: HOME }));
    wrap.appendChild(el("footer", {
      text: "Built from the source papers on " + DATA.generated + ". Schema " + DATA.schema + "."
    }));
    return wrap;
  }

  function stat(v, label) {
    return el("div", { class: "stat" }, [
      el("b", { text: String(v) }), el("span", { text: label })
    ]);
  }

  // ----------------------------------------------------------- router
  function show(id) {
    mainEl.innerHTML = "";
    var cat = null;
    for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) cat = CATS[i];
    mainEl.appendChild(cat ? categoryPage(cat) : homePage());
    Array.prototype.forEach.call(navEl.querySelectorAll("a"), function (a) {
      a.classList.toggle("on", a.dataset.id === (cat ? id : "home"));
    });
    mainEl.scrollIntoView({ block: "start" });
    applyFilter();
  }

  window.addEventListener("hashchange", function () {
    show((location.hash || "#home").slice(1));
  });

  mainEl.addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("button[data-act]") : null;
    if (!b) return;
    var open = b.dataset.act === "open";
    Array.prototype.forEach.call(mainEl.querySelectorAll("details.cmd"), function (d) {
      d.open = open;
    });
  });

  // ----------------------------------------------------------- filter
  function applyFilter() {
    var q = qEl.value.trim().toLowerCase();
    var cards = mainEl.querySelectorAll("details.cmd");
    var shown = 0;
    Array.prototype.forEach.call(cards, function (d) {
      var hit = !q || d.dataset.name.indexOf(q) !== -1;
      d.classList.toggle("hidden", !hit);
      if (hit) shown++;
    });
    var n = mainEl.querySelector(".bar .n");
    if (n) n.textContent = q ? shown + " of " + cards.length + " commands" : cards.length + " commands";
  }
  qEl.addEventListener("input", applyFilter);

  show((location.hash || "#home").slice(1));
})();
</script>
</body>
</html>
