a large and orderly namespace, which makes it unusually easy to write a name that looks exactly like one of its settings and is not.<\/p>","filled":true}]},{"id":"shader-stutter","title":"Shader Compilation & Stutter","introHtml":"<p>The single most complained-about thing in UE5 games is the hitch when a shader compiles for the first time. A pipeline state object -- a PSO -- is the compiled combination of shaders and render state a draw call needs, and building one takes milliseconds. Build it while the player is looking at an explosion and the frame stops.<\/p><p>Every real setting in this category is one of three answers to that. <strong>Build them earlier<\/strong>, from a cache the game shipped. <strong>Keep them longer<\/strong>, so they are not rebuilt. <strong>Spread the building out<\/strong>, so the cost lands as pressure rather than as a stall.<\/p><p>The category was doing the first and third and working against the second.<\/p><p><strong>A fourth answer has since been added, and it is the only one that needs nothing from the game.<\/strong> Eight <code>r.PSOPrecache.*<\/code> commands build the recipes ahead of time from the materials already in the level, rather than from a cache the developer had to ship. They are live but <strong>off by default<\/strong>, behind an experimental checkbox, because they are the maintainer&#x27;s knowledge rather than the audit&#x27;s and because one of them -- the wait that makes precaching worth anything -- can show a missing or grey object instead of a stutter if it is wrong. That is the one failure in this project that a player would see rather than feel, so it is opt-in until somebody measures it.<\/p><p>**<code>r.pso.evictiontime<\/code> was 30 against Epic&#x27;s 60**, halving how long a compiled pipeline state survives before being discarded -- and rebuilding a discarded PSO mid-frame *is* the stutter. One line, pointed directly against the purpose of the fourteen around it. It is 60 now.<\/p><p><strong>Thirty-five names sat in the NO EFFECT block<\/strong>, the largest inert list of any category, and most of them share one mistake. Shader compilation in Unreal is something that happens on a <strong>developer&#x27;s machine<\/strong>, in the editor and during cook. Twelve of the thirty-five are real developer settings written into a player&#x27;s configuration file, where they describe work that finished months before the game shipped.<\/p><p>Two more silenced the shader compilation log -- the seventh and eighth log category found in this review, in the fifth category to do it.<\/p>","commands":[{"name":"r.pso.evictiontime","status":"active","ourValue":"60","engineDefault":"60, in seconds","valueRange":"a time in seconds.","appliesWhen":"Always.","visualsHtml":"None directly.","performanceHtml":"<strong>This is the retention time for compiled pipeline states.<\/strong> A PSO that is evicted must be rebuilt the next time it is needed, and rebuilding one mid-frame is exactly the hitch this category exists to remove. Longer retention means fewer rebuilds and more memory held.","definitionHtml":"How long an unused PSO remains in the cache before eviction.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>We wrote <strong>30<\/strong> until 2026-08-31, halving Epic&#x27;s retention in a category whose other fourteen settings are aimed at reducing stutter.<\/p><p>The audit is unambiguous: *&quot;Faster eviction may save memory but can cause more PSO recreation and hitches.&quot;*<\/p><p><strong>Higher than 60 should keep helping.<\/strong> A single-player game has a bounded set of pipeline states, so a long eviction time converges on keeping all of them, and the memory a PSO occupies is small next to what it costs to rebuild one. That is a plausible improvement and the audit names only 60, so 60 is what gets written until somebody measures a longer one.<\/p>","filled":true},{"name":"r.ShaderPipelineCache.Enabled","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Only where the game ships or has recorded a compatible pipeline file cache.","visualsHtml":"None directly.","performanceHtml":"<strong>The switch the whole category is built on.<\/strong> With a cache present, the game&#x27;s pipeline states are compiled ahead of use instead of at the moment they are first drawn.","definitionHtml":"Enables the shader pipeline cache system.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Departs from Epic&#x27;s default deliberately, and the reasoning is the asymmetry rather than confidence.<\/p><p>The audit&#x27;s objection is that it *&quot;may do nothing&quot;*: *&quot;Only useful when the game ships or records a compatible PipelineFileCache; blindly enabling an absent/incomplete cache adds nothing.&quot;* It does not say it may do harm.<\/p><p>Epic defaults it off because they cannot know whether a given project has a cache. Neither can this app -- but the upside is removing the worst stutter UE5 games have, and the downside is a line that does nothing. Those are not comparable risks.<\/p><p>It is the same shape of argument as <code>r.Lumen.HardwareRayTracing<\/code> in the ray tracing paper and <code>r.VRS.Enable<\/code> in the variable rate shading one: a non-default that is the point of its category.<\/p>","filled":true},{"name":"r.ShaderPipelineCache.PreOptimizeEnabled","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Only alongside a valid pipeline cache and a startup flow that allows for it.","visualsHtml":"None.","performanceHtml":"Compiles cached pipeline states before they are first needed rather than when the game reaches them. It moves the cost into startup.","definitionHtml":"Enables pre-optimisation of the shader pipeline cache.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The same asymmetry as <code>Enabled<\/code> above: it moves compilation off the moment it would be seen, or it does nothing.<\/p><p>The audit&#x27;s caveat -- *&quot;only makes sense when the title supplies a compatible cache and startup flow&quot;* -- is about whether it applies, not about what happens when it does.<\/p>","filled":true},{"name":"r.ShaderPipelineCache.GameFileMaskEnabled","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Only where the title recorded its cache with usage masks.","visualsHtml":"None.","performanceHtml":"Usage masks let the cache compile only the pipeline states a particular part of the game needs, instead of everything at once.","definitionHtml":"Enables game file mask filtering for the pipeline cache.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The weakest of the six anti-stutter bets<\/strong>, and worth marking as such.<\/p><p>The others need the game to have a cache. This one needs the game to have recorded that cache *with masks*, which is a build-time choice a smaller number of projects will have made. The audit calls it *&quot;title-build policy&quot;*.<\/p><p>It costs nothing where it does not apply, which is why it stays -- but if any of the six is doing nothing for most players, it is this one.<\/p>","filled":true},{"name":"r.ShaderPipelineCache.BackgroundBatchSize","status":"active","ourValue":"4","engineDefault":"1","valueRange":"a batch count.","appliesWhen":"While the pipeline cache compiles in the background during play.","visualsHtml":"None directly.","performanceHtml":"How many pipeline states are compiled per background batch. Larger batches warm the cache sooner and take more of each frame while doing it.","definitionHtml":"The batch size for background pipeline cache compilation.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai+benchmark","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The maintainer&#x27;s value, measured.<\/strong> Four times Epic&#x27;s 1.<\/p><p>The audit: *&quot;A larger background batch can reduce warm-up time while increasing frame-time pressure.&quot;* Background compilation runs while the game is playing, so this trades a little of every frame now against the risk of a full stall later -- which is the bargain the entire category is built on, taken in the direction of getting it over with.<\/p><p>**Read it beside <code>BatchSize<\/code> below, which points the opposite way.** That is deliberate, and the reason is in that entry.<\/p>","filled":true},{"name":"r.ShaderPipelineCache.BatchSize","status":"active","ourValue":"30","engineDefault":"50","valueRange":"a batch count.","appliesWhen":"The foreground pipeline cache pass, with a valid title cache.","visualsHtml":"None directly.","performanceHtml":"The audit: *&quot;Smaller batches can reduce one-frame compilation work but prolong cache warmup.&quot;*","definitionHtml":"The batch size for foreground pipeline cache compilation.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai+benchmark","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The maintainer&#x27;s value, measured<\/strong>, and it points the <strong>opposite way<\/strong> to <code>BackgroundBatchSize<\/code> above -- that one was raised four times, this one lowered.<\/p><p>That is not an inconsistency. The two batches run in different places. The background batch happens during play, where warming up sooner is worth a little pressure spread across many frames. This one runs in the foreground pass, where a large batch is not pressure at all -- it is a single long stall.<\/p><p>Bigger where the cost can be spread, smaller where it cannot.<\/p>","filled":true},{"name":"r.ShaderPipelineCache.PrecompileBatchSize","status":"active","ourValue":"30","engineDefault":"50","valueRange":"a batch count.","appliesWhen":"Pre-optimisation of a valid PSO cache.","visualsHtml":"None.","performanceHtml":"The same trade as <code>BatchSize<\/code>, during pre-optimisation.","definitionHtml":"The batch size used when pre-optimising the pipeline cache.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai+benchmark","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The maintainer&#x27;s value, measured, and it moves with <code>BatchSize<\/code> for the same reason: both are foreground work, where a large batch shows up as one long pause rather than as pressure spread across frames.<\/p>","filled":true},{"name":"r.ShaderPipelineCache.BatchTime","status":"active","ourValue":"16","engineDefault":"16, in milliseconds","valueRange":"a time budget in milliseconds.","appliesWhen":"The foreground pipeline cache pass.","visualsHtml":"None.","performanceHtml":"The time budget a batch may occupy. 16 ms is one frame at 60 fps, which is why it is the default -- it is the largest budget that can still fit inside a frame.","definitionHtml":"The per-batch time budget for pipeline cache compilation.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p><p>Worth noticing beside the batch <strong>sizes<\/strong> above: the count was lowered and the time budget was not. A batch is bounded by whichever limit it reaches first, so the two together say *compile fewer states, but give them as long as before*.<\/p>","filled":true},{"name":"r.ShaderPipelineCache.PrecompileBatchTime","status":"active","ourValue":"16","engineDefault":"**disputed.** The reference's table and help text disagree.","valueRange":"a time budget in milliseconds.","appliesWhen":"Pre-optimisation of a valid PSO cache.","visualsHtml":"None.","performanceHtml":"The time budget for a pre-optimisation batch, at startup rather than during play.","definitionHtml":"The per-batch time budget during pipeline cache pre-optimisation.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the table and help disagree","notesHtml":"<p><strong>The fourth documentation conflict found in this review<\/strong>, after <code>r.RayTracing.Culling.Radius<\/code>, <code>r.SSR.Temporal<\/code> and <code>r.Emitter.FastPoolEnable<\/code>. The audit&#x27;s wording is *&quot;current table/help contains legacy default wording&quot;*, so there is a correct answer and the reference does not reliably state it.<\/p><p>16 is kept because it matches <code>BatchTime<\/code> above and one frame is a defensible budget for work at startup. It is a candidate for a <code>memory<\/code> grade: reading the value out of a running game would settle what the documentation cannot.<\/p>","filled":true},{"name":"niagara.CreateShadersOnLoad","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Games using Niagara, which is most UE5 games.","visualsHtml":"None directly.","performanceHtml":"Niagara compiles an effect&#x27;s shaders the first time the effect is used -- typically the first explosion, which is the worst possible moment for a hitch. Creating them on load moves that cost into the loading screen.","definitionHtml":"Creates Niagara shaders at load time rather than on first use.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Departs from Epic&#x27;s default, and <strong>unlike the pipeline cache settings this one always does something<\/strong> where Niagara is used.<\/p><p>That makes its cost real rather than conditional. The audit: *&quot;Can reduce first-use Niagara hitches but increases startup time and memory.&quot;* Shaders are created for effects that may never be triggered, and held.<\/p><p>It is kept because the trade is the category&#x27;s own: a longer loading screen against a hitch during play, and the loading screen is where a player expects to wait.<\/p>","filled":true},{"name":"D3D12.PSO.DiskCache","status":"active","ourValue":"1","engineDefault":"**disputed.** The reference's table and help disagree.","valueRange":"0 or 1","appliesWhen":"The D3D12 renderer.","visualsHtml":"None.","performanceHtml":"Persists compiled pipeline states to disk between runs, so the second launch of a game is smoother than the first.","definitionHtml":"Enables the D3D12 pipeline state disk cache.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the table and help disagree","notesHtml":"<p><strong>The fifth documentation conflict<\/strong>, and the clearest win available in this category despite it.<\/p><p>Every other setting here moves compilation to a better moment *within* a session. This one removes it from the next session entirely. A player&#x27;s second launch should be measurably smoother than their first, and that benefit compounds over every launch afterwards.<\/p>","filled":true},{"name":"D3D12.PSO.DriverOptimizedDiskCache","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"The D3D12 renderer.","visualsHtml":"None.","performanceHtml":"The driver&#x27;s own optimised form of the same cache, which can produce better pipeline states than the generic one.","definitionHtml":"Enables the driver-optimised D3D12 PSO disk cache.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The second half of the disk cache decision, and the riskier half.<\/p><p>It is machine-specific by definition, which is why Epic ships it off: a cache tied to one driver version must be invalidated when that driver changes, and the audit&#x27;s caveat is exactly that -- *&quot;needs invalidation/storage testing&quot;*. Getting it wrong means stale pipeline states rather than a slow first run.<\/p><p>Kept as a pair with <code>D3D12.PSO.DiskCache<\/code> above. If either is ever revisited, both should be.<\/p>","filled":true},{"name":"r.Shaders.Optimize","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Shader compilation, which in a packaged game has already happened.","visualsHtml":"None from a player&#x27;s configuration.","performanceHtml":"None from a player&#x27;s configuration.","definitionHtml":"Whether shaders are compiled with optimisation. The audit: *&quot;packaged shaders are already compiled.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, and it is the fifth build-time setting found in a runtime file -- after <code>r.PreTileTextures<\/code> in the textures paper and three in Lumen, Nanite and foliage.<\/p><p>Harmless, and worth reading as a signpost: it marks the boundary between this category&#x27;s real settings and the twelve developer options in the block below, which are the same mistake made without the safety of being a default.<\/p>","filled":true},{"name":"r.Shaders.RemoveDeadCode","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Shader preprocessing, at build time.","visualsHtml":"None from a player&#x27;s configuration.","performanceHtml":"None from a player&#x27;s configuration.","definitionHtml":"Removes unreachable code during shader preprocessing.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. Build-time, like the entry above.<\/p>","filled":true},{"name":"r.SupportAllShaderPermutations","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Shader compilation.","visualsHtml":"None at 0.","performanceHtml":"At 1 the engine compiles every permutation of every shader rather than the ones the project needs, which multiplies compilation time and package size enormously.","definitionHtml":"Forces compilation of all shader permutations rather than the required set.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, and this is one of the more valuable pins in the project despite doing nothing in a packaged game. The name reads like *support everything*, which sounds like a compatibility fix, and it is the opposite of one.<\/p>","filled":true},{"name":"r.PSOPrecaching","status":"active","ourValue":"1","engineDefault":"1 in current UE5","valueRange":"0 or 1","appliesWhen":"Only when the user ticks the experimental checkbox. Nothing in this family is written otherwise.","visualsHtml":"None on its own.","performanceHtml":"The point of the whole family. A pipeline state object built ahead of the draw that needs it is a compile that does not happen during play, and a compile during play is the stutter this category exists for.","definitionHtml":"Master switch for runtime PSO precaching. The engine builds pipeline state objects in advance from the materials and components present in the level.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE5 source knowledge only. NOT checked against a running engine or a documentation page during this review, which is why the evidence grade stays ai and the whole family sits behind a checkbox.","notesHtml":"<p><strong>The most promising unexplored area found in the review, now taken -- carefully.<\/strong><\/p><p>The <code>r.pso.precaching<\/code> entry further down this paper is a wrong name for this family, and its write-up ends by calling <code>r.PSOPrecache.*<\/code> *&quot;real, current, and aimed at exactly the problem this category exists for.&quot;* This is that opportunity acted on.<\/p><p>A PSO is the compiled recipe the GPU needs before it can draw a thing. If the recipe is missing at the moment of the draw, the game stops and builds it. Precaching builds recipes early instead, from the materials and components already in the level -- it needs no shipped data and no special build, which is what makes it reachable from a configuration file at all.<\/p><p><strong>Everything about this family is behind a checkbox, off by default, and nothing is written until a user ticks it.<\/strong> That is deliberate and the reason is stated plainly: these eight names are the maintainer&#x27;s knowledge rather than the audit&#x27;s, and they have not been checked against a running engine. If a name is wrong the engine ignores it and nothing breaks; if a value is wrong the failure is visible, and <code>r.PSOPrecache.ProxyCreationWhenPSOReady<\/code> below explains how.<\/p>","filled":true},{"name":"r.PSOPrecache.Components","status":"active","ourValue":"1","engineDefault":"1 in current UE5","valueRange":"0 or 1","appliesWhen":"Only when the checkbox is ticked, and only as components are registered into the world.","visualsHtml":"None.","performanceHtml":"Where most of the benefit is. Meshes are the bulk of what a level draws, so most missing recipes are theirs.","definitionHtml":"Precaches pipeline state objects for primitive components as they are registered.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE5 source knowledge only. NOT checked against a running engine or a documentation page during this review, which is why the evidence grade stays ai and the whole family sits behind a checkbox.","notesHtml":"<p>Moves with <code>r.PSOPrecaching<\/code>. Components are ordinary meshes, and ordinary meshes are most of a scene, so this is the largest share of the work and the largest share of the gain.<\/p>","filled":true},{"name":"r.PSOPrecache.Resources","status":"active","ourValue":"1","engineDefault":"1 in current UE5","valueRange":"0 or 1","appliesWhen":"Only when the checkbox is ticked, and only for resource-driven draws.","visualsHtml":"None.","performanceHtml":"Smaller than the component path. Decals and hair are fewer than meshes, but they are also the kind of thing that appears suddenly, which is when a missing recipe hurts most.","definitionHtml":"Precaches pipeline state objects for resource-driven draws such as decals and hair.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE5 source knowledge only. NOT checked against a running engine or a documentation page during this review, which is why the evidence grade stays ai and the whole family sits behind a checkbox.","notesHtml":"<p>The second half of what gets precached. It is worth having for the same reason the first is, on a smaller scale.<\/p>","filled":true},{"name":"r.PSOPrecache.GlobalShaders","status":"active","ourValue":"1","engineDefault":"1 in current UE5","valueRange":"0 or 1","appliesWhen":"Only when the checkbox is ticked.","visualsHtml":"None.","performanceHtml":"Cheap. Global shaders are far fewer than material shaders and they are needed early, so precaching them costs little and pays back at startup.","definitionHtml":"Precaches pipeline state objects for the engine&#x27;s own global shaders rather than only for material shaders.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE5 source knowledge only. NOT checked against a running engine or a documentation page during this review, which is why the evidence grade stays ai and the whole family sits behind a checkbox.","notesHtml":"<p>Global shaders belong to the engine rather than to an artist. There are few of them and they are hit early, which makes this the cheapest member of the family.<\/p>","filled":true},{"name":"r.PSOPrecache.ProxyCreationWhenPSOReady","status":"active","ourValue":"1","engineDefault":"1 in current UE5, though this one changed between versions and is the least certain value in the family","valueRange":"0 or 1","appliesWhen":"Only when the checkbox is ticked, and then on every object whose recipes are not ready yet.","visualsHtml":"<strong>This is the one with a visible failure.<\/strong> An object can appear a moment late, or appear plain grey while it waits.","performanceHtml":"The setting that turns precaching into a saving. Without a wait, precaching still races the draw and can still lose.","definitionHtml":"Delays creating a render proxy until its precached pipeline state objects are ready, so the draw waits rather than stalling the frame to compile.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE5 source knowledge only. NOT checked against a running engine or a documentation page during this review, which is why the evidence grade stays ai and the whole family sits behind a checkbox.","notesHtml":"<p><strong>The reason this family is in the experimental tab rather than in the presets.<\/strong><\/p><p>Precaching only removes a stall if something waits for it. This is the wait. <code>1<\/code> holds an object&#x27;s render proxy back until its recipes are ready, so the frame is never stopped to compile.<\/p><p>The cost is that the object appears a moment late. On a fast machine that is invisible. On a slow machine in a busy level it may not be -- <strong>and a missing object is a worse fault than a brief stutter.<\/strong><\/p><p>That asymmetry is the whole argument. Everywhere else in this project a wrong guess costs frames. Here a wrong guess costs a thing the player was supposed to see, and no amount of reasoning substitutes for measuring it.<\/p><p>Two things soften it. <code>ProxyCreationDelayStrategy<\/code> below makes the wait show a grey object rather than nothing. And <code>WaitForHighPriorityRequestsOnly<\/code> is the dial to reach for first if the delay proves too visible -- not this one.<\/p>","filled":true},{"name":"r.PSOPrecache.ProxyCreationDelayStrategy","status":"active","ourValue":"1","engineDefault":"0 in current UE5, though this changed between versions","valueRange":"0 or 1","appliesWhen":"Only when the checkbox is ticked, and only while an object is being delayed.","visualsHtml":"Decides what a delayed object looks like. 0 shows nothing at all. 1 shows it with the default material until the real one is ready.","performanceHtml":"None. It changes what is drawn during the wait, not how long the wait is.","definitionHtml":"Chooses the behaviour while a proxy is delayed: skip the draw, or draw with the default material.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE5 source knowledge only. NOT checked against a running engine or a documentation page during this review, which is why the evidence grade stays ai and the whole family sits behind a checkbox.","notesHtml":"<p><code>1<\/code> is chosen deliberately, and the reasoning is about how a fault looks rather than how fast it is.<\/p><p>If the wait above is ever visible, the player sees one of two things: an object that is not there, or an object that is there in plain grey for a moment. <strong>The grey one is far less alarming<\/strong>, because it reads as something loading rather than something broken.<\/p><p>It is the only member of the family whose purpose is to make a failure survivable rather than to make anything faster.<\/p>","filled":true},{"name":"r.PSOPrecache.WaitForHighPriorityRequestsOnly","status":"active","ourValue":"0","engineDefault":"0 in current UE5","valueRange":"0 or 1","appliesWhen":"Only when the checkbox is ticked.","visualsHtml":"None directly.","performanceHtml":"At 1 the wait applies only to urgent requests and everything else is allowed to compile late, which brings back some of the stalls precaching removed.","definitionHtml":"Restricts the proxy-creation wait to high-priority precache requests only.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE5 source knowledge only. NOT checked against a running engine or a documentation page during this review, which is why the evidence grade stays ai and the whole family sits behind a checkbox.","notesHtml":"<p><code>0<\/code> is kept, which means the wait applies to every request rather than only the urgent ones. It is the conservative half of a pair: <code>ProxyCreationWhenPSOReady<\/code> turns the wait on, and this declines to narrow it.<\/p><p>**If the delay ever proves too visible, this is the first value to change -- not <code>ProxyCreationWhenPSOReady<\/code>.** Setting this to <code>1<\/code> keeps most of the benefit and shortens the wait, where switching the wait off entirely gives the benefit back.<\/p><p>Recorded here so that whoever measures this knows which dial to reach for.<\/p>","filled":true},{"name":"r.PSOPrecache.Validation","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Only when the checkbox is ticked, and then only to collect numbers.","visualsHtml":"None.","performanceHtml":"Costs time to collect and reports nothing a player can act on.","definitionHtml":"Developer check that counts pipeline state objects precaching missed.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE5 source knowledge only. NOT checked against a running engine or a documentation page during this review, which is why the evidence grade stays ai and the whole family sits behind a checkbox.","notesHtml":"<p><code>0<\/code>, and <strong>the only member of the family that is not a deviation<\/strong> -- it is the engine&#x27;s own value, pinned like everything else in this project.<\/p><p>Validation counts what precaching missed. That is a developer&#x27;s measurement, and switching it off follows the same reasoning that keeps every diagnostic in the crash-diagnostics paper off: a player is not diagnosing anything.<\/p><p>It is included rather than left out so that the family reads as complete. Anybody who does want the numbers knows the name to change.<\/p>","filled":true},{"name":"r.ForceAllCoresForShaderCompiling","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Shader compilation on a developer machine.","visualsHtml":"None in a packaged game.","performanceHtml":"None in a packaged game. Where it applies, the audit warns it *&quot;can exhaust memory&quot;* -- every core compiling shaders at once means every core holding a shader compiler&#x27;s working set.","definitionHtml":"Uses every CPU core for shader compilation, overriding the engine&#x27;s reserved-core policy.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>A real developer control, forced on, with a documented memory hazard.<\/strong><\/p><p>It is the most dangerous of the twelve developer settings in this category&#x27;s inert list, and it is dangerous in the one place it could ever apply -- a machine that is compiling shaders. The engine reserves cores on purpose so that the machine remains usable.<\/p>","filled":true},{"name":"r.ShaderCompiler.AllowDistributedCompilation","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Shader compilation on a developer machine with a distributed build system.","visualsHtml":"None in a packaged game.","performanceHtml":"None in a packaged game.","definitionHtml":"Allows shader compilation to be distributed across a build farm. The audit: *&quot;packaged games do not compile/distribute project shaders as an end-user tuning workflow.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>A real setting turned <strong>off<\/strong> against a default of on. Harmless in a shipped game and wrong in the only place it could matter.<\/p>","filled":true},{"name":"r.ShaderLibrary.PrintExtendedStats","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"None. The audit: *&quot;Disabling diagnostic information is not a meaningful universal performance tweak.&quot;*","definitionHtml":"Prints extended shader library statistics.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>A real diagnostic turned off against a default of on. It belongs with the two silenced logs below and the four warning suppressions in the effects paper: turning off the part of the engine that would tell you what is happening.<\/p>","filled":true},{"name":"r.Shaders.RemoveUnusedInterpolators","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"not the value written.","valueRange":"0 or 1","appliesWhen":"Shader compilation.","visualsHtml":"None in a packaged game.","performanceHtml":"None in a packaged game.","definitionHtml":"A real compiler optimisation that removes unused interpolators between shader stages. The audit: *&quot;A player-side INI cannot safely change cooked shader pipelines.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>A real compiler setting, moved off its default, in a file that cannot recompile anything.<\/p>","filled":true},{"name":"r.CompileShadersForDevelopment","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"engine build configuration.","valueRange":"0 or 1","appliesWhen":"Never from a player's configuration.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A real setting that Epic states cannot change at runtime and belongs in the engine build configuration.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off. Epic says explicitly that it cannot change at runtime, which makes it a rarer case than the usual dead name: real, correctly spelled, and structurally impossible to use from here.<\/p>","filled":true},{"name":"LogShaderCompiler","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"None worth measuring.","definitionHtml":"The log category for shader compilation.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The audit: *&quot;Redundant and hides shader compilation failures.&quot;*<\/p><p><strong>Seventh log category found, fifth category to silence its own subject.<\/strong> VRS, Niagara, texture streaming, level loading, and now shader compilation. Each time the configuration pushes a subsystem hard and then turns off that subsystem&#x27;s report of what happened.<\/p>","filled":true},{"name":"LogShaderCompilers","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"None worth measuring.","definitionHtml":"A variant category name covering the shader compile workers.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The eighth, and the singular and plural spellings of the same idea were both in the file -- silenced twice over.<\/p>","filled":true},{"name":"bAllowAsynchronousShaderCompiling","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"a developer setting under `[DevOptions.Shaders]`.","valueRange":"0 or 1","appliesWhen":"Never from a player's `[ShaderCompiler]` section.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A genuine shader development option that belongs to <code>[DevOptions.Shaders]<\/code> and controls editor and build compilation.","sources":["https://dev.ep l":"A wrong name for a real and current feature. The audit: *&quot;Do not substitute automatically.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where only r.PSOPrecache.* exists","notesHtml":"<p>Switched off, with the do-not-substitute warning preserved -- the ninth in the review.<\/p><p>This one was worth flagging as a <strong>future opportunity<\/strong> rather than only a mistake, and the opportunity has since been taken. PSO precaching is real, current, and aimed at exactly the problem this category exists for.<\/p><p>**Eight <code>r.PSOPrecache.*<\/code> commands are now live**, behind an experimental checkbox that is off by default. They are written up above, with an honest note on each that they are the maintainer&#x27;s knowledge rather than the audit&#x27;s and have not been checked against a running engine.<\/p><p>So the wrong name led to the right family. It is the second time in this review that a dead entry turned out to be worth more than the live ones around it, after <code>r.bForceGCAfterLevelStreamedOut<\/code> in the garbage-collection paper -- and unlike that one, this was not a typo but a whole feature the list had missed.<\/p>","filled":true},{"name":"r.ShaderPipelineCache.AsyncCompileRate","status":"not used","ourValue":"not written since 2026-08-31; was 32","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar with this name, in a family where eight real ones are documented above.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.ShaderPipelineCache.PrecompileFrameTime i","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.Shaders.Precompile","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar under this name. The audit points at the real mechanism: *&quot;Shader and PSO compilation use different controls plus title/build integration.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and it is the most understandable guess in the whole review: the name says exactly what somebody with this problem wants, and the engine has no such switch because the answer is a cache the game must ship.<\/p>","filled":true},{"name":"r.ThreadedShaderCompilation","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar with this name; shader workers use development and build controls.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.ParallelShaderCompile","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/un
