ces the normal shading with a diagnostic one -- wireframe, overdraw, shader complexity. That is a total change of picture, not a subtle one.","performanceHtml":"Debug view modes require their own shader permutations, so forcing them on costs both compilation and frame time.","definitionHtml":"Overrides the engine rule that decides whether debug view modes are available.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Pinned at <code>0<\/code>, and the visual risk here is larger than anywhere else in this category. A debug view mode does not slow the picture down -- it replaces it.<\/p><p>The audit: *&quot;Valid and exactly default 0/no override. Omit.&quot;*<\/p><p><code>0<\/code> means the engine keeps its own rule about when these modes may be used, which in a shipped game is essentially never. That is the right answer and it is worth stating rather than assuming.<\/p>","filled":true},{"name":"r.GPUCrashDebugging","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"When the graphics driver supports a vendor crash-analysis path.","visualsHtml":"None.","performanceHtml":"This is the master switch for vendor crash analysis, and it is the most expensive item in the category. Vendor tooling instruments GPU work in order to have something to report, and that instrumentation runs every frame.","definitionHtml":"Enables the graphics vendor crash-analysis path -- NVIDIA Aftermath and its equivalents -- so that a GPU crash produces a report.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Pinned at <code>0<\/code>. The audit adds a sentence to its usual wording, and the added sentence is the point: *&quot;Diagnostic features should be enabled deliberately when investigating a crash.&quot;*<\/p><p><strong>Deliberately.<\/strong> Not left on from last month, not inherited from a build configuration, not switched on by a launcher flag nobody remembers. A user who is chasing a crash turns this on for the session and turns it off again.<\/p><p>The two <code>Aftermath<\/code> entries below are its sub-options and only matter while this one is on.<\/p>","filled":true},{"name":"r.GPUCrashDebugging.Aftermath.Callstack","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"NVIDIA hardware, and only while r.GPUCrashDebugging is on.","visualsHtml":"None.","performanceHtml":"Capturing a callstack for GPU work means recording where on the CPU each piece of work was submitted from. That record is built during normal play and thrown away unless a crash happens.","definitionHtml":"Makes NVIDIA Aftermath record the CPU callstack that submitted each piece of GPU work.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Pinned at <code>0<\/code>, a sub-option of <code>r.GPUCrashDebugging<\/code> above.<\/p><p>The audit: *&quot;Valid NVIDIA Aftermath option; 0 is the stock default. Omit and inherit.&quot;*<\/p><p>It pairs with <code>.Markers<\/code> below. Between them they are what turns a GPU crash from &quot;the device was removed&quot; into a report naming the draw that did it -- which is worth a great deal on the day it is needed and nothing at all on the other days.<\/p>","filled":true},{"name":"r.GPUCrashDebugging.Aftermath.Markers","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"NVIDIA hardware, and only while r.GPUCrashDebugging is on.","visualsHtml":"None.","performanceHtml":"The more costly of the two Aftermath sub-options. A marker is inserted around GPU work so a crash report can say which piece was running, and there are a great many pieces in a frame.","definitionHtml":"Makes NVIDIA Aftermath insert event markers around GPU work so a crash report can name the draw that failed.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Pinned at <code>0<\/code>, and the second of the pair.<\/p><p>Of everything in this category this is the one whose cost scales with the scene. A marker per piece of GPU work means the busier the frame, the more there is to record.<\/p><p>Same audit note as its sibling: stock default, omit and inherit. Written instead.<\/p>","filled":true},{"name":"r.GPUCrashDump","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"When the driver supports writing a GPU crash dump.","visualsHtml":"None.","performanceHtml":"The dump itself is only written on a crash. The cost is in the state the driver has to keep available so that a dump would be possible.","definitionHtml":"Requests a vendor GPU crash dump when the device is lost.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Pinned at <code>0<\/code>. The audit: *&quot;Valid vendor crash-dump option; 0 is stock default. Omit and inherit.&quot;*<\/p><p>The last of the vendor crash group. Together with <code>r.GPUCrashDebugging<\/code> and the two Aftermath options it forms a set of four that a developer switches on as a block and should switch off as a block.<\/p>","filled":true},{"name":"r.RHICmdBypass","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Always, on every frame the renderer submits.","visualsHtml":"None directly. A stalled renderer is felt rather than seen.","performanceHtml":"The largest single effect of anything in this category. At 1 the multi-threaded renderer stops being multi-threaded: RHI commands run the moment they are issued, on the thread that issued them, instead of being recorded and replayed. Frame times roughly follow.","definitionHtml":"Bypasses the RHI command list. At 1, RHI commands execute immediately on the calling thread instead of being recorded into a command list for the RHI thread.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The most valuable pinned zero in the project, and the clearest single answer to the question of why defaults are written at all.<\/strong><\/p><p>The audit: *&quot;Valid stock debugging CVar; 0 is already default and leaves the multithreaded renderer active. Value 1 is a low-level debugging bypass. Omit.&quot;*<\/p><p>Every other entry in this category costs some frame time when it is switched on. This one costs the multi-threaded renderer. At <code>1<\/code> the whole design of the RHI -- record work on one thread, replay it on another -- is turned off, and the rendering thread does the driver&#x27;s work inline.<\/p><p>It exists so that an engine programmer chasing a driver bug can remove one layer of indirection and see what is really happening. It is not a setting anybody should meet by accident.<\/p><p><code>0<\/code> is the default and always has been. Writing it, after the game&#x27;s own file, means that whatever a title did to itself, this one cannot be wrong.<\/p>","filled":true},{"name":"r.D3D12.GPUTimeout","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, on every piece of GPU work the operating system is watching.","visualsHtml":"None while it works. What it changes is what a hang looks like.","performanceHtml":"None measurable. The watchdog is the driver noticing that two seconds have passed, not work done per frame.","definitionHtml":"Controls whether Direct3D 12 leaves the operating system GPU timeout in place, so a hung device can be detected and reset.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>Promoted out of the inert list, and it is the most dangerous thing found in the whole review.<\/strong><\/p><p>It was in the NO EFFECT block, switched on, set to <code>0<\/code>.<\/p><p>The audit: *&quot;Real D3D12 CVar, but stock default is 1. Epic explicitly warns that 0 can freeze the PC; Windows timeout recovery exists to restore responsiveness.&quot;*<\/p><p>Windows watches the GPU. When a piece of work does not finish within about two seconds it concludes the device has hung, resets the driver and carries on. The mechanism is called Timeout Detection and Recovery, and it is the reason a bad shader costs a black flash and a dropped frame rather than a reboot.<\/p><p>**<code>0<\/code> removes it.** A hang then has nothing to recover it. The failure is no longer the game closing; it is the machine stopping, with the power button as the only way out.<\/p><p>It is written at <code>1<\/code> rather than merely dropped. Dropping it would leave the answer to whatever the title shipped, and a title that shipped <code>0<\/code> would keep it. This is not a setting to leave to chance -- and unlike every other pinned default in this category, the reason is not frame time.<\/p><p>It was in a list of inert entries, so it was graded as one. It is not inert. It was the one live wire in the box.<\/p>","filled":true},{"name":"r.D3D12.LightweightDRED","status":"active","ourValue":"0","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"D3D12 only, on every command list recorded.","visualsHtml":"None.","performanceHtml":"A small per-frame cost. Lightweight DRED keeps a reduced breadcrumb trail so a device removal can name roughly where it happened, and that trail is written during every frame rather than only the failing one.","definitionHtml":"A reduced-cost form of Device Removed Extended Data, on by default, which keeps minimal GPU breadcrumbs.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Promoted out of the inert list and <strong>kept at our value, against Epic&#x27;s default of 1.<\/strong> The audit objects, and the objection is recorded rather than argued with: *&quot;Disabling basic crash diagnostics is not a universal performance improvement and makes GPU failures harder to diagnose.&quot;*<\/p><p>What decides it is consistency. This category already writes <code>0<\/code> for <code>r.D3D12.DRED<\/code>, <code>r.GPUCrashDebugging<\/code>, <code>r.GPUCrashDump<\/code> and both Aftermath options. Every one of those is the same trade made in the same direction for the same reason: a player is not diagnosing anything, and breadcrumb recording runs on every frame rather than only on the bad one.<\/p><p><strong>The difference is that this one&#x27;s default is on rather than off.<\/strong> Everywhere else in this category <code>0<\/code> confirms what the engine already does. Here it changes it, which is what makes this a decision instead of a formality, and why it is written out at length.<\/p><p>Reviewed and kept by the maintainer.<\/p>","filled":true},{"name":"r.GPUCrash.Collectionenable","status":"active","ourValue":"0","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Whenever named GPU work is submitted, which is constantly.","visualsHtml":"None.","performanceHtml":"Collecting scoped-event data means bracketing named blocks of GPU work during every frame so that a crash report can say which one was running.","definitionHtml":"Enables collection of scoped-event data for GPU crash reporting. The name is matched case-insensitively; the canonical spelling is lowercase.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Promoted out of the inert list and kept at our value, against Epic&#x27;s default of 1. The audit: *&quot;Real case-insensitive CVar (canonical lowercase), default 1. Value 0 disables useful scoped-event crash data without a defensible universal performance gain.&quot;*<\/p><p>Scoped-event data is the record of which named block of GPU work was running when the device failed -- the difference between *&quot;the GPU stopped&quot;* and *&quot;the GPU stopped during the shadow pass&quot;*.<\/p><p>It moves with <code>r.D3D12.LightweightDRED<\/code> above and <code>r.GPUCrash.DataDepth<\/code> below. The three are one decision, not three: whether a player&#x27;s machine spends frame time preparing a crash report nobody will read.<\/p><p>Reviewed and kept by the maintainer.<\/p>","filled":true},{"name":"r.GPUCrash.DataDepth","status":"active","ourValue":"0","engineDefault":"-1, which means unlimited","valueRange":"an integer; -1 for unlimited, 0 for none","appliesWhen":"Whenever GPU markers are nested, which on a modern renderer is everywhere.","visualsHtml":"None.","performanceHtml":"Depth is how many levels of nested GPU markers are retained. Unlimited is what a developer wants and what costs the most to maintain.","definitionHtml":"Limits how deep the nesting of retained GPU crash markers goes.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Promoted out of the inert list and kept at our value, and it is <strong>the only command in this category whose default is neither 0 nor 1.<\/strong> Epic&#x27;s default is <code>-1<\/code>, which here means unlimited.<\/p><p>The audit: *&quot;Real case-insensitive CVar, default -1. Value 0 truncates crash-marker depth and harms diagnostics; it is not performance tuning.&quot;*<\/p><p>Third of the trio, and it goes where the other two go.<\/p><p>Worth noting for anyone reading the generated file: <code>0<\/code> here is not &quot;off&quot; in the ordinary sense. It is a depth of zero, which is why the default is <code>-1<\/code> rather than <code>1<\/code>. A reader who assumes the usual pattern will read this line backwards.<\/p>","filled":true},{"name":"LogCrashReportHydra","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"none. The name belongs to a third-party plugin, not to UE5.","valueRange":"not applicable.","appliesWhen":"Never, unless the FATHydra plugin is present.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"FATHydra-specific crash-handler setting, not stock UE5.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The audit: *&quot;FATHydra-specific crash-handler setting, not stock UE5.&quot;*<\/p><p>Hydra is a crash-handling plugin belonging to one studio&#x27;s pipeline. The name means nothing to an engine that does not have it, and it is one of the few entries in this project that can be traced to a specific place it was copied from.<\/p><p>It sits beside fifty-six log-verbosity lines that were copied out of the wrong section, which together say something about where the original list came from.<\/p>","filled":true},{"name":"LogCrashUploader","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"none. The name belongs to a third-party plugin, not to UE5.","valueRange":"not applicable.","appliesWhen":"Never, unless the FATHydra plugin is present.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"FATHydra/plugin-specific crash-handler setting, not stock UE5.","sources":["https://dev. erbose -- optionally given per compile-time and runtime level.","appliesWhen":"Never, as written. Log verbosity is read from the [Core.Log] section, and this line was written to [ConsoleVariables].","visualsHtml":"None.","performanceHtml":"None. A suppressed log category saves the cost of formatting strings that a shipped build has already mostly compiled out.","definitionHtml":"Redundant and hides text-input/IME problems.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/logging-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where log verbosity is set in [Core.Log] and is not a console variable","notesHtml":"<p>Switched off. The audit: *&quot;Redundant and hides text-input/IME problems.&quot;*<\/p><p>One of the entries that would have cost something if it had worked. It is redundant after <code>Global<\/code>, and it silences a channel that reports real failures.<\/p>","filled":true},{"name":"LogWorldPartition","status":"not used","ourValue":"not written since 2026-08-31; was all off","engineDefault":"the category's own compiled-in verbosity, which in a shipped build is already reduced to warnings and errors.","valueRange":"a verbosity level -- off, fatal, error, warning, display, log, verbose, veryverbose -- optionally given per compile-time and runtime level.","appliesWhen":"Never, as written. Log verbosity is read from the [Core.Log] section, and this line was written to [ConsoleVariables].","visualsHtml":"None.","performanceHtml":"None. A suppressed log category saves the cost of formatting strings that a shipped build has already mostly compiled out.","definitionHtml":"Redundant and hides World Partition streaming failures.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/logging-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where log verbosity is set in [Core.Log] and is not a console variable","notesHtml":"<p>Switched off. The audit: *&quot;Redundant and hides World Partition streaming failures.&quot;*<\/p><p>Worth reading beside the level-streaming paper, where nine <code>s.<\/code> and <code>wp.<\/code> values were changed on measured evidence, and beside <code>s.ForceGCAfterLevelStreamedOut<\/code> in the garbage-collection paper, which changes when unloaded cells are freed.<\/p><p>Those are exactly the settings whose failures this category would report.<\/p>","filled":true},{"name":"LogXGEController","status":"not used","ourValue":"not written since 2026-08-31; was all off","engineDefault":"the category's own compiled-in verbosity, which in a shipped build is already reduced to warnings and errors.","valueRange":"a verbosity level -- off, fatal, error, warning, display, log, verbose, veryverbose -- optionally given per compile-time and runtime level.","appliesWhen":"Never, as written. Log verbosity is read from the [Core.Log] section, and this line was written to [ConsoleVariables].","visualsHtml":"None.","performanceHtml":"None. A suppressed log category saves the cost of formatting strings that a shipped build has already mostly compiled out.","definitionHtml":"Redundant and developer/build-specific.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/logging-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where log verbosity is set in [Core.Log] and is not a console variable","notesHtml":"<p>Switched off. The audit: *&quot;Redundant and developer/build-specific.&quot;*<\/p><p>Harmless but pointless: the category belongs to an editor, a plugin, a profiler or a build service, none of which run in a shipped game. There was no output here to suppress.<\/p>","filled":true},{"name":"LogZenServiceInstance","status":"not used","ourValue":"not written since 2026-08-31; was all off","engineDefault":"the category's own compiled-in verbosity, which in a shipped build is already reduced to warnings and errors.","valueRange":"a verbosity level -- off, fatal, error, warning, display, log, verbose, veryverbose -- optionally given per compile-time and runtime level.","appliesWhen":"Never, as written. Log verbosity is read from the [Core.Log] section, and this line was written to [ConsoleVariables].","visualsHtml":"None.","performanceHtml":"None. A suppressed log category saves the cost of formatting strings that a shipped build has already mostly compiled out.","definitionHtml":"Redundant and build/cache-service-specific.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/logging-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where log verbosity is set in [Core.Log] and is not a console variable","notesHtml":"<p>Switched off. The audit: *&quot;Redundant and build/cache-service-specific.&quot;*<\/p><p>Harmless but pointless: the category belongs to an editor, a plugin, a profiler or a build service, none of which run in a shipped game. There was no output here to suppress.<\/p>","filled":true},{"name":"PixWinPlugin","status":"not used","ourValue":"not written since 2026-08-31; was all off","engineDefault":"the category's own compiled-in verbosity, which in a shipped build is already reduced to warnings and errors.","valueRange":"a verbosity level -- off, fatal, error, warning, display, log, verbose, veryverbose -- optionally given per compile-time and runtime level.","appliesWhen":"Never, as written. Log verbosity is read from the [Core.Log] section, and this line was written to [ConsoleVariables].","visualsHtml":"None.","performanceHtml":"None. A suppressed log category saves the cost of formatting strings that a shipped build has already mostly compiled out.","definitionHtml":"Redundant and PIX plugin/developer-specific.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/logging-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where log verbosity is set in [Core.Log] and is not a console variable","notesHtml":"<p>Switched off. PIX is Microsoft&#x27;s GPU capture tool, used by a developer on a machine that has it installed.<\/p><p>It pairs with <code>RenderDocPlugin<\/code> below.<\/p>","filled":true},{"name":"RenderDocPlugin","status":"not used","ourValue":"not written since 2026-08-31; was all off","engineDefault":"the category's own compiled-in verbosity, which in a shipped build is already reduced to warnings and errors.","valueRange":"a verbosity level -- off, fatal, error, warning, display, log, verbose, veryverbose -- optionally given per compile-time and runtime level.","appliesWhen":"Never, as written. Log verbosity is read from the [Core.Log] section, and this line was written to [ConsoleVariables].","visualsHtml":"None.","performanceHtml":"None. A suppressed log category saves the cost of formatting strings that a shipped build has already mostly compiled out.","definitionHtml":"Redundant and RenderDoc plugin/developer-specific.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/logging-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where log verbosity is set in [Core.Log] and is not a console variable","notesHtml":"<p>Switched off, and the last of the fifty-six.<\/p><p>RenderDoc is a frame debugger a developer attaches by hand. <code>PixWinPlugin<\/code> above it is Microsoft&#x27;s equivalent. Neither is present in a shipped game, so neither has a log to silence.<\/p><p>They are a fitting end to the block: two entries written to suppress output from tools that were never running, in a section that could not have suppressed them anyway.<\/p>","filled":true}]},{"id":"other","title":"Other","introHtml":"<p>Every review needs a place for what does not fit, and this is it. Seven live commands with nothing in common but their absence from anywhere else, and fifty-six inert names that between them show the whole shape of the list this project inherited.<\/p><p><strong>Five of the seven live commands are pinned defaults<\/strong>, and one of those is more interesting than a pinned default usually is. <code>r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque<\/code> is the faster path *and* Epic ships a known visual artifact with it. When the engine&#x27;s own default accepts a visual cost for speed, a tuning file is in no position to overrule it -- the people who wrote the atmosphere decided which side of that trade was right.<\/p><p><code>r.DetailMode<\/code> is pinned at Epic&#x27;s top level and deliberately kept out of the presets. It does not make objects cheaper; it decides whether they are created at all, and which ones is the level author&#x27;s decision rather than a rule.<\/p><p><strong>Two live commands deviate.<\/strong> <code>r.Translucency.AutoBeforeDOF<\/code> is kept at 1 against a default of 0.5 -- the audit calls it experimental and content-specific, and it is the only entry here that can change the picture. <code>Slate.bAllowThrottling<\/code> was promoted out of the inert list at <code>0<\/code>, and it is the rare setting that deliberately spends frames rather than saving them: throttling was designed for an editor, and a player who opens a settings menu to judge how the game looks should not watch the frame rate sag while they do it.<\/p><p><strong>The fifty-six inert names are grouped below by subsystem<\/strong>, and read together they are the clearest picture in the review of where this list came from.<\/p><p>Four more invented <code>Parallel<\/code> families -- landscape, materials, navigation, AI -- bringing the review&#x27;s total to six, after cloth in the physics paper and animation in its own. Ten names belonging to AMD, NVIDIA and Intel plugins rather than to the engine, most of them setting a sharpness the plugin already defaults to. Five input properties that belong in <code>Input.ini<\/code>, a file this application does not write. Six settings describing decisions a build machine made months earlier. Six names from an older D3D12 vocabulary, most of them real once. Three asking for DirectStorage, which cannot be added to a game that was not built with it. Four aimed at privacy or at developer prompts, of which the privacy ones do not work -- and a privacy setting that does not work is worse than none, because it is believed. Three near-misses for commands that are live a few lines above. Five more silencing a diagnostic.<\/p><p>And one, <code>EnableMathOptimisations<\/code>, asking the engine to make the mathematics faster.<\/p><p><strong>This is the last category of the review, and the inert list is now empty.<\/strong> The NO EFFECT block that once carried four hundred and eleven names is no longer written at all. Every one of them is recorded in these papers instead, with what it was, why it was there, and why it is gone -- which is worth more than the disk it costs, and considerably more than it was worth in the file.<\/p>","commands":[{"name":"r.DetailMode","status":"active","ourValue":"3","engineDefault":"3","valueRange":"0 low, 1 medium, 2 high, 3 epic","appliesWhen":"Always. Every component authored with a detail-mode threshold reads it.","visualsHtml":"Decides which decorative components exist at all. Below 3 the engine simply does not spawn components tagged above the level -- small props, debris, decorative meshes. They do not get simpler; they are absent.","performanceHtml":"Real, and the crudest kind of saving there is: work not done because the object was never created.","definitionHtml":"The detail-mode threshold. Components tagged above the current mode are not created.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Pinned at Epic&#x27;s top level. The audit: *&quot;Valid stock detail-mode control; 3 is the current Epic/default level and shows all eligible components.&quot;*<\/p><p>It is worth understanding why this is not a preset control, given how strong a lever it looks. Detail mode does not make things cheaper, it makes them absent, and which things are absent is decided by whoever authored the level rather than by a rule. Lowering it on one game removes gravel and litter; on another it removes something the player needed to see.<\/p><p>The presets in this project change how expensive a thing is to draw. This changes whether it is there. That is the game&#x27;s decision, not ours.<\/p>","filled":true},{"name":"r.MeshDrawCommands.DynamicInstancing","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Every frame, on any draw the renderer can merge.","visualsHtml":"None. The same objects appear.","performanceHtml":"One of the largest structural savings in the renderer. Drawing a hundred identical crates as one instanced call instead of a hundred calls removes almost all of the CPU cost of drawing them.","definitionHtml":"Merges mesh draw commands that differ only by instance data into a single instanced draw.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Pinned default. The audit: *&quot;Valid and already default 1 on compatible vertex factories. Omit.&quot;*<\/p><p>The qualifier matters and is why the note says *compatible*. Instancing works where the draws genuinely differ only by their per-instance data; a material that needs something else per object cannot be merged, and the engine works that out per vertex factory rather than being told.<\/p><p>So <code>1<\/code> is permission rather than instruction, in the same way <code>a.ParallelAnimUpdate<\/code> is in the animation paper. The engine keeps the judgement.<\/p><p>Note that the inert list carried <code>r.Renderer.UseGPUInstancing<\/code>, an invented name for this idea. It is documented below.<\/p>","filled":true},{"name":"r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Any scene using the Sky Atmosphere system, which is most outdoor UE5 games.","visualsHtml":"A real trade, and the audit names it: the fast path can show high-frequency atmospheric artifacts. In practice that means banding or shimmer in the haze where the depth changes sharply -- a distant fence line, the edge of a cliff.","performanceHtml":"The fast path applies aerial perspective from a lookup table per pixel instead of ray-marching it, which is a large saving on any wide outdoor view.","definitionHtml":"Applies aerial perspective to opaque surfaces from the precomputed lookup table rather than evaluating it per pixel.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Pinned default, and <strong>the only pinned default in this category that is not free.<\/strong> The audit: *&quot;Valid and already current default 1. It is the faster path, with known possible high-frequency atmospheric artifacts. Omit and inherit.&quot;*<\/p><p>Epic ships the artifact. That is the fact that settles it. When the engine&#x27;s own default accepts a known visual cost in exchange for speed, a tuning file is in no position to overrule it -- the people who wrote the atmosphere system decided which side of that trade was right, and they had the whole picture.<\/p><p>Recorded rather than glossed, because *&quot;known possible artifacts&quot;* in a default is unusual and a reader deserves to see it.<\/p>","filled":true},{"name":"r.SkyLight.RealTimeReflectionCapture.TimeSlice","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Scenes with a real-time captured sky light, which is how a moving sky lights the world.","visualsHtml":"Time slicing spreads the capture over several frames, so a fast sky change arrives slightly late. In practice a sunset is not fast.","performanceHtml":"A capture done in one frame is a spike. Spread over several it is invisible, and the total work is the same.","definitionHtml":"Spreads the real-time sky light reflection capture across several frames instead of completing it in one.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Pinned default. The audit: *&quot;Valid stock CVar; 1 is the documented default, so real-time Sky Light capture already uses time slicing.&quot;*<\/p><p>It is the same idea as batching elsewhere in this project: the work does not get smaller, it gets spread, and a cost spread thin enough stops being a stutter.<\/p><p>The inert list carried <code>r.Skylight.RealTimeCapture.TimeSlice<\/code> -- this command with <code>Reflection<\/code> missing from the middle and a lower-case <code>l<\/code>. It is documented below, and it is the third wrong-namespace copy of a live command found in the review.<\/p>","filled":true},{"name":"r.SSS.Burley.EnableProfileIdCache","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Any scene rendering subsurface scattering, which in practice means any scene with a face in it.","visualsHtml":"None.","performanceHtml":"Trades one byte per pixel of memory for a faster lookup. At 4K that is about eight megabytes against a saving on every subsurface pixel, which is a good trade and is why it is the default.","definitionHtml":"Caches the subsurface profile identifier per pixel to accelerate the Burley subsurface scattering pass.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Pinned default, and the audit&#x27;s note is unusually specific about the cost: *&quot;Valid and exactly default 1. Uses one byte per pixel to accelerate Burley SSS. Omit and inherit.&quot;*<\/p><p>One byte per pixel is a number worth keeping in mind when reading the rest of this project. Eight megabytes at 4K, in exchange for a faster path on every skin pixel in the frame. Most of the memory decisions in this review are larger and less certain than that.<\/p>","filled":true},{"name":"r.Translucency.AutoBeforeDOF","status":"active","ourValue":"1","engineDefault":"0.5","valueRange":"a threshold between 0 and 1","appliesWhen":"Scenes with both depth of field and translucent objects -- glass, smoke, particles, water.","visualsHtml":"This is the visual one. It decides whether a translucent object is composited before depth of field, and so gets blurred with the scene behind it, or after, and so stays sharp. Get it wrong and smoke stays crisp in front of a blurred background, or a glass panel blurs when it should not.","performanceHtml":"Negligible. It changes where translucency is binned, not how much of it there is.","definitionHtml":"The threshold at which translucent materials are automatically sorted into the before-depth-of-field pass.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>Kept at our value against a default of 0.5, on the maintainer&#x27;s decision.<\/strong><\/p><p>The audit is cautious and says so plainly: *&quot;Valid experimental control, current default 0.5. It changes where translucency is binned relative to depth of field; visual/content-specific.&quot;*<\/p><p>Two words there deserve weight. <strong>Experimental<\/strong> means Epic has not settled it. <strong>Content-specific<\/strong> means the right answer depends on what a particular artist built, which is the same objection that kept <code>r.MaxAnisotropy<\/code> from getting a preset split and <code>au.streamcache.StreamCacheSize<\/code> from being corrected and promoted.<\/p><p>It is kept anyway, and the reason is worth stating rather than implied: <code>1<\/code> sorts translucency before depth of field more readily, which is the behaviour that matches what players expect -- smoke and glass in front of a blurred background look blurred. The failure mode is a translucent effect that is sharper or softer than the artist intended, which is a difference of taste rather than a fault.<\/p><p>Reviewed and kept by the maintainer. This is the only entry in this category that deviates from Epic, and it is the only one that could change the picture.<\/p>","filled":true},{"name":"Slate.bAllowThrottling","status":"active","ourValue":"0","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"While the user is interacting with UI -- dragging a slider, holding a menu open.","visualsHtml":"None directly. What changes is the frame rate behind the menu.","performanceHtml":"Throttling makes the engine run slower during UI interaction on the reasoning that nothing else needs to move. Disabling it keeps the game rendering at full rate while a menu is open.","definitionHtml":"Allows Slate to throttle the engine tick rate during user interface interaction.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>Promoted out of the inert list at the maintainer&#x27;s request<\/strong>, and kept at <code>0<\/code> against Epic&#x27;s default of <code>1<\/code>.<\/p><p>The audit: *&quot;Valid stock editor/Slate policy, default 1. Setting 0 disables UI throttling and is not a general packaged-game optimization.&quot;*<\/p><p>The audit is right that it is not an optimisation. It is the opposite -- it spends frames rather than saving them. That is the point.<\/p><p>Throttling was designed for the editor, where an artist dragging a slider does not need the viewport running flat out and a laptop battery is better spent elsewhere. In a game the same behaviour is backwards. A player who opens the settings menu is usually there to judge how the game looks, and a frame rate that sags the moment the menu opens makes that judgement impossible.<\/p><p>The risk is small and easy to state: the worst case is a menu that costs as much to display as the game behind it, which is what a player already expects.<\/p>","filled":true},{"name":"r.Landscape.ParallelSectionUpdate","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current exact stock CVar.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>First of the invented <code>Parallel<\/code> families in this group, and the third such family in the review after the eight cloth names in the physics paper and the nine animation ones.<\/p><p>The pattern is identical: somebody listed what landscape does -- update a section, update a layer, build a splat atlas, calculate a spline segment, update a spline -- and wrote a <code>Parallel<\/code> switch for each stage. Materials got the same treatment with two.<\/p><p>The engine has none of them, and the audit&#x27;s note on each is the same four words: *&quot;No current exact stock CVar.&quot;*<\/p>","filled":true},{"name":"r.ParallelLandscapeLayerUpdate","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar. Landscape layer updates are not exposed this way.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables <script id="home-prose" type="text/plain"><h3>What the app actually does</h3>

<p>Unreal Engine 5 exposes several thousand <strong>console variables</strong> —
runtime switches and numbers that control the renderer. A game reads them from a
chain of configuration files, and the last file in that chain, the one in your
own user folder, wins.</p>

<p>UE5 Tuner writes that file:</p>

<p><code>%LOCALAPPDATA%\&lt;Game&gt;\Saved\Config\Windows\Engine.ini</code></p>

<p>It clears the read-only flag, keeps the game's own contents, appends its own
block underneath, and sets the file read-only again so the game cannot overwrite
it on the next launch. Later lines win, which is why appending works.</p>

<h3>Why this document exists</h3>

<p>A tuned <code>Engine.ini</code> circulating on a forum is a list of assertions
with no evidence attached. Somebody set <code>r.MotionBlur.Amount</code> to
<code>0.25</code>, and nothing in the file says what the engine would have done
instead, whether the number helps, or whether the command is even real.</p>

<p>This document is the missing half. Every command the app writes has an entry
here recording what it does inside the renderer, what the engine's own default
is, what we write, and — where those differ — the reasoning and the evidence.</p>

<p>Entries that were <strong>removed</strong> are kept too. "Why is this not in
my file any more" is a question people arrive with, and the only place that can
answer it is a document the deletion did not touch.</p>

<h3>How to read an entry</h3>

<table>
  <tr><th>Field</th><th>Means</th></tr>
  <tr><td>status</td><td><code>active</code> — the app writes it.
    <code>not used</code> — kept in the data, written nowhere.
    <code>dropped</code> — gone entirely.</td></tr>
  <tr><td>our value</td><td>What lands in your file, including any difference
    between presets or user options.</td></tr>
  <tr><td>engine default</td><td>What the engine does when nobody says
    anything. Where Epic publishes no default, the entry says so rather than
    inventing one.</td></tr>
  <tr><td>value range</td><td>Every value the command accepts, with meanings
    where they are named rather than numeric.</td></tr>
  <tr><td>applies when</td><td>The conditions under which the command does
    anything at all. Roughly a third of them are narrower than their name
    suggests.</td></tr>
  <tr><td>effect on visuals</td><td>What changes on screen, described so it can
    be looked for rather than taken on faith.</td></tr>
  <tr><td>effect on performance</td><td>Which direction, and how the cost
    scales. "Negligible" is used only where it is true.</td></tr>
  <tr><td>technical definition</td><td>What the command does inside the
    renderer, not what it is for.</td></tr>
  <tr><td>technical evidence</td><td>How the entry was checked. The three are
    independent kinds of evidence rather than levels of one scale, and an entry
    may carry any combination.
    <strong>CLAUDE FABLE 5 verified against Epic documentation</strong> — read
    against Epic's published pages and the engine's console variable reference.
    <strong>Reverse Engineered Memory Reading verified</strong> — the value was
    read back out of a running game, which is the only way to settle a default
    Epic has changed between revisions without saying so.
    <strong>Benchmarked on real hardware</strong> — the value was timed on a real
    machine running a real game, which is the only evidence that says a number is
    better rather than merely correct.</td></tr>
  <tr><td>verified against</td><td>Which engine revision the facts were checked
    against. Several UE5 defaults have moved between versions and are not
    version-tagged in Epic's reference.</td></tr>
</table>

<p>A <span style="color:var(--warn)">differs</span> tag on an entry means our
value is not the engine's. Those are the ones worth reading.</p>

<h3>The three presets</h3>

<ul>
  <li><strong>Quality</strong> — spends frames on looks. It is the only preset
    permitted to exceed Epic's own settings.</li>
  <li><strong>Recommended</strong> — the default. It should be Epic's settings
    plus fixes, not a quality preset in disguise.</li>
  <li><strong>Performance</strong> — gives cost back, using values Epic
    documents.</li>
</ul>

<p>Separately, <strong>options</strong> describe the user rather than a taste:
an adaptive-sync monitor, an HDR display, a laptop on battery, a dislike of
motion blur. An option beats a preset, because a fact about the machine outranks
a choice from a list.</p>

<h3>The rules this document is held to</h3>

<ul>
  <li><strong>A preset split needs two numbers Epic already published.</strong>
    Where a value is the maintainer's own, measured rather than documented, the
    entry says so in its first line. Three entries are in that position.</li>
  <li><strong>A documented default is worth pinning.</strong> Writing the value
    the engine would have chosen looks pointless, and is not: a game ships its
    own configuration file, and nothing stops its developers setting something
    else. Pinning costs one line and cannot make anything worse.</li>
  <li><strong>An experiment is a question, not an answer.</strong> Where Epic's
    own guidance is "test this on your workload", shipping one side of the test
    to everybody turns a question into a silent claim. Those settings are behind
    a switch that writes the engine's value until somebody chooses.</li>
  <li><strong>A permission is not a setting.</strong> Several commands only
    grant the renderer leave to use a more expensive path. Granting one the game
    never asked for cannot make anything faster.</li>
</ul>

<h3>The NO EFFECT block</h3>

<p>The generated file ends with several hundred commands the original audit
graded as invalid, obsolete, placebo, or specific to one plugin or one game.
They were written out anyway on the reasoning that the engine ignores names it
does not know.</p>

<p>That reasoning does not survive contact with the exceptions. Reviewing the
block category by category has repeatedly turned up commands the audit itself
grades <em>valid</em>, forced away from their documented defaults — task
granularity, cache eviction rates, ray tracing state objects, and one setting
that selected the anti-aliasing method behind the user's back while the app
offered them a choice of it.</p>

<p>Each of those is documented here alongside the live commands of the category
it belongs to, marked <code>not used</code>, with the reason it was rejected and
the reason it stopped being written.</p>

<h3>Status of the work</h3>

<p>This is an audit in progress, worked category by category in the order the
app shows them. A category listed without a count in the sidebar has not been
written up yet — its commands are still being written into the file, they simply
have no entry here.</p>

<p>Nothing on this page is generated from the shipping configuration. The papers
are written by hand and read no other file, so they are free to say things the
configuration cannot — including that a value was wrong.</p>
</script>

  var HOME = document.getElementById("home-prose").textContent;
  var CATS = DATA.categories;
  var navEl = document.getElementById("nav");
  var mainEl = document.getElementById("main");
  var qEl = document.getElementById("q");

  var filled = function (c) { return c.commands.filter(function (e) { return e.filled; }); };
  var written = CATS.filter(function (c) { return filled(c).length; });

  document.getElementById("brandsub").textContent =
    DATA.counts.filled + " commands documented across " + written.length + " of " + CATS.length + " categories";

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    for (var k in attrs || {}) {
      if (k === "html") n.innerHTML = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  // ------------------------------------------------------------- nav
  navEl.appendChild(el("li", {}, [link("home", "00", "Overview", "", false)]));
  CATS.forEach(function (c, i) {
    var n = filled(c).length;
    navEl.appendChild(el("li", {}, [
      link(c.id, pad(i + 1), c.title, n ? String(n) : "—", !n)
    ]));
  });

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function link(id, num, title, count, empty) {
    var a = el("a", { href: "#" + id, "data-id": id }, [
      el("span", { class: "num", text: num }),
      el("span", { text: title }),
      el("span", { class: "count", text: count })
    ]);
    if (empty) a.className = "empty";
    return a;
  }

  // ------------------------------------------------------------ pages
  function statusBadge(s) {
    var cls = s === "active" ? "b-active" : s === "dropped" ? "b-dropped" : "b-notused";
    return el("span", { class: "badge " + cls, text: s || "?" });
  }

  // CSS cuts these to the column width. This only stops a 400-character value
  // from being handed to the layout in the first place.
  function shortValue(v) {
    if (!v) return "—";
    return v.length > 90 ? v.slice(0, 88) + "…" : v;
  }

  function differs(e) {
    var a = (e.ourValue || "").trim(), b = (e.engineDefault || "").trim();
    if (!a || !b) return false;
    if (a === b) return false;
    // "1" vs "1 where the platform supports it" is not a difference.
    return b.indexOf(a) !== 0 && a.indexOf(b) !== 0;
  }

  // "ai" and "memory" are how the source file records the grade. Neither means
  // anything to a reader, so the page spells both out. "ai+memory" is both.
  function evidenceChips(v) {
    var wrap = el("span", { class: "ev" });
    (v || "none").split("+").forEach(function (part) {
      var k = part.trim();
      if (k === "ai")
        wrap.appendChild(el("span", { class: "chip ev-ai",
          text: "CLAUDE FABLE 5 verified against Epic documentation" }));
      else if (k === "memory")
        wrap.appendChild(el("span", { class: "chip ev-mem", text: "Reverse Engineered Memory Reading verified" }));
      else if (k === "benchmark")
        wrap.appendChild(el("span", { class: "chip ev-bench", text: "Benchmarked on real hardware" }));
      else
        wrap.appendChild(el("span", { class: "chip ev-none", text: "not yet checked" }));
    });
    return wrap;
  }

  function commandCard(e) {
    var rows = [];
    function row(label, value, mono) {
      if (!value) return;
      rows.push(el("dt", { text: label }));
      rows.push(el("dd", mono ? { class: "mono", text: value } : { html: value }));
    }
    function rowNode(label, node) {
      rows.push(el("dt", { text: label }));
      rows.push(el("dd", {}, [node]));
    }
    row("our value", e.ourValue, true);
    row("engine default", e.engineDefault, true);
    row("value range", e.valueRange, true);
    row("applies when", e.appliesWhen);
    row("effect on visuals", e.visualsHtml);
    row("effect on performance", e.performanceHtml);
    row("technical definition", e.definitionHtml);
    rowNode("technical evidence", evidenceChips(e.evidence));
    row("verified against", e.verifiedAgainst);

    var body = [el("dl", { class: "kv" }, rows)];
    if (e.notesHtml) body.push(el("div", { class: "notes", html: e.notesHtml }));
    if (e.sources && e.sources.length) {
      body.push(el("div", { class: "srcs" }, e.sources.map(function (u) {
        return el("a", { href: u, target: "_blank", rel: "noreferrer", text: u });
      })));
    }

    var tags = [statusBadge(e.status)];
    if (differs(e)) tags.push(el("span", { class: "badge b-differs", text: "differs" }));

    var head = [
      el("span", { class: "chev", text: "▶" }),
      el("span", { class: "cname", title: e.name, text: e.name }),
      el("span", { class: "tags" }, tags)
    ];
    head.push(el("span", { class: "vals" }, [
      el("span", { class: "ours", title: e.ourValue || "", text: shortValue(e.ourValue) }),
      el("span", { class: "arrow", text: "vs" }),
      el("span", { class: "def", title: e.engineDefault || "", text: shortValue(e.engineDefault) })
    ]));

    var d = el("details", { class: "cmd", id: "c-" + e.name.toLowerCase() }, [
      el("summary", {}, head),
      el("div", { class: "body" }, body)
    ]);
    d.dataset.name = e.name.toLowerCase();
    return d;
  }

  function categoryPage(c) {
    var list = filled(c);
    var parts = [
      el("div", {}, [
        el("span", { class: "cat-id", text: c.id }),
        el("h2", { class: "cat", text: c.title })
      ])
    ];
    if (c.introHtml) parts.push(el("div", { class: "intro", html: c.introHtml }));

    if (!list.length) {
      parts.push(el("p", { class: "empty-note", text: "Not written yet." }));
      return el("div", {}, parts);
    }

    parts.push(el("div", { class: "bar" }, [
      el("button", { type: "button", "data-act": "open", text: "Expand all" }),
      el("button", { type: "button", "data-act": "close", text: "Collapse all" }),
      el("span", { class: "n", text: list.length + " commands" })
    ]));
    parts.push(el("hr", { class: "rule" }));
    list.forEach(function (e) { parts.push(commandCard(e)); });
    return el("div", {}, parts);
  }

  function homePage() {
    var wrap = el("div", {});
    wrap.appendChild(el("div", { class: "hero" }, [
      el("h2", { text: "The engineering record behind every line we write" }),
      el("p", {
        class: "lede",
        text: "UE5 Tuner writes an Engine.ini into a game's configuration folder. "
            + "This document accounts for every console variable in that file: what "
            + "it does inside the renderer, what value the engine would have chosen "
            + "on its own, what ours is, and why the two differ."
      })
    ]));

    var stats = el("div", { class: "stats" }, [
      stat(DATA.counts.filled, "documented"),
      stat(written.length + " / " + CATS.length, "categories"),
      stat(DATA.counts.open, "still open"),
      stat(DATA.generated, "last built")
    ]);
    wrap.appendChild(stats);
    wrap.appendChild(el("div", { class: "prose", html: HOME }));
    wrap.appendChild(el("footer", {
      text: "Built from the source papers on " + DATA.generated + ". Schema " + DATA.schema + "."
    }));
    return wrap;
  }

  function stat(v, label) {
    return el("div", { class: "stat" }, [
      el("b", { text: String(v) }), el("span", { text: label })
    ]);
  }

  // ----------------------------------------------------------- router
  function show(id) {
    mainEl.innerHTML = "";
    var cat = null;
    for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) cat = CATS[i];
    mainEl.appendChild(cat ? categoryPage(cat) : homePage());
    Array.prototype.forEach.call(navEl.querySelectorAll("a"), function (a) {
      a.classList.toggle("on", a.dataset.id === (cat ? id : "home"));
    });
    mainEl.scrollIntoView({ block: "start" });
    applyFilter();
  }

  window.addEventListener("hashchange", function () {
    show((location.hash || "#home").slice(1));
  });

  mainEl.addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("button[data-act]") : null;
    if (!b) return;
    var open = b.dataset.act === "open";
    Array.prototype.forEach.call(mainEl.querySelectorAll("details.cmd"), function (d) {
      d.open = open;
    });
  });

  // ----------------------------------------------------------- filter
  function applyFilter() {
    var q = qEl.value.trim().toLowerCase();
    var cards = mainEl.querySelectorAll("details.cmd");
    var shown = 0;
    Array.prototype.forEach.call(cards, function (d) {
      var hit = !q || d.dataset.name.indexOf(q) !== -1;
      d.classList.toggle("hidden", !hit);
      if (hit) shown++;
    });
    var n = mainEl.querySelector(".bar .n");
    if (n) n.textContent = q ? shown + " of " + cards.length + " commands" : cards.length + " commands";
  }
  qEl.addEventListener("input", applyFilter);

  show((location.hash || "#home").slice(1));

  // ------------------------------------------------------------ boot screen
  // A deliberate pause before the page is revealed. Nothing is fetched -- the
  // whole document is already in this file -- so the bar is a paced reveal
  // rather than a measurement, and it is written to be honest about that in
  // the code even though the screen is not.
  //
  // The first step runs synchronously so the smoke test can prove the element
  // lookup and the style write work. The interval body does the same two
  // operations, so if the first one holds the rest do.
  var boot = document.getElementById("boot");
  var bootBar = document.getElementById("bootbar");
  var bootPct = document.getElementById("bootpct");
  if (boot && bootBar && bootPct) {
    var pct = 0;
    bootBar.style.width = "0%";
    bootPct.textContent = "0";

    var step = function () {
      pct = Math.min(100, pct + 2.5 + Math.random() * 3.5);
      bootBar.style.width = pct + "%";
      bootPct.textContent = String(Math.round(pct));
      if (pct < 100) return;
      clearInterval(tick);
      setTimeout(function () {
        boot.classList.add("gone");
        // Waits out the opacity transition, then takes it out of the layout
        // so it can never swallow a click on the page underneath.
        setTimeout(function () { boot.classList.add("done"); }, 460);
      }, 240);
    };
    var tick = setInterval(step, 90);
  }
})();
</script>
</body>
</html>
