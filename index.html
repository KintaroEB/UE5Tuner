the documented default. The audit notes that 0 exists *&quot;for legacy compatibility&quot;*, which is worth pinning against -- a game that had set it for an old reason gets the current behaviour back.<\/p>","filled":true},{"name":"r.Streaming.UsePerTextureBias","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, when the pool is under pressure.","visualsHtml":"With per-texture bias, the streamer drops mips selectively -- the textures least likely to be noticed lose resolution first. Without it, everything is reduced together, so a wall you are looking at goes blurry to save a texture behind you.","performanceHtml":"Same memory saved, distributed better.","definitionHtml":"Applies per-texture bias when reducing mips under memory pressure.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, and of the eleven pinned defaults in this category it is the one whose absence would be most visible.<\/p>","filled":true},{"name":"r.TextureStreaming","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"The master switch. At 0 every texture loads at full resolution and stays -- no pop-in, and a large game exhausts memory.","performanceHtml":"At 0, catastrophic on any game not built for it.","definitionHtml":"Enables texture streaming.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. Like <code>r.RayTracing.Enable<\/code> in the ray tracing paper, this is the one line in its category that could make everything else meaningless, which is the strongest case for pinning there is.<\/p>","filled":true},{"name":"r.VT.ParallelFeedbackTasks","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Only in games using virtual textures.","visualsHtml":"None directly. Virtual texture feedback is how the system learns which tiles are actually being sampled, so it decides what gets loaded next.","performanceHtml":"Uses worker threads for that feedback. The audit: *&quot;only VT-enabled titles benefit and scheduling overhead depends on CPU/workload. Test per title.&quot;*","definitionHtml":"Processes virtual texture feedback on parallel tasks.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>We wrote <strong>1<\/strong> until 2026-08-31, against a default of 0.<\/p><p>*&quot;Test per title&quot;* is the phrase that decides it, for the same reason as the virtual shadow map cache policy in the shadows paper: a file shipped for fifty games cannot be tested per title, and most of those games do not use virtual textures at all.<\/p>","filled":true},{"name":"r.Streaming.MinMipForSplitRequest","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"10","valueRange":"a mip index.","appliesWhen":"Always.","visualsHtml":"<strong>This is a pop-in mechanism, and 0 switches it off.<\/strong> Split loading fetches the mips you can see before the ones you cannot, so a surface becomes sharp progressively instead of arriving all at once or not at all. The audit: *&quot;Value 0 disables visible-mip-first split loading and opposes Epic&#x27;s pop-in mitigation.&quot;*","performanceHtml":"Split loading is not slower overall; it changes the order work is done in.","definitionHtml":"The lowest mip index for which a streaming request will be split so that visible mips load first.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>A real command, in the NO EFFECT block, disabling Epic&#x27;s own pop-in mitigation.<\/strong><\/p><p>That is the third anti-pop-in mechanism this configuration was working against, after <code>r.Nanite.Streaming.MaxPageInstallsPerFrame<\/code> and <code>MaxPendingPages<\/code> in the Nanite paper -- and it is the most direct of the three, because the other two slowed streaming down while this one changed what order it happens in.<\/p><p>The irony is worth stating plainly: three other live settings in this same file are aimed squarely at reducing pop-in, and this one was quietly undoing part of that work from a block labelled NO EFFECT.<\/p>","filled":true},{"name":"r.Streaming.AmortizeCPUToGPUCopy","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Only while `MaxNumTexturesToStreamPerFrame` is capped, which it is not here -- that remains 0, meaning unlimited.","visualsHtml":"None as configured.","performanceHtml":"None as configured. The audit: *&quot;Standalone no-op, and a cap needs title testing.&quot;*","definitionHtml":"Spreads the CPU-to-GPU copy of streamed texture data across frames, but only when a per-frame streaming cap is in force.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>A real command, set away from its default, doing nothing -- because the setting it depends on was left at unlimited.<\/p><p>It is a good example of why &quot;it is real&quot; and &quot;it does something&quot; are different questions. Half a mechanism was enabled and the half that would have made it work was not.<\/p>","filled":true},{"name":"LogStreaming","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"None worth measuring.","definitionHtml":"The log category for asset and texture streaming.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The audit&#x27;s sharpest note in the whole review:<\/strong> *&quot;Redundant and hides exactly the streaming failures this tweak file attempts to influence.&quot;*<\/p><p>Eighteen commands in this category tune streaming. One line in the block below them turned off the log that reports when streaming goes wrong.<\/p><p>It is the fifth log category found and the third that was actively unhelpful, after <code>LogVRS<\/code> and <code>LogNiagara<\/code>. The pattern across all three is identical: the configuration pushes a subsystem hard and then silences that subsystem&#x27;s complaints.<\/p>","filled":true},{"name":"r.TextureStreaming.UseBackgroundThreadPool","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this name.","valueRange":"not applicable.","appliesWhen":"Never as written.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"The wrong namespace. The real command is <code>r.Streaming.UseBackgroundThreadPool<\/code>, which is documented above and is written correctly.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where only the r.Streaming spelling exists","notesHtml":"<p>Switched off. Both spellings were in the file at the same value, one working and one not -- the same pattern as the two <code>AllowSpecializedStateObjects<\/code> entries in the ray tracing paper.<\/p>","filled":true},{"name":"r.TextureStreaming.DiscardUnusedMips","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The namespace is wrong or obsolete.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None as written. The audit adds what it would have done: *&quot;indiscriminate mip dropping could worsen re-streaming and pop-in.&quot;*","performanceHtml":"None.","definitionHtml":"No exact stock CVar under this namespace.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and it is one of the few dead names that is fortunate rather than merely harmless. Had it worked, it would have made pop-in worse in a file trying to reduce it.<\/p>","filled":true},{"name":"r.TextureStreaming.UseDeferredLock","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar; invented or obsolete.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The third <code>r.TextureStreaming.*<\/code> name in the block, in a namespace where the engine has none at all -- every real one is <code>r.Streaming.*<\/code>.<\/p>","filled":true},{"name":"r.Streaming.UseMaterialDataStreaming","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this name. The real command is `r.Streaming.UseMaterialData`.","valueRange":"not applicable as written.","appliesWhen":"Never as written.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A wrong name one word away from a real one. The audit: *&quot;do not silently substitute it.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where only UseMaterialData exists","notesHtml":"<p>Switched off, with the do-not-substitute warning preserved. The sixth such warning in the review.<\/p>","filled":true},{"name":"r.Streaming.MinFudgeFactor","status":"not used","ourValue":"not written since 2026-08-31; was 0.5","engineDefault":"none. Obsolete.","valueRange":"not applicable.","appliesWhen":"Never on a current build.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"An obsolete streaming heuristic factor with no current stock equivalent.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.Streaming.PredictiveBoost","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar with this name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.Streaming.PredictiveBoostHintSize","status":"not used","ourValue":"not written since 2026-08-31; was 512","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar with this name; a companion to the invented entry above.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The pair is the same shape as the MegaLights shadow cache and its <code>MaxAge<\/code>: one invented name suggesting a second, more specific one, and neither checked.<\/p>","filled":true},{"name":"r.Streaming.BuildTextureStreamingDataOnLoad","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar. Texture streaming data is built when the project is cooked, not when a level loads.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The fifth build-time concept written as a runtime variable.<\/p>","filled":true},{"name":"r.Streaming.EnableAssetUpdateAbandons","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.IO.VirtualTextures","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this name. The real command is `r.VirtualTextures`.","valueRange":"not applicable as written.","appliesWhen":"Never as written, and the real one is not a runtime choice either.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A wrong name for a real setting, and one that could not be used even correctly. The audit: enabling virtual textures is *&quot;a project/cook decision requiring compatible textures, materials, samplers&quot;* -- the game must be built for it.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where only r.VirtualTextures exists","notesHtml":"<p>Switched off. Two failures in one line: the wrong name, and a real name that would not have worked either because virtual texturing is decided when the game is built.<\/p>","filled":true},{"name":"r.VT.CsvStats","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"none under this exact name.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None. The audit: *&quot;not rendering optimization.&quot;*","definitionHtml":"A CSV statistics switch for virtual texturing, under a name the engine does not answer to.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. A statistics toggle rather than a setting, in the same family as the four warning suppressions in the effects paper.<\/p>","filled":true},{"name":"PlatformStreamingFormat","status":"not used","ourValue":"not written since 2026-08-31; was OGG","engineDefault":"set by the platform's cook settings.","valueRange":"an audio format name.","appliesWhen":"Never from a player's configuration file.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"The streaming audio format for the platform, which is chosen when the project is cooked. Audio is encoded into the packaged game; a text file cannot re-encode it afterwards.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off. It is the only entry in this category that is not about textures at all -- it is audio, and it landed here because of the word *streaming*.<\/p>","filled":true},{"name":"LogTextureEncodingSettings","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Cook and editor only.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A log category for texture encoding settings, which are an editor and cook concern.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off as redundant. Harmless, unlike <code>LogStreaming<\/code> above it.<\/p>","filled":true},{"name":"LogTextureFormatManager","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Cook and editor only.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A log category for the texture format manager.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off as redundant.<\/p>","filled":true},{"name":"LogTextureFormatOodle","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Cook only. Oodle is the compressor textures are encoded with when the game is packaged.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A log category for the Oodle texture format plugin.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off as redundant, and the last of four log categories in this one category alone. Three of the four are cook-time and genuinely pointless; the fourth was <code>LogStreaming<\/code>, which was not.<\/p><p>That ratio is the argument for reading the block rather than trusting its heading, in miniature.<\/p>","filled":true}]},{"id":"frame-pacing","title":"Frame Rate, VSync & Latency","introHtml":"<p>This category is about the last few milliseconds: how a finished frame reaches the monitor, how many of them are allowed per second, and how much of the delay between moving the mouse and seeing the result is the engine&#x27;s fault.<\/p><p>It is also the category where <strong>more settings were removed than kept<\/strong>. Four commands are written now, out of the six that were.<\/p><p>Two reasons for that, and they are worth having up front.<\/p><p><strong>The category argued with itself.<\/strong> <code>r.GTSyncType=2<\/code> is a low-latency presentation mode that depends on VSync frame pacing, and the line above it turned VSync off. The audit spotted the contradiction and said so. We shipped both.<\/p><p><strong>And the pinning rule fails here, for the first time.<\/strong> That rule works because writing the value the engine would have chosen cannot make anything worse. In this category two of the engine&#x27;s own defaults mean *&quot;remove the limit&quot;* -- <code>t.MaxFPS=0<\/code> is no frame cap and <code>r.VSync=0<\/code> is no synchronisation -- and our file outranks the game&#x27;s own configuration. Writing Epic&#x27;s default there does not preserve the engine&#x27;s behaviour; it strips a limit somebody set on purpose.<\/p><p><code>t.MaxFPS<\/code> is no longer written for exactly that reason. <code>r.VSync<\/code> still is, and the reason is a judgement rather than a rule -- recorded in its entry.<\/p><p>The category also gained a command from the NO EFFECT block rather than losing one to it, which happened nowhere else in this review. See <code>t.Streamline.Reflex.Mode<\/code> at the end.<\/p>","commands":[{"name":"r.VSync","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"VSync holds each finished frame until the monitor is ready for it. Off, a frame is shown the moment it is done, which means the screen can show the top half of one frame and the bottom half of the next -- a horizontal seam that moves, called tearing.","performanceHtml":"Off is faster and lower latency. The GPU never waits for the display, and the frame you see is the newest one rather than one held back.","definitionHtml":"Enables vertical synchronisation of frame presentation.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, forced rather than offered, on the maintainer&#x27;s judgement about the hardware people actually own.<\/p><p>The audit is careful about it: *&quot;Disabling VSync is a display/user preference: it can reduce latency but can also tear, increase GPU load, and <strong>override the game&#x27;s own setting<\/strong>. Keep only as an explicit display toggle.&quot;*<\/p><p><strong>The judgement, stated so it can be argued with later:<\/strong> adaptive sync is no longer a premium feature. FreeSync and G-Sync compatibility are standard on inexpensive monitors, and on such a display the tearing VSync exists to prevent is already handled -- while VSync itself is a straightforward latency increase, because a finished frame waits for the panel instead of being shown.<\/p><p>So the trade VSync offers is one almost nobody running this app wants to take: pay latency to solve a problem their monitor already solves.<\/p><p>The residual tension is small and worth naming anyway. This app&#x27;s own *&quot;Adaptive sync monitor&quot;* option has an <strong>off<\/strong> state, which exists because some users have neither G-Sync nor FreeSync, and those users get tearing with no way to ask for VSync back. If tearing reports ever arrive, this is the entry they belong to, and the fix is the same shape as the ambient occlusion method in the shadows paper: a three-state option that can also say *leave it alone*.<\/p><p><strong>One connection worth following.<\/strong> The standard practice on an adaptive-sync display is to sit slightly below the panel&#x27;s maximum refresh rate, which means a frame cap. This project deliberately stopped writing one -- see <code>t.MaxFPS<\/code> below -- so that cap comes from the game, the driver, or the user&#x27;s own limiter. The two decisions were made separately and agree: we remove the synchronisation and we decline to set the limit that would replace it, leaving the limit to whoever knows the monitor.<\/p>","filled":true},{"name":"r.D3D12.UseAllowTearing","status":"active","ourValue":"1; 0 when \"Adaptive sync monitor\" is unticked","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"The D3D12 renderer.","visualsHtml":"Allows the swap chain to present without waiting for the display&#x27;s refresh. It is the mechanism variable refresh rate needs -- G-Sync and FreeSync work by the monitor following the game, which requires the game to present when it is ready.","performanceHtml":"It is what makes uncapped, unsynchronised presentation possible at all. Without it, presentation falls back to waiting.","definitionHtml":"Permits the DXGI swap chain to use the allow-tearing presentation flag.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, and correctly follows the *&quot;Adaptive sync monitor&quot;* option: a display with variable refresh needs this on, and one without it does not.<\/p><p><strong>The audit found a contradiction in the source configuration here<\/strong>, and it is worth keeping as a warning about how these files are assembled: *&quot;This also contradicts line 15&#x27;s value 0; the later ConsoleVariables value would win.&quot;* The same command appeared twice at two different values, in two sections, and only the second one did anything. Nothing in the file said so.<\/p><p>That is the one command in the whole audit that the source config wrote at two different values, and it is why this project resolves each command to exactly one value before writing anything.<\/p>","filled":true},{"name":"r.FinishCurrentFrame","status":"active","ourValue":"0; 1 when \"Lowest input lag\" is ticked","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"At 1 the CPU waits for the GPU to finish the current frame before starting the next. That removes a frame of buffering, so input reaches the screen sooner -- and it removes the overlap that keeps both processors busy, so throughput drops. The audit: *&quot;value 1 reduces buffering/latency but harms throughput.&quot;*","definitionHtml":"Forces the render thread to complete the current frame before beginning the next.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default and is offered as a user option, which is the right shape: latency against frame rate is a preference, not a fact, and it is the trade *&quot;Lowest input lag&quot;* exists to make.<\/p>","filled":true},{"name":"r.OneFrameThreadLag","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"The game thread runs one frame ahead of the render thread. That is what lets both stay busy; without it each waits for the other and the frame rate falls, in exchange for one frame less latency.","definitionHtml":"Allows the render thread to lag the game thread by one frame.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p><p>It is the same trade as <code>r.FinishCurrentFrame<\/code> at a different point in the pipeline, and only one of the two is offered to the user. That is deliberate rather than an oversight: they are not independent, and exposing both would let somebody remove two frames of buffering at once and then wonder why the frame rate collapsed.<\/p>","filled":true},{"name":"t.Streamline.Reflex.Mode","status":"active","ourValue":"not written by default; 0 when \"Turn off NVIDIA Reflex\" is ticked","engineDefault":"set by NVIDIA's plugin, not by Epic.","valueRange":"0 disables Reflex. Other values exist and their meanings are not documented in any source this project has checked.","appliesWhen":"Only in a game that ships the NVIDIA Streamline plugin. Elsewhere it is an unknown name and is ignored.","visualsHtml":"None directly. Reflex changes when frames are submitted, not what is in them -- but frame *pacing* is visible, and that is the whole point of this entry.","performanceHtml":"Reflex reduces input latency by keeping the CPU from running too far ahead of the GPU. In some games the way it does that disturbs frame pacing, producing stutter that is worse to look at than the latency it removes.","definitionHtml":"The Reflex mode for NVIDIA&#x27;s Streamline integration. 0 disables it.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>This is the only command in the entire review that moved OUT of the NO EFFECT block rather than into it.<\/strong><\/p><p>Read the audit&#x27;s grading again: *&quot;Not a stock UE5 CVar. It belongs to NVIDIA Streamline/Reflex integration and only disables that plugin when present.&quot;*<\/p><p>That rejects the line for not being <strong>Epic&#x27;s<\/strong>, which was the audit&#x27;s job. It does not say the line does nothing -- it says the opposite, in the same sentence. And so it sat in a block headed NO EFFECT while being one of the most effective settings in the file for this project&#x27;s own reference game.<\/p><p><strong>Mortal Shell 2 has visible frame-pacing problems with Reflex enabled and no menu option to switch it off.<\/strong> Writing 0 resolves them, and measured latency stays good. That is the maintainer&#x27;s measurement and it outranks the classification.<\/p><p>It is a <strong>user option<\/strong> rather than a forced value because that is a fact about one game and not about the engine. Reflex is normally worth having. Most of the titles on this list are single-player games where its benefit is small and its risk to frame pacing is not, so the default leaves the game alone and the game notes tell affected players to tick the box.<\/p><p>Only 0 is offered. The audit documents no value meanings, and claiming to know what 1 or 2 select would be inventing a fact about somebody else&#x27;s plugin.<\/p><p>The general lesson is the mirror of the one the rest of this review keeps finding. The NO EFFECT block was read as *&quot;these do nothing&quot;*, and it never said that -- it said *&quot;these were rejected&quot;*. Five Lumen commands were rejected and harmful; this one was rejected and useful. Only reading them tells you which.<\/p>","filled":true},{"name":"t.MaxFPS","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"0, meaning uncapped.","valueRange":"a frame rate. 0 is no limit.","appliesWhen":"Always.","visualsHtml":"None directly. A frame cap changes pacing, not content.","performanceHtml":"A cap costs frames above it and gives back power, temperature and, on some hardware, more consistent pacing below it.","definitionHtml":"The engine&#x27;s frame rate limiter.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>This is where the pinning rule breaks, and it is worth understanding rather than patching.<\/strong><\/p><p>Everywhere else in this project, writing the engine&#x27;s documented default is free: the value we write is the value the engine would have chosen, so a game that had moved it gets brought back and a game that had not is unaffected.<\/p><p>Here the default means *no limit*, and our file outranks the game&#x27;s own configuration. So <code>t.MaxFPS=0<\/code> does not preserve the engine&#x27;s behaviour -- it <strong>removes a cap the game set on purpose<\/strong>. Some games cap for good reasons, including physics that misbehaves at high frame rates.<\/p><p>The audit said it plainly and this review took two passes to hear it: *&quot;Omit it so the game and user-selected limiter remain authoritative.&quot;*<\/p><p>Switched off. A frame-limit control may be worth adding later as a user option, but it would need real values rather than a single 0, and nothing in the audit supplies them.<\/p>","filled":true},{"name":"r.GTSyncType","status":"not used","ourValue":"not written since 2026-08-31; was 2","engineDefault":"none published. The audit names 2 as *\"the current stock low-latency mode\"* without naming a default.","valueRange":"0 upwards; the modes are not documented in any source this project has checked.","appliesWhen":"Only with VSync on. It is a synchronisation mode, and there is nothing to synchronise with when presentation is unsynchronised.","visualsHtml":"Where it works, it changes when frames are handed to the display, which affects pacing rather than content.","performanceHtml":"The audit: *&quot;trades hitch tolerance for latency&quot;*. It also *&quot;relies on swap-chain/VSync frame pacing and coordinated settings&quot;*.","definitionHtml":"The game-thread synchronisation mode used for frame pacing.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where no default is published","notesHtml":"<p>Switched off for two reasons that agree.<\/p><p><strong>It could not work.<\/strong> The audit spotted the contradiction directly: it *&quot;relies on swap-chain/VSync frame pacing&quot;* and *&quot;contradicts the earlier r.VSync=0&quot;*. This project writes VSync off, so a VSync-dependent pacing mode had nothing to act on.<\/p><p><strong>And there is nothing to pin.<\/strong> No default is published, so the pinning rule that saves most of the commands in this file has no value to fall back to. That is the same position as <code>r.AmbientOcclusion.Method<\/code> in the shadows paper and <code>PoolSizeVRAMPercentage<\/code> in the textures one -- and unlike those two, this command is not doing anything useful in the meantime.<\/p><p>The audit&#x27;s own condition was *&quot;keep only in a tested platform/display latency profile&quot;*. This is not one.<\/p>","filled":true},{"name":"bSmoothFrameRate","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"set in the engine's own configuration, not as a console variable.","valueRange":"not applicable in the section it was written to.","appliesWhen":"Never as written.","visualsHtml":"None as written.","performanceHtml":"None as written.","definitionHtml":"A real engine configuration property that enables frame rate smoothing, but not a console variable -- so it does nothing in a <code>[ConsoleVariables]<\/code> section. The audit adds that smoothing is *&quot;a user/title pacing policy&quot;* in any case.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off, and it is a failure mode this review has not seen before: not a wrong name, not an obsolete one, but a <strong>real setting written in the wrong kind of section<\/strong>.<\/p><p>Engine configuration properties and console variables live in the same file and look identical. One is read by the section it is in and the other is not.<\/p>","filled":true},{"name":"D3D12.MaximumFrameLatency","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this name.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock D3D12 option under this name. Frame latency is controlled through supported presentation settings.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Also missing the <code>r.<\/code> prefix that every real D3D12 setting in this engine carries -- the same mistake as <code>D3D12.RayTracing.AllowSpecializedStateObjects<\/code> in the ray tracing paper, in the same namespace.<\/p>","filled":true},{"name":"r.RHIThread","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this name. The real command is `r.RHIThread.Enable`.","valueRange":"not applicable as written.","appliesWhen":"Never as written.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"The RHI thread is the one that talks to the graphics driver. This name is obsolete; the current control is <code>r.RHIThread.Enable<\/code>, with <code>-rhithread<\/code> on the command line. The audit: *&quot;Do not substitute or force it universally.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where only r.RHIThread.Enable exists","notesHtml":"<p>Switched off, with the do-not-substitute warning preserved. The seventh such warning in this review, and one of the clearest cases for heeding it: whether the RHI thread should exist is a platform decision the engine makes at startup.<\/p>","filled":true},{"name":"r.RHIThread.Priority","status":"not used","ourValue":"not written since 2026-08-31; was 2","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar. The audit: *&quot;Thread priority should remain engine/platform controlled.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. A companion invented beside an obsolete name -- the same pattern as the MegaLights shadow cache and its <code>MaxAge<\/code>, and the streaming predictive boost and its <code>HintSize<\/code>.<\/p><p>Thread priority is worth one extra sentence, because it is a category of setting rather than a single command: raising one thread&#x27;s priority does not create CPU time, it takes it from another thread in the same process. On a machine that is not oversubscribed it changes nothing, and on one that is it usually moves the problem.<\/p>","filled":true},{"name":"r.Occlusion.SingleRHIThreadStall","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar with this exact name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Occlusion query stalls are a real subject and are covered properly in the occlusion and culling paper; this particular name is not one of them.<\/p>","filled":true}]},{"id":"level-streaming","title":"Level Streaming & Loading","introHtml":"<p>A modern open world is not loaded. It is <strong>streamed<\/strong>: the world is divided into cells, and the engine loads the ones near the player and unloads the ones behind them while the game keeps running. World Partition is UE5&#x27;s system for that, and the <code>wp.Runtime.*<\/code> commands here are its controls. The <code>s.*<\/code> commands are the layer underneath -- the asynchronous loader and the I/O dispatcher that fetch data off disk and turn it into objects.<\/p><p><strong>This category went through both halves of the process in one day, and the second half is why it is worth reading.<\/strong><\/p><p>Twelve of the fourteen commands departed from Epic&#x27;s defaults, and none of the departures carried a measurement. The audit&#x27;s notes made that easy to act on: read together they say one thing repeatedly -- *&quot;title/CPU-specific&quot;*, *&quot;project-specific&quot;*, *&quot;open-world/hardware-specific&quot;*, *&quot;requires title-specific testing&quot;*, *&quot;profile per open-world title&quot;*. Streaming depends on the game&#x27;s world layout and the player&#x27;s storage and memory, and a file shipped for fifty games knows none of those. So every value went back to Epic&#x27;s.<\/p><p>Then nine of them were <strong>measured on a running game<\/strong> and set again -- some to the number they had, some to a different one, and one to a value the original configuration never used at all. Those nine carry <code>ai+memory+benchmark<\/code>: read against the documentation, read back out of the running game, and timed on real hardware. They are the only entries in the project carrying all three.<\/p><p>The two halves are not in tension. The audit asked for testing before departing from a default, and until 2026-08-31 nobody had done any. The numbers that came back are not obviously better than the ones that went in; what changed is that somebody can now say why they are there.<\/p><p><strong>The inert half held the worst cluster of real commands found anywhere in this review.<\/strong> Five valid settings, all pushed off their defaults, three of them removing safety limits rather than tuning anything. Two were promoted into this category and pinned at Epic&#x27;s values; three were switched off.<\/p>","commands":[{"name":"s.AdaptiveAddToWorld.Enabled","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Always, while levels are being added to the world.","visualsHtml":"Indirectly. Adding a streamed level to the world is work that must be spread across frames; how it is spread decides whether you get one long hitch or several short ones.","performanceHtml":"At 1 the fixed time slice is replaced with an adaptive budget that reacts to how busy the frame already is. The audit: *&quot;loading smoothness/latency depends on title and CPU.&quot;*","definitionHtml":"Replaces the fixed AddToWorld time slice with adaptive budgeting.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai+memory+benchmark","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The maintainer&#x27;s value, measured and verified on a running game.<\/strong><\/p><p>Adaptive budgeting reacts to how busy the frame already is instead of spending a fixed slice whether or not there is room for it. Epic ships it off because the answer depends on the title and the CPU, and the measurement here says smoother loading.<\/p><p>It was set back to 0 earlier the same day for having no evidence behind it, and restored once there was. The number is not what changed -- the evidence is.<\/p>","filled":true},{"name":"s.AsyncLoadingTimeLimit","status":"active","ourValue":"3.0","engineDefault":"5, in milliseconds","valueRange":"a time budget in milliseconds.","appliesWhen":"Always, while anything is loading asynchronously.","visualsHtml":"None directly. It decides how much of each frame the loader may consume.","performanceHtml":"The audit: *&quot;Lower budget can reduce frame spikes but extends loading.&quot;* It is a straight trade between smoothness while loading and how long loading takes.","definitionHtml":"The per-frame time budget for asynchronous loading.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai+memory+benchmark","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The maintainer&#x27;s value, measured<\/strong>, and a 40 percent cut to the loader&#x27;s frame budget.<\/p><p>The trade is a preference rather than a win: less of each frame for the loader means smoother frames while streaming and longer loading overall. What was missing before was any record of which annoyance the number was chosen against.<\/p><p>It pairs with <code>s.AdaptiveAddToWorld.Enabled<\/code> above. A smaller fixed budget is a blunter instrument on its own; with adaptive budgeting on, the two were measured together, which is the only way either of them means anything.<\/p>","filled":true},{"name":"s.IoDispatcherBufferMemoryMB","status":"active","ourValue":"96","engineDefault":"8, in megabytes","valueRange":"a size in megabytes.","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"Buffer memory for the I/O dispatcher. More can help throughput on fast storage; it is also a fixed RAM reservation held whether or not it is used.","definitionHtml":"The I/O dispatcher&#x27;s buffer memory allocation.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai+memory+benchmark","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The maintainer&#x27;s value, measured.<\/strong> Twelve times Epic&#x27;s 8 MB.<\/p><p>The audit&#x27;s phrasing is careful -- *&quot;More buffer memory <strong>may<\/strong> help I/O throughput but adds fixed RAM use&quot;* -- and that *may* is exactly what made the earlier, untested 64 indefensible. Measurement replaces it.<\/p><p>This is system RAM rather than video memory, and it is reserved whether or not it is used. 96 MB spent deliberately to keep a fast drive fed.<\/p>","filled":true},{"name":"s.IoDispatcherCacheSizeMB","status":"active","ourValue":"2048","engineDefault":"0","valueRange":"a size in megabytes.","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"A fixed I/O cache. At 0 there is none, and the operating system&#x27;s own file cache does the job.","definitionHtml":"The size of the I/O dispatcher&#x27;s cache.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai+memory+benchmark","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The maintainer&#x27;s value, measured, and the audit&#x27;s own condition for it is now met.<\/strong><\/p><p>The audit: *&quot;Valid, current default 0. A fixed 2-GB cache is a very large RAM reservation; only a deliberately profiled high-memory title should consider it.&quot;*<\/p><p>Read that carefully. It does not reject 2048 -- it requires profiling first, and there had been none. There has now been.<\/p><p>It remains the single largest reservation this file makes: two gigabytes of system RAM, held whether the game needs it or not. Defensible on a machine with 32 GB and questionable on one with 16, which is the same audience assumption sitting under the thread-count settings elsewhere in this project.<\/p><p><strong>The way it used to be written is worth keeping as a warning.<\/strong> The value stayed at 2048 while the *&quot;I have a weaker PC&quot;* option wrote 0 in <strong>both<\/strong> of its states -- so 2048 was unreachable on purpose, kept visible as a record while being impossible to produce.<\/p><p>That was well intentioned and it was confusing, because it is indistinguishable from the four *accidental* unreachable values this review had to correct. The option wiring is gone. The number reaches the file directly now, which is the only honest way to write a value somebody actually wants.<\/p>","filled":true},{"name":"s.IoDispatcherDecompressionWorkerCount","status":"active","ourValue":"8","engineDefault":"4","valueRange":"a worker count.","appliesWhen":"Always. Packaged game data is compressed, so this runs constantly during loading.","visualsHtml":"None.","performanceHtml":"How many threads decompress loaded data. Decompression is usually the bottleneck in modern loading rather than the disk, so this matters more than it sounds.","definitionHtml":"The number of I/O dispatcher decompression workers.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai+memory+benchmark","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The maintainer&#x27;s value, measured.<\/strong> Double Epic&#x27;s 4.<\/p><p>This is a <strong>new<\/strong> departure rather than a restored one -- the command wrote Epic&#x27;s value throughout the original configuration and throughout this review, until it was measured.<\/p><p>It is also the thread-count increase in this project with the clearest mechanism behind it. Packaged game data is compressed, and decompression rather than the disk is usually the bottleneck in modern loading, so more workers has somewhere obvious to help. It rests on the same twelve-thread audience assumption as <code>grass.MaxAsyncTasks<\/code> and <code>r.Streaming.ParallelRenderAssetsNumWorkgroups<\/code>.<\/p>","filled":true},{"name":"s.MaxIncomingRequestsToStall","status":"active","ourValue":"100","engineDefault":"100","valueRange":"a request count.","appliesWhen":"Always.","visualsHtml":"None directly.","performanceHtml":"<strong>Backpressure by request count.<\/strong> When too many I/O requests are outstanding, the loader deliberately stalls new ones so memory does not fill with data nothing has consumed yet. The audit: *&quot;Stalling after a single request can serialize I/O and destroy throughput; not a sensible general policy.&quot;*","definitionHtml":"The number of outstanding incoming requests at which the loader begins stalling new ones.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>Promoted out of the NO EFFECT block on 2026-08-31 and pinned at Epic&#x27;s value.<\/strong> It was being written as <strong>1<\/strong>, which asks the loader to work through a level roughly one item at a time.<\/p><p><strong>Note what is not claimed here.<\/strong> The audit gives the default and the harm; it does not describe the mechanism, and Epic publishes very little about it. Reading the name suggests a higher number allows more read-ahead, which a fast NVMe drive might well take -- but that is a reading rather than a fact, so this pins Epic&#x27;s number rather than raising it.<\/p><p>It was promoted rather than merely switched off because it is half of a pair. See its sibling below.<\/p>","filled":true},{"name":"s.MaxReadyRequestsToStallMB","status":"active","ourValue":"30","engineDefault":"30, in megabytes","valueRange":"a size in megabytes.","appliesWhen":"Always.","visualsHtml":"None directly.","performanceHtml":"<strong>Backpressure by memory.<\/strong> Requests that have completed but not yet been processed occupy RAM, and past this many megabytes the loader stops accepting more. The audit: *&quot;Value 0 removes memory backpressure and can allow unhandled I/O requests to grow dangerously.&quot;*","definitionHtml":"The volume of completed-but-unprocessed request data at which the loader begins stalling.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Also promoted out of the NO EFFECT block and pinned at Epic&#x27;s value. It was being written as <strong>0<\/strong>, which removes the limit entirely.<\/p><p><strong>Read the two together, because that is the point.<\/strong> They are one mechanism measured two ways -- by request count and by unprocessed megabytes -- and the source config wrote <code>1<\/code> and <code>0<\/code>:<\/p><p>``<code> s.MaxIncomingRequestsToStall = 1     stall at the first sign of load s.MaxReadyRequestsToStallMB  = 0     never stall, however much data piles up <\/code>``<\/p><p>Two extremes, in opposite directions, from the same pair of settings, in the same file. Neither is a tuning choice; together they are not even a coherent position.<\/p><p>Both are pinned rather than left unwritten so that this file states a complete I/O backpressure policy instead of half of one. And removing a safety limit is not a performance setting: it does not make loading faster, it removes the thing that stops loading consuming memory without bound when storage is faster than whatever is consuming from it.<\/p>","filled":true},{"name":"s.MaxLevelRequestsAtOnceWhileInMatch","status":"active","ourValue":"0","engineDefault":"0, meaning unlimited","valueRange":"a request count. 0 is no cap.","appliesWhen":"During gameplay, as distinct from a loading screen.","visualsHtml":"A cap delays streaming, so cells arrive later and the world can be visibly incomplete around the player.","performanceHtml":"The audit: *&quot;Capping concurrent level requests can reduce spikes but delay streaming.&quot;*","definitionHtml":"The maximum number of simultaneous level streaming requests while in a match.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>We wrote <strong>4<\/strong> until 2026-08-31, capping something Epic leaves uncapped.<\/p><p>The name is worth reading carefully: *while in match*. This is a setting whose existence assumes a multiplayer game where a hitch is worse than a late-arriving level. Most of the titles on this list are single-player, where the trade points the other way.<\/p>","filled":true},{"name":"s.ProcessPrestreamingRequests","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Only where the cooked game generated prestreaming requests.","visualsHtml":"None where nothing generated them.","performanceHtml":"None where nothing generated them.","definitionHtml":"Processes prestreaming requests baked in at cook time.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>We wrote <strong>1<\/strong> until 2026-08-31. The audit: *&quot;Only useful when a cooked title generated and relies on prestreaming requests. Project-specific.&quot;*<\/p><p>A game that uses prestreaming turns this on itself, because it knows it has requests to process. A game that does not gains nothing from being told to process requests that do not exist.<\/p>","filled":true},{"name":"s.UseUnifiedTimeBudgetForStreaming","status":"active","ourValue":"1","engineDefault":"0. It is an opt-in control.","valueRange":"0 or 1","appliesWhen":"UE 5.6 and later.","visualsHtml":"Indirectly. It changes the order work happens in during a frame, which changes when streamed content appears.","performanceHtml":"A unified budget shares one time allowance between asynchronous loading and level streaming rather than giving each its own. The audit: *&quot;changes frame ordering and latency, so it requires title-specific testing.&quot;*","definitionHtml":"Uses a single combined time budget for async loading and level streaming.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai+memory+benchmark","verifiedAgainst":"UE 5.4 documentation; the setting itself is UE 5.6 and later","notesHtml":"<p><strong>The maintainer&#x27;s value, measured.<\/strong> The audit asked for title-specific testing and it has been done.<\/p><p><strong>Opt-in is still the operative word.<\/strong> Epic ships new behaviour behind a switch when they are not yet ready to make it a default, which is a statement about their confidence rather than about the feature. Turning on somebody else&#x27;s opt-in is a decision they have deliberately not made -- which is precisely why it needed measuring rather than reasoning.<\/p><p>On an engine older than 5.6 the name is unknown and the line does nothing.<\/p>","filled":true},{"name":"s.GroupedComponentMovement.Enable","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none named by the audit.","valueRange":"0 or 1","appliesWhen":"Only components authored to use deferred group movement.","visualsHtml":"Grouped movement defers and batches component transform updates. Where it applies it is cheaper; where it applies to something the player controls, <strong>it delays that thing&#x27;s transform<\/strong>.","performanceHtml":"A real saving on scenes with many moving components.","definitionHtml":"Enables deferred grouped component movement, part of Epic&#x27;s Mover API.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.8 Mover API, per the audit","notesHtml":"<p>Switched off, and this is the one entry in the category that could have changed how a game <strong>feels<\/strong> rather than how it looks or how fast it runs.<\/p><p>The audit: *&quot;delayed transforms can be unsuitable for high-fidelity/player movement, so it needs title-level testing.&quot;* Input latency on the thing the player is steering is not a frame-time trade.<\/p><p>There is also nothing to pin -- the audit names no default -- so the choice was between an untested 1 and writing nothing. Writing nothing wins.<\/p>","filled":true},{"name":"s.MinBulkDataSizeForAsyncLoading","status":"not used","ourValue":"not written since 2026-08-31; was 0","engineDefault":"131072, in bytes","valueRange":"a size in bytes.","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"The size below which bulk data is loaded synchronously rather than being sent through the asynchronous path. The audit: *&quot;Sending even tiny bulk payloads through async loading can add more overhead than it saves.&quot;*","definitionHtml":"The minimum bulk data size for asynchronous loading.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>A real command set to 0 -- meaning *send everything asynchronously, however small*. Asynchronous work has a fixed cost per item, so below some size the bookkeeping costs more than the wait it avoids. Epic put that threshold at 128 kilobytes.<\/p><p>Switched off rather than pinned, because unlike the two stall settings it is not half of a pair and nothing else in the file depends on it.<\/p>","filled":true},{"name":"s.PriorityAsyncLoadingExtraTime","status":"not used","ourValue":"not written since 2026-08-31; was 0.0","engineDefault":"15, in milliseconds","valueRange":"a time budget in milliseconds.","appliesWhen":"When a load is marked as high priority.","visualsHtml":"An urgent load is urgent because something is waiting for it -- typically the player about to walk into a level that is not there yet.","performanceHtml":"The audit: *&quot;Removes the extra budget intended for urgent loads and may prolong high-priority stalls.&quot;*","definitionHtml":"Additional per-frame time granted to high-priority asynchronous loads.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off. A real command set to 0, removing the engine&#x27;s mechanism for saying *this one matters more*.<\/p><p>It is worth reading beside <code>s.AsyncLoadingTimeLimit<\/code>, which the same config cut from 5 ms to 3. One reduced the loader&#x27;s ordinary budget and the other removed its emergency budget entirely -- so a load the engine considered urgent got less time than an ordinary one used to.<\/p>","filled":true},{"name":"s.PriorityLevelStreamingActorsUpdateExtraTime","status":"not used","ourValue":"not written since 2026-08-31; was 0.0","engineDefault":"5, in milliseconds","valueRange":"a time budget in milliseconds.","appliesWhen":"While streamed actors are being registered into the world.","visualsHtml":"Registration is the last step before a streamed actor exists. Delay it and the geometry is loaded but not yet present.","performanceHtml":"The audit: *&quot;Removes urgent actor-registration budget; no universal benefit.&quot;*","definitionHtml":"Additional per-frame time granted to urgent level streaming actor updates.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off. The third of the three urgency budgets this configuration set to zero, and the audit&#x27;s verdict on it is the shortest in the category: *no universal benefit*.<\/p>","filled":true},{"name":"wp.Runtime.HLOD.WarmupEnabled","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"World Partition games using HLODs.","visualsHtml":"Warms up resources for an HLOD before it is swapped in, so the transition happens without a frame of missing detail.","performanceHtml":"A small amount of work done early to avoid a hitch later.","definitionHtml":"Enables World Partition HLOD warmup.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. It is the first of <strong>three<\/strong> warmup siblings, and only two of them appear here: <code>wp.Runtime.HLOD.WarmupNanite<\/code> belongs to the Nanite category in the catalog and is documented in the Nanite paper, so that it is written up once rather than twice.<\/p>","filled":true},{"name":"wp.Runtime.HLOD.WarmupVT","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"World Partition HLODs using virtual textures.","visualsHtml":"The virtual texture half of the warmup. The audit: *&quot;Disabling VT warmup may save work but <strong>can expose HLOD virtual-texture pop-in<\/strong>.&quot;*","performanceHtml":"The same small early cost as its two siblings.","definitionHtml":"Pre-warms virtual texture data for World Partition HLOD transitions.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>We wrote <strong>0<\/strong> until 2026-08-31, and it is the odd one of three siblings: warmup was left on for HLODs generally and for Nanite, and switched off only for virtual textures.<\/p><p><strong>This is the fourth anti-pop-in mechanism this configuration was working against<\/strong>, after the two Nanite streaming budgets and <code>r.Streaming.MinMipForSplitRequest<\/code> in the textures paper. All four were doing the same job in different subsystems, and all four were disabled or throttled in a file whose other settings are aimed at reducing pop-in.<\/p>","filled":true},{"name":"wp.Runtime.LevelStreamingContinuouslyIncrementalGCWhileLevelsPendingPurgeForWP","status":"active","ourValue":"256","engineDefault":"64","valueRange":"a level count threshold.","appliesWhen":"World Partition, while levels are waiting to be purged.","visualsHtml":"None directly.","performanceHtml":"The number of levels pending purge before incremental garbage collection is run continuously. The audit: *&quot;Higher threshold delays incremental GC, trading less frequent work for more pending memory.&quot;*","definitionHtml":"The pending-purge level count that triggers continuous incremental garbage collection under World Partition.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai+memory+benchmark","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The maintainer&#x27;s value, measured.<\/strong> Four times Epic&#x27;s threshold, so four times as many unloaded levels may wait before continuous incremental collection begins.<\/p><p>The audit names the trade exactly: *&quot;less frequent work for more pending memory&quot;*. It belongs to the same memory budget as <code>s.IoDispatcherCacheSizeMB<\/code> above -- both spend system RAM to avoid work, and both assume the machine has RAM to spend.<\/p><p>The longest command name in the entire catalog, and a good example of why the audit&#x27;s notes are worth more than the names: nothing in those seventy-eight characters says *this decides how much memory a streaming world may leave lying around*.<\/p>","filled":true},{"name":"wp.Runtime.MaxLoadingStreamingCells","status":"active","ourValue":"10","engineDefault":"4","valueRange":"a cell count.","appliesWhen":"World Partition.","visualsHtml":"More concurrent cell loads means the world fills in faster around a moving player.","performanceHtml":"The audit: *&quot;More concurrent cell loads can improve throughput but spike I/O, CPU, and memory. Open-world/hardware-specific.&quot;*","definitionHtml":"The maximum number of streaming cells loading at once.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai+memory+benchmark","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The maintainer&#x27;s value, measured<\/strong>, and it was the strongest candidate in the category before anyone ran it. Loading more cells at once is exactly what a fast NVMe drive and a wide CPU are for, and Epic&#x27;s 4 is chosen to be safe on hardware that has neither.<\/p><p><strong>10, not the 12 the source config used.<\/strong> That is worth noticing on its own: the measured answer landed near the untested one without matching it, which is about the most useful thing a measurement can do to a guess.<\/p>","filled":true},{"name":"wp.Runtime.UpdateStreamingStateTimeLimit","status":"active","ourValue":"0.33","engineDefault":"0, meaning no limit","valueRange":"a time budget in milliseconds. 0 is unlimited.","appliesWhen":"World Partition.","visualsHtml":"Time-slicing the streaming state update spreads it across frames, so the decision about what should be loaded is reached later.","performanceHtml":"The audit: *&quot;Time-slicing WP state updates can reduce spikes but delay streaming convergence.&quot;*","definitionHtml":"A per-frame time limit on World Partition streaming state updates.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai+memory+benchmark","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The maintainer&#x27;s value, measured<\/strong>, and it introduces a limit where Epic has none: the streaming state update gets a third of a millisecond per frame and continues next frame if it needs more.<\/p><p>*Delay streaming convergence* is worth translating: the engine takes marginally longer to work out which cells should be loaded, so it starts loading them later. Measured against the frame spike it removes, that came out in favour of the limit.<\/p><p>It is the only setting in this category that deliberately slows a decision down, which is why it needed a stopwatch rather than an argument.<\/p>","filled":true},{"name":"LogPakFile","status":"not used","ourValue":"not written since 2026-08-31; was \"all off\"","engineDefault":"the category's own default verbosity.","valueRange":"log verbosity levels.","appliesWhen":"Always.","visualsHtml":"None.","performanceHtml":"None worth measuring.","definitionHtml":"The log category for pak file and package loading.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The sixth log category found in this review, and the fourth that was actively unhelpful. The audit: *&quot;Redundant and hides package/file loading failures.&quot;*<\/p><p>The pattern is now unmistakable across four categories. Variable rate shading pushed hard and silenced <code>LogVRS<\/code>. Particles pushed hard and silenced <code>LogNiagara<\/code>. Texture streaming pushed hard and silenced <code>LogStreaming<\/code>. Level loading pushed hard and silenced <code>LogPakFile<\/code>. Each time, the log that would have reported the resulting failure.<\/p>","filled":true},{"name":"s.AsyncLoadingThreadEnabled","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"not applicable. The reference marks it a placeholder.","valueRange":"not applicable at runtime.","appliesWhen":"Never in a packaged game.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"The audit: *&quot;Current reference marks this as a placeholder not used at runtime. It cannot enable a loader architecture in a packaged game.&quot;* Whether the async loading thread exists is decided when the game is built.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off. A <strong>placeholder<\/strong> is a new category of dead entry for this review: the name exists in the reference, so it survives a search, and it does nothing because the engine never reads it at runtime.<\/p><p>That is worse than a name that does not exist, because checking whether a name is real does not catch it.<\/p>","filled":true},{"name":"s.AsyncLoadingThreadPriority","status":"not used","ourValue":"not written since 2026-08-31; was 2","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar under this name. The audit calls 2 a *&quot;fixed thread-priority magic number&quot;*.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and it is the second invented thread-priority setting in the review after <code>r.RHIThread.Priority<\/code> in the frame pacing paper. The same objection applies: raising one thread&#x27;s priority does not create CPU time, it takes it from another thread in the same process.<\/p>","filled":true},{"name":"s.AllowParallelUObjectCreationFromRequests","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar; a loader implementation detail rather than a setting.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The sixteenth <code>Parallel*<\/code> name reviewed of the ninety-one.<\/p>","filled":true},{"name":"s.IoDispatcherUseAsyncPriority","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No current stock CVar with this exact name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Three real <code>s.IoDispatcher*<\/code> commands are documented above; this is a fourth name built in the same shape and answering to nothing.<\/p>","filled":true},{"name":"s.Zen.AllowAsyncIO","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none verified.","valueRange":"not applicable.","appliesWhen":"Never from a player's configuration.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Zen is Epic&#x27;s storage server, used during development and packaging. The audit: *&quot;Zen/IoStore behavior is build/package integration.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Switched off. The sixth build-time concept found written as a runtime setting.<\/p>","filled":true},{"name":"pakcache.CachePerPakFile","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. Obsolete.","valueRange":"not applicable.","appliesWhen":"Never on a current build.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Part of the legacy pak file cache, superseded by the I/O store and dispatcher documented above.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. First of six <code>pakcache.*<\/code> entries, all from the same superseded system.<\/p>","filled":true},{"name":"pakcache.MaxBlockMemory","status":"not used","ourValue":"not written since 2026-08-31; was 384","engineDefault":"none. Obsolete.","valueRange":"not applicable.","appliesWhen":"Never on a current build.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A memory budget for the legacy pak cache.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"pakcache.MaxRequestSizeToLowerLevellKB","status":"not used","ourValue":"not written since 2026-08-31; was 3072","engineDefault":"none. Obsolete.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A legacy pak cache request size limit. The audit notes the name *&quot;contains a suspicious misspelling&quot;* -- there is a doubled <code>l<\/code> in <code>LowerLevell<\/code>.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The second misspelled name in the review after <code>fx.DeferrPSCDeactivation<\/code> in the effects paper, and doubly dead: obsolete system, misspelled name.<\/p>","filled":true},{"name":"pakcache.MaxRequestsToLowerLevel","status":"not used","ourValue":"not written since 2026-08-31; was 3","engineDefault":"none. Obsolete.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A legacy pak cache concurrency limit.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and worth noting beside the misspelled entry above: this is the correctly spelled sibling of it, so both spellings of the same idea were in the file at once.<\/p>","filled":true},{"name":"pakcache.NumUnreferencedBlocksToCache","status":"not used","ourValue":"not written since 2026-08-31; was 20","engineDefault":"none. Obsolete.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"How many unreferenced blocks the legacy pak cache kept.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"pakcache.UseNewTrim","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. Obsolete.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A legacy pak cache trimming policy.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and the last of six. The name is its own epitaph: *UseNewTrim* was new once, in a caching system the engine has since replaced entirely.<\/p>","filled":true},{"name":"wp.Runtime.HLODStreaming","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar. The audit: World Partition HLOD is *&quot;project-authored rather than enabled by this line.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Three real <code>wp.Runtime.HLOD.*<\/code> commands are documented above, all with a dot after <code>HLOD<\/code>; this one runs the words together and answers to nothing.<\/p>","filled":true},{"name":"wp.Runtime.HLODStreaming.Async","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar; the invented name above with <code>.Async<\/code> appended.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"wp.Runtime.PartitionStreaming.Async","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar with this exact name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"wp.Runtime.PartitionStreaming.NumThreads","status":"not used","ourValue":"not written since 2026-08-31; was 4","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar. The audit: *&quot;fixed thread count ignores CPU and workload.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, alongside its invented parent above.<\/p>","filled":true},{"name":"wp.runtime.UpdateStreaming.EnableAsyncUpdate","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none in UE 5.8.","valueRange":"not applicable.","appliesWhen":"Never on a current build.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar with this exact name; internal and version-specific. Note also the lowercase <code>runtime<\/code>, where every real command in this family capitalises it.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Console variable names are matched case-insensitively, so the lowercase <code>runtime<\/code> is not what makes this one dead -- but it is a fair sign of how it was written.<\/p>","filled":true},{"name":"wp.Runtime.UpdateStreaming.UseAsyncWorkloadProfile","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar; internal workload policy rather than a published setting.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and the last of six invented <code>wp.Runtime.*<\/code> names in this category -- against nine real ones documented above.<\/p><p>That ratio is the category in miniature. World Partition is a large system with
