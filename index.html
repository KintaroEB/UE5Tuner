me pass. The audit adds one wrinkle: *&quot;Benefit depends on graphics versus compute-pipe workload and volumetric passes.&quot;* A game with heavy volumetric fog has more of this work to overlap, and more to gain or lose.","definitionHtml":"Schedules the MegaLights volume pass on the asynchronous compute queue.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Moves with <code>GenerateSamples<\/code> in every state, deliberately. They are one decision -- whether MegaLights uses the async compute queue -- written as two CVars, and nobody wants one without the other.<\/p><p>That is also why there is one switch rather than two. A user on the Experimental tab is answering a question about their GPU, not about two separate passes.<\/p>","filled":true},{"name":"r.MegaLights.DirectionalLights","status":"active","ourValue":"0","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Only in a game using MegaLights, and only for directional lights -- the sun, the moon, anything lighting the whole scene from one direction.","visualsHtml":"At 1, directional lights are sampled by MegaLights along with everything else. Because MegaLights is stochastic, a light that covers the entire scene gets noisy where a dedicated shadow map would be clean, and the sun is the light a player looks at the results of most.","performanceHtml":"Including the sun in MegaLights removes its separate shadow pass but adds its samples to every pixel. On a sunlit exterior that is usually a loss.","definitionHtml":"Whether directional lights are handled by MegaLights rather than by the standard shadow path.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, and the audit agrees with the direction rather than merely with the number: *&quot;Epic recommends keeping strong directional lights outside MegaLights.&quot;*<\/p><p>That makes this a rare entry -- a pinned default that Epic has separately argued for. Most pinned defaults in this project are pinned because they are defaults; this one would be worth writing even if it were not.<\/p>","filled":true},{"name":"r.MegaLights.NumSamplesPerPixel","status":"active","ourValue":"4","engineDefault":"none published. Epic drives it from scalability profiles.","valueRange":"powers of two in practice. Higher is cleaner and more expensive.","appliesWhen":"Always, in a game using MegaLights.","visualsHtml":"The primary quality dial. MegaLights estimates lighting from a small random sample of the lights affecting each pixel, so too few samples leaves visible noise that the denoiser then has to smooth -- and smoothing noise costs sharpness in the lighting itself. More samples means cleaner light and crisper shadow edges.","performanceHtml":"Close to linear. This is the main cost lever of the whole system.","definitionHtml":"How many light samples MegaLights takes per pixel before denoising.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>There is no documented default here to pin.<\/strong> The audit: *&quot;Valid primary quality/performance control, but scalability profiles choose it and there is no universal value. Only expose for confirmed MegaLights games.&quot;*<\/p><p>So 4 is a number without a stated engine counterpart, which is unusual in this project. It survives on the narrowness of where it lands: the category only appears for a game that actually uses MegaLights, and this is the feature&#x27;s main dial, so a tuner that says nothing about it is not tuning MegaLights at all.<\/p><p>It is the obvious preset candidate in this category and it is not split, because splitting it would mean inventing the second number rather than measuring it. That remains open.<\/p>","filled":true},{"name":"r.MegaLights.Volume.GridPixelSize","status":"active","ourValue":"16","engineDefault":"none published.","valueRange":"a pixel size. Smaller means a denser grid.","appliesWhen":"Only where MegaLights lights translucency or volumetric fog.","visualsHtml":"Sets how finely the MegaLights volume is diced. A denser grid gives sharper shadows through fog and better-defined lighting on translucent surfaces; a coarser one makes light shafts soft and can let them shimmer as the camera moves.","performanceHtml":"Cost rises quickly as the grid tightens, because it is a volume -- halving the pixel size multiplies the cells, not doubles them.","definitionHtml":"The pixel size of the MegaLights volume grid used for translucency and volumetric fog.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The same situation as <code>NumSamplesPerPixel<\/code>: no published default, and the audit&#x27;s warning is explicit -- *&quot;Value 16 is not universal; confirmed MegaLights titles only, with A/B testing.&quot;*<\/p><p>It stays for the same reason: the category is already narrow, and this is one of the two dials the feature is tuned with. The caveat is recorded rather than buried, and it is the second open preset candidate here.<\/p>","filled":true},{"name":"r.MegaLights.HardwareRayTracing.ForceTwoSided","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"unverifiable. The name is not in current Epic documentation or the registry.","valueRange":"0 or 1 where it exists.","appliesWhen":"Never confirmed. If it is real anywhere, only with MegaLights hardware ray tracing.","visualsHtml":"Forcing all geometry two-sided means rays hit the back faces of everything, including surfaces authored as one-sided because their backs are never meant to be seen. That fixes light leaking through some thin geometry and introduces wrong occlusion elsewhere.","performanceHtml":"Two-sided hits cost more to resolve, and forcing it globally applies that cost to every surface rather than to the ones that need it.","definitionHtml":"A low-level override making all geometry two-sided in the MegaLights hardware ray tracing path. The audit: *&quot;Low-level geometry override with correctness and performance risk.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and worth reading beside <code>r.RayTracing.Shadows.EnableTwoSidedGeometry<\/code> in the ray tracing paper. That one we set to 0 and had to restore to 1, because excluding two-sided geometry from shadows loses foliage shadows. This one forces two-sided <strong>everywhere<\/strong>, which is the opposite mistake: paying the two-sided cost on every surface in the scene rather than on the ones that are actually two-sided.<\/p><p>The same config held both. Neither was measured.<\/p>","filled":true},{"name":"r.MegaLights.RayTracing.SamplesPerPixel","status":"not used","ourValue":"not written since 2026-08-31; was 4","engineDefault":"none. The name is not a documented stock control.","valueRange":"not applicable.","appliesWhen":"Never confirmed.","visualsHtml":"None, as written.","performanceHtml":"None, as written.","definitionHtml":"Not documented as a current stock control, and it overlaps the supported <code>r.MegaLights.NumSamplesPerPixel<\/code> above.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Both names were in the file at the same value, 4, one real and one not -- so whoever wrote the config was setting the same idea twice under two spellings and could not have known which was working.<\/p>","filled":true},{"name":"r.MegaLights.RayTracing.SER","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"unverifiable.","valueRange":"not applicable.","appliesWhen":"Never confirmed.","visualsHtml":"None, as written.","performanceHtml":"None, as written. If it were real, shader execution reordering is hardware and RHI specific and can regress workloads it does not suit.","definitionHtml":"SER regroups divergent ray tracing threads on recent NVIDIA hardware. The exact name and default here cannot be verified.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The second unverifiable SER line in this review, after <code>r.Lumen.HardwareRayTracing.ShaderExecutionReordering<\/code> in the Lumen paper, and the audit&#x27;s caution is the same both times: SER is not a general override.<\/p>","filled":true},{"name":"r.MegaLights.Shadow.Cache","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"unverifiable.","valueRange":"not applicable.","appliesWhen":"Never confirmed.","visualsHtml":"None, as written.","performanceHtml":"None, as written.","definitionHtml":"Not a documented general MegaLights control. Shadow caching in MegaLights is renderer-internal behaviour.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.MegaLights.Shadow.Cache.MaxAge","status":"not used","ourValue":"not written since 2026-08-31; was 8","engineDefault":"unverifiable.","valueRange":"not applicable.","appliesWhen":"Never confirmed.","visualsHtml":"None, as written.","performanceHtml":"None, as written.","definitionHtml":"A cache lifetime in frames, if it exists. The audit: *&quot;cache lifetime is renderer- and version-specific internal behavior.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off with its parent above. The pair is a good illustration of how these lists grow: one plausible name suggests a second, more specific one, and neither was ever checked.<\/p>","filled":true},{"name":"r.Shadow.Virtual.MegaLights.Cache","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. No exact stock CVar under this name.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"A third spelling of the shadow cache idea, this time under the virtual shadow map namespace. The audit adds a warning: *&quot;Do not substitute another VSM cache control.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Three names for one wish about caching MegaLights shadows, none of them real, and a note telling us not to go looking for a real one to put in their place.<\/p><p>That is the whole inert half of this category: six names, none verifiable, all about a feature new enough that guessing at its CVars was easy and checking them was not.<\/p>","filled":true}]},{"id":"shadows-fog","title":"Shadows, Fog & Ambient Occlusion","introHtml":"<p>Three subjects that share one property: they all decide how light behaves where it *stops*. Shadows are where light is blocked, volumetric fog is light caught in the air on its way, and ambient occlusion is the soft darkening in the crease where two surfaces nearly meet.<\/p><p>Most of the category is <strong>virtual shadow maps<\/strong>, UE5&#x27;s replacement for cascaded shadow maps. VSM keeps shadows in a pool of pages at several resolutions and caches them between frames, which is why so many of the settings here are about memory and eviction rather than about sharpness directly. Run out of pages and shadows do not soften -- they disappear.<\/p><p><strong>This category is the mirror image of Lumen.<\/strong> Lumen shipped extra quality to everybody. This one shipped *reductions* to everybody: half the shadow page pool, lower directional shadow resolution, no distant shadows from non-Nanite geometry, and quarter-resolution fog. Every preset took them, including the one whose whole promise is not taking them.<\/p><p>The reviewer had already noticed. The category&#x27;s own note has always read <code>quality=off balanced=on performance=on<\/code> -- *do not apply these reductions on Quality*. That field is honoured for exactly three toggleable categories and this is not one of them, so it sat there doing nothing. Since 2026-08-31 it is wired up by hand: five commands now carry Epic&#x27;s value on Quality and the reduction on Balanced and Performance.<\/p><p>Two more were A/B tests shipped as answers, and are switches on the Experimental tab. One command, the ambient occlusion method, has no documented default at all and became a user choice.<\/p>","commands":[{"name":"r.DFShadowAsyncCompute","status":"active","ourValue":"0; 1 when \"Distance field shadows: use the async compute queue\" is ticked","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Only where distance field shadows are in use and the platform supports async compute.","visualsHtml":"None. It moves work between GPU queues.","performanceHtml":"Unpredictable by design. It lets distance field shadow work overlap the graphics queue, which pays where that queue has gaps and costs where it does not.","definitionHtml":"Schedules distance field shadow tracing on the asynchronous compute queue.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The audit: *&quot;Valid, default 0. Can overlap distance-field shadow work where supported, but benefit depends on renderer, GPU queues, and available overlap. A/B test.&quot;*<\/p><p>The third async compute A/B test found in this review, after the two in MegaLights, and the answer is the same each time: whether overlapping work helps is a property of the machine, so a shipped file cannot know it. It writes the engine&#x27;s 0 until somebody ticks the switch.<\/p>","filled":true},{"name":"r.Shadow.Virtual.Cache.AllocateViaLRU","status":"active","ourValue":"0; 1 when \"Shadow cache: evict the least recently used page\" is ticked","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Always, in the virtual shadow map cache.","visualsHtml":"Indirectly. Which pages the cache keeps decides which shadows are ready when you look at them; the wrong policy shows as shadows resolving a frame or two late as you turn.","performanceHtml":"It changes which page is thrown away when the pool is full, not how big the pool is. A scene that keeps returning to the same views benefits; one that keeps moving into new ones does not.","definitionHtml":"Allocates virtual shadow map cache pages by least recently used order rather than the default policy.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-shadow-maps-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The audit: *&quot;Valid VSM cache policy, default 0. Changes page retention/allocation behavior; scene- and memory-sensitive, so test per title rather than force generally.&quot;*<\/p><p>*Test per title* is the phrase that decides it. A config shipped for fifty games cannot be tested per title, so it writes the engine&#x27;s value and offers the test to whoever wants to run it.<\/p>","filled":true},{"name":"r.Shadow.Virtual.Cache.StaticSeparate","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, in the virtual shadow map cache.","visualsHtml":"None directly. It separates static geometry into its own cache pages, so a moving object no longer invalidates the shadow of the building behind it.","performanceHtml":"A real win in a scene where most geometry is still, which is most scenes. The cost is memory: the audit notes it can double the VSM page pool.","definitionHtml":"Keeps static and dynamic geometry in separate virtual shadow map cache pages so that invalidation from movement is contained.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-shadow-maps-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. Worth reading beside <code>r.Shadow.Virtual.MaxPhysicalPages<\/code> below, because the two pull against each other: this doubles the page pool&#x27;s appetite while that one halves its size on two of the three presets.<\/p><p>That combination is not obviously wrong -- separate static pages cost memory and save time, and a smaller pool saves memory and costs quality -- but it is the kind of interaction a config file assembled setting by setting produces without anyone deciding it.<\/p>","filled":true},{"name":"r.Shadow.Virtual.MaxPhysicalPages","status":"active","ourValue":"2048, and 4096 on the Quality preset","engineDefault":"4096","valueRange":"a page count. Powers of two in practice.","appliesWhen":"Always, wherever virtual shadow maps are used.","visualsHtml":"This is the shadow memory budget. Inside it, nothing shows. Run out and the failure is abrupt: pages are refused, and shadows stop being drawn rather than becoming softer. A scene with many shadow-casting lights is where it happens.","performanceHtml":"Halving the pool halves the GPU memory virtual shadow maps hold. On a card that is short of memory that is a real win; on one that is not, it buys nothing and risks the failure above.","definitionHtml":"The maximum number of physical pages in the virtual shadow map pool.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-shadow-maps-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Both numbers are the audit&#x27;s: *&quot;current default 4096. Halving the pool saves GPU memory but can exhaust pages and reduce shadow quality. VRAM/title-specific profile only.&quot;*<\/p><p>Quality gets Epic&#x27;s 4096. Balanced and Performance keep the halved pool, which is the category&#x27;s own preset note finally wired up.<\/p><p><strong>It is the entry in this category most likely to still be wrong.<\/strong> The audit qualifies it as *VRAM-specific*, and a preset is not a VRAM measurement. The app already has a &quot;weaker PC&quot; option for exactly that kind of fact, and this may belong there rather than to Balanced.<\/p>","filled":true},{"name":"r.Shadow.Virtual.ResolutionLodBiasDirectional","status":"active","ourValue":"-0.50, and -1.5 on the Quality preset","engineDefault":"-1.5","valueRange":"a LOD bias. Lower is sharper.","appliesWhen":"Directional lights only -- in most games, the sun.","visualsHtml":"Sets how far virtual shadow maps drop resolution with distance for the sun. At -0.5 shadows go soft and blocky sooner; the edge of a building&#x27;s shadow across open ground is where it shows.","performanceHtml":"A real saving, and it grows with how much of the screen the sun shadows.","definitionHtml":"A bias applied to the resolution level of detail chosen for directional light virtual shadow maps.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-shadow-maps-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>The sign reads backwards at a glance.<\/strong> -0.5 is *higher* than -1.5, and a higher LOD bias means a lower resolution. So -0.5 is the cheap end, which is why the audit describes it as *&quot;lowers directional VSM resolution and cost, with softer/blockier shadows&quot;*.<\/p><p>Both numbers are the audit&#x27;s. Quality gets Epic&#x27;s -1.5; Balanced and Performance keep -0.5.<\/p><p>Directional means the sun, and the sun&#x27;s shadow is the one a player looks at all day. Of the five reductions in this category, this is the one most likely to be noticed without being understood.<\/p>","filled":true},{"name":"r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving","status":"active","ourValue":"-0.50, and -1.5 on the Quality preset","engineDefault":"-1.5","valueRange":"a LOD bias. Lower is sharper.","appliesWhen":"Directional lights that are moving -- a day/night cycle, a swinging lamp, a cutscene sun.","visualsHtml":"The same as the entry above, applied while the light moves. A separate control exists because a moving light invalidates its cached shadow pages every frame, so it is much more expensive and Epic allows a different quality for it.","performanceHtml":"Larger than the static case, for the same reason.","definitionHtml":"The resolution LOD bias used for directional lights while they are moving.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-shadow-maps-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Moves with its static twin above deliberately. A game with a day/night cycle would otherwise get one shadow resolution while the sun is still and another while it moves, which reads as the shadows changing quality on their own.<\/p>","filled":true},{"name":"r.Shadow.Virtual.SMRT.SamplesPerRayDirectional","status":"active","ourValue":"4","engineDefault":"4","valueRange":"a sample count per ray.","appliesWhen":"Directional lights, in the shadow map ray tracing pass.","visualsHtml":"SMRT traces short rays through the shadow map to work out how much of the light is blocked, which is what gives virtual shadow maps their soft contact and correct penumbra. More samples means less noise in that softness; fewer means visible banding in a wide penumbra.","performanceHtml":"Close to linear in the sample count, and paid per shadowed pixel.","definitionHtml":"How many samples are taken along each shadow map ray for directional lights.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-shadow-maps-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. The audit&#x27;s note is one of the shortest in the project: *&quot;Valid and exactly current default 4. Omit and inherit.&quot;*<\/p>","filled":true},{"name":"r.Shadow.Virtual.SMRT.SamplesPerRayLocal","status":"active","ourValue":"4","engineDefault":"4","valueRange":"a sample count per ray.","appliesWhen":"Local lights -- point and spot lights, which is every lamp, torch and window in an interior.","visualsHtml":"The same as the directional entry above, applied to local lights. In a room lit by several lamps this is the setting that decides whether the overlapping soft shadows look smooth or grainy.","performanceHtml":"Linear in the sample count, and multiplied by how many local lights reach a pixel -- so a room with six lamps pays six times.","definitionHtml":"How many samples are taken along each shadow map ray for local lights.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-shadow-maps-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.Shadow.Virtual.NonNanite.IncludeInCoarsePages","status":"active","ourValue":"0, and 1 on the Quality preset","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, for geometry that has not been converted to Nanite.","visualsHtml":"Coarse pages are the low-resolution tier virtual shadow maps use for distance. Excluding non-Nanite geometry from them means anything not converted -- which is most foliage, most skeletal meshes, and everything from an older project -- <strong>stops casting a distant shadow at all<\/strong>. Not a softer shadow: no shadow, past the range where coarse pages take over.","performanceHtml":"The audit calls it *&quot;a significant performance win&quot;*, and it is the largest single saving in this category.","definitionHtml":"Whether non-Nanite geometry is rendered into the coarse pages of the virtual shadow map.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-shadow-maps-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Both numbers are the audit&#x27;s: *&quot;Valid, default 1. Disabling can be a significant performance win, but may remove needed coarse shadow data from non-Nanite geometry. Content-specific.&quot;*<\/p><p>Quality gets Epic&#x27;s 1; Balanced and Performance keep 0.<\/p><p><strong>The biggest saving and the biggest loss in the category, in the same line.<\/strong> How bad it looks depends entirely on how much of the game is Nanite, which is the definition of content-specific -- a new Nanite-heavy title barely notices, an older one loses its distant shadows.<\/p>","filled":true},{"name":"r.VolumetricFog.GridPixelSize","status":"active","ourValue":"16, and 8 on the Quality preset","engineDefault":"8","valueRange":"a pixel size. Smaller is a denser grid.","appliesWhen":"Only where the game uses volumetric fog.","visualsHtml":"Volumetric fog is computed in a grid through the view. At 16 the cells are twice as wide, so light shafts through a window, god rays and the edge of a fog bank get blocky and can shimmer as the camera moves.","performanceHtml":"Large. The grid is a <strong>volume<\/strong>, so doubling the cell size is roughly an eighth of the cells rather than half.","definitionHtml":"The pixel size of the volumetric fog froxel grid.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/volumetric-fog-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Both numbers are the audit&#x27;s: *&quot;current default 8. Larger cells improve performance but reduce fog resolution/quality. Explicit fog-quality profile only.&quot;*<\/p><p>Quality gets Epic&#x27;s 8; Balanced and Performance keep 16.<\/p><p>The cubic scaling is why this is worth having as a preset value rather than a fixed choice: it is one of the few settings where the saving is genuinely large and the loss is confined to one effect.<\/p>","filled":true},{"name":"r.VolumetricFog.InjectShadowedLightsSeparately","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only where the game uses volumetric fog with shadowed lights.","visualsHtml":"Injecting shadowed lights separately is what lets fog show a light shaft with the shadow of the window frame in it. Off, shadowed lights are approximated into the fog and the shafts lose their shape.","performanceHtml":"Real, and proportional to how many shadowed lights touch the fog volume.","definitionHtml":"Injects shadow-casting lights into the volumetric fog in a separate pass rather than folding them into the general injection.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/volumetric-fog-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.VolumetricFog.Jitter","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only where the game uses volumetric fog.","visualsHtml":"Jitter offsets the fog grid slightly each frame so that the temporal pass can average several offsets together. It is what turns a coarse grid into smooth fog. Off, the grid&#x27;s cell edges become visible as banding through the volume -- and that is worst exactly where <code>GridPixelSize<\/code> is large, which is on two of our three presets.","performanceHtml":"Effectively free. It changes where samples are taken, not how many.","definitionHtml":"Enables temporal jitter of the volumetric fog grid for temporal supersampling.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/volumetric-fog-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, and this is a good example of the pinning rule paying for itself. A game that had turned jitter off would show fog banding, and our own <code>GridPixelSize=16<\/code> on Balanced and Performance would make it worse. Pinning it to 1 costs a line and removes that interaction entirely.<\/p>","filled":true},{"name":"r.AmbientOcclusion.Method","status":"active","ourValue":"not written by default; 0 or 1 when the user picks a method","engineDefault":"none published. The audit names neither value as the default.","valueRange":"0 = SSAO, 1 = GTAO","appliesWhen":"Wherever the game uses screen-space ambient occlusion. Platform support for GTAO differs.","visualsHtml":"Ambient occlusion is the soft darkening in creases and where objects meet the ground. SSAO is the older screen-space method and tends to halo around silhouettes. GTAO is ground-truth-based, and is generally cleaner and better behaved on curved surfaces, at the cost of being less forgiving where the depth buffer is thin.","performanceHtml":"The audit says only that *&quot;quality, cost and platform support differ&quot;*, which is honest: which is faster depends on the GPU and the resolution, and neither is reliably the cheap one.","definitionHtml":"Selects the screen-space ambient occlusion algorithm.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/post-process-effects-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>We wrote <strong>1<\/strong> -- GTAO -- for every user until 2026-08-31, with no documented default to compare it against and no measurement behind it.<\/p><p><strong>There is nothing to pin here.<\/strong> The pinning rule works because writing the engine&#x27;s own value cannot make anything worse; with no published default, that argument is unavailable, and the honest answer is to write nothing.<\/p><p>It is now a three-state option: <strong>Leave it alone<\/strong>, <strong>SSAO<\/strong>, <strong>GTAO<\/strong>. The default writes no line.<\/p><p>This one was foreseen. <code>options.json<\/code> has used *&quot;pick SSAO or GTAO&quot;* as its example of a setting that is not a yes/no question since the day three-state options were added, and this is that setting.<\/p><p>Read it beside the Lumen paper&#x27;s <code>r.Lumen.ScreenProbeGather.ShortRangeAO<\/code>, which is off in every preset. Between them, Balanced currently has no Lumen contact occlusion and no forced screen-space method either -- the game decides, which is the right answer while nobody has measured the alternative.<\/p>","filled":true},{"name":"r.AmbientOcclusionRadiusScale","status":"not used","ourValue":"not written since 2026-08-31; was 2","engineDefault":"1","valueRange":"a multiplier on the authored radius.","appliesWhen":"Wherever screen-space ambient occlusion runs.","visualsHtml":"Doubles the radius over which ambient occlusion darkens. Corners get deeper, but so does everything else: the darkening spreads across surfaces that were never meant to be occluded, and the scene reads as murky rather than as contact-shaded.","performanceHtml":"A larger radius means samples spread further, which is more cache misses for the same sample count. It is not free.","definitionHtml":"A global scale on the ambient occlusion radius set by the game&#x27;s post-process settings.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>A real command in the NO EFFECT block again, and this one is an art direction change.<\/strong><\/p><p>The audit&#x27;s word is *arbitrary*: *&quot;Valid CVar, but doubling the title&#x27;s SSAO radius is an arbitrary artistic override that can over-darken scenes.&quot;*<\/p><p>Every other real command found in that block was a technical setting pushed off its default. This one reaches past the engine and overrules the game&#x27;s artists about how dark its corners should be, for every game on the list at once.<\/p>","filled":true},{"name":"r.EnableAsyncComputeVolumetricFog","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar under this name. Current UE5 schedules supported async passes through the render graph rather than through per-pass switches, so there is no general fog equivalent to substitute.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The fourth async compute name in this review that does not exist, against three that do -- and the audit&#x27;s point is worth keeping: the engine moved to deciding this itself, so the absence is deliberate rather than an oversight.<\/p>","filled":true},{"name":"r.FogDensityVolumes.Parallel","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar under this name or prefix. Local fog volumes are controlled through <code>r.LocalFogVolume.*<\/code>, which exposes no parallel switch.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Another <code>*.Parallel<\/code> guess, joining the four in the Lumen paper. The pattern by now is unmistakable: somebody worked through a list of subsystems appending <code>Parallel<\/code> to each, and the engine answered to almost none of them.<\/p>","filled":true},{"name":"r.Shadow.CacheWPOPrimitives","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this exact name.","valueRange":"not applicable.","appliesWhen":"Never as written.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"WPO is world position offset -- vertex animation, which is how foliage sways. Caching the shadows of primitives that use it is a real idea, and there is no stock CVar by this name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.Shadow.CSMCaching","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this exact name.","valueRange":"not applicable.","appliesWhen":"Never as written.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"CSM is cascaded shadow maps, the system virtual shadow maps replaced. No stock CVar under this exact name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. Worth noting for what it says about the config&#x27;s origins: cascaded shadow maps are the pre-VSM system, so this line was aimed at an engine two generations back while the rest of the category tunes virtual shadow maps.<\/p>","filled":true},{"name":"r.Shadow.Virtual.Cache.MaxLightAgeSinceLastRequest","status":"not used","ourValue":"not written since 2026-08-31; was 8","engineDefault":"none under this name. The real control is `MaxPageAgeSinceLastRequest`, with different semantics and a different default.","valueRange":"not applicable as written.","appliesWhen":"Never as written.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"An obsolete or invented name close enough to a real one to be dangerous. The audit is explicit: *&quot;Wrong/obsolete name. Current stock control is MaxPageAgeSinceLastRequest, with different semantics/default. Do not silently replace it.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/virtual-shadow-maps-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where only the Page spelling appears","notesHtml":"<p>Switched off, with the do-not-substitute warning preserved. It is the fourth such warning in this review, and every one exists for the same reason: the obvious next move after finding a dead name is to look for the live one, and *light age* and *page age* are not the same quantity even though the names sit one word apart.<\/p>","filled":true},{"name":"r.Shadow.Virtual.ParallelBuild","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar under this exact name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.Shadow.Virtual.ParallelProjection","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar under this exact name. &quot;Parallel projection&quot; also happens to be a real term in graphics meaning an orthographic camera, which is not what this line was reaching for.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and it closes the category the way the Lumen one closed: a family of invented <code>Parallel*<\/code> names beside a handful of real settings, indistinguishable by appearance and separated only by reading the reference.<\/p>","filled":true}]},{"id":"reflections","title":"Reflections & Water","introHtml":"<p>The smallest category in the file, and the one that has been most thoroughly overtaken by events. Screen-space reflections were how UE4 did reflections; UE5 does them with Lumen, and this category is what is left over.<\/p><p>That matters for reading everything below. <strong>Two of the three commands only run where Lumen is not doing the job<\/strong>: <code>r.SSR.Temporal<\/code> affects screen-space reflections, which are a fallback path in a Lumen game, and the two water settings belong to Single Layer Water, which has its own reflection path separate from the scene&#x27;s.<\/p><p>So this is a category about the edges: what happens on water, and what happens when the main reflection system is not the one in charge.<\/p>","commands":[{"name":"r.SSR.Temporal","status":"active","ourValue":"1","engineDefault":"**disputed.** Epic's own pages disagree.","valueRange":"0 or 1","appliesWhen":"Screen-space reflections only. In a game using Lumen reflections this is a fallback path that may never run.","visualsHtml":"Screen-space reflections are noisy by nature -- they are built from a small number of rays marched through the depth buffer, so a rough reflective floor comes out grainy. A temporal filter averages that noise across frames and cleans it up. The cost is the usual temporal cost: a reflection of something moving smears behind it.","performanceHtml":"Small. It reuses a history buffer that already exists for other temporal work rather than adding a pass.","definitionHtml":"Enables the temporal filter on the screen-space reflection resolve.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/screen-space-reflections-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the reference's table and its help text do not agree","notesHtml":"<p><strong>There is no default to pin, because Epic publishes two.<\/strong> The audit&#x27;s wording is careful: *&quot;Current table and help/default behavior are inconsistent.&quot;* The console variable reference&#x27;s table says one thing and the variable&#x27;s own help text says another.<\/p><p>That is the second such conflict found in this review, after <code>r.RayTracing.Culling.Radius<\/code>, and it is worse than that one. There the two numbers were different kinds of statement -- a default and a recommendation -- which could be told apart. Here they are the same kind of statement, twice, with different answers.<\/p><p>We keep 1. The reasoning is narrow rather than strong: this only affects a fallback path, less noise is the safer answer on a path that is already the rough approximation, and the ghosting it can add is bounded by the same temporal history the rest of the frame already uses.<\/p><p>It is the clearest candidate in the file for a <code>memory<\/code> grade. Reading the value out of a running game would settle in one minute what the documentation cannot.<\/p>","filled":true},{"name":"r.Water.SingleLayer.Reflection.DownsampleFactor","status":"active","ourValue":"1","engineDefault":"1","valueRange":"1 or 2. 1 is full resolution, 2 is half.","appliesWhen":"UE 5.6 and later, and only where the game uses the Single Layer Water shading model. On an older engine the name is unknown and ignored.","visualsHtml":"Water reflections are traced into their own buffer. At 2 that buffer is half resolution, so the reflection of a shoreline in a lake goes soft and its edges crawl as the water moves -- which is worse on water than elsewhere, because the surface is already animating.","performanceHtml":"The main cost lever for water reflections. Half resolution is roughly a quarter of the rays.","definitionHtml":"The resolution divisor for the Single Layer Water reflection pass, relative to the screen.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/single-layer-water-shading-model-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation; the setting itself is UE 5.6 and later","notesHtml":"<p>Writes the documented default.<\/p><p>Like <code>r.Lumen.Reflections.DownsampleFactor<\/code> in the Lumen paper, this is a <strong>future preset candidate<\/strong>: 2 is a documented value with a documented effect, and halving a reflection buffer is exactly the lever a Performance preset wants. It is not split because the audit names only the default, and this project does not invent the second number.<\/p><p>The two entries are the same shape in the same position for the same reason, which is worth noticing: the pattern is not a coincidence in one category, it is what happens whenever Epic documents a default and leaves the alternative to measurement.<\/p>","filled":true},{"name":"r.Water.SingleLayer.Reflection.ScreenSpaceReconstruction","status":"active","ourValue":"0, and 1 on the Quality preset","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"UE 5.6 and later, Single Layer Water only.","visualsHtml":"Reconstructs the water reflection from screen-space information rather than taking the traced result directly. It helps where the reflection is rough or broken up -- choppy water, a rain-disturbed surface -- and does very little on flat water, where a mirror reflection is already correct.","performanceHtml":"A reconstruction pass over the water reflection buffer. Bounded by how much water is on screen, so a lake level pays and a corridor pays nothing.","definitionHtml":"Enables screen-space reconstruction of the Single Layer Water reflection.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/single-layer-water-shading-model-in-unreal-engine","https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation; the setting itself is UE 5.6 and later","notesHtml":"<p>Both numbers are the audit&#x27;s: *&quot;default 0. Screen-space reconstruction is water-path-specific and usually unnecessary for mirror-like reflections.&quot;*<\/p><p>Quality writes 1; Balanced and Performance write the documented 0.<\/p><p>Until 2026-08-31 Balanced wrote 1 too, on the reading that *usually* unnecessary is not *always* unnecessary. That is true, and it is not enough -- the same argument would justify every extra in the file, and Balanced is the preset most people never change. A cost the audit itself calls usually unnecessary belongs to the preset that promises to spend frames.<\/p>","filled":true},{"name":"r.ParallelReflectionCaptures","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar under this name. Reflection captures are built when the level is built and loaded with it; there is no runtime switch to parallelise them.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.ParallelReflectionEnvironment","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name does not exist.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar under this name.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and they are worth counting properly rather than in passing.<\/p><p>**107 command names in this file contain the word <code>Parallel<\/code>.<strong> Sixteen are real commands sitting in categories. The other <\/strong>91 are in the NO EFFECT block**, and only ten of those have been reached so far -- the four <code>r.DistanceFields.*<\/code> in the Lumen paper, <code>r.FogDensityVolumes.Parallel<\/code> and two virtual shadow map ones in the shadows paper, <code>r.ParallelDistanceField<\/code>, and these two. All ten are switched off now. <strong>Eighty-one are still being written.<\/strong><\/p><p>Of the ten reviewed, exactly one named a real command: <code>r.DistanceFields.ParallelUpdate<\/code>, which is valid, defaults to 0, and Epic publishes nothing about what forcing it does -- so it was switched off for being undocumented rather than for being fake.<\/p><p>The shape of the list tells its own story. <strong>Eight of the names are for cloth alone<\/strong> -- <code>r.ParallelSkeletalCloth<\/code> followed by <code>BoundsCalc<\/code>, <code>Gather<\/code>, <code>PrepareSim<\/code>, <code>Simulate<\/code>, <code>Skinning<\/code>, <code>Update<\/code>, <code>UpdateBounds<\/code> and <code>UpdateVerts<\/code>. Somebody enumerated the stages of cloth simulation and wrote a <code>Parallel<\/code> switch for each one, in a namespace the engine does not use. The audit&#x27;s phrase for them is *&quot;fabricated granularity&quot;*.<\/p><p>The same pattern produced <code>r.ParallelAnimationCacheConversion<\/code> and <code>r.ParallelAnimationCacheConversionAsync<\/code>, and a dozen more across animation, lighting and navigation. Somebody worked through the engine&#x27;s subsystems appending <code>Parallel<\/code> to each, and it answered to almost none of them.<\/p><p>The remaining eighty-one are picked up in the categories they belong to, and <code>tools/analysis_leftovers.py<\/code> is what stops any of them being forgotten.<\/p>","filled":true}]},{"id":"nanite","title":"Nanite Detail & Streaming","introHtml":"<p>Nanite is UE5&#x27;s geometry system. Instead of an artist building three or four levels of detail for a rock and the engine swapping between them, Nanite stores the rock once at full density and draws roughly one triangle per pixel, choosing which clusters of the original mesh to use as the camera moves.<\/p><p>Two consequences run through this whole category. First, <strong>detail is streamed<\/strong> -- the full-density mesh lives on disk and pages in as it is needed, so most of the settings here are about how fast pages arrive rather than how they look. Second, <strong>the quality dial is measured in pixels<\/strong>, not in polygons: you tell Nanite how large a triangle may get on screen, and it works out the rest.<\/p><p>Nine of the eleven live commands write Epic&#x27;s own value and are pinned. The interesting part of this category was not in the eleven at all.<\/p><p><strong>Four real streaming and culling settings sat in the NO EFFECT block, and two of them were throttled to a quarter of Epic&#x27;s value<\/strong> -- in the category whose entire job is getting geometry detail on screen in time.<\/p>","commands":[{"name":"landscape.RenderNanite","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only where the landscape was authored and built with Nanite data. Without that data the line does nothing.","visualsHtml":"Draws the landscape through Nanite rather than the classic heightfield path. Nanite landscape holds fine terrain detail at distance without the LOD popping the old path shows on ridgelines.","performanceHtml":"Generally a win on dense terrain, because Nanite&#x27;s cluster culling beats per-component LOD selection. It costs more memory.","definitionHtml":"Enables the Nanite rendering path for landscape.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. The audit&#x27;s second sentence is the useful one: *&quot;Only acts when Nanite landscape data was authored/built.&quot;* A config file cannot give a game Nanite landscape; it can only avoid switching one off.<\/p>","filled":true},{"name":"r.GeometryCollection.Nanite","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only for geometry collections -- the fractured, destructible meshes Chaos uses -- and only where they were built with Nanite support.","visualsHtml":"Lets destructible geometry render through Nanite, so a wall keeps its detail after it breaks instead of dropping to a coarse LOD at the moment it becomes interesting.","performanceHtml":"Follows the usual Nanite trade: better culling, more memory.","definitionHtml":"Enables Nanite rendering for geometry collection components.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.Nanite.DicingRate","status":"active","ourValue":"2","engineDefault":"2","valueRange":"a target size in pixels.","appliesWhen":"Only where Nanite tessellation and displacement are in use, which is a newer feature and not present in every game.","visualsHtml":"Sets how finely a displaced surface is diced before displacement is applied. A smaller rate means finer geometric displacement -- crisper bricks, sharper rock detail -- and more triangles to produce it.","performanceHtml":"Cost rises quickly as the rate falls, because it is an area measure: halving it is roughly four times the diced triangles.","definitionHtml":"The target dicing rate, in pixels, for Nanite tessellation.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.Nanite.MaterialVisibility.Async","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, where Nanite is in use.","visualsHtml":"None.","performanceHtml":"Computes which materials are visible asynchronously rather than blocking the render thread on it. On by default because the answer is needed a frame later than it is computed.","definitionHtml":"Runs Nanite material visibility computation on an async task.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.Nanite.MaxPixelsPerEdge","status":"active","ourValue":"1, and 1.5 on the Performance preset","engineDefault":"1","valueRange":"a pixel length. Higher is coarser.","appliesWhen":"Always, wherever Nanite geometry is drawn.","visualsHtml":"<strong>The primary Nanite quality dial.<\/strong> It says how long a triangle edge may be on screen before Nanite refines to a denser cluster. At 1 the geometry is refined to roughly pixel size. At 1.5 edges may be half again as long, so silhouettes coarsen and fine surface geometry flattens -- and, as the audit warns, it *&quot;can expose visual issues&quot;*, because some meshes were authored assuming pixel-level refinement.","performanceHtml":"Large and direct. Triangle count scales with the inverse square of this, so 1.5 is roughly half the geometric work of 1.","definitionHtml":"The maximum screen-space edge length, in pixels, that Nanite will accept before selecting a finer cluster.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Both numbers are the audit&#x27;s: *&quot;current default 1. Raising it reduces geometric detail/work and can expose visual issues. Older UE5 revisions need extra caution. Explicit Nanite performance profile only.&quot;*<\/p><p>The source config wrote 1.5 for everybody. That was corrected before this review began: Quality and Balanced write Epic&#x27;s 1, and only Performance takes the coarser geometry -- which is what *&quot;explicit Nanite performance profile only&quot;* asks for.<\/p><p>It is one of the two entries in the whole project where fixing a value moved the <strong>base<\/strong> preset, so the file most people get changed. The other is <code>fx.ScalabilityMaxUpdatesPerFrame<\/code>.<\/p>","filled":true},{"name":"r.Nanite.SoftwareVRS","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Where Nanite's software rasteriser is in use, which is the path small or thin triangles take.","visualsHtml":"Applies variable rate shading within the software rasteriser. The effect is the usual VRS trade -- shading computed at a coarser rate where detail is least visible -- but confined to geometry Nanite is already rasterising in software.","performanceHtml":"A win on scenes with a lot of small-triangle geometry, which is exactly what Nanite encourages.","definitionHtml":"Enables software variable rate shading in the Nanite rasteriser.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. Note that this is <strong>not<\/strong> the same thing as the hardware VRS in category 10 -- that one is gated on GPU support and this one is not, because it is Nanite doing the work in software.<\/p>","filled":true},{"name":"r.Nanite.Streaming.Async","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Always, where Nanite is in use.","visualsHtml":"None directly. It decides whether streaming work blocks the render thread, and a blocked render thread is a hitch rather than a visual change.","performanceHtml":"On by default because Nanite already schedules its streaming asynchronously; turning it off would serialise page installs against rendering.","definitionHtml":"Runs Nanite streaming work asynchronously.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.Nanite.Streaming.AsyncCompute","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Where the platform supports async compute.","visualsHtml":"None.","performanceHtml":"Puts the GPU side of Nanite streaming on the async compute queue so it overlaps rendering rather than queueing behind it.","definitionHtml":"Schedules Nanite streaming GPU work on the asynchronous compute queue.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default, and it is the interesting exception among the async compute settings found in this review. Four of them turned out to be A/B tests Epic declines to answer -- two in MegaLights, two in the shadows paper -- and were moved behind switches. This one Epic simply defaults to on, so there is nothing to test and nothing to decide.<\/p><p>The difference is in the audit&#x27;s wording each time. *&quot;A/B test&quot;* means Epic will not say; *&quot;exactly current default 1&quot;* means Epic has.<\/p>","filled":true},{"name":"r.Nanite.Streaming.NumInitialRootPages","status":"active","ourValue":"2048","engineDefault":"2048","valueRange":"a page count.","appliesWhen":"Always, where Nanite is in use.","visualsHtml":"Root pages are the coarsest representation of every Nanite mesh, kept resident so that something can always be drawn while finer detail streams in. Too few and a mesh has nothing to fall back on, so it appears late.","performanceHtml":"A fixed memory reservation, paid at startup regardless of what is on screen.","definitionHtml":"The number of Nanite root pages allocated at initialisation.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default. The audit noticed the source config had it commented out and approved: *&quot;2048 initial root pages is the current default, so leaving it commented is correct.&quot;* We write it anyway under the pinning rule.<\/p>","filled":true},{"name":"r.Nanite.Streaming.StreamingPoolSize","status":"active","ourValue":"512, and 768 on the Quality preset","engineDefault":"512, in megabytes","valueRange":"a size in megabytes.","appliesWhen":"Always, where Nanite is in use.","visualsHtml":"The pool is where streamed Nanite pages live. A larger pool holds more detail resident, so less of it has to be re-fetched as the camera moves, which shows as less geometry popping in behind you when you turn around.","performanceHtml":"Not frame time -- <strong>memory<\/strong>. 768 reserves an extra 256 MB of GPU memory whether or not the scene needs it.","definitionHtml":"The size of the Nanite streaming page pool.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Both numbers are the audit&#x27;s: *&quot;current default is 512 MB. A 768-MB pool may reduce pressure but reserves another 256 MB of GPU memory.&quot;*<\/p><p>Quality reserves the extra; Balanced and Performance write Epic&#x27;s 512. Until 2026-08-31 Balanced reserved it too.<\/p><p><strong>This is the only entry in the category that spends VRAM rather than frame time, and VRAM is what runs out first on the cards Balanced is aimed at.<\/strong> A quarter of a gigabyte reserved is a quarter of a gigabyte the texture streamer cannot have, and the failure that causes -- textures dropping to a lower mip across the whole scene -- looks considerably worse than the geometry pop-in the larger pool prevents.<\/p>","filled":true},{"name":"wp.Runtime.HLOD.WarmupNanite","status":"active","ourValue":"1","engineDefault":"1","valueRange":"0 or 1","appliesWhen":"Only in a World Partition game using HLODs built with Nanite.","visualsHtml":"Warms up Nanite data for an HLOD before it is swapped in, so the transition from the distant proxy to the real geometry happens without a frame of missing detail.","performanceHtml":"A small amount of work done early to avoid a hitch later.","definitionHtml":"Pre-warms Nanite resources for World Partition HLOD transitions.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>Writes the documented default.<\/p>","filled":true},{"name":"r.Nanite.Streaming.MaxPageInstallsPerFrame","status":"not used","ourValue":"not written since 2026-08-31; was 32","engineDefault":"128","valueRange":"a page count per frame.","appliesWhen":"Always, where Nanite is in use.","visualsHtml":"<strong>Directly visible.<\/strong> This is how many streamed Nanite pages may be installed in a single frame. At a quarter of Epic&#x27;s budget, detail arrives four times more slowly, so geometry resolves in visibly after you turn a corner or a level loads.","performanceHtml":"It lowers the worst-case work in any one frame, which is a real thing to want -- a large install batch can cause a hitch. But it does not remove the work, it spreads it, and it pays for that by making the intermediate frames wrong.","definitionHtml":"The per-frame cap on Nanite streaming page installations.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>A real command, in the NO EFFECT block, cut to a quarter of Epic&#x27;s value in a category whose entire job is getting detail on screen in time.<\/strong><\/p><p>The audit says it plainly: *&quot;Valid internal streaming budget, current default 128. Reducing it to 32 may lower one-frame work but delays detail arrival and can increase visible pop-in.&quot;*<\/p><p>Pop-in is the single complaint UE5 games attract most often, and this is a config marketed as a tuning improvement making it worse. Switched off.<\/p>","filled":true},{"name":"r.Nanite.Streaming.MaxPendingPages","status":"not used","ourValue":"not written since 2026-08-31; was 32","engineDefault":"128","valueRange":"a queue length.","appliesWhen":"Always, where Nanite is in use.","visualsHtml":"The same failure as its sibling above, reached differently. This one caps how many page requests may be outstanding at once, so a short queue means the streamer runs dry waiting for the disk instead of keeping work in flight.","performanceHtml":"The audit: *&quot;Value 32 can starve streaming depending on scene, storage, and camera movement.&quot;* Fast storage and a fast-moving camera is exactly where it starves, which is the modern case.","definitionHtml":"The maximum number of pending Nanite streaming page requests.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The second of the pair, quartered the same way on the same day by whoever wrote the original config. Together they throttle both ends of the streaming pipeline -- how many requests may be in flight, and how many may land per frame.<\/p><p>Switched off. <strong>These two are the most defensible removals in the entire review<\/strong>: they are documented, they are real, they were set against their documented values, and the audit names the exact harm.<\/p>","filled":true},{"name":"r.Nanite.LargePageRectThreshold","status":"not used","ourValue":"not written since 2026-08-31; was 512","engineDefault":"128","valueRange":"a threshold in pixels.","appliesWhen":"Always, where Nanite is in use, but only in the statistics path.","visualsHtml":"None.","performanceHtml":"None. The audit is unusually direct: *&quot;It changes only the statistics threshold used to classify large candidate clusters; 512 is not a rendering optimization.&quot;*","definitionHtml":"The size threshold above which a candidate cluster is counted as large, for Nanite&#x27;s own statistics.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>A real command pushed four times off its default, changing a counter. Harmless, and worth documenting for what it shows about how the original list was built: the name reads like a rendering budget, and it is a reporting threshold. Nobody who had read the reference would have changed it.<\/p>","filled":true},{"name":"r.Nanite.Culling.MinLOD","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"not published for the current version.","valueRange":"a level of detail index.","appliesWhen":"Where Nanite culling runs, on the revisions that have it.","visualsHtml":"If it does what its name implies, it sets a floor on how coarse a cluster Nanite may cull against -- which would trade culling accuracy for culling cost, and could drop detail.","performanceHtml":"Unknown in the direction we were pushing it.","definitionHtml":"A recent internal culling optimisation. The audit: *&quot;whose stable cross-version default is not published in the current CVar table. Not a broad end-user control.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where no default is published","notesHtml":"<p>Switched off for the same reason as <code>r.DistanceFields.ParallelUpdate<\/code> in the Lumen paper: it is real, it is internal, and Epic publishes no default. There is nothing to pin and nothing to measure against, which makes any value we write a guess dressed as a setting.<\/p>","filled":true},{"name":"r.Nanite.CompressedStreamingPages","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none. The name is not in the current registry.","valueRange":"not applicable.","appliesWhen":"Never on a current build.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Not found in the current CVar registry; obsolete, branch-specific, or invented.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off.<\/p>","filled":true},{"name":"r.Nanite.PrimeHZB","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none in the current registry.","valueRange":"not applicable.","appliesWhen":"Never on a current build.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"HZB is the hierarchical depth buffer Nanite culls against. Priming it early is real experimental work; this name is absent from the current registry.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The audit&#x27;s phrasing is worth keeping -- *&quot;not stable enough for a broad catalog&quot;* -- because it is a different objection from the usual one. This is not a name that never existed; it is one that may exist and may change.<\/p>","filled":true},{"name":"r.Nanite.VSMMeshShaderRasterization","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this exact name.","valueRange":"not applicable.","appliesWhen":"Never as written.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Mesh shader rasterisation of Nanite geometry into virtual shadow maps is a real capability, and the engine exposes it under a different, capability-gated name. The audit: *&quot;do not silently substitute it.&quot;*","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, with the do-not-substitute warning preserved. The fifth such warning in this review.<\/p><p>Capability-gated is the operative word: the real control exists because mesh shaders are hardware that some GPUs have and some do not, and the engine decides per machine. Writing a value into a config file removes exactly the check that makes it safe.<\/p>","filled":true},{"name":"r.Nanite.Builder.AsyncHelpers","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none found.","valueRange":"not applicable.","appliesWhen":"Never in a shipped game.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"Nanite&#x27;s builder converts a mesh into Nanite clusters, and that happens when the asset is imported and cooked -- on a developer&#x27;s machine, months before the game ships.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off. The audit&#x27;s objection is the structural one rather than the naming one: *&quot;Builder controls are editor/asset-build/cook concerns, not useful in a shipped game&#x27;s user Engine.ini.&quot;*<\/p><p>It is the second command found in this review that asks a shipped game to speed up something that already happened, after <code>r.DistanceFields.ParallelBuild<\/code> in the Lumen paper. Both are worth keeping as documented examples: a line can be harmless and still be evidence that the list was assembled by name rather than by function.<\/p>","filled":true},{"name":"r.GeometryCollection.Nanite.AsyncCompute","status":"not used","ourValue":"not written since 2026-08-31; was 1","engineDefault":"none under this exact name.","valueRange":"not applicable.","appliesWhen":"Never.","visualsHtml":"None.","performanceHtml":"None.","definitionHtml":"No stock CVar under this exact name. <code>r.GeometryCollection .Nanite<\/code> above is real; this is that name with <code>.AsyncCompute<\/code> appended.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation, where the name does not appear","notesHtml":"<p>Switched off, and it is the clearest single illustration of how the original list grew. A real command sits two entries above it in this paper. This is that command with a suffix added, on the reasonable-sounding assumption that if a subsystem exists then an async compute switch for it must exist too.<\/p><p>The engine has three real <code>Nanite.*.Async*<\/code> settings, all documented above, all defaulting to on. Guessing a fourth produced nothing.<\/p>","filled":true}]},{"id":"vrs","title":"Variable Rate Shading","introHtml":"<p>Variable rate shading lets the GPU shade a block of pixels once instead of shading each of them, in places where the difference would not be seen -- a flat wall, a patch of sky, the blurred edge of a fast pan. It is hardware: the GPU must support it, and how well it works varies by vendor and generation.<\/p><p><strong>The values in this category are a three-way enum, and reading them as &quot;bigger is better&quot; gets the whole thing backwards.<\/strong><\/p><p>``<code> 0   off           this pass shades every pixel normally 2   conservative  reduce the shading rate only where it is safe   &lt;- Epic&#x27;s default 1   full          reduce it wherever the heuristic allows <\/code>``<\/p><p>So <code>1<\/code> is the *aggressive* setting, not the good one. Epic ships <code>2<\/code> on four of the five passes here and <code>0<\/code> on the fifth.<\/p><p>The category is gated on <code>vrs-gpu<\/code> -- it does not appear unless the machine supports it -- and it is <strong>switched off on the Quality preset<\/strong>, which is correct: variable rate shading buys speed by shading less, and that is not what Quality is for.<\/p><p>**Until 2026-08-31 both remaining presets wrote <code>1<\/code> on every pass.** The preset most people never change was getting the most aggressive shading-rate reduction the engine offers, on every pass at once, against Epic&#x27;s own conservative tuning. Five commands are now split: Balanced writes Epic&#x27;s values, Performance takes the full ones.<\/p><p>One distinction runs through the category and is worth having before reading on. Three commands are <strong>enablers<\/strong> -- they turn the feature on and produce the shading-rate image. Five are <strong>pass controls<\/strong> -- they decide how hard each pass pushes. Only the pass controls are split. Splitting an enabler could leave the pass controls with no image to act on, and that coupling is not something the documentation settles.<\/p>","commands":[{"name":"r.VRS.Enable","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Needs a compatible RHI and GPU. Without both it does nothing.","visualsHtml":"The master switch. Off, nothing else in this category means anything. On, shading rates below one-per-pixel become possible.","performanceHtml":"Where the hardware supports it and the scene has flat regions, a real saving in the pixel shading portion of the frame.","definitionHtml":"The global switch for variable rate shading.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference","https://dev.epicgames.com/documentation/unreal-engine/xr-performance-features-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p><strong>This departs from the engine default in every preset where the category is on, and that is deliberate.<\/strong> It is the same reasoning as <code>r.Lumen.HardwareRayTracing<\/code> in the ray tracing paper: the default is off because Epic cannot assume the hardware, and we can, because the category is gated on exactly that.<\/p><p>A user who sees a category called Variable Rate Shading, has a GPU that supports it, and leaves it ticked has asked for this line.<\/p>","filled":true},{"name":"r.VRS.EnableImage","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Needs a supported attachment and a shading-rate image generator.","visualsHtml":"Image-based VRS drives the shading rate from a per-tile image rather than from a single global rate, so the reduction follows the content. Without it, VRS has far less to work with.","performanceHtml":"It is what makes VRS worth having. A single global rate either loses detail everywhere or saves nothing.","definitionHtml":"Enables the image-based path for variable rate shading.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference","https://dev.epicgames.com/documentation/unreal-engine/xr-performance-features-in-unreal-engine"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The second enabler. It departs from the default for the same reason as the first, and the two only make sense together.<\/p>","filled":true},{"name":"r.VRS.EnableSoftware","status":"active","ourValue":"1","engineDefault":"0","valueRange":"0 or 1","appliesWhen":"Supported Nanite paths.","visualsHtml":"None directly. It produces the shading-rate image for Nanite in software rather than relying on hardware generation.","performanceHtml":"A small cost to generate the image, in exchange for VRS being able to act on Nanite geometry at all.","definitionHtml":"Generates software shading-rate images for the supported Nanite paths.","sources":["https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-console-variables-reference"],"evidence":"ai","verifiedAgainst":"UE 5.4 documentation","notesHtml":"<p>The third enabler, and the one that was almost split by mistake during this review.<\/p><p>It was on the first list of pass controls to move to Performance only. That was wrong. The pass controls decide how hard to push; this one <strong>produces the image they push with<\/strong>. Splitting it would have left Balanced&#x27;s pass controls acting on whatever the hardware happened to generate, and nothing in the documentation says what that is on a Nanite path.<\/p><p>The general shape is worth keeping: before splitting a setting across presets, check whether anything else depends on it existing.<\/p>","filled":true},{"name":"r.VRS.BasePass","status":"active","ourValue":"2, and 1 on the Performance preset","engineDefault":"2","valueRange":"0 = off, 2 = conservative, 1 = full","appliesWhen":"Always, while VRS is enabled.","visualsHtml":"<strong>The pass to be most careful with.<\/strong> The base pass draws the scene&#x27;s geometry and materials, so this is where a coarse shading rate would show on a surface the player is looking straight at -- a flat painted wall going subtly blocky, or a gradient banding across a large object.","performanceHtml":"The largest saving in the category, because the base pass is usually the most expensive shading work in the frame.","definitionHtml":"The variable rate shading mode used for the base pass.","sources":["https
